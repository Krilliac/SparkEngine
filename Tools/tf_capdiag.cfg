# Onboards a fresh account, spawns MRA, teleports onto AUC-owned Breaker Quarry
# (lattice-linked via MRA's Dustline Relay) and watches the 1 Hz capture tick:
# expect occ MRA:1 -> progress ~1.6%/s (60 s outpost) -> REGION FLIP by ~t=75.
# Run (window required until the headless ECS-World engine fix is BUILT):
#   SparkEngine.exe -game SparkGameMMOFPS.dll -exec Tools/tf_capdiag.cfg -test-seconds 90 -window-size 640 360
# After the engine rebuild the same cfg must also pass with -headless — that is
# the dedicated-server regression this lane fixed (null GetWorld() => every
# pawn at (0,0,0) => capture never ticks; tf_capture_debug prints a loud
# "NO ENGINE ECS WORLD" banner if it regresses).
# NOTE: cwd must contain Assets/MMOFPS/Data (repo root or codex-ci bin);
# build/windows-release/bin has no staged MMOFPS assets.
