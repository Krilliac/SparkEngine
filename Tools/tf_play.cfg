# TERRAFRONT local-play setup: auto-host + bot war, then leave onboarding open.
# WASD move, mouse look, LMB fire, RMB ADS, Shift sprint, Space jump, R reload,
# E interact (vehicle terminals), B deploy Aegis. Close the window to quit.
# Complete the login UI, or type the sensitive command
# `tf_quickplay <user> <pass> [faction] [class] [bots]` for one-step entry.
t3 tf_host
t5 tf_bots 12
t7 tf_status
