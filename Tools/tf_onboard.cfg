# TERRAFRONT W5 onboarding: drive register -> login -> character-create ->
# character-list -> enter-world via the tf_* console commands (Task 7) and
# screenshot the result. This is the "watch it happen" companion to
# tf_selftest_onboarding (Tools/tf_onboard_selftest.cfg), which is the
# assertion-bearing acceptance proof; run this one on its own (fresh boot --
# don't combine with the self-test in one process run, since both drive the
# SAME loopback session and would double-enter-world).
# Run: SparkEngine.exe -game SparkGameMMOFPS.dll -exec Tools/tf_onboard.cfg -test-seconds 12 -window-size 1280 720
