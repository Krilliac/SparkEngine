# TERRAFRONT W5 onboarding acceptance harness (T7). Runs tf_selftest_onboarding
# over the listen-host/standalone loopback and asserts, with real PASS/FAIL
# checks (not just "it built"):
#   (a) the full happy path: register -> login -> character create ->
#       enter-world -> the player can now spawn (RouteClientMessage lets
#       gameplay through once the sender is in TFServerSim::m_enteredWorld);
#   (b) THE SECURITY GATE (T6 / T4-review #1): a client that has NOT entered
#       world is blocked from gameplay -- SpawnRequest/FactionSelect sent
#       before login/enter-world produce NO authoritative effect.
# Evidence: the command's own return string (PASS/FAIL per assertion + a
# final "RESULT: N passed, M failed" line) and the "[TF-ACCEPTANCE]" log
# lines it emits are both captured in exec_audit.log (grep that file, or
# view the returned string directly from the console).
# The final disconnect/rehost cycle exercises the real TFServerSim network-stop
# hook and proves handlers can be registered again without waiting for a tick.
# Run: SparkEngine.exe -game SparkGameMMOFPS.dll -exec Tools/tf_onboard_selftest.cfg -test-seconds 9 -window-size 1280 720
t2 tf_status
t3 tf_host
t4 tf_selftest_onboarding
t5 tf_status
t6 tf_disconnect
t7 tf_host
t8 tf_status
