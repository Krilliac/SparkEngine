[Server]
name = Blank3D Dedicated Server
motd = Welcome to Blank3D

[Network]
port = 27015
max_clients = 16
tick_rate = 60
# LAN mode requires canonical RFC1918 CIDR (for example 192.168.1.20/24) and no GatewayControl.
bind_address = loopback
lan_broadcast = false

[Game]
maps = Scenes/Default.sparkscene
score_limit = 0
time_limit_minutes = 0

[Modules]
manifest = spark.modules.json

[Status]
health_file = Temp/spark-server-health.json
interval_ms = 1000

[GatewayControl]
endpoint = spark-area-control-27201
key_file = Config/gateway.key
epoch_state_file = Temp/spark-area-control-epochs.txt
