[Server]
name = MultiplayerArena Dedicated Server
motd = Welcome to MultiplayerArena

[Network]
port = 27015
max_clients = 16
tick_rate = 60
# LAN mode requires canonical RFC1918 CIDR (for example 192.168.1.20/24) and no GatewayControl.
bind_address = loopback
lan_broadcast = false

[Game]
maps = Scenes/Arena.sparkscene
# The module owns the match rules: first to three, 90 seconds. Keep these in
# step with RuntimeScoreLimit and RuntimeMatchDuration in Source/GameModule.h.
score_limit = 3
time_limit_minutes = 1.5

[Modules]
manifest = spark.modules.json

[Status]
health_file = Temp/spark-server-health.json
interval_ms = 1000

[GatewayControl]
endpoint = spark-area-control-27201
key_file = Config/gateway.key
epoch_state_file = Temp/spark-area-control-epochs.txt
