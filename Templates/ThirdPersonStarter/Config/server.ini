[Server]
name = ThirdPersonStarter Dedicated Server
motd = Welcome to ThirdPersonStarter

[Network]
port = 27015
max_clients = 16
tick_rate = 60
# Use a concrete numeric RFC1918 address only for isolated LAN development.
bind_address = loopback
lan_broadcast = false

[Game]
maps = Scenes/Adventure.sparkscene
score_limit = 0
time_limit_minutes = 0

[Modules]
manifest = spark.modules.json

[Status]
health_file = Temp/spark-server-health.json
interval_ms = 1000

[GatewayControl]
endpoint = spark-area-control-27201
key_file = Config/gateway.key
epoch_state_file = Temp/spark-area-control-epochs.txt
