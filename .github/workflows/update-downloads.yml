name: Update Download Badges

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sparkengine-publication-global
  cancel-in-progress: false

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout trusted workflow source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: Working
        persist-credentials: false

    - name: Resolve exact trusted source
      id: source
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
        LOCAL_SOURCE="$(git rev-parse HEAD)"
        REMOTE_SOURCE="$(git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          ls-remote --refs origin refs/heads/Working | awk 'NR == 1 { print $1 }')"
        if test -z "$REMOTE_SOURCE" || test "$LOCAL_SOURCE" != "$REMOTE_SOURCE"; then
          echo "Trusted workflow checkout is not the current Working head." >&2
          exit 1
        fi
        echo "commit=$LOCAL_SOURCE" >> "$GITHUB_OUTPUT"

    - name: Checkout badge-state seed
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: Working
        path: badge-repository
        persist-credentials: false

    - name: Load durable download-counter state tag
      id: badge-state
      working-directory: badge-repository
      env:
        GH_TOKEN: ${{ github.token }}
        STATE_REF: refs/tags/generated-release-counters
      run: |
        set -euo pipefail
        AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
        REMOTE_OBJECT="$(git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          ls-remote --refs origin "$STATE_REF" | awk 'NR == 1 { print $1 }')"
        if test -n "$REMOTE_OBJECT"; then
          git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
            fetch --force --no-tags origin "+${STATE_REF}:${STATE_REF}"
          git checkout --detach "$STATE_REF"
          if test "$(git rev-parse HEAD)" != "$(git rev-parse "${STATE_REF}^{commit}")"; then
            echo "Generated counter state tag did not resolve to its fetched commit." >&2
            exit 1
          fi
        else
          git checkout --detach "$(git rev-parse HEAD)"
        fi
        echo "remote_object=$REMOTE_OBJECT" >> "$GITHUB_OUTPUT"
        echo "state_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Refresh download count badges
      id: badge-commit
      working-directory: badge-repository
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        STATE_REF: refs/tags/generated-release-counters
        EXPECTED_REMOTE_OBJECT: ${{ steps.badge-state.outputs.remote_object }}
        EXPECTED_STATE_COMMIT: ${{ steps.badge-state.outputs.state_commit }}
        TRUSTED_SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
      run: |
        set -euo pipefail
        echo "changed=false" >> "$GITHUB_OUTPUT"
        mkdir -p .github/badges
        NIGHTLY_BADGE=".github/badges/nightly-downloads.json"
        STABLE_BADGE=".github/badges/stable-downloads.json"

        API_TEMP="$(mktemp -d)"
        trap 'rm -rf "$API_TEMP"' EXIT

        # GET one GitHub API endpoint with bounded retries. The response status
        # is returned through the named variable; diagnostics go to stderr so
        # they can never be mistaken for a download count.
        api_get() {
          local endpoint="$1"
          local response_body="$2"
          local response_headers="$3"
          local status_variable="$4"
          local attempt http_status curl_status retry api_message
          local api_url="https://api.github.com/repos/$REPO"
          if test -n "$endpoint"; then
            api_url="$api_url/$endpoint"
          fi

          for attempt in 1 2 3 4 5; do
            : > "$response_body"
            : > "$response_headers"
            if http_status="$(curl \
              --silent \
              --show-error \
              --location \
              --connect-timeout 10 \
              --max-time 60 \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --dump-header "$response_headers" \
              --output "$response_body" \
              --write-out '%{http_code}' \
              "$api_url")"; then
              curl_status=0
            else
              curl_status=$?
            fi

            if test "$curl_status" -ne 0; then
              if test "$attempt" -eq 5; then
                echo "GitHub API request failed after $attempt attempts: $endpoint" >&2
                return 1
              fi
              echo "GitHub API network failure for $endpoint; retrying (attempt $attempt/5)." >&2
              sleep "$((attempt * 2))"
              continue
            fi

            case "$http_status" in
              200|404)
                printf -v "$status_variable" '%s' "$http_status"
                return 0
                ;;
              408|425|429|500|502|503|504)
                retry=true
                ;;
              403)
                # GitHub reports primary/secondary rate limits as 403. Other
                # authorization failures are permanent and should fail now.
                if jq -er '.message // ""' "$response_body" 2>/dev/null \
                    | grep -Eqi 'rate limit|secondary rate|abuse detection'; then
                  retry=true
                else
                  retry=false
                fi
                ;;
              *)
                retry=false
                ;;
            esac

            if test "$retry" = true && test "$attempt" -lt 5; then
              echo "GitHub API returned transient HTTP $http_status for $endpoint; retrying (attempt $attempt/5)." >&2
              sleep "$((attempt * 2))"
              continue
            fi

            api_message="$(jq -r '.message // empty' "$response_body" 2>/dev/null || true)"
            echo "GitHub API request failed for $endpoint (HTTP $http_status${api_message:+: $api_message})." >&2
            return 1
          done
        }

        # A private/inaccessible repository can also produce HTTP 404. Verify
        # repository access first so a later release 404 is genuinely "missing"
        # rather than an authentication error disguised as an empty release.
        REPO_BODY="$API_TEMP/repository.json"
        REPO_HEADERS="$API_TEMP/repository.headers"
        REPO_STATUS=""
        api_get "" "$REPO_BODY" "$REPO_HEADERS" REPO_STATUS
        if test "$REPO_STATUS" != 200; then
          echo "Cannot verify GitHub API access to $REPO (HTTP $REPO_STATUS); preserving existing badges." >&2
          exit 1
        fi

        # Reconcile the durable per-asset ledger before computing channel
        # badges. This keeps lifetime and installer totals current between
        # releases and fails closed while an interrupted publication is pending.
        python3 "$GITHUB_WORKSPACE/.github/scripts/prepare-download-badges.py" refresh \
          --repository "$REPO" \
          --data-file "$GITHUB_WORKSPACE/badge-repository/.github/badges/downloads-data.json" \
          --badge-directory "$GITHUB_WORKSPACE/badge-repository/.github/badges"

        # Fetch the total count for a release endpoint. Only a verified 404
        # means the release does not exist and may legitimately publish zero.
        # Every transport, auth, rate-limit, server, or schema error fails the
        # job before either existing badge file is replaced.
        fetch_downloads() {
          local endpoint="$1"
          local label="$2"
          local output_variable="$3"
          local body="$API_TEMP/$label.json"
          local headers="$API_TEMP/$label.headers"
          local status=""
          local count

          api_get "$endpoint" "$body" "$headers" status
          if test "$status" = 404; then
            echo "$label release is absent (HTTP 404); using a genuine zero." >&2
            printf -v "$output_variable" '0'
            return 0
          fi

          if test "$label" = "nightly"; then
            if ! jq -e '
                type == "object" and
                .tag_name == "nightly" and
                .draft == false and
                .prerelease == true
              ' "$body" >/dev/null; then
              echo "GitHub API returned a non-published or non-prerelease nightly payload; preserving existing badges." >&2
              return 1
            fi
          elif test "$label" = "stable"; then
            if ! jq -e '
                type == "object" and
                .draft == false and
                .prerelease == false and
                (.tag_name | type) == "string" and
                (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))
              ' "$body" >/dev/null; then
              echo "GitHub API latest release is not a published stable vMAJOR.MINOR.PATCH release; preserving existing badges." >&2
              return 1
            fi
          fi

          if ! count="$(jq -er '
              if type != "object" or (.assets | type) != "array" then
                error("release response has no assets array")
              elif all(.assets[]; ((.download_count | type) == "number") and
                                    .download_count >= 0 and
                                    (.download_count | floor) == .download_count) then
                ([.assets[].download_count] | add // 0)
              else
                error("release response contains an invalid download_count")
              end
            ' "$body")"; then
            echo "GitHub API returned an invalid $label release payload; preserving existing badges." >&2
            return 1
          fi
          case "$count" in
            ''|*[!0-9]*)
              echo "GitHub API returned a non-integer $label count; preserving existing badges." >&2
              return 1
              ;;
          esac
          printf -v "$output_variable" '%s' "$count"
        }

        # Format an integer with thousands separators. Falls back to the raw
        # number if the locale-aware printf is unavailable.
        format_count() {
          LC_ALL=en_US.UTF-8 printf "%'d" "$1" 2>/dev/null || printf '%s' "$1"
        }

        # Build the badge JSON with jq so we get guaranteed-valid output and
        # proper escaping regardless of the message contents.
        write_badge() {
          jq -n \
            --arg label "$2" \
            --arg message "$3" \
            --arg color "$4" \
            '{schemaVersion: 1, label: $label, message: $message, color: $color, namedLogo: "github", logoColor: "white"}' \
            > "$1"
        }

        NIGHTLY_DL=""
        STABLE_DL=""
        fetch_downloads "releases/tags/nightly" "nightly" NIGHTLY_DL
        fetch_downloads "releases/latest" "stable" STABLE_DL

        NIGHTLY_FMT=$(format_count "$NIGHTLY_DL")
        echo "Nightly downloads: $NIGHTLY_DL"
        STABLE_FMT=$(format_count "$STABLE_DL")
        echo "Stable downloads: $STABLE_DL"

        # Generate both replacements in temporary files. If either fetch or
        # validation fails, the checked-in badge values remain untouched.
        NIGHTLY_CANDIDATE="$API_TEMP/nightly-downloads.json"
        STABLE_CANDIDATE="$API_TEMP/stable-downloads.json"
        write_badge "$NIGHTLY_CANDIDATE" "nightly downloads" "$NIGHTLY_FMT" "brightgreen"
        write_badge "$STABLE_CANDIDATE" "release downloads" "$STABLE_FMT" "blue"

        # Sanity-check: both badge files must parse as JSON before we commit.
        jq empty "$NIGHTLY_CANDIDATE" "$STABLE_CANDIDATE" \
          || { echo "Generated badge JSON is invalid; aborting." >&2; exit 1; }
        mv "$NIGHTLY_CANDIDATE" "$NIGHTLY_BADGE"
        mv "$STABLE_CANDIDATE" "$STABLE_BADGE"

        AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
        if test "$(git rev-parse HEAD)" != "$EXPECTED_STATE_COMMIT"; then
          echo "Badge checkout no longer points to the loaded counter-state commit." >&2
          exit 1
        fi
        REMOTE_SOURCE="$(git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          ls-remote --refs origin refs/heads/Working | awk 'NR == 1 { print $1 }')"
        if test "$REMOTE_SOURCE" != "$TRUSTED_SOURCE_COMMIT"; then
          echo "Working advanced while badge data was generated; refusing to publish stale state." >&2
          exit 1
        fi
        REMOTE_OBJECT="$(git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          ls-remote --refs origin "$STATE_REF" | awk 'NR == 1 { print $1 }')"
        if test "$REMOTE_OBJECT" != "$EXPECTED_REMOTE_OBJECT"; then
          echo "Generated counter state advanced while badge data was generated; refusing stale state." >&2
          exit 1
        fi

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -- \
          .github/badges/downloads-data.json \
          .github/badges/downloads.json \
          .github/badges/installer-downloads.json \
          .github/badges/nightly-downloads.json \
          .github/badges/stable-downloads.json
        git diff --cached --quiet && echo "No changes" && exit 0
        git commit -s -m "chore: refresh download badges (nightly: $NIGHTLY_DL, stable: $STABLE_DL) [skip ci]"
        FINAL_COMMIT="$(git rev-parse HEAD)"
        git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" push \
          --force-with-lease="${STATE_REF}:${EXPECTED_REMOTE_OBJECT}" origin \
          "HEAD:${STATE_REF}"
        PUBLISHED_OBJECT="$(git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          ls-remote --refs origin "$STATE_REF" | awk 'NR == 1 { print $1 }')"
        if test "$PUBLISHED_OBJECT" != "$FINAL_COMMIT"; then
          echo "Generated counter state tag does not point to the refreshed badge commit." >&2
          exit 1
        fi
        echo "changed=true" >> "$GITHUB_OUTPUT"
