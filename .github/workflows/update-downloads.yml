name: Update Download Badges

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: update-download-badges-Working
  cancel-in-progress: false

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        ref: Working

    - name: Refresh download count badges
      id: badge-commit
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        echo "changed=false" >> "$GITHUB_OUTPUT"
        mkdir -p .github/badges
        NIGHTLY_BADGE=".github/badges/nightly-downloads.json"
        STABLE_BADGE=".github/badges/stable-downloads.json"

        # Fetch the total download count for a release endpoint. Any failure
        # (missing release, network error, non-numeric output) collapses to 0
        # so that corrupt data can never leak into the badge JSON. We redirect
        # both stderr AND stdout through the validator so a 404 body cannot
        # be captured as the "count".
        fetch_downloads() {
          endpoint="$1"
          raw=$(gh api "repos/$REPO/$endpoint" \
            --jq '[.assets[].download_count] | add // 0' 2>/dev/null) || raw=""
          case "$raw" in
            ''|*[!0-9]*) printf '0' ;;
            *)           printf '%s' "$raw" ;;
          esac
        }

        # Format an integer with thousands separators. Falls back to the raw
        # number if the locale-aware printf is unavailable.
        format_count() {
          LC_ALL=en_US.UTF-8 printf "%'d" "$1" 2>/dev/null || printf '%s' "$1"
        }

        # Build the badge JSON with jq so we get guaranteed-valid output and
        # proper escaping regardless of the message contents.
        write_badge() {
          jq -n \
            --arg label "$2" \
            --arg message "$3" \
            --arg color "$4" \
            '{schemaVersion: 1, label: $label, message: $message, color: $color, namedLogo: "github", logoColor: "white"}' \
            > "$1"
        }

        NIGHTLY_DL=$(fetch_downloads "releases/tags/nightly")
        NIGHTLY_FMT=$(format_count "$NIGHTLY_DL")
        echo "Nightly downloads: $NIGHTLY_DL"
        write_badge "$NIGHTLY_BADGE" "nightly downloads" "$NIGHTLY_FMT" "brightgreen"

        STABLE_DL=$(fetch_downloads "releases/latest")
        STABLE_FMT=$(format_count "$STABLE_DL")
        echo "Stable downloads: $STABLE_DL"
        write_badge "$STABLE_BADGE" "release downloads" "$STABLE_FMT" "blue"

        # Sanity-check: both badge files must parse as JSON before we commit.
        jq empty "$NIGHTLY_BADGE" "$STABLE_BADGE" \
          || { echo "Generated badge JSON is invalid; aborting." >&2; exit 1; }

        # Only the run that still owns the exact Working head may advance it.
        REMOTE_HEAD="$(git ls-remote --heads origin refs/heads/Working | awk '{print $1}')"
        if test -z "$REMOTE_HEAD" || test "$REMOTE_HEAD" != "$(git rev-parse HEAD)"; then
          echo "Working advanced while badge data was generated; the newer run owns the update."
          exit 0
        fi

        # Commit if changed.
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .github/badges/nightly-downloads.json .github/badges/stable-downloads.json
        git diff --cached --quiet && echo "No changes" && exit 0
        git commit -m "chore: refresh download badges (nightly: $NIGHTLY_DL, stable: $STABLE_DL) [skip ci]"
        git push origin "HEAD:refs/heads/Working"
        echo "changed=true" >> "$GITHUB_OUTPUT"

    # GITHUB_TOKEN pushes do not trigger ordinary push workflows. Dispatching
    # Build explicitly ensures every generated Working head receives the same
    # proof and exact-head site publication as a human-authored commit.
    - name: Dispatch exact-head build after badge commit
      if: steps.badge-commit.outputs.changed == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        REMOTE_HEAD="$(git ls-remote --heads origin refs/heads/Working | awk '{print $1}')"
        if test "$REMOTE_HEAD" != "$(git rev-parse HEAD)"; then
          echo "Working advanced after this badge push; the newer head owns the build."
          exit 0
        fi
        for attempt in 1 2 3 4 5; do
          if gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref Working; then
            exit 0
          fi
          test "$attempt" -lt 5 || exit 1
          sleep "$((attempt * 2))"
        done
