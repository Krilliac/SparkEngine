name: Repository Site Data

on:
  push:
    branches: [Working]
  pull_request:
    branches: [Working, main, develop]
  workflow_dispatch:

concurrency:
  group: site-data-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-health:
    name: Documentation exact-currentness
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Generate and validate exact-commit API documentation
        env:
          SPARKENGINE_DOC_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export SPARKENGINE_DOC_SOURCE_COMMITTED_AT="$(git show -s --format=%cI HEAD)"
          timeout 5m bash docs/generate-api-docs.sh generate
          timeout 2m python3 tools/docs_contract.py validate \
            --api-dir docs/api --wiki-root wiki
          timeout 3m python3 tools/site-data/validate_docs_links.py \
            --generated-root docs/api --source-sha "$GITHUB_SHA"

      - name: Run hostile documentation contract tests
        run: |
          set -euo pipefail
          timeout 3m python3 Tests/Tools/test_docs_health.py -v
          timeout 3m python3 Tests/Tools/test_site_data_contract.py -v
          timeout 3m python3 tools/site-data/validate.py --docs

      - name: Prove isolated deterministic currentness and clean checkout
        env:
          SPARKENGINE_DOC_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export SPARKENGINE_DOC_SOURCE_COMMITTED_AT="$(git show -s --format=%cI HEAD)"
          before="$(git status --porcelain=v1 --untracked-files=no)"
          timeout 10m bash docs/update-all-docs.sh check
          after="$(git status --porcelain=v1 --untracked-files=no)"
          test "$before" = "$after"

  site-data-validate:
    name: Validate repository site data
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The contract only reads the checked-out commit timestamp; fetching
          # the full repository history can exhaust this job's 10-minute budget.
          fetch-depth: 1

      - name: Validate contract and generated handoff
        run: |
          set -euo pipefail
          python3 tools/site-data/validate.py
          python3 tools/site-data/validate.py --assets
          python3 tools/site-data/validate.py --legal
          python3 tools/site-data/render_handoff.py --check

      - name: Generate API docs and validate documentation links
        env:
          SPARKENGINE_DOC_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export SPARKENGINE_DOC_SOURCE_COMMITTED_AT="$(git show -s --format=%cI HEAD)"
          timeout 5m bash docs/generate-api-docs.sh generate
          timeout 3m python3 tools/site-data/validate_docs_links.py \
            --generated-root docs/api --source-sha "$GITHUB_SHA"
          timeout 3m python3 tools/site-data/validate.py --docs

      - name: Run readiness contract tests
        run: |
          set -euo pipefail
          python3 Tests/Tools/test_site_data_contract.py -v

      - name: Prove deterministic exact-commit generation
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          COMMITTED_AT="$(git show -s --format=%cI HEAD)"
          python3 tools/site-data/generate.py \
            --output "$RUNNER_TEMP/.site-data-a" \
            --source-commit "$GITHUB_SHA" \
            --source-branch "$SOURCE_BRANCH" \
            --committed-at "$COMMITTED_AT"
          python3 tools/site-data/generate.py \
            --output "$RUNNER_TEMP/.site-data-b" \
            --source-commit "$GITHUB_SHA" \
            --source-branch "$SOURCE_BRANCH" \
            --committed-at "$COMMITTED_AT"
          python3 tools/site-data/validate.py --published "$RUNNER_TEMP/.site-data-a"
          python3 tools/site-data/validate.py --published "$RUNNER_TEMP/.site-data-b"
          diff --recursive --brief "$RUNNER_TEMP/.site-data-a" "$RUNNER_TEMP/.site-data-b"

      - name: Upload validated bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sparkengine-site-data-${{ github.sha }}
          path: ${{ runner.temp }}/.site-data-a
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
