name: Repository Site Data

on:
  push:
    branches: [Working]
  pull_request:
    branches: [Working, main, develop]
  workflow_dispatch:

concurrency:
  group: site-data-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-health:
    name: Documentation exact-currentness
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Generate and validate exact-commit API documentation
        env:
          SPARKENGINE_DOC_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export SPARKENGINE_DOC_SOURCE_COMMITTED_AT="$(git show -s --format=%cI HEAD)"
          timeout 5m bash docs/generate-api-docs.sh generate
          timeout 2m python3 tools/docs_contract.py validate \
            --api-dir docs/api --wiki-root wiki
          timeout 3m python3 tools/site-data/validate_docs_links.py \
            --generated-root docs/api --source-sha "$GITHUB_SHA"

      - name: Run hostile documentation contract tests
        run: |
          set -euo pipefail
          timeout 3m python3 Tests/Tools/test_docs_health.py -v
          timeout 5m python3 Tests/Tools/test_site_data_contract.py -v
          timeout 3m python3 tools/site-data/validate.py --docs

      - name: Prove isolated deterministic currentness and clean checkout
        env:
          SPARKENGINE_DOC_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export SPARKENGINE_DOC_SOURCE_COMMITTED_AT="$(git show -s --format=%cI HEAD)"
          before="$(git status --porcelain=v1 --untracked-files=no)"
          timeout 10m bash docs/update-all-docs.sh check
          after="$(git status --porcelain=v1 --untracked-files=no)"
          test "$before" = "$after"

  site-data-validate:
    name: Validate repository site data
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The contract only reads the checked-out commit timestamp; fetching
          # the full repository history can exhaust this job's 10-minute budget.
          fetch-depth: 1

      # Windows collapses Tools/ and tools/ into one directory; a case-sensitive
      # runner does not. Every site-data module is tracked at the lowercase
      # tools/site-data/ path and validate.py imports its siblings by bare name,
      # so a module staged under Tools/site-data/ checks out into a different
      # directory here and every site-data step dies with ModuleNotFoundError.
      # Catch the staging mistake by name instead of by import traceback.
      - name: Assert site-data modules are tracked at the lowercase path
        run: |
          set -euo pipefail
          stray="$(git ls-files | grep '^Tools/site-data/' || true)"
          if [ -n "$stray" ]; then
            echo "site-data modules tracked under Tools/site-data/ (must be tools/site-data/):" >&2
            printf '%s\n' "$stray" >&2
            exit 1
          fi
          tracked="$(git ls-files -- tools/site-data | wc -l)"
          test "$tracked" -ge 6
          python3 -c "import sys; sys.path.insert(0, 'tools/site-data'); import assets, contract_selectors, common"

      - name: Validate contract and generated handoff
        run: |
          set -euo pipefail
          # Strict validation, no waiver: every requiredCiJobs/testSelectors/glob
          # reference must resolve. The --allow-legacy-contract waiver was retired
          # once the contract validated strictly; never reintroduce it here.
          # Asset-package integrity moved to the asset-integrity job below.
          python3 tools/site-data/validate.py
          python3 tools/site-data/validate.py --legal
          python3 tools/site-data/render_handoff.py --check

      - name: Generate API docs and validate documentation links
        env:
          SPARKENGINE_DOC_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export SPARKENGINE_DOC_SOURCE_COMMITTED_AT="$(git show -s --format=%cI HEAD)"
          timeout 5m bash docs/generate-api-docs.sh generate
          timeout 3m python3 tools/site-data/validate_docs_links.py \
            --generated-root docs/api --source-sha "$GITHUB_SHA"
          timeout 3m python3 tools/site-data/validate.py --docs

      - name: Run readiness contract tests
        run: |
          set -euo pipefail
          python3 Tests/Tools/test_site_data_contract.py -v

      # Documentation health is excluded from THIS determinism claim (see the
      # --skip-doc-health note below). The publication path proves health too:
      # site-data-publish.yml regenerates it once and compares the payload built
      # from it, so nothing is published on the strength of this narrower proof.
      - name: Prove deterministic exact-commit generation (health excluded)
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          COMMITTED_AT="$(git show -s --format=%cI HEAD)"
          # --skip-doc-health on the determinism proof only: documentation health
          # now really regenerates the docs in an isolated worktree, and two
          # health-enabled generate runs no longer fit this job's time budget. The
          # publish path in site-data-publish.yml keeps real health evidence.
          python3 tools/site-data/generate.py \
            --output "$RUNNER_TEMP/.site-data-a" \
            --source-commit "$GITHUB_SHA" \
            --source-branch "$SOURCE_BRANCH" \
            --committed-at "$COMMITTED_AT" \
            --skip-doc-health
          python3 tools/site-data/generate.py \
            --output "$RUNNER_TEMP/.site-data-b" \
            --source-commit "$GITHUB_SHA" \
            --source-branch "$SOURCE_BRANCH" \
            --committed-at "$COMMITTED_AT" \
            --skip-doc-health
          python3 tools/site-data/validate.py --published "$RUNNER_TEMP/.site-data-a"
          python3 tools/site-data/validate.py --published "$RUNNER_TEMP/.site-data-b"
          diff --recursive --brief "$RUNNER_TEMP/.site-data-a" "$RUNNER_TEMP/.site-data-b"

      - name: Upload validated bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sparkengine-site-data-${{ github.sha }}
          path: ${{ runner.temp }}/.site-data-a
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # RDY-020 names `asset-integrity` as a required CI job. No such job existed, so
  # the gate behind it could be neither red nor green. The executable check is
  # tools/site-data/validate.py --assets: every Assets/ package must declare a
  # manifest carrying provenance and SHA-256 for its tracked files.
  asset-integrity:
    name: Asset package integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Validate asset package manifests
        run: |
          set -euo pipefail
          # Strict --assets validation. This job exists to make the
          # missing-manifest condition behind RDY-020 observable, and a job that
          # runs the validator under a waiver could not honestly claim to enforce
          # the condition it was created for.
          python3 tools/site-data/validate.py --assets
