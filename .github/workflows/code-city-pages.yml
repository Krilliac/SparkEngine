name: Code City Pages

# Publishes the interactive 3D code city (tools/architecture-viz) to GitHub
# Pages so the README link always shows the current Working tree. The page is
# generated from tracked sources only; it is a visualization, not readiness or
# support evidence.
on:
  push:
    branches: [Working]
    paths:
      - "SparkEngine/**"
      - "SparkEditor/**"
      - "GameModules/**"
      - "Spark*/**"
      - "Tests/**"
      - "Shaders/**"
      - "Templates/**"
      - "docs/readiness/work-items/**"
      - "tools/architecture-viz/**"
      - ".github/workflows/code-city-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-city-pages
  cancel-in-progress: true

jobs:
  build:
    name: Generate code city
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the churn overlay counts the last 180 days of commits.
          fetch-depth: 0
          persist-credentials: false

      - name: Test the generator
        run: python3 Tests/Tools/test_code_city.py

      - name: Generate the page
        run: python3 tools/architecture-viz/generate_code_city.py --output _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
