name: Publish Builds

on:
  push:
    tags: [ 'v*' ]
  schedule:
    # Nightly at 04:00 UTC — after the day's merges settle
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0). Leave empty for rolling "latest" release.'
        required: false
        type: string
      build_configs:
        description: 'Which build configurations to publish'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - release
          - debug

permissions:
  contents: write

jobs:
  # ===========================================================================
  # Compute release metadata and build matrix shared by all jobs
  # ===========================================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      is_versioned: ${{ steps.meta.outputs.is_versioned }}
      configs: ${{ steps.matrix.outputs.configs }}
      build_type: ${{ steps.matrix.outputs.build_type }}
    steps:
    - name: Compute release metadata
      id: meta
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.release_tag }}" ]]; then
          TAG="${{ inputs.release_tag }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "is_versioned=true" >> "$GITHUB_OUTPUT"
        elif [[ "${{ github.ref_type }}" == "tag" ]]; then
          TAG="${{ github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "is_versioned=true" >> "$GITHUB_OUTPUT"
        else
          echo "tag=nightly" >> "$GITHUB_OUTPUT"
          echo "version=nightly" >> "$GITHUB_OUTPUT"
          echo "is_versioned=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Determine build configurations
      id: matrix
      run: |
        # Default to 'both' for tag pushes, use input for workflow_dispatch
        BUILD_CONFIGS="${{ inputs.build_configs || 'both' }}"
        echo "build_type=$BUILD_CONFIGS" >> "$GITHUB_OUTPUT"

        if [[ "$BUILD_CONFIGS" == "both" ]]; then
          echo 'configs=["Debug","Release"]' >> "$GITHUB_OUTPUT"
        elif [[ "$BUILD_CONFIGS" == "release" ]]; then
          echo 'configs=["Release"]' >> "$GITHUB_OUTPUT"
        else
          echo 'configs=["Debug"]' >> "$GITHUB_OUTPUT"
        fi

  # ===========================================================================
  # Windows Build — MSVC VS 2022
  # ===========================================================================
  build-windows:
    needs: [prepare]
    runs-on: windows-latest
    strategy:
      matrix:
        config: ${{ fromJson(needs.prepare.outputs.configs) }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v3

    - name: Configure CMake
      run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DSPARK_MSVC_TOOLSET=v143 -DBUILD_TESTS=ON

    - name: Build
      run: cmake --build build --config ${{ matrix.config }} --parallel

    - name: Run Tests
      run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

    - name: Package artifacts
      shell: pwsh
      run: |
        $outDir = "dist/SparkEngine-Windows-${{ matrix.config }}"
        New-Item -ItemType Directory -Force -Path $outDir | Out-Null
        if (Test-Path "build/bin/${{ matrix.config }}") {
          Copy-Item "build/bin/${{ matrix.config }}/*" $outDir -Recurse -Force
        } elseif (Test-Path "build/bin") {
          Copy-Item "build/bin/*" $outDir -Recurse -Force
        }
        Compress-Archive -Path $outDir -DestinationPath "SparkEngine-Windows-${{ matrix.config }}.zip"

    - name: Upload packaged artifact
      uses: actions/upload-artifact@v7
      with:
        name: SparkEngine-Windows-${{ matrix.config }}
        path: SparkEngine-Windows-${{ matrix.config }}.zip
        retention-days: 7

  # ===========================================================================
  # Linux Build — GCC
  # ===========================================================================
  build-linux:
    needs: [prepare]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        config: ${{ fromJson(needs.prepare.outputs.configs) }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libgl-dev libvulkan-dev libsdl2-dev

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DBUILD_TESTS=ON \
          -DCMAKE_C_COMPILER=gcc \
          -DCMAKE_CXX_COMPILER=g++

    - name: Build
      run: cmake --build build --parallel $(nproc)

    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure
        if [ -f bin/SparkTests ]; then ./bin/SparkTests; fi

    - name: Package artifacts
      run: |
        mkdir -p dist/SparkEngine-Linux-${{ matrix.config }}
        cp -r build/bin/* dist/SparkEngine-Linux-${{ matrix.config }}/
        tar -czf SparkEngine-Linux-${{ matrix.config }}.tar.gz \
          -C dist SparkEngine-Linux-${{ matrix.config }}

    - name: Upload packaged artifact
      uses: actions/upload-artifact@v7
      with:
        name: SparkEngine-Linux-${{ matrix.config }}
        path: SparkEngine-Linux-${{ matrix.config }}.tar.gz
        retention-days: 7

  # ===========================================================================
  # Publish GitHub Release (versioned or rolling "latest")
  # ===========================================================================
  release:
    needs: [prepare, build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        ref: ${{ github.ref }}
        fetch-depth: 0

    - name: Snapshot download counts and update badges
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p .github/badges
        DATA_FILE=".github/badges/downloads-data.json"
        LIFETIME_BADGE=".github/badges/downloads.json"
        NIGHTLY_BADGE=".github/badges/nightly-downloads.json"
        STABLE_BADGE=".github/badges/stable-downloads.json"

        # Read existing lifetime total
        if [ -f "$DATA_FILE" ]; then
          LIFETIME=$(jq -r '.total // 0' "$DATA_FILE")
        else
          LIFETIME=0
        fi
        echo "Previous lifetime total: $LIFETIME"

        SNAPSHOT=0

        if [[ "${{ needs.prepare.outputs.is_versioned }}" == "false" ]]; then
          # Nightly release: snapshot current nightly downloads before replacement
          NIGHTLY_DL=$(gh api repos/${{ github.repository }}/releases/tags/nightly \
            --jq '[.assets[].download_count] | add // 0' 2>/dev/null || echo 0)
          echo "Current nightly downloads before reset: $NIGHTLY_DL"
          SNAPSHOT=$NIGHTLY_DL

          # Reset nightly badge to 0 (release is being replaced)
          cat > "$NIGHTLY_BADGE" << BADGE_EOF
{
    "schemaVersion": 1,
    "label": "nightly downloads",
    "message": "0",
    "color": "brightgreen",
    "namedLogo": "github",
    "logoColor": "white"
}
BADGE_EOF
        else
          # Stable release: snapshot current stable downloads before new version
          STABLE_DL=$(gh api repos/${{ github.repository }}/releases/latest \
            --jq '[.assets[].download_count] | add // 0' 2>/dev/null || echo 0)
          echo "Current stable downloads before reset: $STABLE_DL"
          SNAPSHOT=$STABLE_DL

          # Reset stable badge to 0 (new release is being published)
          cat > "$STABLE_BADGE" << BADGE_EOF
{
    "schemaVersion": 1,
    "label": "release downloads",
    "message": "0",
    "color": "blue",
    "namedLogo": "github",
    "logoColor": "white"
}
BADGE_EOF
        fi

        # Accumulate into lifetime total
        NEW_TOTAL=$((LIFETIME + SNAPSHOT))
        echo "New lifetime total: $NEW_TOTAL"
        FORMATTED=$(printf "%'d" "$NEW_TOTAL" 2>/dev/null || echo "$NEW_TOTAL")

        # Write data file
        cat > "$DATA_FILE" << DATA_EOF
{
    "total": $NEW_TOTAL,
    "updated": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
}
DATA_EOF

        # Write lifetime badge
        cat > "$LIFETIME_BADGE" << BADGE_EOF
{
    "schemaVersion": 1,
    "label": "lifetime downloads",
    "message": "$FORMATTED",
    "color": "brightgreen",
    "namedLogo": "github",
    "logoColor": "white"
}
BADGE_EOF

        # Commit updated counters
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .github/badges/
        git diff --cached --quiet && echo "No download count change" && exit 0
        git commit -m "chore: update download counters (lifetime: $NEW_TOTAL) [skip ci]"
        git push origin HEAD:${{ github.ref_name }}

    - name: Resolve short commit SHA
      id: sha
      run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

    - name: Download all build artifacts
      uses: actions/download-artifact@v8
      with:
        path: release-assets

    - name: Collect release assets
      id: assets
      run: |
        # Flatten all artifacts to current directory
        find release-assets -type f \( -name "*.zip" -o -name "*.tar.gz" \) \
          -exec cp {} . \;

        # Build the file list and downloads table dynamically
        FILES=""
        TABLE="| Asset | Platform | Config |"$'\n'"|---|---|---|"

        for config in Debug Release; do
          WIN="SparkEngine-Windows-${config}.zip"
          LIN="SparkEngine-Linux-${config}.tar.gz"

          if [ -f "$WIN" ]; then
            FILES="${FILES}${WIN}"$'\n'
            TABLE="${TABLE}"$'\n'"| \`${WIN}\` | Windows (VS 2022 x64) | ${config} |"
          fi
          if [ -f "$LIN" ]; then
            FILES="${FILES}${LIN}"$'\n'
            TABLE="${TABLE}"$'\n'"| \`${LIN}\` | Linux (GCC, ubuntu-24.04) | ${config} |"
          fi
        done

        # Write multiline outputs
        {
          echo "files<<FILESEOF"
          echo "$FILES"
          echo "FILESEOF"
        } >> "$GITHUB_OUTPUT"

        {
          echo "table<<TABLEEOF"
          echo "$TABLE"
          echo "TABLEEOF"
        } >> "$GITHUB_OUTPUT"

    - name: Determine release title suffix
      id: suffix
      run: |
        BUILD_TYPE="${{ needs.prepare.outputs.build_type }}"
        if [[ "$BUILD_TYPE" == "debug" ]]; then
          echo "label= (Debug)" >> "$GITHUB_OUTPUT"
        elif [[ "$BUILD_TYPE" == "release" ]]; then
          echo "label= (Release)" >> "$GITHUB_OUTPUT"
        else
          echo "label=" >> "$GITHUB_OUTPUT"
        fi

    - name: Create stable versioned release
      if: needs.prepare.outputs.is_versioned == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.prepare.outputs.tag }}
        name: "SparkEngine ${{ needs.prepare.outputs.version }} (Stable)${{ steps.suffix.outputs.label }}"
        body: |
          ## SparkEngine ${{ needs.prepare.outputs.version }} — Stable Release${{ steps.suffix.outputs.label }}

          Built from commit [`${{ steps.sha.outputs.short }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
          Built on: ${{ github.run_started_at }}

          > **Stable releases** are manually published and thoroughly tested. For the latest development builds, see the [nightly release](https://github.com/${{ github.repository }}/releases/tag/nightly).

          ### Downloads

          ${{ steps.assets.outputs.table }}
        prerelease: false
        make_latest: true
        files: ${{ steps.assets.outputs.files }}

    - name: Create or update nightly rolling release
      if: needs.prepare.outputs.is_versioned == 'false'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nightly
        name: "Nightly Build (${{ steps.sha.outputs.short }})${{ steps.suffix.outputs.label }}"
        body: |
          ## Nightly Build${{ steps.suffix.outputs.label }}

          Built from commit [`${{ steps.sha.outputs.short }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
          Built on: ${{ github.run_started_at }}
          Branch: `${{ github.ref_name }}`

          > **Nightly builds** are published automatically on every commit. All CI checks pass before publishing. For a stable, manually-verified release see the [latest stable release](https://github.com/${{ github.repository }}/releases/latest).

          ${{ steps.assets.outputs.table }}
        prerelease: false
        make_latest: false
        files: ${{ steps.assets.outputs.files }}
