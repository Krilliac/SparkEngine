name: Publish Builds

on:
  schedule:
    # Nightly at 04:00 UTC — after the day's merges settle
    - cron: '0 4 * * *'
  # repository_dispatch always executes the workflow from the current default
  # branch. Its client_payload is treated only as bounded release metadata, so
  # a caller cannot select a historical workflow file with write permission.
  repository_dispatch:
    types: [publish-builds]

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Compute release metadata and build matrix shared by all jobs
  # ===========================================================================
  prepare:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      cmake_version: ${{ steps.meta.outputs.cmake_version }}
      tag: ${{ steps.meta.outputs.tag }}
      is_versioned: ${{ steps.meta.outputs.is_versioned }}
      configs: ${{ steps.matrix.outputs.configs }}
      windows_matrix: ${{ steps.matrix.outputs.windows_matrix }}
      build_type: ${{ steps.matrix.outputs.build_type }}
    steps:
    - name: Checkout release metadata source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: Working
        persist-credentials: false

    # Release publication must enforce the same dependency, vendored-content,
    # and action-pin policy as CI before any release metadata is computed.
    - name: Install supply-chain checker dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-yaml cmake
        python3 -c "import yaml; print('PyYAML', yaml.__version__)"
        cmake --version

    - name: Supply-chain policy check
      run: python3 tools/check-supply-chain.py --ci

    # REL-100: prove the per-artifact provenance gate still rejects forged,
    # stale, or incomplete records before any job relies on it.
    - name: Self-test per-artifact build provenance gate
      run: python3 Tests/Tools/test_release_build_provenance.py

    - name: Attest current trusted release controller
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_REF: ${{ github.ref }}
        EVENT_SHA: ${{ github.sha }}
        WORKFLOW_SHA: ${{ github.workflow_sha }}
      run: |
        set -euo pipefail
        if [[ "$EVENT_NAME" != "schedule" && "$EVENT_NAME" != "repository_dispatch" ]]; then
          echo "Untrusted release event: $EVENT_NAME" >&2
          exit 1
        fi
        if test "$EVENT_REF" != "refs/heads/Working"; then
          echo "Release controller must execute from refs/heads/Working; got $EVENT_REF" >&2
          exit 1
        fi
        LOCAL_SHA="$(git rev-parse HEAD)"
        AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
        REMOTE_SHA="$(git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          ls-remote --refs origin refs/heads/Working | awk 'NR == 1 { print $1 }')"
        if test "$LOCAL_SHA" != "$EVENT_SHA" \
          || test "$LOCAL_SHA" != "$WORKFLOW_SHA" \
          || test "$LOCAL_SHA" != "$REMOTE_SHA"; then
          echo "Release controller is not the exact current Working workflow commit." >&2
          exit 1
        fi

    - name: Compute release metadata
      id: meta
      env:
        EVENT_NAME: ${{ github.event_name }}
        INPUT_RELEASE_TAG: ${{ github.event.client_payload.release_tag || '' }}
      run: |
        set -euo pipefail
        DEFAULT_VERSION=$(sed -nE 's/^set\(SPARK_ENGINE_VERSION "([0-9]+\.[0-9]+\.[0-9]+)" CACHE.*/\1/p' CMakeLists.txt | head -n 1)
        if [[ ! "$DEFAULT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Could not determine the default semantic version from CMakeLists.txt" >&2
          exit 1
        fi

        if [[ "$EVENT_NAME" == "repository_dispatch" && -n "$INPUT_RELEASE_TAG" ]]; then
          TAG="$INPUT_RELEASE_TAG"
        else
          TAG=""
        fi

        if [[ -n "$TAG" ]]; then
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must have the form vMAJOR.MINOR.PATCH; got: $TAG" >&2
            exit 1
          fi
          # An override must not manufacture a stable version absent from the source.
          # Nightly deliberately has no versioned-changelog requirement.
          python3 - "${TAG#v}" "$DEFAULT_VERSION" <<'PYVERSION'
        import re
        import sys
        from pathlib import Path

        version, default = sys.argv[1:]
        declarations = re.findall(
            r"(?im)^[ \t]*set\s*\(\s*SPARK_ENGINE_VERSION(?=\s|\))",
            Path("CMakeLists.txt").read_text(encoding="utf-8"),
        )
        if len(declarations) != 1 or version != default:
            sys.exit("Stable tag must equal the single CMake SPARK_ENGINE_VERSION default")
        changelog = Path("CHANGELOG.md")
        if not changelog.is_file():
            sys.exit("Stable publication requires CHANGELOG.md")
        heading = re.compile(r"## \[" + re.escape(version) + r"\](?: - \d{4}-\d{2}-\d{2})?[ \t]*")
        count = sum(heading.fullmatch(line) is not None
                    for line in changelog.read_text(encoding="utf-8").splitlines())
        if count != 1:
            sys.exit(f"Stable publication requires exactly one CHANGELOG.md heading for [{version}]; found {count}")
        PYVERSION
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "cmake_version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "is_versioned=true" >> "$GITHUB_OUTPUT"
        else
          if [[ ! "${GITHUB_RUN_ID:-}" =~ ^[1-9][0-9]*$ ||
                ! "${GITHUB_RUN_ATTEMPT:-}" =~ ^[1-9][0-9]*$ ||
                ! "${GITHUB_SHA:-}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Immutable nightly identity requires the authenticated run ID, attempt, and 40-hex source SHA." >&2
            exit 1
          fi
          NIGHTLY_TAG="nightly-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          echo "tag=$NIGHTLY_TAG" >> "$GITHUB_OUTPUT"
          echo "version=nightly" >> "$GITHUB_OUTPUT"
          echo "cmake_version=$DEFAULT_VERSION" >> "$GITHUB_OUTPUT"
          echo "is_versioned=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Preflight stable publication authority before building
      if: steps.meta.outputs.is_versioned == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: python3 .github/scripts/verify_release_environment.py

    - name: Determine build configurations
      id: matrix
      env:
        EVENT_NAME: ${{ github.event_name }}
        IS_VERSIONED: ${{ steps.meta.outputs.is_versioned }}
        REQUESTED_CONFIGS: ${{ github.event.client_payload.build_configs || 'both' }}
      run: |
        set -euo pipefail
        # Every immutable nightly publishes both configurations so the newest
        # prerelease always contains a complete Debug and Release asset set.
        # Only versioned releases may honor an explicit single-config choice.
        if [[ ! "$REQUESTED_CONFIGS" =~ ^(both|release|debug)$ ]]; then
          echo "build_configs must be one of both, release, or debug; got: $REQUESTED_CONFIGS" >&2
          exit 1
        fi
        if [[ "$IS_VERSIONED" == "true" && "$REQUESTED_CONFIGS" == "debug" ]]; then
          echo "versioned releases require Windows Shipping artifacts; debug-only publication is forbidden" >&2
          exit 1
        fi
        if [[ "$IS_VERSIONED" == "false" ]]; then
          BUILD_CONFIGS="both"
        else
          BUILD_CONFIGS="$REQUESTED_CONFIGS"
        fi
        echo "build_type=$BUILD_CONFIGS" >> "$GITHUB_OUTPUT"

        if [[ "$IS_VERSIONED" == "true" ]]; then
          echo 'windows_matrix=[{"config":"MinSizeRel","build_dir":"build/windows-shipping","profile":"stable-v1"}]' >> "$GITHUB_OUTPUT"
        else
          echo 'windows_matrix=[{"config":"Debug","build_dir":"build","profile":"default"},{"config":"Release","build_dir":"build","profile":"default"}]' >> "$GITHUB_OUTPUT"
        fi

        if [[ "$BUILD_CONFIGS" == "both" ]]; then
          echo 'configs=["Debug","Release"]' >> "$GITHUB_OUTPUT"
        elif [[ "$BUILD_CONFIGS" == "release" ]]; then
          echo 'configs=["Release"]' >> "$GITHUB_OUTPUT"
        else
          echo 'configs=["Debug"]' >> "$GITHUB_OUTPUT"
        fi

  # ===========================================================================
  # Windows Build — MSVC VS 2022
  # ===========================================================================
  build-windows:
    needs: [prepare]
    runs-on: windows-2022
    environment: ${{ needs.prepare.outputs.is_versioned == 'true' && 'stable-release' || 'nightly-release' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.windows_matrix) }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive

    - name: Test native Windows signature rejection
      if: needs.prepare.outputs.is_versioned == 'true'
      run: python .github/scripts/test_verify_windows_package_signatures.py

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

    - name: Configure Windows stable validation
      if: needs.prepare.outputs.is_versioned == 'true'
      run: cmake --preset windows-release -DSPARK_ENGINE_VERSION="${{ needs.prepare.outputs.cmake_version }}"

    - name: Build Windows stable validation
      if: needs.prepare.outputs.is_versioned == 'true'
      run: cmake --build build/windows-release --config Release --parallel

    - name: Test Windows stable validation
      if: needs.prepare.outputs.is_versioned == 'true'
      run: ctest --test-dir build/windows-release -C Release --output-on-failure --no-tests=error

    - name: Configure Windows Shipping package
      if: needs.prepare.outputs.is_versioned == 'true'
      # Preserve the authoritative Shipping feature surface, including BUILD_TESTS=OFF.
      # The separate Release tree above supplies validation; only this tree is packaged.
      run: cmake --preset windows-shipping -DSPARK_REQUIRE_WINDOWS_INSTALLERS=ON -DSPARK_ENGINE_VERSION="${{ needs.prepare.outputs.cmake_version }}" -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/stage"

    - name: Configure CMake
      if: needs.prepare.outputs.is_versioned == 'false'
      # SPARK_REQUIRE_WINDOWS_INSTALLERS turns a missing makensis/WiX toolchain into
      # a configure error here, so the release cannot quietly produce a ZIP only.
      run: cmake -B build -G "Visual Studio 17 2022" -A x64 -T v143 -DBUILD_TESTS=ON -DSPARK_STRICT_DEPS=ON -DSPARK_REQUIRE_WINDOWS_INSTALLERS=ON -DSPARK_ENGINE_VERSION="${{ needs.prepare.outputs.cmake_version }}" -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/stage"

    - name: Build
      run: cmake --build ${{ matrix.build_dir }} --config ${{ matrix.config }} --parallel

    - name: Run Tests
      if: needs.prepare.outputs.is_versioned == 'false'
      run: ctest --test-dir ${{ matrix.build_dir }} -C ${{ matrix.config }} --output-on-failure --no-tests=error

    - name: Validate external package consumption
      shell: pwsh
      run: |
        cmake --install ${{ matrix.build_dir }} --config ${{ matrix.config }}
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cmake -S Tests/PackageSmoke -B smoke-build -G "Visual Studio 17 2022" -A x64 -T v143 `
          -DSparkEngine_DIR="${{ github.workspace }}/stage/lib/cmake/SparkEngine" `
          -DSPARK_EXPECTED_ENGINE_VERSION="${{ needs.prepare.outputs.cmake_version }}"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cmake --build smoke-build --config ${{ matrix.config }} --parallel
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        ctest --test-dir smoke-build -C ${{ matrix.config }} --output-on-failure --no-tests=error
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Build every template against the installed SDK
      shell: pwsh
      run: |
        cmake `
          -DSPARK_TEMPLATE_ROOT="${{ github.workspace }}/stage/share/SparkEngine/templates" `
          -DSPARK_TEMPLATE_SOURCE_ROOT="${{ github.workspace }}/Templates" `
          -DSPARK_TEMPLATE_BUILD_ROOT="${{ github.workspace }}/template-smoke-build" `
          -DSPARK_ENGINE_DIR="${{ github.workspace }}/stage/lib/cmake/SparkEngine" `
          -DSPARK_ENGINE_EXECUTABLE="${{ github.workspace }}/stage/bin/SparkEngine.exe" `
          -DSPARK_TEMPLATE_CONFIG=${{ matrix.config }} `
          "-DSPARK_CMAKE_GENERATOR=Visual Studio 17 2022" `
          -DSPARK_CMAKE_GENERATOR_PLATFORM=x64 `
          -DSPARK_CMAKE_GENERATOR_TOOLSET=v143 `
          -P cmake/VerifyInstalledTemplates.cmake
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Verify staged template assets and service configs
      shell: pwsh
      # The CTest copies of these gates read ${CMAKE_SOURCE_DIR}/Templates, which
      # cannot show that the install filter dropped a locked asset from the package
      # a user actually installs. Only a staged install can, and this job has one.
      run: |
        cmake `
          -DSPARK_TEMPLATE_ROOT="${{ github.workspace }}/stage/share/SparkEngine/templates" `
          -P cmake/VerifyTemplateAssets.cmake
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cmake `
          -DSPARK_TEMPLATE_ROOT="${{ github.workspace }}/stage/share/SparkEngine/templates" `
          -P cmake/VerifyTemplateServiceConfigs.cmake
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Validate staged package executable BOM
      shell: pwsh
      run: |
        cmake `
          -DSPARK_PACKAGE_ROOT="${{ github.workspace }}/stage" `
          -DSPARK_PACKAGE_PROFILE=${{ matrix.profile }} -DSPARK_EXECUTABLE_SUFFIX:STRING=.exe `
          -P cmake/ValidateStagedPackageExecutables.cmake
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Validate Windows stable runtime component layout
      if: needs.prepare.outputs.is_versioned == 'true'
      shell: pwsh
      # This checks the native installers' component set before packaging. It
      # does not install an MSI or certify Windows 11, signing, or upgrades.
      run: |
        $ErrorActionPreference = 'Stop'
        $runtimeRoot = Join-Path "${{ github.workspace }}" "runtime-stage"
        if (Test-Path -LiteralPath $runtimeRoot) { throw "Runtime staging root must be fresh" }
        cmake --install ${{ matrix.build_dir }} --config ${{ matrix.config }} --component runtime --prefix "$runtimeRoot" 2>&1 | Tee-Object -FilePath runtime-layout.log
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cmake --install ${{ matrix.build_dir }} --config ${{ matrix.config }} --component tools --prefix "$runtimeRoot" 2>&1 | Tee-Object -FilePath runtime-layout.log -Append
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cmake --install ${{ matrix.build_dir }} --config ${{ matrix.config }} --component samples --prefix "$runtimeRoot" 2>&1 | Tee-Object -FilePath runtime-layout.log -Append
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cmake -DSPARK_PACKAGE_ROOT="$runtimeRoot" -DSPARK_PACKAGE_LAYOUT=runtime -DSPARK_PACKAGE_PROFILE=stable-v1 `
          -DSPARK_PACKAGE_EXPECTED_MODULE_MANIFEST="${{ github.workspace }}/${{ matrix.build_dir }}/SparkEngineGameModules.cmake" `
          -DSPARK_EXECUTABLE_SUFFIX:STRING=.exe -P cmake/ValidateStagedPackageExecutables.cmake 2>&1 | Tee-Object -FilePath runtime-layout.log -Append
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Upload runtime layout diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: SparkEngine-Windows-${{ matrix.config }}-runtime-layout-diagnostics
        path: runtime-layout.log
        if-no-files-found: ignore
        retention-days: 7

    - name: Generate CPack packages
      shell: pwsh
      run: |
        cpack --config ${{ matrix.build_dir }}/CPackConfig.cmake -C ${{ matrix.config }} -B ${{ matrix.build_dir }}/packages
        $cpackExitCode = $LASTEXITCODE
        if ($cpackExitCode -ne 0) {
          Get-ChildItem ${{ matrix.build_dir }}/packages/_CPack_Packages -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -in @('NSISOutput.log', 'wix.log') } |
            ForEach-Object {
              Write-Error "CPack diagnostic: $($_.FullName)" -ErrorAction Continue
              Get-Content -LiteralPath $_.FullName
            }
          exit $cpackExitCode
        }

    # Stable signing is performed only after the protected stable-release
    # environment has authorized this job. The PFX is provisioned externally;
    # it is never committed, uploaded, or exposed to nightly builds.
    - name: Sign Windows stable outer installers
      if: needs.prepare.outputs.is_versioned == 'true'
      shell: pwsh
      env:
        SPARK_RELEASE_SIGNER_THUMBPRINT: ${{ vars.SPARK_RELEASE_SIGNER_THUMBPRINT }}
        SPARK_RELEASE_SIGNING_PFX_BASE64: ${{ secrets.SPARK_RELEASE_SIGNING_PFX_BASE64 }}
        SPARK_RELEASE_SIGNING_PFX_PASSWORD: ${{ secrets.SPARK_RELEASE_SIGNING_PFX_PASSWORD }}
      run: |
        $ErrorActionPreference = 'Stop'
        if ($env:SPARK_RELEASE_SIGNER_THUMBPRINT -notmatch '^[0-9A-Fa-f]{40}$') {
          throw 'SPARK_RELEASE_SIGNER_THUMBPRINT must be the protected 40-hex public certificate thumbprint'
        }
        if ([string]::IsNullOrWhiteSpace($env:SPARK_RELEASE_SIGNING_PFX_BASE64) -or
            [string]::IsNullOrEmpty($env:SPARK_RELEASE_SIGNING_PFX_PASSWORD)) {
          throw 'Stable signing requires the protected PFX and password secrets'
        }
        $pfxPath = Join-Path $env:RUNNER_TEMP ('spark-signing-' + [guid]::NewGuid().ToString('N') + '.pfx')
        $cerPath = Join-Path $env:RUNNER_TEMP ('spark-signing-' + [guid]::NewGuid().ToString('N') + '.cer')
        $rootMarker = Join-Path $env:RUNNER_TEMP 'spark-signing-root-added.txt'
        $cert = $null
        $importAttempted = $false
        try {
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SPARK_RELEASE_SIGNING_PFX_BASE64))
          $securePassword = ConvertTo-SecureString $env:SPARK_RELEASE_SIGNING_PFX_PASSWORD -AsPlainText -Force
          $pfxData = Get-PfxData -FilePath $pfxPath -Password $securePassword
          $pfxThumbprints = @($pfxData.EndEntityCertificates + $pfxData.OtherCertificates | ForEach-Object { $_.Thumbprint })
          if ($pfxThumbprints.Count -ne 1 -or
              $pfxThumbprints[0] -ne $env:SPARK_RELEASE_SIGNER_THUMBPRINT.ToUpperInvariant()) {
            throw 'PFX must contain exactly the pinned signing certificate'
          }
          $myThumbprintsBefore = @(Get-ChildItem -Path 'Cert:\CurrentUser\My' -ErrorAction Stop | ForEach-Object { $_.Thumbprint })
          if ($env:SPARK_RELEASE_SIGNER_THUMBPRINT.ToUpperInvariant() -in $myThumbprintsBefore) {
            throw 'Pinned signer already exists in CurrentUser personal store; refusing to replace it'
          }
          $importAttempted = $true
          $certificates = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation 'Cert:\CurrentUser\My' -Password $securePassword)
          if ($certificates.Count -ne 1) {
            throw "Expected exactly one imported signing certificate; PFX returned $($certificates.Count)"
          }
          $cert = $certificates[0]
          if ($null -eq $cert -or $cert.Thumbprint -ne $env:SPARK_RELEASE_SIGNER_THUMBPRINT.ToUpperInvariant()) {
            throw 'Imported signing certificate thumbprint does not match the protected public thumbprint'
          }
          # Never resolve SignTool through PATH: an arbitrary PATH binary must
          # not receive access to the imported private signing certificate.
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          if (-not (Test-Path -LiteralPath $sdkRoot -PathType Container)) {
            throw 'Windows SDK x64 SignTool root was not found'
          }
          $sdkTool = Get-ChildItem -LiteralPath $sdkRoot -Filter signtool.exe -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match '\\Windows Kits\\10\\bin\\[^\\]+\\x64\\signtool\.exe$' -and
              -not ($_.Attributes -band [IO.FileAttributes]::ReparsePoint)
            } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $sdkTool) { throw 'Windows SDK x64 SignTool was not found' }
          $signtoolPath = $sdkTool.FullName
          if ([string]::IsNullOrWhiteSpace($signtoolPath) -or -not (Test-Path -LiteralPath $signtoolPath -PathType Leaf)) {
            throw 'Resolved SDK SignTool path is not a regular file'
          }
          $existingRoot = @(Get-ChildItem -Path 'Cert:\CurrentUser\Root' -ErrorAction Stop |
            Where-Object { $_.Thumbprint -eq $env:SPARK_RELEASE_SIGNER_THUMBPRINT.ToUpperInvariant() })
          if ($existingRoot.Count -eq 0) {
            Export-Certificate -Cert $cert -FilePath $cerPath -Type CERT -Force | Out-Null
            Set-Content -LiteralPath $rootMarker -Value $env:SPARK_RELEASE_SIGNER_THUMBPRINT -NoNewline
            Import-Certificate -FilePath $cerPath -CertStoreLocation 'Cert:\CurrentUser\Root' | Out-Null
          } elseif ($existingRoot.Count -ne 1) {
            throw 'Pinned signer has an ambiguous preexisting root-store identity'
          }
          $targets = @(Get-ChildItem -LiteralPath "${{ github.workspace }}/${{ matrix.build_dir }}/packages" -File |
            Where-Object { $_.Extension -in @('.exe', '.msi') } | Sort-Object Name)
          if ($targets.Count -ne 2) { throw "Expected exactly two Windows outer installers; found $($targets.Count)" }
          foreach ($target in $targets) {
            & $signtoolPath sign /sha1 $env:SPARK_RELEASE_SIGNER_THUMBPRINT /fd SHA256 /tr 'http://timestamp.digicert.com' /td SHA256 $target.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($target.Name)" }
          }
        } finally {
          if ($importAttempted) {
            $introducedPath = 'Cert:\CurrentUser\My\' + $env:SPARK_RELEASE_SIGNER_THUMBPRINT.ToUpperInvariant()
            if (Test-Path -LiteralPath $introducedPath) {
              Remove-Item -LiteralPath $introducedPath -Force -DeleteKey -Confirm:$false -ErrorAction Stop
            }
            if (Test-Path -LiteralPath $introducedPath) { throw 'Imported signer remains after cleanup' }
          }
          if (Test-Path -LiteralPath $pfxPath) {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction Stop
            if (Test-Path -LiteralPath $pfxPath) { throw 'Temporary PFX remains after cleanup' }
          }
          if (Test-Path -LiteralPath $cerPath) {
            Remove-Item -LiteralPath $cerPath -Force -ErrorAction Stop
            if (Test-Path -LiteralPath $cerPath) { throw 'Temporary certificate remains after cleanup' }
          }
        }

    # Owner prerequisite: sign the final CPack outputs with the project-pinned
    # self-signed Authenticode certificate and provision its public thumbprint.
    # The release runner must trust that certificate; end users may see the
    # explicitly disclosed Windows "Unknown Publisher" warning.
    - name: Verify Windows stable outer installer signatures
      if: needs.prepare.outputs.is_versioned == 'true'
      shell: pwsh
      env:
        SPARK_RELEASE_SIGNER_THUMBPRINT: ${{ vars.SPARK_RELEASE_SIGNER_THUMBPRINT }}
        SPARK_RELEASE_TRUST_MODEL: ${{ vars.SPARK_RELEASE_TRUST_MODEL }}
      run: |
        python .github/scripts/verify-windows-package-signatures.py `
          --packages "${{ github.workspace }}/${{ matrix.build_dir }}/packages" `
          --version "${{ needs.prepare.outputs.cmake_version }}" --source-sha "${{ github.sha }}" `
          --report "${{ github.workspace }}/signature-verification/result.json"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Qualify Windows v0.9.0 predecessor MSI bootstrap install repair and uninstall
      if: needs.prepare.outputs.is_versioned == 'true' && needs.prepare.outputs.version == '0.9.0'
      shell: pwsh
      # v0.9.0 is the one explicitly permitted bootstrap release: it has no
      # older stable MSI. The qualifier's omitted predecessor arguments still
      # exercises native install, package smoke, repair, and uninstall. Any
      # other version must use the exact published N-1 path below.
      run: |
        $packageManifest = "${{ github.workspace }}/${{ matrix.build_dir }}/packages/shipping-package-manifest.json"
        python .github/scripts/write-shipping-package-manifest.py `
          --packages "${{ github.workspace }}/${{ matrix.build_dir }}/packages" `
          --version "${{ needs.prepare.outputs.cmake_version }}" `
          --commit-sha "${{ github.sha }}" --out $packageManifest
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python .github/scripts/qualify-windows-msi.py `
          --packages "${{ github.workspace }}/${{ matrix.build_dir }}/packages" `
          --version "${{ needs.prepare.outputs.cmake_version }}" `
          --manifest "${{ github.workspace }}/${{ matrix.build_dir }}/SparkEngineGameModules.cmake" `
          --package-manifest $packageManifest `
          --bootstrap-repair `
          --runner-temp "${{ runner.temp }}" --logs "${{ github.workspace }}/msi-qualification" `
          --source-sha "${{ github.sha }}"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Qualify Windows stable MSI install upgrade rollback repair and uninstall
      if: needs.prepare.outputs.is_versioned == 'true' && needs.prepare.outputs.version != '0.9.0'
      shell: pwsh
      # Hosted Windows Server evidence is not Windows 11 certification. Stable
      # Publication requires an exact predecessor MSI+manifest pair. Resolve it
      # from the published GitHub release API by immutable asset id; runner-local
      # repository variables are not an acceptable artifact source. v1.0.0
      # requires the exact published immutable v0.9.0 predecessor. This job is
      # not a bootstrap path for v0.9.0; no synthetic predecessor is permitted.
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $packageManifest = "${{ github.workspace }}/${{ matrix.build_dir }}/packages/shipping-package-manifest.json"
        python .github/scripts/write-shipping-package-manifest.py `
          --packages "${{ github.workspace }}/${{ matrix.build_dir }}/packages" `
          --version "${{ needs.prepare.outputs.cmake_version }}" `
          --commit-sha "${{ github.sha }}" --out $packageManifest
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $previousRoot = Join-Path "${{ runner.temp }}" "spark-previous-release-${{ github.run_id }}-${{ github.run_attempt }}"
        $previousReceipt = Join-Path $previousRoot "provisioning-receipt.json"
        python .github/scripts/provision-previous-windows-msi.py `
          --repository "${{ github.repository }}" `
          --current-version "${{ needs.prepare.outputs.cmake_version }}" `
          --output-dir $previousRoot --receipt $previousReceipt
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if (-not (Test-Path -LiteralPath $previousReceipt -PathType Leaf)) { throw "Previous-release provisioner did not publish its receipt" }
        $previous = Get-Content -LiteralPath $previousReceipt -Raw | ConvertFrom-Json
        $previousVersion = [string]$previous.previous_version
        if ($previousVersion -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw "Previous-release receipt has an invalid version" }
        $previousPackages = Join-Path $previousRoot "packages"
        $previousManifest = Join-Path $previousRoot "shipping-package-manifest.json"
        if (-not (Test-Path -LiteralPath $previousPackages -PathType Container) -or
            -not (Test-Path -LiteralPath $previousManifest -PathType Leaf)) { throw "Previous-release provisioner did not publish the required MSI and manifest" }
        python .github/scripts/qualify-windows-msi.py `
          --packages "${{ github.workspace }}/${{ matrix.build_dir }}/packages" `
          --version "${{ needs.prepare.outputs.cmake_version }}" `
          --manifest "${{ github.workspace }}/${{ matrix.build_dir }}/SparkEngineGameModules.cmake" `
          --package-manifest $packageManifest `
          --previous-packages $previousPackages `
          --previous-version $previousVersion `
          --previous-package-manifest $previousManifest `
          --previous-signer-thumbprint "${{ vars.SPARK_PREVIOUS_RELEASE_SIGNER_THUMBPRINT }}" `
          --runner-temp "${{ runner.temp }}" --logs "${{ github.workspace }}/msi-qualification" `
          --source-sha "${{ github.sha }}"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Upload Windows stable signature diagnostics
      if: always() && needs.prepare.outputs.is_versioned == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: SparkEngine-Windows-${{ matrix.config }}-signature-verification
        path: signature-verification/
        if-no-files-found: ignore
        retention-days: 7

    - name: Upload native MSI qualification diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: SparkEngine-Windows-${{ matrix.config }}-msi-qualification
        path: msi-qualification/
        if-no-files-found: ignore
        retention-days: 7

    - name: Extract and smoke-test portable package
      shell: pwsh
      run: |
        $archives = @(Get-ChildItem -LiteralPath ${{ matrix.build_dir }}/packages -Filter *.zip -File)
        if ($archives.Count -ne 1) {
          throw "Expected exactly one portable ZIP package; found $($archives.Count)"
        }
        python .github/scripts/validate-extracted-package.py --preflight-archive "$($archives[0].FullName)"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Remove-Item -LiteralPath ${{ matrix.build_dir }}/packages/_CPack_Packages -Recurse -Force -ErrorAction SilentlyContinue
        $extractRoot = Join-Path "${{ github.workspace }}" "package-extract"
        New-Item -ItemType Directory -Force -Path $extractRoot | Out-Null
        Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $extractRoot
        if (Test-Path (Join-Path $extractRoot "bin")) {
          $packageRoot = $extractRoot
        } else {
          $roots = @(Get-ChildItem -LiteralPath $extractRoot -Directory)
          if ($roots.Count -ne 1) {
            throw "Portable ZIP must contain one package root; found $($roots.Count)"
          }
          $packageRoot = $roots[0].FullName
        }
        python .github/scripts/validate-extracted-package.py --package-root "$packageRoot" --stage-root "${{ github.workspace }}/stage" --archive "$($archives[0].FullName)"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cmake -DSPARK_PACKAGE_ROOT="$packageRoot" -DSPARK_PACKAGE_PROFILE=${{ matrix.profile }} -DSPARK_EXECUTABLE_SUFFIX:STRING=.exe -P cmake/ValidateStagedPackageExecutables.cmake
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cmake -S Tests/PackageSmoke -B package-smoke-build -G "Visual Studio 17 2022" -A x64 -T v143 -DSparkEngine_DIR="$packageRoot/lib/cmake/SparkEngine" -DSPARK_EXPECTED_ENGINE_VERSION="${{ needs.prepare.outputs.cmake_version }}"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cmake --build package-smoke-build --config ${{ matrix.config }} --parallel
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        ctest --test-dir package-smoke-build -C ${{ matrix.config }} --output-on-failure --no-tests=error
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cmake `
          -DSPARK_TEMPLATE_ROOT="$packageRoot/share/SparkEngine/templates" `
          -DSPARK_TEMPLATE_SOURCE_ROOT="${{ github.workspace }}/Templates" `
          -DSPARK_TEMPLATE_BUILD_ROOT="${{ github.workspace }}/package-template-smoke-build" `
          -DSPARK_ENGINE_DIR="$packageRoot/lib/cmake/SparkEngine" `
          -DSPARK_ENGINE_EXECUTABLE="$packageRoot/bin/SparkEngine.exe" `
          -DSPARK_TEMPLATE_CONFIG=${{ matrix.config }} `
          "-DSPARK_CMAKE_GENERATOR=Visual Studio 17 2022" `
          -DSPARK_CMAKE_GENERATOR_PLATFORM=x64 `
          -DSPARK_CMAKE_GENERATOR_TOOLSET=v143 `
          -P cmake/VerifyInstalledTemplates.cmake
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Upload CPack failure diagnostics
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: SparkEngine-Windows-${{ matrix.config }}-cpack-diagnostics
        path: |
          ${{ matrix.build_dir }}/packages/_CPack_Packages/**/NSISOutput.log
          ${{ matrix.build_dir }}/packages/_CPack_Packages/**/wix.log
        if-no-files-found: ignore
        retention-days: 7

    - name: Check signed installer bytes after native qualification
      if: needs.prepare.outputs.is_versioned == 'true'
      shell: pwsh
      env:
        SPARK_RELEASE_SIGNER_THUMBPRINT: ${{ vars.SPARK_RELEASE_SIGNER_THUMBPRINT }}
        SPARK_RELEASE_TRUST_MODEL: ${{ vars.SPARK_RELEASE_TRUST_MODEL }}
      run: |
        python .github/scripts/verify-windows-package-signatures.py --check-hashes `
          --packages "${{ github.workspace }}/${{ matrix.build_dir }}/packages" `
          --version "${{ needs.prepare.outputs.cmake_version }}" --source-sha "${{ github.sha }}" `
          --report "${{ github.workspace }}/signature-verification/result.json"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Remove temporary stable signer trust
      if: always() && needs.prepare.outputs.is_versioned == 'true'
      shell: pwsh
      env:
        SPARK_RELEASE_SIGNER_THUMBPRINT: ${{ vars.SPARK_RELEASE_SIGNER_THUMBPRINT }}
      run: |
        $ErrorActionPreference = 'Stop'
        $marker = Join-Path $env:RUNNER_TEMP 'spark-signing-root-added.txt'
        if (-not (Test-Path -LiteralPath $marker -PathType Leaf)) { exit 0 }
        $thumbprint = (Get-Content -LiteralPath $marker -Raw).Trim().ToUpperInvariant()
        if ($thumbprint -notmatch '^[0-9A-F]{40}$' -or $thumbprint -ne $env:SPARK_RELEASE_SIGNER_THUMBPRINT.ToUpperInvariant()) {
          throw 'Temporary signer trust marker does not match the protected thumbprint'
        }
        $rootPath = 'Cert:\CurrentUser\Root\' + $thumbprint
        if (Test-Path -LiteralPath $rootPath) {
          Remove-Item -LiteralPath $rootPath -Force -Confirm:$false -ErrorAction Stop
        }
        if (Get-ChildItem -Path 'Cert:\CurrentUser\Root' -ErrorAction Stop | Where-Object { $_.Thumbprint -eq $thumbprint }) {
          throw 'Temporary signer root certificate remains after cleanup'
        }
        Remove-Item -LiteralPath $marker -Force -ErrorAction Stop

    # REL-100: bind the final (signed, qualified) package bytes to the source
    # SHA, committed dependency-lock digest, CMake toolchain, and configuration.
    # The record is a separate artifact so the stable asset boundary is unchanged.
    - name: Record per-artifact build provenance
      shell: pwsh
      run: |
        python tools/release_build_provenance.py record `
          --source-root "${{ github.workspace }}" --source-sha "${{ github.sha }}" `
          --version "${{ needs.prepare.outputs.cmake_version }}" --profile "${{ matrix.profile }}" `
          --platform Windows --configuration "${{ matrix.config }}" `
          --build-dir "${{ github.workspace }}/${{ matrix.build_dir }}" `
          --packages "${{ github.workspace }}/${{ matrix.build_dir }}/packages" `
          --out "${{ github.workspace }}/build-provenance/build-provenance-Windows-${{ matrix.config }}.json"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Upload build provenance record
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: build-provenance-Windows-${{ matrix.config }}
        path: build-provenance/build-provenance-Windows-${{ matrix.config }}.json
        retention-days: 90
        if-no-files-found: error

    - name: Upload packaged artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: SparkEngine-Windows-${{ matrix.config }}-packages
        path: |
          ${{ matrix.build_dir }}/packages/*.zip
          ${{ matrix.build_dir }}/packages/*.exe
          ${{ matrix.build_dir }}/packages/*.msi
          ${{ matrix.build_dir }}/packages/shipping-package-manifest.json
        retention-days: 7
        if-no-files-found: error

  # ===========================================================================
  # Linux Build — GCC
  # ===========================================================================
  build-linux:
    needs: [prepare]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.prepare.outputs.configs) }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-14 g++-14 cmake libgl-dev libvulkan-dev libsdl2-dev libfreetype-dev mesa-vulkan-drivers

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DBUILD_TESTS=ON \
          -DSPARK_STRICT_DEPS=ON \
          -DSPARK_ENGINE_VERSION="${{ needs.prepare.outputs.cmake_version }}" \
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/stage" \
          -DCMAKE_C_COMPILER=gcc-14 \
          -DCMAKE_CXX_COMPILER=g++-14

    - name: Build
      run: cmake --build build --parallel $(nproc)

    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure --no-tests=error
        if [ -f bin/SparkTests ]; then ./bin/SparkTests; fi

    - name: Validate external package consumption
      run: |
        cmake --install build
        cmake -S Tests/PackageSmoke -B smoke-build \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DCMAKE_C_COMPILER=gcc-14 \
          -DCMAKE_CXX_COMPILER=g++-14 \
          -DSparkEngine_DIR="${{ github.workspace }}/stage/lib/cmake/SparkEngine" \
          -DSPARK_EXPECTED_ENGINE_VERSION="${{ needs.prepare.outputs.cmake_version }}"
        cmake --build smoke-build --parallel $(nproc)
        ctest --test-dir smoke-build --output-on-failure --no-tests=error

    - name: Build every template against the installed SDK
      run: |
        cmake \
          -DSPARK_TEMPLATE_ROOT="${{ github.workspace }}/stage/share/SparkEngine/templates" \
          -DSPARK_TEMPLATE_SOURCE_ROOT="${{ github.workspace }}/Templates" \
          -DSPARK_TEMPLATE_BUILD_ROOT="${{ github.workspace }}/template-smoke-build" \
          -DSPARK_ENGINE_DIR="${{ github.workspace }}/stage/lib/cmake/SparkEngine" \
          -DSPARK_ENGINE_EXECUTABLE="${{ github.workspace }}/stage/bin/SparkEngine" \
          -DSPARK_TEMPLATE_CONFIG=${{ matrix.config }} \
          "-DSPARK_CMAKE_GENERATOR=Unix Makefiles" \
          -DSPARK_C_COMPILER=gcc-14 \
          -DSPARK_CXX_COMPILER=g++-14 \
          -P cmake/VerifyInstalledTemplates.cmake

    - name: Validate staged package executable BOM
      run: |
        cmake \
          -DSPARK_PACKAGE_ROOT="${{ github.workspace }}/stage" \
          -P cmake/ValidateStagedPackageExecutables.cmake

    - name: Generate CPack packages
      run: |
        cpack --config build/CPackConfig.cmake -C ${{ matrix.config }} -B build/packages

    - name: Extract and smoke-test portable package
      run: |
        archive_count=$(find build/packages -maxdepth 1 -type f -name '*.tar.gz' | wc -l)
        if [ "$archive_count" -ne 1 ]; then
          echo "Expected exactly one portable TGZ package; found $archive_count" >&2
          exit 1
        fi
        archive=$(find build/packages -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
        python3 .github/scripts/validate-extracted-package.py --preflight-archive "$archive"
        rm -rf build/packages/_CPack_Packages
        mkdir package-extract
        tar -xzf "$archive" -C package-extract
        if [ -d package-extract/bin ]; then
          package_root="$(pwd)/package-extract"
        else
          root_count=$(find package-extract -mindepth 1 -maxdepth 1 -type d | wc -l)
          if [ "$root_count" -ne 1 ]; then
            echo "Portable TGZ must contain one package root; found $root_count" >&2
            exit 1
          fi
          package_root=$(find package-extract -mindepth 1 -maxdepth 1 -type d -print -quit)
        fi
        python3 .github/scripts/validate-extracted-package.py \
          --package-root "$package_root" \
          --stage-root "${{ github.workspace }}/stage" \
          --archive "$archive"
        cmake -DSPARK_PACKAGE_ROOT="$package_root" -P cmake/ValidateStagedPackageExecutables.cmake
        cmake -S Tests/PackageSmoke -B package-smoke-build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 -DSparkEngine_DIR="$package_root/lib/cmake/SparkEngine" -DSPARK_EXPECTED_ENGINE_VERSION="${{ needs.prepare.outputs.cmake_version }}"
        cmake --build package-smoke-build --parallel $(nproc)
        ctest --test-dir package-smoke-build --output-on-failure --no-tests=error
        cmake \
          -DSPARK_TEMPLATE_ROOT="$package_root/share/SparkEngine/templates" \
          -DSPARK_TEMPLATE_SOURCE_ROOT="${{ github.workspace }}/Templates" \
          -DSPARK_TEMPLATE_BUILD_ROOT="${{ github.workspace }}/package-template-smoke-build" \
          -DSPARK_ENGINE_DIR="$package_root/lib/cmake/SparkEngine" \
          -DSPARK_ENGINE_EXECUTABLE="$package_root/bin/SparkEngine" \
          -DSPARK_TEMPLATE_CONFIG=${{ matrix.config }} \
          "-DSPARK_CMAKE_GENERATOR=Unix Makefiles" \
          -DSPARK_C_COMPILER=gcc-14 \
          -DSPARK_CXX_COMPILER=g++-14 \
          -P cmake/VerifyInstalledTemplates.cmake

    - name: Record per-artifact build provenance
      run: |
        python3 tools/release_build_provenance.py record \
          --source-root . --source-sha "${{ github.sha }}" \
          --version "${{ needs.prepare.outputs.cmake_version }}" --profile default \
          --platform Linux --configuration "${{ matrix.config }}" \
          --build-dir build --packages build/packages \
          --out "build-provenance/build-provenance-Linux-${{ matrix.config }}.json"

    - name: Upload build provenance record
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: build-provenance-Linux-${{ matrix.config }}
        path: build-provenance/build-provenance-Linux-${{ matrix.config }}.json
        retention-days: 90
        if-no-files-found: error

    - name: Upload packaged artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: SparkEngine-Linux-${{ matrix.config }}-packages
        path: |
          build/packages/*.zip
          build/packages/*.tar.gz
        retention-days: 7
        if-no-files-found: error

