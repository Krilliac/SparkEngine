  # ===========================================================================
  # SparkInstaller — standalone bootstrap binary for the README "Install" buttons
  # ===========================================================================
  build-installer:
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact_name: SparkInstaller-Linux-x64
            bin_name: SparkInstaller
            platform_name: Linux
          - os: windows-2022
            artifact_name: SparkInstaller-Windows-x64.exe
            bin_name: SparkInstaller.exe
            platform_name: Windows
          - os: macos-15
            artifact_name: SparkInstaller-macOS-arm64
            bin_name: SparkInstaller
            platform_name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure SparkBuild + SparkInstaller (standalone)
        shell: bash
        run: |
          mkdir -p build-installer
          cat > build-installer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          project(SparkInstallerCombo LANGUAGES CXX)
          include(CTest)
          add_subdirectory(${CMAKE_SOURCE_DIR}/../SparkBuild SparkBuild)
          add_subdirectory(${CMAKE_SOURCE_DIR}/../SparkInstaller SparkInstaller)
          EOF
          cmake -S build-installer -B build-installer/build \
                -DCMAKE_BUILD_TYPE=Release \
                -DSPARK_ENGINE_VERSION="${{ needs.prepare.outputs.cmake_version }}" \
                -DSPARKINSTALLER_ENABLE_GUI=OFF \
                -DSPARKINSTALLER_BUILD_TESTS=ON

      - name: Build SparkInstaller and registered contract tests
        shell: bash
        run: >-
          cmake --build build-installer/build --config Release --target
          SparkInstaller
          SparkInstallerGitTests
          SparkBuildProcessRunnerTests
          SparkBuildDownloaderTests
          -j

      - name: Run installer dependency contract tests
        shell: bash
        run: ctest --test-dir build-installer/build -C Release --output-on-failure --no-tests=error

      - name: Stage artifact with release-ready name
        shell: bash
        run: |
          mkdir -p staging
          cp "build-installer/build/bin/${{ matrix.bin_name }}" "staging/${{ matrix.artifact_name }}"

      - name: Launch staged executable
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.cmake_version }}
          EXPECTED_PLATFORM: ${{ matrix.platform_name }}
        run: |
          set -o pipefail
          "./staging/${{ matrix.artifact_name }}" --version | tee installer-version.txt
          "./staging/${{ matrix.artifact_name }}" --help | tee installer-help.txt
          sed $'s/\r$//' installer-version.txt | grep -Fqx -- "SparkInstaller ${EXPECTED_VERSION} (${EXPECTED_PLATFORM})"
          grep -Fq "Usage:" installer-help.txt

      - name: Record per-artifact build provenance
        shell: bash
        run: |
          ${{ runner.os == 'Windows' && 'python' || 'python3' }} tools/release_build_provenance.py record \
            --source-root . --source-sha "${{ github.sha }}" \
            --version "${{ needs.prepare.outputs.cmake_version }}" --profile default \
            --platform "Installer-${{ matrix.platform_name }}" --configuration Release \
            --build-dir build-installer/build --packages staging \
            --out "build-provenance/build-provenance-Installer-${{ matrix.platform_name }}.json"

      - name: Upload build provenance record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-provenance-Installer-${{ matrix.platform_name }}
          path: build-provenance/build-provenance-Installer-${{ matrix.platform_name }}.json
          retention-days: 90
          if-no-files-found: error

      - name: Upload installer binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: staging/${{ matrix.artifact_name }}
          retention-days: 7

  # ===========================================================================
  # Publish GitHub Release (versioned or rolling "latest")
  # ===========================================================================
  release:
    needs: [prepare, build-windows, build-linux, build-macos, build-installer]
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.is_versioned == 'true' && 'stable-release' || 'nightly-release' }}
    env:
      IS_VERSIONED: ${{ needs.prepare.outputs.is_versioned }}
      # Stable and uniquely tagged nightly releases are both immutable. The
      # legacy `nightly` release is preserved and is never mutated.
      RELEASE_IMMUTABLE: 'true'
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      statuses: read
    concurrency:
      group: sparkengine-publication-global
      cancel-in-progress: false

    steps:
    - name: Checkout release source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false

    - name: Verify release channel policy before any publication mutation
      env:
        RELEASE_POLICY_READ_TOKEN: ${{ secrets.RELEASE_POLICY_READ_TOKEN }}
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        IS_VERSIONED: ${{ needs.prepare.outputs.is_versioned }}
      run: python3 .github/scripts/verify_release_policy.py

    - name: Verify stable publication environment protection
      if: needs.prepare.outputs.is_versioned == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: python3 .github/scripts/verify_release_environment.py

    - name: Verify v0.9.0 source seal before publication mutation
      if: needs.prepare.outputs.is_versioned == 'true' && needs.prepare.outputs.version == '0.9.0'
      env:
        RELEASE_POLICY_READ_TOKEN: ${{ secrets.RELEASE_POLICY_READ_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        BASELINE_COMMIT="$(python3 - <<'PY'
        import json
        with open("docs/site/readiness.json", encoding="utf-8") as stream:
            source = json.load(stream)["predecessorRelease"]["sourceCommitEvidence"]
        value = source.get("baselineCommit")
        if not isinstance(value, str):
            raise SystemExit("v0.9.0 source seal has no baselineCommit")
        print(value)
        PY
        )"
        python3 .github/scripts/verify_v090_source_seal.py \
          --repository "$GITHUB_REPOSITORY" \
          --source-sha "${{ github.sha }}" \
          --baseline-commit "$BASELINE_COMMIT" \
          --report "$RUNNER_TEMP/v090-source-seal-pre-mutation.json"

    - name: Verify exact source commit passed Required CI Gate
      id: required-ci
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET_SHA: ${{ github.sha }}
      run: python3 .github/scripts/verify-exact-required-gate.py

    - name: Verify stable-v1 candidate is qualified for versioned publication
      if: needs.prepare.outputs.is_versioned == 'true'
      shell: bash
      # Strict validation, no waiver: every requiredCiJobs/testSelectors and
      # path reference in the contract must resolve. The --allow-legacy-contract
      # waiver was retired once the contract validated strictly; never
      # reintroduce it to make a versioned publication green.
      run: |
        if [[ "${{ needs.prepare.outputs.version }}" == "0.9.0" ]]; then
          python3 tools/site-data/validate.py --require-predecessor-candidate
        else
          python3 tools/site-data/validate.py --require-candidate-ready
        fi

    - name: Freeze durable exact CI evidence release asset
      env:
        EXACT_SOURCE_COMMIT: ${{ github.sha }}
        EXACT_BUILD_RUN_ID: ${{ steps.required-ci.outputs.run_id }}
        EXACT_BUILD_RUN_ATTEMPT: ${{ steps.required-ci.outputs.run_attempt }}
        EXACT_BUILD_RUN_URL: ${{ steps.required-ci.outputs.run_url }}
        EXACT_BUILD_EVENT: ${{ steps.required-ci.outputs.event }}
        EXACT_BUILD_MATRIX_PRODUCER_JOB_ID: ${{ steps.required-ci.outputs.build_build_matrix_producer_job_id }}
        EXACT_BUILD_REQUIRED_GATE_JOB_ID: ${{ steps.required-ci.outputs.build_required_gate_job_id }}
        EXACT_BUILD_JOB_INVENTORY_DIGEST: ${{ steps.required-ci.outputs.build_job_inventory_digest }}
        EXACT_BUILD_MATRIX_SOURCE_ARTIFACT_ID: ${{ steps.required-ci.outputs.build_matrix_source_artifact_id }}
        EXACT_BUILD_MATRIX_SOURCE_ARTIFACT_DIGEST: ${{ steps.required-ci.outputs.build_matrix_source_artifact_digest }}
        EXACT_BUILD_MATRIX_SOURCE_ARTIFACT_BYTES: ${{ steps.required-ci.outputs.build_matrix_source_artifact_bytes }}
        EXACT_BUILD_MATRIX_STATUS_ID: ${{ steps.required-ci.outputs.build_matrix_status_id }}
        EXACT_BUILD_MATRIX_STATUS_TARGET_URL: ${{ steps.required-ci.outputs.build_matrix_status_target_url }}
        EXACT_BUILD_MATRIX_STATUS_CREATED_AT: ${{ steps.required-ci.outputs.build_matrix_status_created_at }}
        EXACT_BUILD_MATRIX_STATUS_UPDATED_AT: ${{ steps.required-ci.outputs.build_matrix_status_updated_at }}
        EXACT_BUILD_MATRIX_VERIFIER_RUN_ID: ${{ steps.required-ci.outputs.verifier_run_id }}
        EXACT_BUILD_MATRIX_VERIFIER_RUN_ATTEMPT: ${{ steps.required-ci.outputs.verifier_run_attempt }}
        EXACT_BUILD_MATRIX_VERIFIER_RUN_URL: ${{ steps.required-ci.outputs.verifier_run_url }}
        EXACT_VERIFIER_COMMIT: ${{ steps.required-ci.outputs.verifier_sha }}
        EXACT_BUILD_MATRIX_TRUSTED_VERIFIER_JOB_ID: ${{ steps.required-ci.outputs.build_matrix_trusted_verifier_job_id }}
        EXACT_BUILD_MATRIX_VERIFIER_JOB_INVENTORY_DIGEST: ${{ steps.required-ci.outputs.build_matrix_verifier_job_inventory_digest }}
        EXACT_BUILD_MATRIX_STATUS_PUBLISH_STEP_STARTED_AT: ${{ steps.required-ci.outputs.build_matrix_status_publish_step_started_at }}
        EXACT_BUILD_MATRIX_STATUS_PUBLISH_STEP_COMPLETED_AT: ${{ steps.required-ci.outputs.build_matrix_status_publish_step_completed_at }}
        EXACT_BUILD_MATRIX_RECEIPT_ARTIFACT_ID: ${{ steps.required-ci.outputs.receipt_artifact_id }}
        EXACT_BUILD_MATRIX_RECEIPT_ARTIFACT_DIGEST: ${{ steps.required-ci.outputs.receipt_artifact_digest }}
        EXACT_BUILD_MATRIX_RECEIPT_ARTIFACT_BYTES: ${{ steps.required-ci.outputs.receipt_artifact_bytes }}
        EXACT_CODEQL_RUN_ID: ${{ steps.required-ci.outputs.codeql_run_id }}
        EXACT_CODEQL_RUN_ATTEMPT: ${{ steps.required-ci.outputs.codeql_run_attempt }}
        EXACT_CODEQL_RUN_URL: ${{ steps.required-ci.outputs.codeql_run_url }}
        EXACT_CODEQL_ACTIONS_SOURCE_JOB_ID: ${{ steps.required-ci.outputs.codeql_actions_source_job_id }}
        EXACT_CODEQL_C_CPP_SOURCE_JOB_ID: ${{ steps.required-ci.outputs.codeql_c_cpp_source_job_id }}
        EXACT_CODEQL_PYTHON_SOURCE_JOB_ID: ${{ steps.required-ci.outputs.codeql_python_source_job_id }}
        EXACT_CODEQL_SOURCE_JOB_INVENTORY_DIGEST: ${{ steps.required-ci.outputs.codeql_source_job_inventory_digest }}
        EXACT_CODEQL_ACTIONS_SOURCE_ARTIFACT_ID: ${{ steps.required-ci.outputs.codeql_actions_source_artifact_id }}
        EXACT_CODEQL_ACTIONS_SOURCE_ARTIFACT_DIGEST: ${{ steps.required-ci.outputs.codeql_actions_source_artifact_digest }}
        EXACT_CODEQL_ACTIONS_SOURCE_ARTIFACT_BYTES: ${{ steps.required-ci.outputs.codeql_actions_source_artifact_bytes }}
        EXACT_CODEQL_C_CPP_SOURCE_ARTIFACT_ID: ${{ steps.required-ci.outputs.codeql_c_cpp_source_artifact_id }}
        EXACT_CODEQL_C_CPP_SOURCE_ARTIFACT_DIGEST: ${{ steps.required-ci.outputs.codeql_c_cpp_source_artifact_digest }}
        EXACT_CODEQL_C_CPP_SOURCE_ARTIFACT_BYTES: ${{ steps.required-ci.outputs.codeql_c_cpp_source_artifact_bytes }}
        EXACT_CODEQL_PYTHON_SOURCE_ARTIFACT_ID: ${{ steps.required-ci.outputs.codeql_python_source_artifact_id }}
        EXACT_CODEQL_PYTHON_SOURCE_ARTIFACT_DIGEST: ${{ steps.required-ci.outputs.codeql_python_source_artifact_digest }}
        EXACT_CODEQL_PYTHON_SOURCE_ARTIFACT_BYTES: ${{ steps.required-ci.outputs.codeql_python_source_artifact_bytes }}
        EXACT_CODEQL_STATUS_ID: ${{ steps.required-ci.outputs.codeql_status_id }}
        EXACT_CODEQL_STATUS_TARGET_URL: ${{ steps.required-ci.outputs.codeql_status_target_url }}
        EXACT_CODEQL_STATUS_CREATED_AT: ${{ steps.required-ci.outputs.codeql_status_created_at }}
        EXACT_CODEQL_STATUS_UPDATED_AT: ${{ steps.required-ci.outputs.codeql_status_updated_at }}
        EXACT_CODEQL_REPORTER_RUN_ID: ${{ steps.required-ci.outputs.codeql_reporter_run_id }}
        EXACT_CODEQL_REPORTER_RUN_ATTEMPT: ${{ steps.required-ci.outputs.codeql_reporter_run_attempt }}
        EXACT_CODEQL_REPORTER_RUN_URL: ${{ steps.required-ci.outputs.codeql_reporter_run_url }}
        EXACT_CODEQL_TRUSTED_REPORTER_JOB_ID: ${{ steps.required-ci.outputs.codeql_trusted_reporter_job_id }}
        EXACT_CODEQL_REPORTER_JOB_INVENTORY_DIGEST: ${{ steps.required-ci.outputs.codeql_reporter_job_inventory_digest }}
        EXACT_CODEQL_STATUS_PUBLISH_STEP_STARTED_AT: ${{ steps.required-ci.outputs.codeql_status_publish_step_started_at }}
        EXACT_CODEQL_STATUS_PUBLISH_STEP_COMPLETED_AT: ${{ steps.required-ci.outputs.codeql_status_publish_step_completed_at }}
        EXACT_CODEQL_SUMMARY_ARTIFACT_ID: ${{ steps.required-ci.outputs.codeql_summary_artifact_id }}
        EXACT_CODEQL_SUMMARY_ARTIFACT_DIGEST: ${{ steps.required-ci.outputs.codeql_summary_artifact_digest }}
        EXACT_CODEQL_SUMMARY_ARTIFACT_BYTES: ${{ steps.required-ci.outputs.codeql_summary_artifact_bytes }}
      run: |
        set -euo pipefail
        python3 tools/site-data/exact_evidence.py write \
          --output "$GITHUB_WORKSPACE/SparkEngine-Exact-CI-Evidence.json"

    # SEC-120 is release-blocking: publication must fail while any inventoried
    # parser still lacks a sanitizer-backed fuzz target and bounded corpus.
    # The structural gate in build.yml blocks merges; this blocks releases.
    - name: Verify SEC-120 parser fuzz-policy closure
      run: python3 tools/fuzz-policy/check_fuzz_policy.py --source-root . --ci --require-closure

    # Download counters are durable generated state on one moving tag. Keeping
    # them off Working lets branch protection stay strict and leaves the source
    # commit unchanged throughout exact-CI revalidation.
    # Counters are repository-global/default-branch state, not tag state. A
    # separate checkout keeps release tags immutable and preserves the exact
    # source checkout used by the release metadata below.
    - name: Checkout canonical badge branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: Working
        path: badge-repository
        persist-credentials: false

    - name: Load durable download-counter state tag
      id: badge-state
      working-directory: badge-repository
      env:
        GH_TOKEN: ${{ github.token }}
        STATE_REF: refs/tags/generated-release-counters
      run: |
        set -euo pipefail
        AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
        REMOTE_OBJECT="$(git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          ls-remote --refs origin "$STATE_REF" | awk 'NR == 1 { print $1 }')"
        if test -n "$REMOTE_OBJECT"; then
          git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
            fetch --force --no-tags origin "+${STATE_REF}:${STATE_REF}"
          git checkout --detach "$STATE_REF"
          if test "$(git rev-parse HEAD)" != "$(git rev-parse "${STATE_REF}^{commit}")"; then
            echo "Generated counter state tag did not resolve to its fetched commit." >&2
            exit 1
          fi
        else
          git checkout --detach "$(git rev-parse HEAD)"
        fi
        echo "remote_object=$REMOTE_OBJECT" >> "$GITHUB_OUTPUT"
        echo "state_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Resolve short commit SHA
      id: sha
      run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

    - name: Download channel build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        # Stable SBOM and publication include only the qualified Windows Shipping product.
        # Nightly retains all platform packages and standalone bootstrap installers.
        pattern: ${{ needs.prepare.outputs.is_versioned == 'true' && 'SparkEngine-Windows-MinSizeRel-packages' || '*' }}
        path: release-assets

    - name: Download build provenance records
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: ${{ needs.prepare.outputs.is_versioned == 'true' && 'build-provenance-Windows-MinSizeRel' || 'build-provenance-*' }}
        path: build-provenance

    - name: Generate SPDX software bill of materials
      uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      with:
        path: release-assets
        format: spdx-json
        # One canonical SBOM file name: the stable bundle verifiers, the signing
        # tests and verify_published_stable_release.py all consume this exact
        # published asset (checked by test-workflow-failure-propagation.py).
        output-file: SparkEngine-SBOM.spdx.json
        artifact-name: SparkEngine-SBOM.spdx.json
        upload-artifact: false
        upload-release-assets: false

    - name: Collect release assets
      id: assets
      env:
        IS_VERSIONED: ${{ needs.prepare.outputs.is_versioned }}
        RELEASE_VERSION: ${{ needs.prepare.outputs.cmake_version }}
      run: |
        set -euo pipefail
        # Select the same channel boundary as the download/SBOM step. Do not flatten
        # another platform or bootstrap installer into the stable release even if
        # an unrelated artifact directory is present.
        package_root=release-assets
        if [[ "$IS_VERSIONED" == "true" ]]; then
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid stable package version" >&2
            exit 1
          fi
          package_root=release-assets/SparkEngine-Windows-MinSizeRel-packages
          required_stable_packages=(
            "SparkEngine-${RELEASE_VERSION}-Windows-AMD64-MinSizeRel.zip"
            "SparkEngine-${RELEASE_VERSION}-Windows-AMD64-MinSizeRel-Runtime.exe"
            "SparkEngine-${RELEASE_VERSION}-Windows-AMD64-MinSizeRel-Runtime.msi"
            "shipping-package-manifest.json"
          )
          for required_package in "${required_stable_packages[@]}"; do
            if [[ ! -f "$package_root/$required_package" || -L "$package_root/$required_package" ]]; then
              echo "Missing regular Windows Shipping package: $required_package" >&2
              exit 1
            fi
          done
          mapfile -d '' stable_files < <(find "$package_root" -mindepth 1 -print0)
          if (( ${#stable_files[@]} != ${#required_stable_packages[@]} )); then
            echo "Unexpected content in Windows Shipping artifact" >&2
            exit 1
          fi
        fi
        # Flatten selected package artifacts to the current directory.
        while IFS= read -r -d '' artifact; do
          name=$(basename "$artifact")
          if [[ -e "$name" ]]; then
            echo "Duplicate release asset name: $name" >&2
            exit 1
          fi
          cp "$artifact" "$name"
        done < <(
          find "$package_root" -type f \
            \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.exe" -o -name "*.msi" \
               -o -name "SparkInstaller-*" -o -name "shipping-package-manifest.json" \) -print0
        )

        # Publish version-independent aliases for direct README downloads.
        # Keep the versioned packages alongside them for archival clarity.
        alias_configs=()
        if [[ "$IS_VERSIONED" == "false" ]]; then
          alias_configs=(Debug Release)
        fi
        for config in "${alias_configs[@]}"; do
          mapfile -t zip_matches < <(compgen -G "SparkEngine-*-Windows-AMD64-${config}.zip" || true)
          mapfile -t installer_matches < <(compgen -G "SparkEngine-*-Windows-AMD64-${config}-Runtime.exe" || true)

          if (( ${#zip_matches[@]} > 1 || ${#installer_matches[@]} > 1 )); then
            echo "Ambiguous Windows ${config} release assets; refusing to publish direct aliases." >&2
            exit 1
          fi

          if (( ${#zip_matches[@]} == 1 )); then
            cp -- "${zip_matches[0]}" "SparkEngine-Windows-x64-${config}.zip"
          fi
          if (( ${#installer_matches[@]} == 1 )); then
            cp -- "${installer_matches[0]}" "SparkEngine-Windows-x64-${config}-Installer.exe"
          fi
        done

        # An immutable nightly is public only when both configuration aliases
        # are present. Direct links cannot target a moving `nightly` tag;
        # README points users at the releases page, where the newest immutable
        # prerelease and its exact assets are discoverable.
        if [[ "${{ needs.prepare.outputs.is_versioned }}" == "false" ]]; then
          readme_nightly_assets=(
            "SparkEngine-Windows-x64-Debug.zip"
            "SparkEngine-Windows-x64-Debug-Installer.exe"
            "SparkEngine-Windows-x64-Release.zip"
            "SparkEngine-Windows-x64-Release-Installer.exe"
            "SparkInstaller-Windows-x64.exe"
          )
          for required_asset in "${readme_nightly_assets[@]}"; do
            if [[ ! -f "$required_asset" ]]; then
              echo "Missing README nightly asset: $required_asset" >&2
              exit 1
            fi
          done
        fi

        FILES=""
        TABLE="| Asset | Size | Notes |"$'\n'"|---|---:|---|"
        : > SHA256SUMS
        while IFS= read -r -d '' artifact; do
          artifact=${artifact#./}

          note="CPack package"
          if [[ "$artifact" == SparkInstaller-* ]]; then
            note="Bootstrap installer (clone + build engine)"
          elif [[ "$artifact" == *.spdx.json ]]; then
            note="SPDX software bill of materials"
          elif [[ "$artifact" == "SparkEngine-Exact-CI-Evidence.json" ]]; then
            note="Exact build-matrix and CodeQL evidence manifest"
          elif [[ "$artifact" == *"-Windows-"* ]]; then
            note="Windows package"
          elif [[ "$artifact" == *"-Linux-"* ]]; then
            note="Linux package"
          fi

          size_bytes=$(stat --format='%s' "$artifact")
          size_human=$(numfmt --to=iec-i --suffix=B "$size_bytes")
          # The exact-CI manifest is independently digest-bound by the durable
          # ledger and the terminal GitHub asset check. Keeping it out of
          # SHA256SUMS avoids a transitive checksum mutation when an interrupted
          # stable draft resumes with fresher exact-run evidence.
          if [[ "$artifact" != "SparkEngine-Exact-CI-Evidence.json" ]]; then
            sha256sum "$artifact" >> SHA256SUMS
          fi
          FILES="${FILES}${artifact}"$'\n'
          TABLE="${TABLE}"$'\n'"| \`${artifact}\` | ${size_human} | ${note} |"
        done < <(
          find . -maxdepth 1 -type f \
            \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.exe" -o -name "*.msi" \
               -o -name "SparkInstaller-*" -o -name "*.spdx.json" \
               -o -name "shipping-package-manifest.json" \
               -o -name "SparkEngine-Exact-CI-Evidence.json" \) -print0 | sort -z
        )

        if [ ! -s SHA256SUMS ]; then
          echo "No release assets were collected; refusing to publish an empty release." >&2
          exit 1
        fi
        sha256sum --check SHA256SUMS
        FILES="${FILES}SHA256SUMS"$'\n'
        TABLE="${TABLE}"$'\n'"| \`SHA256SUMS\` | — | SHA-256 verification manifest |"
        printf '%s' "$FILES" > expected-release-assets.txt
        while IFS= read -r artifact; do
          sha256sum -- "$artifact"
        done < expected-release-assets.txt > expected-release-digests.txt

        {
          echo "### Release artifact statistics"
          echo
          echo "$TABLE"
          echo
          echo 'Every distributable artifact passed an immediate `sha256sum --check SHA256SUMS` round trip. The exact-CI manifest is separately bound to its GitHub asset digest and revalidated immediately before publication.'
        } >> "$GITHUB_STEP_SUMMARY"

        # Write multiline outputs
        {
          echo "files<<FILESEOF"
          echo "$FILES"
          echo "FILESEOF"
        } >> "$GITHUB_OUTPUT"

        {
          echo "table<<TABLEEOF"
          echo "$TABLE"
          echo "TABLEEOF"
        } >> "$GITHUB_OUTPUT"

    # REL-100: every published distributable (aliases included) must be covered
    # by a build record from this exact source SHA whose dependency-lock digest
    # equals the committed lock, and every recorded artifact must be published.
    - name: Verify per-artifact build provenance before publication mutation
      env:
        IS_VERSIONED: ${{ needs.prepare.outputs.is_versioned }}
        RELEASE_VERSION: ${{ needs.prepare.outputs.cmake_version }}
        SOURCE_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        STABLE_ARGS=()
        if [[ "$IS_VERSIONED" == "true" ]]; then
          STABLE_ARGS+=(--stable)
        fi
        python3 tools/release_build_provenance.py verify \
          --records-dir build-provenance \
          --assets-dir . \
          --assets-file expected-release-assets.txt \
          --source-root . \
          --source-sha "$SOURCE_SHA" \
          --version "$RELEASE_VERSION" \
          "${STABLE_ARGS[@]}"

    - name: Inspect existing release before mutation
      id: release-inspect
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        IS_VERSIONED: ${{ needs.prepare.outputs.is_versioned }}
        GITHUB_SHA: ${{ github.sha }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      run: |
        set -euo pipefail
        if test "$(git rev-parse HEAD)" != "$GITHUB_SHA"; then
          echo "Release-source checkout is not the exact workflow commit." >&2
          exit 1
        fi

        INSPECT_ARGS=()
        if [[ "$IS_VERSIONED" == "true" ]]; then
          INSPECT_ARGS+=(--allow-exact-ci-evidence-replacement)
          INSPECT_ARGS+=(--allow-stable-draft-recovery-candidates)
        fi
        python3 "$GITHUB_WORKSPACE/.github/scripts/prepare-download-badges.py" inspect \
          --expected-assets-file "$GITHUB_WORKSPACE/expected-release-assets.txt" \
          --expected-digests-file "$GITHUB_WORKSPACE/expected-release-digests.txt" \
          "${INSPECT_ARGS[@]}"

    - name: Revalidate exact CI evidence before first release mutation
      id: required-ci-mutation
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET_SHA: ${{ github.sha }}
      run: python3 .github/scripts/verify-exact-required-gate.py

    - name: Verify frozen exact CI evidence before first release mutation
      env:
        EXACT_SOURCE_COMMIT: ${{ github.sha }}
        EXACT_BUILD_RUN_ID: ${{ steps.required-ci-mutation.outputs.run_id }}
        EXACT_BUILD_RUN_ATTEMPT: ${{ steps.required-ci-mutation.outputs.run_attempt }}
        EXACT_BUILD_RUN_URL: ${{ steps.required-ci-mutation.outputs.run_url }}
        EXACT_BUILD_EVENT: ${{ steps.required-ci-mutation.outputs.event }}
        EXACT_BUILD_MATRIX_PRODUCER_JOB_ID: ${{ steps.required-ci-mutation.outputs.build_build_matrix_producer_job_id }}
        EXACT_BUILD_REQUIRED_GATE_JOB_ID: ${{ steps.required-ci-mutation.outputs.build_required_gate_job_id }}
        EXACT_BUILD_JOB_INVENTORY_DIGEST: ${{ steps.required-ci-mutation.outputs.build_job_inventory_digest }}
        EXACT_BUILD_MATRIX_SOURCE_ARTIFACT_ID: ${{ steps.required-ci-mutation.outputs.build_matrix_source_artifact_id }}
        EXACT_BUILD_MATRIX_SOURCE_ARTIFACT_DIGEST: ${{ steps.required-ci-mutation.outputs.build_matrix_source_artifact_digest }}
        EXACT_BUILD_MATRIX_SOURCE_ARTIFACT_BYTES: ${{ steps.required-ci-mutation.outputs.build_matrix_source_artifact_bytes }}
        EXACT_BUILD_MATRIX_STATUS_ID: ${{ steps.required-ci-mutation.outputs.build_matrix_status_id }}
        EXACT_BUILD_MATRIX_STATUS_TARGET_URL: ${{ steps.required-ci-mutation.outputs.build_matrix_status_target_url }}
        EXACT_BUILD_MATRIX_STATUS_CREATED_AT: ${{ steps.required-ci-mutation.outputs.build_matrix_status_created_at }}
        EXACT_BUILD_MATRIX_STATUS_UPDATED_AT: ${{ steps.required-ci-mutation.outputs.build_matrix_status_updated_at }}
        EXACT_BUILD_MATRIX_VERIFIER_RUN_ID: ${{ steps.required-ci-mutation.outputs.verifier_run_id }}
        EXACT_BUILD_MATRIX_VERIFIER_RUN_ATTEMPT: ${{ steps.required-ci-mutation.outputs.verifier_run_attempt }}
        EXACT_BUILD_MATRIX_VERIFIER_RUN_URL: ${{ steps.required-ci-mutation.outputs.verifier_run_url }}
        EXACT_VERIFIER_COMMIT: ${{ steps.required-ci-mutation.outputs.verifier_sha }}
        EXACT_BUILD_MATRIX_TRUSTED_VERIFIER_JOB_ID: ${{ steps.required-ci-mutation.outputs.build_matrix_trusted_verifier_job_id }}
        EXACT_BUILD_MATRIX_VERIFIER_JOB_INVENTORY_DIGEST: ${{ steps.required-ci-mutation.outputs.build_matrix_verifier_job_inventory_digest }}
        EXACT_BUILD_MATRIX_STATUS_PUBLISH_STEP_STARTED_AT: ${{ steps.required-ci-mutation.outputs.build_matrix_status_publish_step_started_at }}
        EXACT_BUILD_MATRIX_STATUS_PUBLISH_STEP_COMPLETED_AT: ${{ steps.required-ci-mutation.outputs.build_matrix_status_publish_step_completed_at }}
        EXACT_BUILD_MATRIX_RECEIPT_ARTIFACT_ID: ${{ steps.required-ci-mutation.outputs.receipt_artifact_id }}
        EXACT_BUILD_MATRIX_RECEIPT_ARTIFACT_DIGEST: ${{ steps.required-ci-mutation.outputs.receipt_artifact_digest }}
        EXACT_BUILD_MATRIX_RECEIPT_ARTIFACT_BYTES: ${{ steps.required-ci-mutation.outputs.receipt_artifact_bytes }}
        EXACT_CODEQL_RUN_ID: ${{ steps.required-ci-mutation.outputs.codeql_run_id }}
        EXACT_CODEQL_RUN_ATTEMPT: ${{ steps.required-ci-mutation.outputs.codeql_run_attempt }}
        EXACT_CODEQL_RUN_URL: ${{ steps.required-ci-mutation.outputs.codeql_run_url }}
        EXACT_CODEQL_ACTIONS_SOURCE_JOB_ID: ${{ steps.required-ci-mutation.outputs.codeql_actions_source_job_id }}
        EXACT_CODEQL_C_CPP_SOURCE_JOB_ID: ${{ steps.required-ci-mutation.outputs.codeql_c_cpp_source_job_id }}
        EXACT_CODEQL_PYTHON_SOURCE_JOB_ID: ${{ steps.required-ci-mutation.outputs.codeql_python_source_job_id }}
        EXACT_CODEQL_SOURCE_JOB_INVENTORY_DIGEST: ${{ steps.required-ci-mutation.outputs.codeql_source_job_inventory_digest }}
        EXACT_CODEQL_ACTIONS_SOURCE_ARTIFACT_ID: ${{ steps.required-ci-mutation.outputs.codeql_actions_source_artifact_id }}
        EXACT_CODEQL_ACTIONS_SOURCE_ARTIFACT_DIGEST: ${{ steps.required-ci-mutation.outputs.codeql_actions_source_artifact_digest }}
        EXACT_CODEQL_ACTIONS_SOURCE_ARTIFACT_BYTES: ${{ steps.required-ci-mutation.outputs.codeql_actions_source_artifact_bytes }}
        EXACT_CODEQL_C_CPP_SOURCE_ARTIFACT_ID: ${{ steps.required-ci-mutation.outputs.codeql_c_cpp_source_artifact_id }}
        EXACT_CODEQL_C_CPP_SOURCE_ARTIFACT_DIGEST: ${{ steps.required-ci-mutation.outputs.codeql_c_cpp_source_artifact_digest }}
        EXACT_CODEQL_C_CPP_SOURCE_ARTIFACT_BYTES: ${{ steps.required-ci-mutation.outputs.codeql_c_cpp_source_artifact_bytes }}
        EXACT_CODEQL_PYTHON_SOURCE_ARTIFACT_ID: ${{ steps.required-ci-mutation.outputs.codeql_python_source_artifact_id }}
        EXACT_CODEQL_PYTHON_SOURCE_ARTIFACT_DIGEST: ${{ steps.required-ci-mutation.outputs.codeql_python_source_artifact_digest }}
        EXACT_CODEQL_PYTHON_SOURCE_ARTIFACT_BYTES: ${{ steps.required-ci-mutation.outputs.codeql_python_source_artifact_bytes }}
        EXACT_CODEQL_STATUS_ID: ${{ steps.required-ci-mutation.outputs.codeql_status_id }}
        EXACT_CODEQL_STATUS_TARGET_URL: ${{ steps.required-ci-mutation.outputs.codeql_status_target_url }}
        EXACT_CODEQL_STATUS_CREATED_AT: ${{ steps.required-ci-mutation.outputs.codeql_status_created_at }}
        EXACT_CODEQL_STATUS_UPDATED_AT: ${{ steps.required-ci-mutation.outputs.codeql_status_updated_at }}
        EXACT_CODEQL_REPORTER_RUN_ID: ${{ steps.required-ci-mutation.outputs.codeql_reporter_run_id }}
        EXACT_CODEQL_REPORTER_RUN_ATTEMPT: ${{ steps.required-ci-mutation.outputs.codeql_reporter_run_attempt }}
        EXACT_CODEQL_REPORTER_RUN_URL: ${{ steps.required-ci-mutation.outputs.codeql_reporter_run_url }}
        EXACT_CODEQL_TRUSTED_REPORTER_JOB_ID: ${{ steps.required-ci-mutation.outputs.codeql_trusted_reporter_job_id }}
        EXACT_CODEQL_REPORTER_JOB_INVENTORY_DIGEST: ${{ steps.required-ci-mutation.outputs.codeql_reporter_job_inventory_digest }}
        EXACT_CODEQL_STATUS_PUBLISH_STEP_STARTED_AT: ${{ steps.required-ci-mutation.outputs.codeql_status_publish_step_started_at }}
        EXACT_CODEQL_STATUS_PUBLISH_STEP_COMPLETED_AT: ${{ steps.required-ci-mutation.outputs.codeql_status_publish_step_completed_at }}
        EXACT_CODEQL_SUMMARY_ARTIFACT_ID: ${{ steps.required-ci-mutation.outputs.codeql_summary_artifact_id }}
        EXACT_CODEQL_SUMMARY_ARTIFACT_DIGEST: ${{ steps.required-ci-mutation.outputs.codeql_summary_artifact_digest }}
        EXACT_CODEQL_SUMMARY_ARTIFACT_BYTES: ${{ steps.required-ci-mutation.outputs.codeql_summary_artifact_bytes }}
      run: |
        set -euo pipefail
        python3 tools/site-data/exact_evidence.py verify \
          --manifest "$GITHUB_WORKSPACE/SparkEngine-Exact-CI-Evidence.json"

    # Stable publication signs the already-frozen exact asset bytes inside the
    # protected stable-release job. The PFX private key is imported ephemerally
    # and never exported to a file, artifact, log, or release asset.
    - name: Generate protected stable signature bundle
      if: needs.prepare.outputs.is_versioned == 'true'
      env:
        SPARK_RELEASE_SIGNING_PFX_BASE64: ${{ secrets.SPARK_RELEASE_SIGNING_PFX_BASE64 }}
        SPARK_RELEASE_SIGNING_PFX_PASSWORD: ${{ secrets.SPARK_RELEASE_SIGNING_PFX_PASSWORD }}
        SIGNER_CERTIFICATE_THUMBPRINT: ${{ vars.SPARK_RELEASE_SIGNER_THUMBPRINT }}
        SIGNATURE_KEY_FINGERPRINT: ${{ vars.SPARKENGINE_STABLE_SIGNATURE_KEY_FINGERPRINT }}
        SOURCE_COMMIT: ${{ github.sha }}
      run: |
        set -euo pipefail
        [[ "$SIGNATURE_KEY_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
        pwsh -NoLogo -NoProfile -NonInteractive -File "$GITHUB_WORKSPACE/.github/scripts/sign_release_bundle.ps1" \
          -InputRoot "$GITHUB_WORKSPACE" \
          -ExpectedAssetsFile "$GITHUB_WORKSPACE/expected-release-assets.txt" \
          -OutputDirectory "$RUNNER_TEMP/spark-release-signature-bundle" \
          -SourceCommit "$SOURCE_COMMIT" \
          -SignerFingerprint "$SIGNATURE_KEY_FINGERPRINT" \
          -SignerCertificateThumbprint "$SIGNER_CERTIFICATE_THUMBPRINT"
        mapfile -t signature_files < <(find "$RUNNER_TEMP/spark-release-signature-bundle" -maxdepth 1 -type f -name '*.sig' -printf '%f\n' | sort)
        test "${#signature_files[@]}" -gt 0
        GZIP=-n tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
          -czf "$RUNNER_TEMP/spark-release-signature-bundle.tar.gz" \
          -C "$RUNNER_TEMP/spark-release-signature-bundle" \
          release-signatures.json spark-release-public-key.pem "${signature_files[@]}"
        test ! -e "$GITHUB_WORKSPACE/spark-release-signature-bundle.tar.gz"

    - name: Verify complete stable release bundle before draft publication
      if: needs.prepare.outputs.is_versioned == 'true'
      env:
        SOURCE_COMMIT: ${{ github.sha }}
        SIGNATURE_KEY_FINGERPRINT: ${{ vars.SPARKENGINE_STABLE_SIGNATURE_KEY_FINGERPRINT }}
      run: |
        set -euo pipefail
        python3 -I "$GITHUB_WORKSPACE/.github/scripts/verify_release_bundle.py" \
          --bundle-directory "$GITHUB_WORKSPACE" \
          --expected-assets-file "$GITHUB_WORKSPACE/expected-release-assets.txt" \
          --sha256sums "$GITHUB_WORKSPACE/SHA256SUMS" \
          --sbom "$GITHUB_WORKSPACE/SparkEngine-SBOM.spdx.json" \
          --provenance-manifest "$GITHUB_WORKSPACE/SparkEngine-Exact-CI-Evidence.json" \
          --signature-directory "$RUNNER_TEMP/spark-release-signature-bundle" \
          --signature-manifest "$RUNNER_TEMP/spark-release-signature-bundle/release-signatures.json" \
          --trusted-public-key "$RUNNER_TEMP/spark-release-signature-bundle/spark-release-public-key.pem" \
          --trusted-key-fingerprint "$SIGNATURE_KEY_FINGERPRINT" \
          --source-commit "$SOURCE_COMMIT"

    - name: Prepare durable pending download-counter state
      id: badge-prepare
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        IS_VERSIONED: ${{ needs.prepare.outputs.is_versioned }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        GITHUB_SHA: ${{ github.sha }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      run: |
        set -euo pipefail
        if test "$(git rev-parse HEAD)" != "$GITHUB_SHA"; then
          echo "Release-source checkout is not the exact workflow commit." >&2
          exit 1
        fi

        PREPARE_ARGS=()
        if [[ "$IS_VERSIONED" == "true" ]]; then
          PREPARE_ARGS+=(--allow-exact-ci-evidence-replacement)
        fi
        python3 "$GITHUB_WORKSPACE/.github/scripts/prepare-download-badges.py" prepare \
          --data-file "$GITHUB_WORKSPACE/badge-repository/.github/badges/downloads-data.json" \
          --badge-directory "$GITHUB_WORKSPACE/badge-repository/.github/badges" \
          --expected-assets-file "$GITHUB_WORKSPACE/expected-release-assets.txt" \
          --expected-digests-file "$GITHUB_WORKSPACE/expected-release-digests.txt" \
          "${PREPARE_ARGS[@]}"

    - name: Commit durable pending download-counter state
      id: badge-pending-commit
      working-directory: badge-repository
      env:
        RELEASE_POLICY_READ_TOKEN: ${{ secrets.RELEASE_POLICY_READ_TOKEN }}
        GH_TOKEN: ${{ github.token }}
        STATE_REF: refs/tags/generated-release-counters
        EXPECTED_REMOTE_OBJECT: ${{ steps.badge-state.outputs.remote_object }}
        EXPECTED_STATE_COMMIT: ${{ steps.badge-state.outputs.state_commit }}
      run: |
        set -euo pipefail
        AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
        INITIAL_HEAD="$(git rev-parse HEAD)"
        if test "$INITIAL_HEAD" != "$EXPECTED_STATE_COMMIT"; then
          echo "Badge checkout no longer points to the loaded counter-state commit." >&2
          exit 1
        fi
        REMOTE_OBJECT="$(git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          ls-remote --refs origin "$STATE_REF" | awk 'NR == 1 { print $1 }')"
        if test "$REMOTE_OBJECT" != "$EXPECTED_REMOTE_OBJECT"; then
          echo "Generated counter state advanced before pending state could be committed; rerun this release." >&2
          exit 1
        fi

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -- \
          .github/badges/downloads-data.json \
          .github/badges/downloads.json \
          .github/badges/installer-downloads.json
        if git diff --cached --quiet; then
          echo "Counter preparation produced no durable pending-state diff; refusing to mutate the release." >&2
          exit 1
        fi

        git commit -s -m "chore: prepare download counters (lifetime: ${{ steps.badge-prepare.outputs.new_total }}, installer: ${{ steps.badge-prepare.outputs.installer_total }}, operation: ${{ steps.badge-prepare.outputs.operation_id }}) [skip ci]"
        PENDING_COMMIT="$(git rev-parse HEAD)"
        python3 "$GITHUB_WORKSPACE/.github/scripts/guard_release_mutation.py" -- git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" push \
          --force-with-lease="${STATE_REF}:${EXPECTED_REMOTE_OBJECT}" origin \
          "HEAD:${STATE_REF}"

        PUBLISHED_OBJECT="$(git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          ls-remote --refs origin "$STATE_REF" | awk 'NR == 1 { print $1 }')"
        if test "$PUBLISHED_OBJECT" != "$PENDING_COMMIT"; then
          echo "Generated counter state tag does not point to the durable pending commit after push." >&2
          exit 1
        fi
        echo "pending_commit=$PENDING_COMMIT" >> "$GITHUB_OUTPUT"

    - name: Reverify exact public nightly snapshot before hiding
      if: false
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        IS_VERSIONED: ${{ needs.prepare.outputs.is_versioned }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        GITHUB_SHA: ${{ github.sha }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_WORKSPACE/.github/scripts/prepare-download-badges.py" pre-hide-preflight \
          --expected-assets-file "$GITHUB_WORKSPACE/expected-release-assets.txt" \
          --expected-digests-file "$GITHUB_WORKSPACE/expected-release-digests.txt" \
          --data-file "$GITHUB_WORKSPACE/badge-repository/.github/badges/downloads-data.json"

    - name: Hide and verify existing nightly release
      # Retained as a documented migration tombstone; immutable nightlies
      # never execute this legacy hide/redraft path.
      if: needs.prepare.outputs.is_versioned == 'false' && steps.release-inspect.outputs.target_exists == 'true' && false
      env:
        RELEASE_POLICY_READ_TOKEN: ${{ secrets.RELEASE_POLICY_READ_TOKEN }}
        GH_TOKEN: ${{ github.token }}
        RELEASE_ID: ${{ steps.release-inspect.outputs.target_release_id }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        TARGET_WAS_DRAFT: ${{ steps.release-inspect.outputs.target_is_draft }}
      run: |
        set -euo pipefail
        if [[ ! "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]; then
          echo "Existing nightly release ID is invalid." >&2
          exit 1
        fi
        if [[ "$RELEASE_TAG" != "nightly" ]]; then
          echo "Refusing to hide non-nightly release: $RELEASE_TAG" >&2
          exit 1
        fi

        CURRENT_RELEASE="$(mktemp)"
        VERIFIED_RELEASE="$(mktemp)"
        trap 'rm -f "$CURRENT_RELEASE" "$VERIFIED_RELEASE"' EXIT
        gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$CURRENT_RELEASE"
        if ! jq -e \
            --argjson release_id "$RELEASE_ID" \
            --arg release_tag "$RELEASE_TAG" \
            'type == "object" and
             .id == $release_id and
             .tag_name == $release_tag and
             (.draft | type) == "boolean" and
             .prerelease == true and
             .immutable == false' \
            "$CURRENT_RELEASE" >/dev/null; then
          echo "Existing nightly release changed after inspection; refusing to hide it." >&2
          exit 1
        fi
        if [[ "$TARGET_WAS_DRAFT" == "true" ]]; then
          if ! jq -e '.draft == true' "$CURRENT_RELEASE" >/dev/null; then
            echo "Existing nightly visibility changed after its durable draft snapshot." >&2
            exit 1
          fi
          cp "$CURRENT_RELEASE" "$VERIFIED_RELEASE"
        elif [[ "$TARGET_WAS_DRAFT" == "false" ]]; then
          if ! jq -e '.draft == false' "$CURRENT_RELEASE" >/dev/null; then
            echo "Existing nightly visibility changed after its durable public snapshot." >&2
            exit 1
          fi
          python3 "$GITHUB_WORKSPACE/.github/scripts/guard_release_mutation.py" -- gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=true \
            -F prerelease=true \
            -f make_latest=false >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$VERIFIED_RELEASE"
        else
          echo "Existing nightly durable visibility snapshot is invalid." >&2
          exit 1
        fi
        if ! jq -e \
            --argjson release_id "$RELEASE_ID" \
            --arg release_tag "$RELEASE_TAG" \
            'type == "object" and
             .id == $release_id and
             .tag_name == $release_tag and
             .draft == true and
             .prerelease == true and
             .immutable == false' \
            "$VERIFIED_RELEASE" >/dev/null; then
          echo "Existing nightly release was not verifiably hidden; refusing all tag and asset mutation." >&2
          exit 1
        fi

    - name: Preflight durable stable-draft failed-upload cleanup
      id: draft-cleanup
      if: needs.prepare.outputs.is_versioned == 'true' && steps.badge-prepare.outputs.cleanup_required == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        IS_VERSIONED: ${{ needs.prepare.outputs.is_versioned }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        GITHUB_SHA: ${{ github.sha }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_WORKSPACE/.github/scripts/prepare-download-badges.py" cleanup-preflight \
          --expected-assets-file "$GITHUB_WORKSPACE/expected-release-assets.txt" \
          --expected-digests-file "$GITHUB_WORKSPACE/expected-release-digests.txt" \
          --data-file "$GITHUB_WORKSPACE/badge-repository/.github/badges/downloads-data.json"

    - name: Delete only durably authorized failed stable-draft uploads
      if: steps.draft-cleanup.outputs.cleanup_required == 'true'
      env:
        RELEASE_POLICY_READ_TOKEN: ${{ secrets.RELEASE_POLICY_READ_TOKEN }}
        GH_TOKEN: ${{ github.token }}
        RELEASE_ID: ${{ steps.draft-cleanup.outputs.target_release_id }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        IS_VERSIONED: ${{ needs.prepare.outputs.is_versioned }}
        CLEANUP_ASSETS: ${{ steps.draft-cleanup.outputs.cleanup_assets }}
      run: |
        set -euo pipefail
        if [[ ! "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]; then
          echo "Durably authorized stable-draft cleanup release ID is invalid." >&2
          exit 1
        fi
        if ! jq -e \
            'type == "array" and length <= 100 and
             ([.[].assetId] | length == (unique | length)) and
             ([.[].name] | length == (unique | length))' \
            <<< "$CLEANUP_ASSETS" >/dev/null; then
          echo "Durably authorized stable-draft cleanup plan is invalid." >&2
          exit 1
        fi

        while IFS= read -r candidate; do
          ASSET_ID="$(jq -er '.assetId | select(type == "number" and floor == . and . > 0)' <<< "$candidate")"
          ASSET_NAME="$(jq -er '.name | select(type == "string" and test("^[^/\\r\\n]+$"))' <<< "$candidate")"
          ASSET_STATE="$(jq -er '.state | select(. == "starter" or . == "uploaded")' <<< "$candidate")"
          ASSET_DIGEST="$(jq -er 'if .digest == null then "" elif (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$")) then .digest else error("invalid digest") end' <<< "$candidate")"
          DOWNLOAD_COUNT="$(jq -er '.downloadCount | select(type == "number" and floor == . and . >= 0)' <<< "$candidate")"
          if [[ "$ASSET_STATE" == "starter" && -n "$ASSET_DIGEST" ]]; then
            echo "A starter cleanup candidate unexpectedly has a digest." >&2
            exit 1
          fi

          ASSET_RECORD="$RUNNER_TEMP/stable-draft-cleanup-asset-${ASSET_ID}.json"
          RELEASE_RECORD="$RUNNER_TEMP/stable-draft-cleanup-release-${ASSET_ID}.json"
          RECHECK_OUTPUT="$RUNNER_TEMP/stable-draft-cleanup-recheck-${ASSET_ID}.out"
          rm -f "$RECHECK_OUTPUT"
          GITHUB_OUTPUT="$RECHECK_OUTPUT" \
            python3 "$GITHUB_WORKSPACE/.github/scripts/prepare-download-badges.py" cleanup-preflight \
              --expected-assets-file "$GITHUB_WORKSPACE/expected-release-assets.txt" \
              --expected-digests-file "$GITHUB_WORKSPACE/expected-release-digests.txt" \
              --data-file "$GITHUB_WORKSPACE/badge-repository/.github/badges/downloads-data.json"
          RECHECK_RELEASE_ID="$(sed -n 's/^target_release_id=//p' "$RECHECK_OUTPUT")"
          RECHECK_ASSETS="$(sed -n 's/^cleanup_assets=//p' "$RECHECK_OUTPUT")"
          if [[ "$RECHECK_RELEASE_ID" != "$RELEASE_ID" ]] || \
             ! jq -e --argjson candidate "$candidate" \
               'type == "array" and any(.[]; . == $candidate)' \
               <<< "$RECHECK_ASSETS" >/dev/null; then
            echo "Stable-draft cleanup authorization changed before deletion." >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" > "$ASSET_RECORD"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RELEASE_RECORD"
          jq -e \
            --argjson asset_id "$ASSET_ID" \
            --arg asset_name "$ASSET_NAME" \
            --arg asset_digest "$ASSET_DIGEST" \
            --arg asset_state "$ASSET_STATE" \
            --argjson download_count "$DOWNLOAD_COUNT" \
            'type == "object" and
             .id == $asset_id and
             .name == $asset_name and
             .state == $asset_state and
             (if $asset_digest == "" then .digest == null else .digest == $asset_digest end) and
             .download_count == $download_count' \
            "$ASSET_RECORD" >/dev/null
          jq -e \
            --argjson release_id "$RELEASE_ID" \
            --arg release_tag "$RELEASE_TAG" \
            --arg upload_template "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets{?name,label}" \
            'type == "object" and
             .id == $release_id and
             .tag_name == $release_tag and
             .draft == true and
             .prerelease == false and
             .upload_url == $upload_template' \
            "$RELEASE_RECORD" >/dev/null
          # These bound reads are the final operations before the exact-ID delete.
          python3 "$GITHUB_WORKSPACE/.github/scripts/guard_release_mutation.py" -- gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID"
        done < <(jq -c '.[]' <<< "$CLEANUP_ASSETS")

    - name: Accept stable-draft cleanup into the durable pending ledger
      if: steps.draft-cleanup.outputs.cleanup_required == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        IS_VERSIONED: ${{ needs.prepare.outputs.is_versioned }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        GITHUB_SHA: ${{ github.sha }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_WORKSPACE/.github/scripts/prepare-download-badges.py" cleanup-accept \
          --expected-assets-file "$GITHUB_WORKSPACE/expected-release-assets.txt" \
          --expected-digests-file "$GITHUB_WORKSPACE/expected-release-digests.txt" \
          --data-file "$GITHUB_WORKSPACE/badge-repository/.github/badges/downloads-data.json" \
          --badge-directory "$GITHUB_WORKSPACE/badge-repository/.github/badges"

    - name: Commit accepted stable-draft cleanup state
      id: badge-cleanup-commit
      if: steps.draft-cleanup.outputs.cleanup_required == 'true'
      working-directory: badge-repository
      env:
        RELEASE_POLICY_READ_TOKEN: ${{ secrets.RELEASE_POLICY_READ_TOKEN }}
        GH_TOKEN: ${{ github.token }}
        STATE_REF: refs/tags/generated-release-counters
        EXPECTED_PENDING: ${{ steps.badge-pending-commit.outputs.pending_commit }}
      run: |
        set -euo pipefail
        AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
        if test "$(git rev-parse HEAD)" != "$EXPECTED_PENDING"; then
          echo "Badge checkout no longer points to the durable cleanup intent." >&2
          exit 1
        fi
        REMOTE_OBJECT="$(git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          ls-remote --refs origin "$STATE_REF" | awk 'NR == 1 { print $1 }')"
        if test "$REMOTE_OBJECT" != "$EXPECTED_PENDING"; then
          echo "Generated counter state advanced during stable-draft cleanup." >&2
          exit 1
        fi
        git add -- \
          .github/badges/downloads-data.json \
          .github/badges/downloads.json \
          .github/badges/installer-downloads.json
        if git diff --cached --quiet; then
          echo "Stable-draft cleanup acceptance produced no durable ledger change." >&2
          exit 1
        fi
        git commit -s -m "chore: accept stable-draft failed-upload cleanup [skip ci]"
        ACCEPTED_COMMIT="$(git rev-parse HEAD)"
        python3 "$GITHUB_WORKSPACE/.github/scripts/guard_release_mutation.py" -- git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" push \
          --force-with-lease="${STATE_REF}:${EXPECTED_PENDING}" origin \
          "HEAD:${STATE_REF}"
        PUBLISHED_OBJECT="$(git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          ls-remote --refs origin "$STATE_REF" | awk 'NR == 1 { print $1 }')"
        if test "$PUBLISHED_OBJECT" != "$ACCEPTED_COMMIT"; then
          echo "Generated counter tag does not contain the accepted stable-draft cleanup." >&2
          exit 1
        fi
        echo "pending_commit=$ACCEPTED_COMMIT" >> "$GITHUB_OUTPUT"

    - name: Preflight durable exact CI evidence replacement
      id: evidence-replacement
      if: needs.prepare.outputs.is_versioned == 'true' && steps.badge-prepare.outputs.replacement_required == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        IS_VERSIONED: ${{ needs.prepare.outputs.is_versioned }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        GITHUB_SHA: ${{ github.sha }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_WORKSPACE/.github/scripts/prepare-download-badges.py" replacement-preflight \
          --expected-assets-file "$GITHUB_WORKSPACE/expected-release-assets.txt" \
          --expected-digests-file "$GITHUB_WORKSPACE/expected-release-digests.txt" \
          --data-file "$GITHUB_WORKSPACE/badge-repository/.github/badges/downloads-data.json"

    - name: Delete only the durably authorized stable-draft evidence asset
      if: steps.evidence-replacement.outputs.delete_required == 'true'
      env:
        RELEASE_POLICY_READ_TOKEN: ${{ secrets.RELEASE_POLICY_READ_TOKEN }}
        GH_TOKEN: ${{ github.token }}
        RELEASE_ID: ${{ steps.evidence-replacement.outputs.target_release_id }}
        DELETE_EVIDENCE_ASSET_ID: ${{ steps.evidence-replacement.outputs.delete_evidence_asset_id }}
        DELETE_EVIDENCE_ASSET_DIGEST: ${{ steps.evidence-replacement.outputs.delete_evidence_asset_digest }}
        DELETE_EVIDENCE_ASSET_STATE: ${{ steps.evidence-replacement.outputs.delete_evidence_asset_state }}
        DELETE_EVIDENCE_DOWNLOAD_COUNT: ${{ steps.evidence-replacement.outputs.delete_evidence_download_count }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      run: |
        set -euo pipefail
        if [[ ! "$RELEASE_ID" =~ ^[1-9][0-9]*$ || ! "$DELETE_EVIDENCE_ASSET_ID" =~ ^[1-9][0-9]*$ ]]; then
          echo "Durably authorized evidence replacement IDs are invalid." >&2
          exit 1
        fi
        if [[ "$DELETE_EVIDENCE_ASSET_STATE" != "uploaded" && "$DELETE_EVIDENCE_ASSET_STATE" != "starter" ]]; then
          echo "Durably authorized evidence cleanup state is invalid." >&2
          exit 1
        fi
        if [[ ! "$DELETE_EVIDENCE_DOWNLOAD_COUNT" =~ ^(0|[1-9][0-9]*)$ ]]; then
          echo "Durably authorized evidence cleanup count is invalid." >&2
          exit 1
        fi
        if [[ "$DELETE_EVIDENCE_ASSET_STATE" == "uploaded" && -n "$DELETE_EVIDENCE_ASSET_DIGEST" && ! "$DELETE_EVIDENCE_ASSET_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
          echo "Durably authorized uploaded evidence cleanup digest is invalid." >&2
          exit 1
        fi
        if [[ "$DELETE_EVIDENCE_ASSET_STATE" == "starter" && -n "$DELETE_EVIDENCE_ASSET_DIGEST" ]]; then
          echo "Durably authorized starter evidence cleanup unexpectedly has a digest." >&2
          exit 1
        fi
        RELEASE_RECORD="$RUNNER_TEMP/stable-draft-before-evidence-delete.json"
        ASSET_RECORD="$RUNNER_TEMP/evidence-asset-before-delete.json"
        gh api "repos/$GITHUB_REPOSITORY/releases/assets/$DELETE_EVIDENCE_ASSET_ID" > "$ASSET_RECORD"
        gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RELEASE_RECORD"
        jq -e \
          --argjson asset_id "$DELETE_EVIDENCE_ASSET_ID" \
          --arg asset_name "SparkEngine-Exact-CI-Evidence.json" \
          --arg asset_digest "$DELETE_EVIDENCE_ASSET_DIGEST" \
          --arg asset_state "$DELETE_EVIDENCE_ASSET_STATE" \
          --argjson download_count "$DELETE_EVIDENCE_DOWNLOAD_COUNT" \
          'type == "object" and
           .id == $asset_id and
           .name == $asset_name and
           .state == $asset_state and
           (if $asset_digest == "" then .digest == null else .digest == $asset_digest end) and
           .download_count == $download_count' \
          "$ASSET_RECORD" >/dev/null
        jq -e \
          --argjson release_id "$RELEASE_ID" \
          --arg release_tag "$RELEASE_TAG" \
          --arg upload_template "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets{?name,label}" \
          'type == "object" and
           .id == $release_id and
           .tag_name == $release_tag and
           .draft == true and
           .prerelease == false and
           .upload_url == $upload_template' \
          "$RELEASE_RECORD" >/dev/null
        # GitHub exposes no atomic compare-and-delete primitive. These exact
        # asset and release reads deliberately make the unavoidable TOCTOU
        # window the single API call immediately preceding the bound-ID delete.
        python3 "$GITHUB_WORKSPACE/.github/scripts/guard_release_mutation.py" -- gh api --method DELETE \
          "repos/$GITHUB_REPOSITORY/releases/assets/$DELETE_EVIDENCE_ASSET_ID"

    - name: Upload only the replacement stable-draft evidence asset
      if: steps.evidence-replacement.outputs.upload_required == 'true'
      env:
        RELEASE_POLICY_READ_TOKEN: ${{ secrets.RELEASE_POLICY_READ_TOKEN }}
        GH_TOKEN: ${{ github.token }}
        RELEASE_ID: ${{ steps.evidence-replacement.outputs.target_release_id }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      run: |
        set -euo pipefail
        if [[ ! "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]; then
          echo "Durably authorized evidence upload release ID is invalid." >&2
          exit 1
        fi
        RELEASE_RECORD="$RUNNER_TEMP/stable-draft-before-evidence-upload.json"
        UPLOAD_RECORD="$RUNNER_TEMP/evidence-asset-upload-result.json"
        EVIDENCE_PATH="$GITHUB_WORKSPACE/SparkEngine-Exact-CI-Evidence.json"
        test -f "$EVIDENCE_PATH"
        gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RELEASE_RECORD"
        jq -e \
          --argjson release_id "$RELEASE_ID" \
          --arg release_tag "$RELEASE_TAG" \
          --arg upload_template "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets{?name,label}" \
          'type == "object" and
           .id == $release_id and
           .tag_name == $release_tag and
           .draft == true and
           .prerelease == false and
           .upload_url == $upload_template' \
          "$RELEASE_RECORD" >/dev/null
        EXPECTED_SIZE="$(stat --format='%s' "$EVIDENCE_PATH")"
        EXPECTED_DIGEST="sha256:$(sha256sum "$EVIDENCE_PATH" | awk '{print $1}')"
        python3 "$GITHUB_WORKSPACE/.github/scripts/guard_release_mutation.py" -- gh api --method POST \
          -H "Content-Type: application/json" \
          --input "$EVIDENCE_PATH" \
          "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=SparkEngine-Exact-CI-Evidence.json" \
          > "$UPLOAD_RECORD"
        jq -e \
          --arg asset_name "SparkEngine-Exact-CI-Evidence.json" \
          --arg asset_digest "$EXPECTED_DIGEST" \
          --argjson asset_size "$EXPECTED_SIZE" \
          'type == "object" and
           .name == $asset_name and
           .state == "uploaded" and
           .digest == $asset_digest and
           .size == $asset_size and
           .uploader.id == 41898282 and
           .uploader.login == "github-actions[bot]"' \
          "$UPLOAD_RECORD" >/dev/null

    - name: Accept replacement evidence asset into the durable pending ledger
      if: steps.evidence-replacement.outputs.replacement_required == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        IS_VERSIONED: ${{ needs.prepare.outputs.is_versioned }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        GITHUB_SHA: ${{ github.sha }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_WORKSPACE/.github/scripts/prepare-download-badges.py" replacement-accept \
          --expected-assets-file "$GITHUB_WORKSPACE/expected-release-assets.txt" \
          --expected-digests-file "$GITHUB_WORKSPACE/expected-release-digests.txt" \
          --data-file "$GITHUB_WORKSPACE/badge-repository/.github/badges/downloads-data.json" \
          --badge-directory "$GITHUB_WORKSPACE/badge-repository/.github/badges"

    - name: Commit accepted exact CI evidence replacement state
      id: badge-replacement-commit
      if: steps.evidence-replacement.outputs.replacement_required == 'true'
      working-directory: badge-repository
      env:
        RELEASE_POLICY_READ_TOKEN: ${{ secrets.RELEASE_POLICY_READ_TOKEN }}
        GH_TOKEN: ${{ github.token }}
        STATE_REF: refs/tags/generated-release-counters
        EXPECTED_PENDING: ${{ steps.badge-cleanup-commit.outputs.pending_commit || steps.badge-pending-commit.outputs.pending_commit }}
      run: |
        set -euo pipefail
        AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
        if test "$(git rev-parse HEAD)" != "$EXPECTED_PENDING"; then
          echo "Badge checkout no longer points to the durable replacement intent." >&2
          exit 1
        fi
        REMOTE_OBJECT="$(git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          ls-remote --refs origin "$STATE_REF" | awk 'NR == 1 { print $1 }')"
        if test "$REMOTE_OBJECT" != "$EXPECTED_PENDING"; then
          echo "Generated counter state advanced during evidence replacement." >&2
          exit 1
        fi
        git add -- \
          .github/badges/downloads-data.json \
          .github/badges/downloads.json \
          .github/badges/installer-downloads.json
        if git diff --cached --quiet; then
          echo "Evidence replacement acceptance produced no durable ledger change." >&2
          exit 1
        fi
        git commit -s -m "chore: accept stable-draft exact CI evidence replacement [skip ci]"
        ACCEPTED_COMMIT="$(git rev-parse HEAD)"
        python3 "$GITHUB_WORKSPACE/.github/scripts/guard_release_mutation.py" -- git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" push \
          --force-with-lease="${STATE_REF}:${EXPECTED_PENDING}" origin \
          "HEAD:${STATE_REF}"
        PUBLISHED_OBJECT="$(git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          ls-remote --refs origin "$STATE_REF" | awk 'NR == 1 { print $1 }')"
        if test "$PUBLISHED_OBJECT" != "$ACCEPTED_COMMIT"; then
          echo "Generated counter tag does not contain the accepted evidence replacement." >&2
          exit 1
        fi
        echo "pending_commit=$ACCEPTED_COMMIT" >> "$GITHUB_OUTPUT"

    - name: Verify compatible existing release assets before publication
      id: release-preflight
      # The inspect/hide sequence above prevents public partial replacement,
      # while the pending ledger commit makes every old asset count recoverable.
      # This second guard proves the snapshotted target did not change and that
      # an existing nightly is still draft before any tag or asset mutation.
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        IS_VERSIONED: ${{ needs.prepare.outputs.is_versioned }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        GITHUB_SHA: ${{ github.sha }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_WORKSPACE/.github/scripts/prepare-download-badges.py" preflight \
          --expected-assets-file "$GITHUB_WORKSPACE/expected-release-assets.txt" \
          --expected-digests-file "$GITHUB_WORKSPACE/expected-release-digests.txt" \
          --data-file "$GITHUB_WORKSPACE/badge-repository/.github/badges/downloads-data.json"

    - name: Determine release title suffix
      id: suffix
      run: |
        BUILD_TYPE="${{ needs.prepare.outputs.build_type }}"
        if [[ "${{ needs.prepare.outputs.is_versioned }}" == "true" ]]; then
          echo "label= (Windows Shipping)" >> "$GITHUB_OUTPUT"
        elif [[ "$BUILD_TYPE" == "debug" ]]; then
          echo "label= (Debug)" >> "$GITHUB_OUTPUT"
        elif [[ "$BUILD_TYPE" == "release" ]]; then
          echo "label= (Release)" >> "$GITHUB_OUTPUT"
        else
          echo "label=" >> "$GITHUB_OUTPUT"
        fi

    - name: Bind stable release tag to workflow commit
      if: needs.prepare.outputs.is_versioned == 'true'
      env:
        RELEASE_POLICY_READ_TOKEN: ${{ secrets.RELEASE_POLICY_READ_TOKEN }}
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        TARGET_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail

        AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
        TARGET_COMMIT="$(git rev-parse "${TARGET_SHA}^{commit}")"
        REMOTE_TAG_OBJECT="$(git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          ls-remote --refs origin "refs/tags/${RELEASE_TAG}" | awk 'NR == 1 { print $1 }')"

        if [[ -n "$REMOTE_TAG_OBJECT" ]]; then
          git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
            fetch --force --no-tags origin \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
        else
          # A manual versioned release may introduce a new immutable tag.
          # A normal push fails if another writer creates it between the
          # remote lookup and this push; stable tags are never force-moved.
          git tag "$RELEASE_TAG" "$TARGET_COMMIT"
          python3 "$GITHUB_WORKSPACE/.github/scripts/guard_release_mutation.py" -- git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" push origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
        fi

        # Re-read the remote ref after any create/move and prove the tag peels
        # to the exact commit whose artifacts this workflow built.
        git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          fetch --force --no-tags origin \
          "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
        BOUND_COMMIT="$(git rev-parse "${RELEASE_TAG}^{commit}")"
        if [[ "$BOUND_COMMIT" != "$TARGET_COMMIT" ]]; then
          echo "Release tag ${RELEASE_TAG} resolves to ${BOUND_COMMIT}, expected ${TARGET_COMMIT}." >&2
          exit 1
        fi
        echo "Release tag ${RELEASE_TAG} is bound to ${BOUND_COMMIT}."

    - name: Attest release build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: ${{ steps.assets.outputs.files }}

    - name: Resolve workflow run start time
      id: run-start
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_RUN_ID: ${{ github.run_id }}
      run: |
        set -euo pipefail
        RUN_STARTED_AT="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.run_started_at // empty')"
        if [[ ! "$RUN_STARTED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
          echo "Workflow run API returned an invalid run_started_at value." >&2
          exit 1
        fi
        printf 'started_at=%s\n' "$RUN_STARTED_AT" >> "$GITHUB_OUTPUT"

    - name: Reverify frozen asset counts immediately before staging
      id: release-freeze
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        IS_VERSIONED: ${{ needs.prepare.outputs.is_versioned }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        GITHUB_SHA: ${{ github.sha }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_WORKSPACE/.github/scripts/prepare-download-badges.py" preflight \
          --expected-assets-file "$GITHUB_WORKSPACE/expected-release-assets.txt" \
          --expected-digests-file "$GITHUB_WORKSPACE/expected-release-digests.txt" \
          --data-file "$GITHUB_WORKSPACE/badge-repository/.github/badges/downloads-data.json"

    - name: Stage new or interrupted stable versioned release as draft
      id: stable-stage
      if: needs.prepare.outputs.is_versioned == 'true' && (steps.release-freeze.outputs.target_exists != 'true' || steps.release-freeze.outputs.target_is_draft == 'true')
      env:
        RELEASE_POLICY_READ_TOKEN: ${{ secrets.RELEASE_POLICY_READ_TOKEN }}
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        EXPECTED_RELEASE_ID: ${{ steps.release-freeze.outputs.target_release_id }}
        RELEASE_TITLE: "SparkEngine ${{ needs.prepare.outputs.version }} (Stable)${{ steps.suffix.outputs.label }}"
        RELEASE_BODY: |
          ## SparkEngine ${{ needs.prepare.outputs.version }} — Stable Release${{ steps.suffix.outputs.label }}

          Built from commit [`${{ steps.sha.outputs.short }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
          Built on: ${{ steps.run-start.outputs.started_at }}

          > **Stable-v1 releases** contain Windows x64 Shipping packages built with the authoritative `windows-shipping` preset and validated separately in Release. Stable releases and uniquely tagged nightly prereleases are immutable; the historical `nightly` release is never modified.

          ### Downloads

          ${{ steps.assets.outputs.table }}
      run: python3 .github/scripts/stage_release_draft.py

    - name: Stage nightly rolling release as draft
      id: nightly-stage
      if: needs.prepare.outputs.is_versioned == 'false'
      env:
        RELEASE_POLICY_READ_TOKEN: ${{ secrets.RELEASE_POLICY_READ_TOKEN }}
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        EXPECTED_RELEASE_ID: ${{ steps.release-freeze.outputs.target_release_id }}
        RELEASE_TITLE: "Nightly Build (${{ steps.sha.outputs.short }})${{ steps.suffix.outputs.label }}"
        RELEASE_BODY: |
          ## Nightly Build${{ steps.suffix.outputs.label }}

          Built from commit [`${{ steps.sha.outputs.short }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
          Built on: ${{ steps.run-start.outputs.started_at }}
          Branch: `${{ github.ref_name }}`

          > **Nightly builds are immutable prereleases.** Each run has a unique tag and remains available in the releases list; the historical `nightly` rolling release is not modified.

          ${{ steps.assets.outputs.table }}
      run: python3 .github/scripts/stage_release_draft.py

    - name: Checkpoint staged release download counters
      id: badge-stage
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        IS_VERSIONED: ${{ needs.prepare.outputs.is_versioned }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        GITHUB_SHA: ${{ github.sha }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      run: |
        set -euo pipefail
        if test "$(git rev-parse HEAD)" != "$GITHUB_SHA"; then
          echo "Release-source checkout is not the exact workflow commit." >&2
          exit 1
        fi

        for attempt in 1 2 3 4 5 6; do
          if python3 "$GITHUB_WORKSPACE/.github/scripts/prepare-download-badges.py" stage \
            --expected-assets-file "$GITHUB_WORKSPACE/expected-release-assets.txt" \
            --expected-digests-file "$GITHUB_WORKSPACE/expected-release-digests.txt" \
            --data-file "$GITHUB_WORKSPACE/badge-repository/.github/badges/downloads-data.json"; then
            exit 0
          fi
          if test "$attempt" -eq 6; then
            echo "Staged release did not converge to the exact expected asset set and digests." >&2
            exit 1
          fi
          echo "Staged assets are not yet consistent (attempt ${attempt}/6); retrying."
          sleep "$((attempt * 3))"
        done

    - name: Commit staged download-counter checkpoint
      id: badge-staged-commit
      working-directory: badge-repository
      env:
        RELEASE_POLICY_READ_TOKEN: ${{ secrets.RELEASE_POLICY_READ_TOKEN }}
        GH_TOKEN: ${{ github.token }}
        STATE_REF: refs/tags/generated-release-counters
      run: |
        set -euo pipefail
        AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
        EXPECTED_PENDING="${{ steps.badge-replacement-commit.outputs.pending_commit || steps.badge-cleanup-commit.outputs.pending_commit || steps.badge-pending-commit.outputs.pending_commit }}"
        LOCAL_PENDING="$(git rev-parse HEAD)"
        if test "$LOCAL_PENDING" != "$EXPECTED_PENDING"; then
          echo "Badge checkout no longer points to this run's pending commit." >&2
          exit 1
        fi

        REMOTE_OBJECT="$(git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          ls-remote --refs origin "$STATE_REF" | awk 'NR == 1 { print $1 }')"
        if test "$REMOTE_OBJECT" != "$EXPECTED_PENDING"; then
          echo "Generated counter state advanced after the pending commit; refusing to checkpoint stale state." >&2
          exit 1
        fi

        git add -- .github/badges/downloads-data.json
        if git diff --cached --quiet; then
          echo "Counter staging produced no durable staged-state diff." >&2
          exit 1
        fi

        git commit -s -m "chore: checkpoint staged download counters (lifetime: ${{ steps.badge-stage.outputs.new_total }}, installer: ${{ steps.badge-stage.outputs.installer_total }}) [skip ci]"
        STAGED_COMMIT="$(git rev-parse HEAD)"
        python3 "$GITHUB_WORKSPACE/.github/scripts/guard_release_mutation.py" -- git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" push \
          --force-with-lease="${STATE_REF}:${EXPECTED_PENDING}" origin \
          "HEAD:${STATE_REF}"

        PUBLISHED_OBJECT="$(git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          ls-remote --refs origin "$STATE_REF" | awk 'NR == 1 { print $1 }')"
        if test "$PUBLISHED_OBJECT" != "$STAGED_COMMIT"; then
          echo "Generated counter state tag does not point to the staged checkpoint after push." >&2
          exit 1
        fi
        echo "staged_commit=$STAGED_COMMIT" >> "$GITHUB_OUTPUT"

    - name: Bind nightly tag to workflow commit
      if: needs.prepare.outputs.is_versioned == 'false'
      env:
        RELEASE_POLICY_READ_TOKEN: ${{ secrets.RELEASE_POLICY_READ_TOKEN }}
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        TARGET_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        if [[ ! "$RELEASE_TAG" =~ ^nightly-[1-9][0-9]*-[1-9][0-9]*-[0-9a-f]{12}$ ]]; then
          echo "Refusing to create malformed immutable nightly tag: $RELEASE_TAG" >&2
          exit 1
        fi

        AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
        TARGET_COMMIT="$(git rev-parse "${TARGET_SHA}^{commit}")"
        REMOTE_TAG_OBJECT="$(git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          ls-remote --refs origin "refs/tags/${RELEASE_TAG}" | awk 'NR == 1 { print $1 }')"
        if [[ -n "$REMOTE_TAG_OBJECT" ]]; then
          git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" fetch --no-tags origin \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
        else
          git tag "$RELEASE_TAG" "$TARGET_COMMIT"
          python3 "$GITHUB_WORKSPACE/.github/scripts/guard_release_mutation.py" -- git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" push origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
        fi
        git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          fetch --force --no-tags origin \
          "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
        BOUND_COMMIT="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
        if [[ "$BOUND_COMMIT" != "$TARGET_COMMIT" ]]; then
          echo "Release tag ${RELEASE_TAG} resolves to ${BOUND_COMMIT}, expected ${TARGET_COMMIT}." >&2
          exit 1
        fi
        echo "Immutable nightly tag ${RELEASE_TAG} is bound to ${BOUND_COMMIT}."

    - name: Verify release tag immediately before publication
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        TARGET_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
        TARGET_COMMIT="$(git rev-parse "${TARGET_SHA}^{commit}")"
        git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          fetch --force --no-tags origin \
          "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
        REMOTE_COMMIT="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
        if [[ "$REMOTE_COMMIT" != "$TARGET_COMMIT" ]]; then
          echo "Release tag ${RELEASE_TAG} drifted to ${REMOTE_COMMIT} before publication; expected ${TARGET_COMMIT}." >&2
          exit 1
        fi

    - name: Revalidate exact CI evidence immediately before publication
      id: required-ci-final
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET_SHA: ${{ github.sha }}
      run: python3 .github/scripts/verify-exact-required-gate.py

    - name: Verify frozen exact CI evidence manifest immediately before publication
      env:
        EXACT_SOURCE_COMMIT: ${{ github.sha }}
        EXACT_BUILD_RUN_ID: ${{ steps.required-ci-final.outputs.run_id }}
        EXACT_BUILD_RUN_ATTEMPT: ${{ steps.required-ci-final.outputs.run_attempt }}
        EXACT_BUILD_RUN_URL: ${{ steps.required-ci-final.outputs.run_url }}
        EXACT_BUILD_EVENT: ${{ steps.required-ci-final.outputs.event }}
        EXACT_BUILD_MATRIX_PRODUCER_JOB_ID: ${{ steps.required-ci-final.outputs.build_build_matrix_producer_job_id }}
        EXACT_BUILD_REQUIRED_GATE_JOB_ID: ${{ steps.required-ci-final.outputs.build_required_gate_job_id }}
        EXACT_BUILD_JOB_INVENTORY_DIGEST: ${{ steps.required-ci-final.outputs.build_job_inventory_digest }}
        EXACT_BUILD_MATRIX_SOURCE_ARTIFACT_ID: ${{ steps.required-ci-final.outputs.build_matrix_source_artifact_id }}
        EXACT_BUILD_MATRIX_SOURCE_ARTIFACT_DIGEST: ${{ steps.required-ci-final.outputs.build_matrix_source_artifact_digest }}
        EXACT_BUILD_MATRIX_SOURCE_ARTIFACT_BYTES: ${{ steps.required-ci-final.outputs.build_matrix_source_artifact_bytes }}
        EXACT_BUILD_MATRIX_STATUS_ID: ${{ steps.required-ci-final.outputs.build_matrix_status_id }}
        EXACT_BUILD_MATRIX_STATUS_TARGET_URL: ${{ steps.required-ci-final.outputs.build_matrix_status_target_url }}
        EXACT_BUILD_MATRIX_STATUS_CREATED_AT: ${{ steps.required-ci-final.outputs.build_matrix_status_created_at }}
        EXACT_BUILD_MATRIX_STATUS_UPDATED_AT: ${{ steps.required-ci-final.outputs.build_matrix_status_updated_at }}
        EXACT_BUILD_MATRIX_VERIFIER_RUN_ID: ${{ steps.required-ci-final.outputs.verifier_run_id }}
        EXACT_BUILD_MATRIX_VERIFIER_RUN_ATTEMPT: ${{ steps.required-ci-final.outputs.verifier_run_attempt }}
        EXACT_BUILD_MATRIX_VERIFIER_RUN_URL: ${{ steps.required-ci-final.outputs.verifier_run_url }}
        EXACT_VERIFIER_COMMIT: ${{ steps.required-ci-final.outputs.verifier_sha }}
        EXACT_BUILD_MATRIX_TRUSTED_VERIFIER_JOB_ID: ${{ steps.required-ci-final.outputs.build_matrix_trusted_verifier_job_id }}
        EXACT_BUILD_MATRIX_VERIFIER_JOB_INVENTORY_DIGEST: ${{ steps.required-ci-final.outputs.build_matrix_verifier_job_inventory_digest }}
        EXACT_BUILD_MATRIX_STATUS_PUBLISH_STEP_STARTED_AT: ${{ steps.required-ci-final.outputs.build_matrix_status_publish_step_started_at }}
        EXACT_BUILD_MATRIX_STATUS_PUBLISH_STEP_COMPLETED_AT: ${{ steps.required-ci-final.outputs.build_matrix_status_publish_step_completed_at }}
        EXACT_BUILD_MATRIX_RECEIPT_ARTIFACT_ID: ${{ steps.required-ci-final.outputs.receipt_artifact_id }}
        EXACT_BUILD_MATRIX_RECEIPT_ARTIFACT_DIGEST: ${{ steps.required-ci-final.outputs.receipt_artifact_digest }}
        EXACT_BUILD_MATRIX_RECEIPT_ARTIFACT_BYTES: ${{ steps.required-ci-final.outputs.receipt_artifact_bytes }}
        EXACT_CODEQL_RUN_ID: ${{ steps.required-ci-final.outputs.codeql_run_id }}
        EXACT_CODEQL_RUN_ATTEMPT: ${{ steps.required-ci-final.outputs.codeql_run_attempt }}
        EXACT_CODEQL_RUN_URL: ${{ steps.required-ci-final.outputs.codeql_run_url }}
        EXACT_CODEQL_ACTIONS_SOURCE_JOB_ID: ${{ steps.required-ci-final.outputs.codeql_actions_source_job_id }}
        EXACT_CODEQL_C_CPP_SOURCE_JOB_ID: ${{ steps.required-ci-final.outputs.codeql_c_cpp_source_job_id }}
        EXACT_CODEQL_PYTHON_SOURCE_JOB_ID: ${{ steps.required-ci-final.outputs.codeql_python_source_job_id }}
        EXACT_CODEQL_SOURCE_JOB_INVENTORY_DIGEST: ${{ steps.required-ci-final.outputs.codeql_source_job_inventory_digest }}
        EXACT_CODEQL_ACTIONS_SOURCE_ARTIFACT_ID: ${{ steps.required-ci-final.outputs.codeql_actions_source_artifact_id }}
        EXACT_CODEQL_ACTIONS_SOURCE_ARTIFACT_DIGEST: ${{ steps.required-ci-final.outputs.codeql_actions_source_artifact_digest }}
        EXACT_CODEQL_ACTIONS_SOURCE_ARTIFACT_BYTES: ${{ steps.required-ci-final.outputs.codeql_actions_source_artifact_bytes }}
        EXACT_CODEQL_C_CPP_SOURCE_ARTIFACT_ID: ${{ steps.required-ci-final.outputs.codeql_c_cpp_source_artifact_id }}
        EXACT_CODEQL_C_CPP_SOURCE_ARTIFACT_DIGEST: ${{ steps.required-ci-final.outputs.codeql_c_cpp_source_artifact_digest }}
        EXACT_CODEQL_C_CPP_SOURCE_ARTIFACT_BYTES: ${{ steps.required-ci-final.outputs.codeql_c_cpp_source_artifact_bytes }}
        EXACT_CODEQL_PYTHON_SOURCE_ARTIFACT_ID: ${{ steps.required-ci-final.outputs.codeql_python_source_artifact_id }}
        EXACT_CODEQL_PYTHON_SOURCE_ARTIFACT_DIGEST: ${{ steps.required-ci-final.outputs.codeql_python_source_artifact_digest }}
        EXACT_CODEQL_PYTHON_SOURCE_ARTIFACT_BYTES: ${{ steps.required-ci-final.outputs.codeql_python_source_artifact_bytes }}
        EXACT_CODEQL_STATUS_ID: ${{ steps.required-ci-final.outputs.codeql_status_id }}
        EXACT_CODEQL_STATUS_TARGET_URL: ${{ steps.required-ci-final.outputs.codeql_status_target_url }}
        EXACT_CODEQL_STATUS_CREATED_AT: ${{ steps.required-ci-final.outputs.codeql_status_created_at }}
        EXACT_CODEQL_STATUS_UPDATED_AT: ${{ steps.required-ci-final.outputs.codeql_status_updated_at }}
        EXACT_CODEQL_REPORTER_RUN_ID: ${{ steps.required-ci-final.outputs.codeql_reporter_run_id }}
        EXACT_CODEQL_REPORTER_RUN_ATTEMPT: ${{ steps.required-ci-final.outputs.codeql_reporter_run_attempt }}
        EXACT_CODEQL_REPORTER_RUN_URL: ${{ steps.required-ci-final.outputs.codeql_reporter_run_url }}
        EXACT_CODEQL_TRUSTED_REPORTER_JOB_ID: ${{ steps.required-ci-final.outputs.codeql_trusted_reporter_job_id }}
        EXACT_CODEQL_REPORTER_JOB_INVENTORY_DIGEST: ${{ steps.required-ci-final.outputs.codeql_reporter_job_inventory_digest }}
        EXACT_CODEQL_STATUS_PUBLISH_STEP_STARTED_AT: ${{ steps.required-ci-final.outputs.codeql_status_publish_step_started_at }}
        EXACT_CODEQL_STATUS_PUBLISH_STEP_COMPLETED_AT: ${{ steps.required-ci-final.outputs.codeql_status_publish_step_completed_at }}
        EXACT_CODEQL_SUMMARY_ARTIFACT_ID: ${{ steps.required-ci-final.outputs.codeql_summary_artifact_id }}
        EXACT_CODEQL_SUMMARY_ARTIFACT_DIGEST: ${{ steps.required-ci-final.outputs.codeql_summary_artifact_digest }}
        EXACT_CODEQL_SUMMARY_ARTIFACT_BYTES: ${{ steps.required-ci-final.outputs.codeql_summary_artifact_bytes }}
      run: |
        set -euo pipefail
        python3 tools/site-data/exact_evidence.py verify \
          --manifest "$GITHUB_WORKSPACE/SparkEngine-Exact-CI-Evidence.json"

    - name: Reverify complete staged release against durable checkpoint before publication
      if: needs.prepare.outputs.is_versioned == 'false' || (needs.prepare.outputs.is_versioned == 'true' && (steps.release-freeze.outputs.target_exists != 'true' || steps.release-freeze.outputs.target_is_draft == 'true'))
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        IS_VERSIONED: ${{ needs.prepare.outputs.is_versioned }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        GITHUB_SHA: ${{ github.sha }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_WORKSPACE/.github/scripts/prepare-download-badges.py" publish-preflight \
          --expected-assets-file "$GITHUB_WORKSPACE/expected-release-assets.txt" \
          --expected-digests-file "$GITHUB_WORKSPACE/expected-release-digests.txt" \
          --data-file "$GITHUB_WORKSPACE/badge-repository/.github/badges/downloads-data.json"

    - name: Verify complete staged release immediately before publication
      if: needs.prepare.outputs.is_versioned == 'false' || (needs.prepare.outputs.is_versioned == 'true' && (steps.release-freeze.outputs.target_exists != 'true' || steps.release-freeze.outputs.target_is_draft == 'true'))
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_ID: ${{ steps.stable-stage.outputs.id || steps.nightly-stage.outputs.id || steps.release-freeze.outputs.target_release_id }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        IS_VERSIONED: ${{ needs.prepare.outputs.is_versioned }}
      run: |
        set -euo pipefail
        if [[ ! "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]; then
          echo "Staged release ID is invalid before publication." >&2
          exit 1
        fi
        RELEASE_RECORD="$RUNNER_TEMP/release-before-publication.json"
        RELEASE_ASSETS="$RUNNER_TEMP/release-assets-before-publication.json"
        gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RELEASE_RECORD"
        gh api --paginate --slurp \
          "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
          > "$RELEASE_ASSETS"
        python3 -I "$GITHUB_WORKSPACE/.github/scripts/verify_release_asset_boundary.py" \
          --release-json "$RELEASE_RECORD" \
          --assets-json "$RELEASE_ASSETS" \
          --ledger-json "$GITHUB_WORKSPACE/badge-repository/.github/badges/downloads-data.json" \
          --expected-assets-file "$GITHUB_WORKSPACE/expected-release-assets.txt" \
          --expected-digests-file "$GITHUB_WORKSPACE/expected-release-digests.txt" \
          --asset-directory "$GITHUB_WORKSPACE" \
          --release-id "$RELEASE_ID" \
          --release-tag "$RELEASE_TAG" \
          --is-versioned "$IS_VERSIONED" \
          --expected-draft true

    - name: Reverify signed stable release bundle immediately before promotion
      if: needs.prepare.outputs.is_versioned == 'true'
      env:
        SOURCE_COMMIT: ${{ github.sha }}
        SIGNATURE_KEY_FINGERPRINT: ${{ vars.SPARKENGINE_STABLE_SIGNATURE_KEY_FINGERPRINT }}
      run: |
        set -euo pipefail
        python3 -I "$GITHUB_WORKSPACE/.github/scripts/verify_release_bundle.py" \
          --bundle-directory "$GITHUB_WORKSPACE" \
          --expected-assets-file "$GITHUB_WORKSPACE/expected-release-assets.txt" \
          --sha256sums "$GITHUB_WORKSPACE/SHA256SUMS" \
          --sbom "$GITHUB_WORKSPACE/SparkEngine-SBOM.spdx.json" \
          --provenance-manifest "$GITHUB_WORKSPACE/SparkEngine-Exact-CI-Evidence.json" \
          --signature-directory "$RUNNER_TEMP/spark-release-signature-bundle" \
          --signature-manifest "$RUNNER_TEMP/spark-release-signature-bundle/release-signatures.json" \
          --trusted-public-key "$RUNNER_TEMP/spark-release-signature-bundle/spark-release-public-key.pem" \
          --trusted-key-fingerprint "$SIGNATURE_KEY_FINGERPRINT" \
          --source-commit "$SOURCE_COMMIT"

    - name: Publish complete stable versioned release
      if: needs.prepare.outputs.is_versioned == 'true' && (steps.release-freeze.outputs.target_exists != 'true' || steps.release-freeze.outputs.target_is_draft == 'true')
      env:
        RELEASE_POLICY_READ_TOKEN: ${{ secrets.RELEASE_POLICY_READ_TOKEN }}
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        GITHUB_SHA: ${{ github.sha }}
        IS_VERSIONED: ${{ needs.prepare.outputs.is_versioned }}
        EXPECTED_STAGED_COMMIT: ${{ steps.badge-staged-commit.outputs.staged_commit }}
        STATE_REF: refs/tags/generated-release-counters
        RELEASE_ID: ${{ steps.stable-stage.outputs.id || steps.release-freeze.outputs.target_release_id }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        TARGET_SHA: ${{ github.sha }}
        EXPECTED_ASSETS_FILE: expected-release-assets.txt
        EXPECTED_DIGESTS_FILE: expected-release-digests.txt
        SIGNATURE_BUNDLE_PATH: ${{ runner.temp }}/spark-release-signature-bundle.tar.gz
      run: |
        set -euo pipefail
        test -n "$RELEASE_ID"
        RELEASE_ACCEPTANCE_PATCH_STARTED_FILE="$RUNNER_TEMP/release-acceptance-patch-started-$RELEASE_ID"
        rm -f "$RELEASE_ACCEPTANCE_PATCH_STARTED_FILE"
        export RELEASE_ACCEPTANCE_PATCH_STARTED_FILE
        FINAL_GATE_OUTPUT="$RUNNER_TEMP/final-stable-exact-gate.out"
        rm -f "$FINAL_GATE_OUTPUT"
        GITHUB_OUTPUT="$FINAL_GATE_OUTPUT" \
          python3 "$GITHUB_WORKSPACE/.github/scripts/verify-exact-required-gate.py"
        python3 "$GITHUB_WORKSPACE/tools/site-data/exact_evidence.py" verify-gate-output \
          --manifest "$GITHUB_WORKSPACE/SparkEngine-Exact-CI-Evidence.json" \
          --gate-output "$FINAL_GATE_OUTPUT" \
          --repository "$GITHUB_REPOSITORY" \
          --source-commit "$TARGET_SHA"
        AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
        TARGET_COMMIT="$(git rev-parse "${TARGET_SHA}^{commit}")"
        git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          fetch --force --no-tags origin \
          "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
        REMOTE_COMMIT="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
        if [[ "$REMOTE_COMMIT" != "$TARGET_COMMIT" ]]; then
          echo "Release tag ${RELEASE_TAG} drifted to ${REMOTE_COMMIT} at the publication boundary; expected ${TARGET_COMMIT}." >&2
          exit 1
        fi
        python3 "$GITHUB_WORKSPACE/.github/scripts/prepare-download-badges.py" publish-preflight \
          --expected-assets-file "$GITHUB_WORKSPACE/expected-release-assets.txt" \
          --expected-digests-file "$GITHUB_WORKSPACE/expected-release-digests.txt" \
          --data-file "$GITHUB_WORKSPACE/badge-repository/.github/badges/downloads-data.json"
        test -f "$RUNNER_TEMP/spark-release-signature-bundle.tar.gz"
        RELEASE_RECORD="$RUNNER_TEMP/signature-control-release.json"
        ASSETS_RECORD="$RUNNER_TEMP/signature-control-assets.json"
        gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RELEASE_RECORD"
        jq -e --arg tag "$RELEASE_TAG" --argjson id "$RELEASE_ID" \
          '.id == $id and .tag_name == $tag and .draft == true and .prerelease == false and .immutable == false' \
          "$RELEASE_RECORD" >/dev/null
        gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" > "$ASSETS_RECORD"
        EXPECTED_DIGEST="sha256:$(sha256sum "$RUNNER_TEMP/spark-release-signature-bundle.tar.gz" | awk '{print $1}')"
        EXISTING="$(jq -c '[.[] | select(.name == "SparkEngine-release-signature-bundle.tar.gz")]' "$ASSETS_RECORD")"
        if [[ "$EXISTING" != "[]" ]]; then
          jq -e --arg digest "$EXPECTED_DIGEST" \
            'length == 1 and .[0].state == "uploaded" and .[0].digest == $digest and .[0].uploader.id == 41898282 and .[0].uploader.login == "github-actions[bot]"' \
            <<< "$EXISTING" >/dev/null || { echo 'Existing signature control asset differs; refusing overwrite.' >&2; exit 1; }
        else
          python3 "$GITHUB_WORKSPACE/.github/scripts/guard_release_mutation.py" -- gh api --method POST \
            -H 'Content-Type: application/octet-stream' --input "$RUNNER_TEMP/spark-release-signature-bundle.tar.gz" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=SparkEngine-release-signature-bundle.tar.gz" \
            > "$RUNNER_TEMP/signature-control-upload.json"
          jq -e --arg digest "$EXPECTED_DIGEST" \
            '.name == "SparkEngine-release-signature-bundle.tar.gz" and .state == "uploaded" and .digest == $digest and .uploader.id == 41898282 and .uploader.login == "github-actions[bot]"' \
            "$RUNNER_TEMP/signature-control-upload.json" >/dev/null
        fi
        LOCAL_STAGED_COMMIT="$(git -C "$GITHUB_WORKSPACE/badge-repository" rev-parse HEAD)"
        REMOTE_STAGED_COMMIT="$(git -C "$GITHUB_WORKSPACE/badge-repository" \
          -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          ls-remote --refs origin "$STATE_REF" | awk 'NR == 1 { print $1 }')"
        CURRENT_WORKING_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/Working" --jq '.sha')"
        if [[ "$LOCAL_STAGED_COMMIT" != "$EXPECTED_STAGED_COMMIT" || \
              "$REMOTE_STAGED_COMMIT" != "$EXPECTED_STAGED_COMMIT" ]]; then
          echo "Generated release-counter state drifted at the publication boundary." >&2
          exit 1
        fi
        if [[ "$CURRENT_WORKING_SHA" != "$TARGET_SHA" ]]; then
          echo "Working advanced to ${CURRENT_WORKING_SHA} at the publication boundary; expected ${TARGET_SHA}." >&2
          exit 1
        fi
        FINAL_REPLAY_OUTPUT="$RUNNER_TEMP/final-stable-exact-replay.out"
        rm -f "$FINAL_REPLAY_OUTPUT"
        GITHUB_OUTPUT="$FINAL_REPLAY_OUTPUT" \
          python3 "$GITHUB_WORKSPACE/.github/scripts/verify-exact-required-gate.py"
        python3 "$GITHUB_WORKSPACE/tools/site-data/exact_evidence.py" verify-gate-output \
          --manifest "$GITHUB_WORKSPACE/SparkEngine-Exact-CI-Evidence.json" \
          --gate-output "$FINAL_REPLAY_OUTPUT" \
          --repository "$GITHUB_REPOSITORY" \
          --source-commit "$TARGET_SHA"
        # Re-read the release contract at the final stable publication boundary.
        # Candidate qualification preserves every technical gate without
        # claiming that publication and its independent verification are done.
        if [[ "${{ needs.prepare.outputs.version }}" == "0.9.0" ]]; then
          BASELINE_COMMIT="$(python3 - <<'PY'
          import json
          import os
          with open(os.path.join(os.environ["GITHUB_WORKSPACE"], "docs/site/readiness.json"), encoding="utf-8") as stream:
              print(json.load(stream)["predecessorRelease"]["sourceCommitEvidence"]["baselineCommit"])
          PY
          )"
          python3 "$GITHUB_WORKSPACE/.github/scripts/verify_v090_source_seal.py" \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "${{ github.sha }}" \
            --baseline-commit "$BASELINE_COMMIT" \
            --report "$RUNNER_TEMP/v090-source-seal-final.json"
          python3 "$GITHUB_WORKSPACE/tools/site-data/validate.py" --require-predecessor-candidate
        else
          python3 "$GITHUB_WORKSPACE/tools/site-data/validate.py" --require-candidate-ready
        fi
        python3 "$GITHUB_WORKSPACE/.github/scripts/verify_release_environment.py"
        bash "$GITHUB_WORKSPACE/.github/scripts/verify-release-publication-boundary.sh" \
          publish-preflight
        publication_attempted=false
        report_failed_immutable_publication() {
          local failure_status="$?"
          trap - ERR
          if [[ "$publication_attempted" != "true" && ! -f "$RELEASE_ACCEPTANCE_PATCH_STARTED_FILE" ]]; then
            return "$failure_status"
          fi
          echo "::error::Stable publication ${RELEASE_ID} failed or is ambiguous after dispatch. The acceptance helper quarantines only a proven mutable target; immutable or ambiguous targets are preserved for investigation at https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}." >&2
          return "$failure_status"
        }
        trap report_failed_immutable_publication ERR
        python3 -I "$GITHUB_WORKSPACE/.github/scripts/release-acceptance-gate.py"
        publication_attempted=true
        bash "$GITHUB_WORKSPACE/.github/scripts/verify-release-publication-boundary.sh" \
          post-publish-preflight
        publication_attempted=false
        trap - ERR
        rm -f "$RELEASE_ACCEPTANCE_PATCH_STARTED_FILE"

    - name: Publish complete nightly rolling release
      if: needs.prepare.outputs.is_versioned == 'false'
      env:
        RELEASE_POLICY_READ_TOKEN: ${{ secrets.RELEASE_POLICY_READ_TOKEN }}
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        GITHUB_SHA: ${{ github.sha }}
        IS_VERSIONED: ${{ needs.prepare.outputs.is_versioned }}
        EXPECTED_STAGED_COMMIT: ${{ steps.badge-staged-commit.outputs.staged_commit }}
        STATE_REF: refs/tags/generated-release-counters
        RELEASE_ID: ${{ steps.nightly-stage.outputs.id }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        TARGET_SHA: ${{ github.sha }}
        EXPECTED_ASSETS_FILE: expected-release-assets.txt
        EXPECTED_DIGESTS_FILE: expected-release-digests.txt
      run: |
        set -euo pipefail
        test -n "$RELEASE_ID"
        RELEASE_ACCEPTANCE_PATCH_STARTED_FILE="$RUNNER_TEMP/release-acceptance-patch-started-$RELEASE_ID"
        rm -f "$RELEASE_ACCEPTANCE_PATCH_STARTED_FILE"
        export RELEASE_ACCEPTANCE_PATCH_STARTED_FILE
        FINAL_GATE_OUTPUT="$RUNNER_TEMP/final-nightly-exact-gate.out"
        rm -f "$FINAL_GATE_OUTPUT"
        GITHUB_OUTPUT="$FINAL_GATE_OUTPUT" \
          python3 "$GITHUB_WORKSPACE/.github/scripts/verify-exact-required-gate.py"
        python3 "$GITHUB_WORKSPACE/tools/site-data/exact_evidence.py" verify-gate-output \
          --manifest "$GITHUB_WORKSPACE/SparkEngine-Exact-CI-Evidence.json" \
          --gate-output "$FINAL_GATE_OUTPUT" \
          --repository "$GITHUB_REPOSITORY" \
          --source-commit "$TARGET_SHA"
        AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
        TARGET_COMMIT="$(git rev-parse "${TARGET_SHA}^{commit}")"
        git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          fetch --force --no-tags origin \
          "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
        REMOTE_COMMIT="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
        if [[ "$REMOTE_COMMIT" != "$TARGET_COMMIT" ]]; then
          echo "Release tag ${RELEASE_TAG} drifted to ${REMOTE_COMMIT} at the publication boundary; expected ${TARGET_COMMIT}." >&2
          exit 1
        fi
        python3 "$GITHUB_WORKSPACE/.github/scripts/prepare-download-badges.py" publish-preflight \
          --expected-assets-file "$GITHUB_WORKSPACE/expected-release-assets.txt" \
          --expected-digests-file "$GITHUB_WORKSPACE/expected-release-digests.txt" \
          --data-file "$GITHUB_WORKSPACE/badge-repository/.github/badges/downloads-data.json"
        LOCAL_STAGED_COMMIT="$(git -C "$GITHUB_WORKSPACE/badge-repository" rev-parse HEAD)"
        REMOTE_STAGED_COMMIT="$(git -C "$GITHUB_WORKSPACE/badge-repository" \
          -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          ls-remote --refs origin "$STATE_REF" | awk 'NR == 1 { print $1 }')"
        CURRENT_WORKING_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/Working" --jq '.sha')"
        if [[ "$LOCAL_STAGED_COMMIT" != "$EXPECTED_STAGED_COMMIT" || \
              "$REMOTE_STAGED_COMMIT" != "$EXPECTED_STAGED_COMMIT" ]]; then
          echo "Generated release-counter state drifted at the publication boundary." >&2
          exit 1
        fi
        if [[ "$CURRENT_WORKING_SHA" != "$TARGET_SHA" ]]; then
          echo "Working advanced to ${CURRENT_WORKING_SHA} at the publication boundary; expected ${TARGET_SHA}." >&2
          exit 1
        fi
        FINAL_REPLAY_OUTPUT="$RUNNER_TEMP/final-nightly-exact-replay.out"
        rm -f "$FINAL_REPLAY_OUTPUT"
        GITHUB_OUTPUT="$FINAL_REPLAY_OUTPUT" \
          python3 "$GITHUB_WORKSPACE/.github/scripts/verify-exact-required-gate.py"
        python3 "$GITHUB_WORKSPACE/tools/site-data/exact_evidence.py" verify-gate-output \
          --manifest "$GITHUB_WORKSPACE/SparkEngine-Exact-CI-Evidence.json" \
          --gate-output "$FINAL_REPLAY_OUTPUT" \
          --repository "$GITHUB_REPOSITORY" \
          --source-commit "$TARGET_SHA"
        bash "$GITHUB_WORKSPACE/.github/scripts/verify-release-publication-boundary.sh" \
          publish-preflight
        publication_attempted=false
        redraft_failed_publication() {
          local failure_status="$?"
          trap - ERR
          if [[ "$publication_attempted" != "true" && ! -f "$RELEASE_ACCEPTANCE_PATCH_STARTED_FILE" ]]; then
            return "$failure_status"
          fi
          if ! python3 -I "$GITHUB_WORKSPACE/.github/scripts/recover_release_publication.py" \
              --repository "$GITHUB_REPOSITORY" \
              --release-id "$RELEASE_ID" \
              --release-tag "$RELEASE_TAG" \
              --expected-prerelease true \
              --attempts 3; then
            echo "::error::Could not verify release ${RELEASE_ID} was returned to draft; inspect https://github.com/${GITHUB_REPOSITORY}/releases immediately." >&2
          fi
          return "$failure_status"
        }
        trap redraft_failed_publication ERR
        python3 -I "$GITHUB_WORKSPACE/.github/scripts/release-acceptance-gate.py"
        publication_attempted=true
        bash "$GITHUB_WORKSPACE/.github/scripts/verify-release-publication-boundary.sh" \
          post-publish-preflight
        publication_attempted=false
        trap - ERR
        rm -f "$RELEASE_ACCEPTANCE_PATCH_STARTED_FILE"

    - name: Verify release tag immediately after publication
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        TARGET_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
        TARGET_COMMIT="$(git rev-parse "${TARGET_SHA}^{commit}")"
        git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          fetch --force --no-tags origin \
          "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
        REMOTE_COMMIT="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
        if [[ "$REMOTE_COMMIT" != "$TARGET_COMMIT" ]]; then
          echo "Release tag ${RELEASE_TAG} drifted to ${REMOTE_COMMIT} after publication; expected ${TARGET_COMMIT}." >&2
          exit 1
        fi

    - name: Verify published release attestation as a consumer
      if: needs.prepare.outputs.is_versioned == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      run: |
        set -euo pipefail
        gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"

    - name: Complete published release and download counters
      id: badge-complete
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        IS_VERSIONED: ${{ needs.prepare.outputs.is_versioned }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        GITHUB_SHA: ${{ github.sha }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      run: |
        set -euo pipefail
        for attempt in 1 2 3 4 5 6; do
          if python3 "$GITHUB_WORKSPACE/.github/scripts/prepare-download-badges.py" complete \
            --expected-assets-file "$GITHUB_WORKSPACE/expected-release-assets.txt" \
            --expected-digests-file "$GITHUB_WORKSPACE/expected-release-digests.txt" \
            --data-file "$GITHUB_WORKSPACE/badge-repository/.github/badges/downloads-data.json" \
            --badge-directory "$GITHUB_WORKSPACE/badge-repository/.github/badges"; then
            exit 0
          fi
          if test "$attempt" -eq 6; then
            echo "Published release did not converge to the exact expected state." >&2
            exit 1
          fi
          echo "Published state is not yet consistent (attempt ${attempt}/6); retrying."
          sleep "$((attempt * 3))"
        done

    - name: Commit completed download-counter state
      id: badge-final-commit
      working-directory: badge-repository
      env:
        RELEASE_POLICY_READ_TOKEN: ${{ secrets.RELEASE_POLICY_READ_TOKEN }}
        GH_TOKEN: ${{ github.token }}
        IS_VERSIONED: ${{ needs.prepare.outputs.is_versioned }}
        STATE_REF: refs/tags/generated-release-counters
      run: |
        set -euo pipefail
        AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
        EXPECTED_STAGED="${{ steps.badge-staged-commit.outputs.staged_commit }}"
        LOCAL_STAGED="$(git rev-parse HEAD)"
        if test "$LOCAL_STAGED" != "$EXPECTED_STAGED"; then
          echo "Badge checkout no longer points to this run's staged checkpoint." >&2
          exit 1
        fi

        REMOTE_OBJECT="$(git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          ls-remote --refs origin "$STATE_REF" | awk 'NR == 1 { print $1 }')"
        if test "$REMOTE_OBJECT" != "$EXPECTED_STAGED"; then
          echo "Generated counter state advanced after the staged checkpoint; refusing to commit stale completed state." >&2
          exit 1
        fi

        if [[ "$IS_VERSIONED" == "true" ]]; then
          TARGET_BADGE=.github/badges/stable-downloads.json
        else
          TARGET_BADGE=.github/badges/nightly-downloads.json
        fi
        git add -- \
          .github/badges/downloads-data.json \
          .github/badges/downloads.json \
          .github/badges/installer-downloads.json \
          "$TARGET_BADGE"
        if git diff --cached --quiet; then
          echo "Counter completion produced no completed-state diff." >&2
          exit 1
        fi

        git commit -s -m "chore: complete download counters (lifetime: ${{ steps.badge-complete.outputs.new_total }}, installer: ${{ steps.badge-complete.outputs.installer_total }}) [skip ci]"
        FINAL_COMMIT="$(git rev-parse HEAD)"
        python3 "$GITHUB_WORKSPACE/.github/scripts/guard_release_mutation.py" -- git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" push \
          --force-with-lease="${STATE_REF}:${EXPECTED_STAGED}" origin \
          "HEAD:${STATE_REF}"

        PUBLISHED_OBJECT="$(git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          ls-remote --refs origin "$STATE_REF" | awk 'NR == 1 { print $1 }')"
        if test "$PUBLISHED_OBJECT" != "$FINAL_COMMIT"; then
          echo "Generated counter state tag does not point to the completed counter commit after push." >&2
          exit 1
        fi
        echo "changed=true" >> "$GITHUB_OUTPUT"
        echo "final_commit=$FINAL_COMMIT" >> "$GITHUB_OUTPUT"

    - name: Verify generated counter tag and unchanged Working
      if: steps.badge-final-commit.outputs.changed == 'true'
      working-directory: badge-repository
      env:
        GH_TOKEN: ${{ github.token }}
        TRUSTED_WORKING_SHA: ${{ steps.required-ci-final.outputs.verifier_sha }}
        STATE_REF: refs/tags/generated-release-counters
      run: |
        set -euo pipefail
        AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
        FINAL_COMMIT="${{ steps.badge-final-commit.outputs.final_commit }}"
        if test "$(git rev-parse HEAD)" != "$FINAL_COMMIT"; then
          echo "Badge checkout no longer points to this run's finalized commit." >&2
          exit 1
        fi
        PUBLISHED_OBJECT="$(git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          ls-remote --refs origin "$STATE_REF" | awk 'NR == 1 { print $1 }')"
        if test "$PUBLISHED_OBJECT" != "$FINAL_COMMIT"; then
          echo "Generated counter state tag advanced after this release." >&2
          exit 1
        fi
        WORKING_HEAD="$(git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          ls-remote --refs origin refs/heads/Working | awk 'NR == 1 { print $1 }')"
        if test "$WORKING_HEAD" != "$TRUSTED_WORKING_SHA"; then
          echo "Working advanced after the final exact-CI revalidation." >&2
          exit 1
        fi

    - name: Recover incomplete public release
      if: failure() && needs.prepare.outputs.is_versioned == 'false'
      env:
        RELEASE_POLICY_READ_TOKEN: ${{ secrets.RELEASE_POLICY_READ_TOKEN }}
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        STATE_FILE="$GITHUB_WORKSPACE/badge-repository/.github/badges/downloads-data.json"
        if ! test -f "$STATE_FILE"; then
          echo "No durable staged ledger is available; there is no release object to recover."
          exit 0
        fi
        python3 -I "$GITHUB_WORKSPACE/.github/scripts/recover_release_publication.py" \
          --repository "$GITHUB_REPOSITORY" \
          --state-file "$STATE_FILE" \
          --run-id "$GITHUB_RUN_ID" \
          --run-attempt "$GITHUB_RUN_ATTEMPT" \
          --source-sha "$GITHUB_SHA" \
          --attempts 5

    - name: Report failed immutable stable publication
      if: failure() && needs.prepare.outputs.is_versioned == 'true'
      run: |
        echo "::error::Stable publication failed. Preserve all evidence and any immutable or ambiguous target. Only an exactly proven mutable target may be quarantined; final readiness is blocked pending owner investigation."
        exit 1

  # A fresh runner consumes public bytes, with no permission to publish or
  # rewrite readiness. A receipt is evidence for final review, never a ready claim.
  verify-stable-publication:
    needs: [prepare, release]
    if: needs.prepare.outputs.is_versioned == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      attestations: read
    steps:
    - name: Checkout exact consumer source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Revalidate candidate and current exact CI for the independent consumer
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        if [[ "${{ needs.prepare.outputs.version }}" == "0.9.0" ]]; then
          python3 tools/site-data/validate.py --require-predecessor-candidate
        else
          python3 tools/site-data/validate.py --require-candidate-ready
        fi
        GITHUB_OUTPUT="$RUNNER_TEMP/consumer-exact-ci.out" \
          python3 .github/scripts/verify-exact-required-gate.py

    - name: Download and independently verify the published stable release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        SIGNATURE_KEY_FINGERPRINT: ${{ vars.SPARKENGINE_STABLE_SIGNATURE_KEY_FINGERPRINT }}
      run: |
        set -euo pipefail
        python3 .github/scripts/verify_published_stable_release.py \
          --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --source-commit "$GITHUB_SHA" \
          --directory "$RUNNER_TEMP/published-stable-download" \
           --signature-directory "$RUNNER_TEMP/consumer-signatures" \
           --signature-control-asset "SparkEngine-release-signature-bundle.tar.gz" \
          --fingerprint "$SIGNATURE_KEY_FINGERPRINT" --gate-output "$RUNNER_TEMP/consumer-exact-ci.out" \
          --receipt "$RUNNER_TEMP/stable-publication-evidence.json" \
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"

    - name: Retain immutable independent publication evidence
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: stable-publication-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/stable-publication-evidence.json
        if-no-files-found: error
        retention-days: 90
