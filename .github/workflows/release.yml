name: Release Builds

on:
  push:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  # ===========================================================================
  # Windows Build — MSVC VS 2022, Debug + Release
  # ===========================================================================
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        config: [Debug, Release]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2

    - name: Configure CMake
      run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DSPARK_MSVC_TOOLSET=v143 -DBUILD_TESTS=OFF

    - name: Build
      run: cmake --build build --config ${{ matrix.config }} --parallel

    - name: Package artifacts
      shell: pwsh
      run: |
        $outDir = "dist/SparkEngine-Windows-${{ matrix.config }}"
        New-Item -ItemType Directory -Force -Path $outDir | Out-Null
        if (Test-Path "build/bin/${{ matrix.config }}") {
          Copy-Item "build/bin/${{ matrix.config }}/*" $outDir -Recurse -Force
        } elseif (Test-Path "build/bin") {
          Copy-Item "build/bin/*" $outDir -Recurse -Force
        }
        Compress-Archive -Path $outDir -DestinationPath "SparkEngine-Windows-${{ matrix.config }}.zip"

    - name: Upload packaged artifact
      uses: actions/upload-artifact@v4
      with:
        name: SparkEngine-Windows-${{ matrix.config }}
        path: SparkEngine-Windows-${{ matrix.config }}.zip
        retention-days: 1

  # ===========================================================================
  # Linux Build — GCC, Debug + Release
  # ===========================================================================
  build-linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        config: [Debug, Release]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libgl-dev libvulkan-dev

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DBUILD_TESTS=OFF \
          -DCMAKE_C_COMPILER=gcc \
          -DCMAKE_CXX_COMPILER=g++

    - name: Build
      run: cmake --build build --parallel $(nproc) --target SparkEngine

    - name: Package artifacts
      run: |
        mkdir -p dist/SparkEngine-Linux-${{ matrix.config }}
        cp -r build/bin/* dist/SparkEngine-Linux-${{ matrix.config }}/
        tar -czf SparkEngine-Linux-${{ matrix.config }}.tar.gz \
          -C dist SparkEngine-Linux-${{ matrix.config }}

    - name: Upload packaged artifact
      uses: actions/upload-artifact@v4
      with:
        name: SparkEngine-Linux-${{ matrix.config }}
        path: SparkEngine-Linux-${{ matrix.config }}.tar.gz
        retention-days: 1

  # ===========================================================================
  # Publish rolling "latest" GitHub Release
  # ===========================================================================
  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Resolve short commit SHA
      id: sha
      run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

    - name: Download all build artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-assets

    - name: Flatten assets to root
      run: |
        find release-assets -type f \( -name "*.zip" -o -name "*.tar.gz" \) \
          -exec cp {} . \;

    - name: Create or update "latest" release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "Latest Build (${{ steps.sha.outputs.short }})"
        body: |
          Automated build from commit [`${{ steps.sha.outputs.short }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

          Built on: ${{ github.run_started_at }}
          Branch: `${{ github.ref_name }}`

          | Asset | Platform | Config |
          |---|---|---|
          | `SparkEngine-Windows-Release.zip` | Windows (VS 2022 x64) | Release |
          | `SparkEngine-Windows-Debug.zip` | Windows (VS 2022 x64) | Debug |
          | `SparkEngine-Linux-Release.tar.gz` | Linux (GCC, ubuntu-24.04) | Release |
          | `SparkEngine-Linux-Debug.tar.gz` | Linux (GCC, ubuntu-24.04) | Debug |
        prerelease: false
        make_latest: true
        files: |
          SparkEngine-Windows-Release.zip
          SparkEngine-Windows-Debug.zip
          SparkEngine-Linux-Release.tar.gz
          SparkEngine-Linux-Debug.tar.gz
