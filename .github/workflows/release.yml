name: Publish Builds

on:
  push:
    branches: [ 'release/**' ]
    tags: [ 'v*' ]
  schedule:
    # Nightly at 04:00 UTC — after the day's merges settle
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0). Leave empty for rolling "latest" release.'
        required: false
        type: string
      build_configs:
        description: 'Which build configurations to publish'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - release
          - debug

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Compute release metadata and build matrix shared by all jobs
  # ===========================================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      cmake_version: ${{ steps.meta.outputs.cmake_version }}
      tag: ${{ steps.meta.outputs.tag }}
      is_versioned: ${{ steps.meta.outputs.is_versioned }}
      configs: ${{ steps.matrix.outputs.configs }}
      build_type: ${{ steps.matrix.outputs.build_type }}
    steps:
    - name: Checkout release metadata source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Compute release metadata
      id: meta
      env:
        EVENT_NAME: ${{ github.event_name }}
        INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        REF_NAME: ${{ github.ref_name }}
        REF_TYPE: ${{ github.ref_type }}
      run: |
        set -euo pipefail
        DEFAULT_VERSION=$(sed -nE 's/^set\(SPARK_ENGINE_VERSION "([0-9]+\.[0-9]+\.[0-9]+)" CACHE.*/\1/p' CMakeLists.txt | head -n 1)
        if [[ ! "$DEFAULT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Could not determine the default semantic version from CMakeLists.txt" >&2
          exit 1
        fi

        if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_RELEASE_TAG" ]]; then
          TAG="$INPUT_RELEASE_TAG"
        elif [[ "$REF_TYPE" == "tag" ]]; then
          TAG="$REF_NAME"
        else
          TAG=""
        fi

        if [[ -n "$TAG" ]]; then
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must have the form vMAJOR.MINOR.PATCH; got: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "cmake_version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "is_versioned=true" >> "$GITHUB_OUTPUT"
        else
          echo "tag=nightly" >> "$GITHUB_OUTPUT"
          echo "version=nightly" >> "$GITHUB_OUTPUT"
          echo "cmake_version=$DEFAULT_VERSION" >> "$GITHUB_OUTPUT"
          echo "is_versioned=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Determine build configurations
      id: matrix
      env:
        EVENT_NAME: ${{ github.event_name }}
        IS_VERSIONED: ${{ steps.meta.outputs.is_versioned }}
        REQUESTED_CONFIGS: ${{ inputs.build_configs || 'both' }}
      run: |
        # Every rolling nightly publishes both configurations so direct Debug
        # and Release links always identify assets from one exact source SHA.
        # Only versioned releases may honor an explicit single-config choice.
        if [[ "$IS_VERSIONED" == "false" ]]; then
          BUILD_CONFIGS="both"
        else
          BUILD_CONFIGS="$REQUESTED_CONFIGS"
        fi
        echo "build_type=$BUILD_CONFIGS" >> "$GITHUB_OUTPUT"

        if [[ "$BUILD_CONFIGS" == "both" ]]; then
          echo 'configs=["Debug","Release"]' >> "$GITHUB_OUTPUT"
        elif [[ "$BUILD_CONFIGS" == "release" ]]; then
          echo 'configs=["Release"]' >> "$GITHUB_OUTPUT"
        else
          echo 'configs=["Debug"]' >> "$GITHUB_OUTPUT"
        fi

  # ===========================================================================
  # Windows Build — MSVC VS 2022
  # ===========================================================================
  build-windows:
    needs: [prepare]
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.prepare.outputs.configs) }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

    - name: Configure CMake
      run: cmake -B build -G "Visual Studio 17 2022" -A x64 -T v143 -DBUILD_TESTS=ON -DSPARK_STRICT_DEPS=ON -DSPARK_ENGINE_VERSION="${{ needs.prepare.outputs.cmake_version }}" -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/stage"

    - name: Build
      run: cmake --build build --config ${{ matrix.config }} --parallel

    - name: Run Tests
      run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure --no-tests=error

    - name: Validate external package consumption
      shell: pwsh
      run: |
        cmake --install build --config ${{ matrix.config }}
        cmake -S Tests/PackageSmoke -B smoke-build -G "Visual Studio 17 2022" -A x64 -T v143 `
          -DSparkEngine_DIR="${{ github.workspace }}/stage/lib/cmake/SparkEngine" `
          -DSPARK_EXPECTED_ENGINE_VERSION="${{ needs.prepare.outputs.cmake_version }}"
        cmake --build smoke-build --config ${{ matrix.config }} --parallel
        ctest --test-dir smoke-build -C ${{ matrix.config }} --output-on-failure --no-tests=error

    - name: Build every template against the installed SDK
      shell: pwsh
      run: |
        cmake `
          -DSPARK_TEMPLATE_ROOT="${{ github.workspace }}/stage/share/SparkEngine/templates" `
          -DSPARK_TEMPLATE_SOURCE_ROOT="${{ github.workspace }}/Templates" `
          -DSPARK_TEMPLATE_BUILD_ROOT="${{ github.workspace }}/template-smoke-build" `
          -DSPARK_ENGINE_DIR="${{ github.workspace }}/stage/lib/cmake/SparkEngine" `
          -DSPARK_ENGINE_EXECUTABLE="${{ github.workspace }}/stage/bin/SparkEngine.exe" `
          -DSPARK_TEMPLATE_CONFIG=${{ matrix.config }} `
          "-DSPARK_CMAKE_GENERATOR=Visual Studio 17 2022" `
          -DSPARK_CMAKE_GENERATOR_PLATFORM=x64 `
          -DSPARK_CMAKE_GENERATOR_TOOLSET=v143 `
          -P cmake/VerifyInstalledTemplates.cmake

    - name: Validate staged package executable BOM
      shell: pwsh
      run: |
        cmake `
          -DSPARK_PACKAGE_ROOT="${{ github.workspace }}/stage" `
          -DSPARK_EXECUTABLE_SUFFIX:STRING=.exe `
          -P cmake/ValidateStagedPackageExecutables.cmake

    - name: Generate CPack packages
      shell: pwsh
      run: |
        cpack --config build/CPackConfig.cmake -C ${{ matrix.config }} -B build/packages
        $cpackExitCode = $LASTEXITCODE
        if ($cpackExitCode -ne 0) {
          Get-ChildItem build/packages/_CPack_Packages -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -in @('NSISOutput.log', 'wix.log') } |
            ForEach-Object {
              Write-Error "CPack diagnostic: $($_.FullName)" -ErrorAction Continue
              Get-Content -LiteralPath $_.FullName
            }
          exit $cpackExitCode
        }

    - name: Extract and smoke-test portable package
      shell: pwsh
      run: |
        $archives = @(Get-ChildItem -LiteralPath build/packages -Filter *.zip -File)
        if ($archives.Count -ne 1) {
          throw "Expected exactly one portable ZIP package; found $($archives.Count)"
        }
        python .github/scripts/validate-extracted-package.py --preflight-archive "$($archives[0].FullName)"
        Remove-Item -LiteralPath build/packages/_CPack_Packages -Recurse -Force -ErrorAction SilentlyContinue
        $extractRoot = Join-Path "${{ github.workspace }}" "package-extract"
        New-Item -ItemType Directory -Force -Path $extractRoot | Out-Null
        Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $extractRoot
        if (Test-Path (Join-Path $extractRoot "bin")) {
          $packageRoot = $extractRoot
        } else {
          $roots = @(Get-ChildItem -LiteralPath $extractRoot -Directory)
          if ($roots.Count -ne 1) {
            throw "Portable ZIP must contain one package root; found $($roots.Count)"
          }
          $packageRoot = $roots[0].FullName
        }
        python .github/scripts/validate-extracted-package.py --package-root "$packageRoot" --stage-root "${{ github.workspace }}/stage" --archive "$($archives[0].FullName)"
        cmake -DSPARK_PACKAGE_ROOT="$packageRoot" -DSPARK_EXECUTABLE_SUFFIX:STRING=.exe -P cmake/ValidateStagedPackageExecutables.cmake
        cmake -S Tests/PackageSmoke -B package-smoke-build -G "Visual Studio 17 2022" -A x64 -T v143 -DSparkEngine_DIR="$packageRoot/lib/cmake/SparkEngine" -DSPARK_EXPECTED_ENGINE_VERSION="${{ needs.prepare.outputs.cmake_version }}"
        cmake --build package-smoke-build --config ${{ matrix.config }} --parallel
        ctest --test-dir package-smoke-build -C ${{ matrix.config }} --output-on-failure --no-tests=error
        cmake `
          -DSPARK_TEMPLATE_ROOT="$packageRoot/share/SparkEngine/templates" `
          -DSPARK_TEMPLATE_SOURCE_ROOT="${{ github.workspace }}/Templates" `
          -DSPARK_TEMPLATE_BUILD_ROOT="${{ github.workspace }}/package-template-smoke-build" `
          -DSPARK_ENGINE_DIR="$packageRoot/lib/cmake/SparkEngine" `
          -DSPARK_ENGINE_EXECUTABLE="$packageRoot/bin/SparkEngine.exe" `
          -DSPARK_TEMPLATE_CONFIG=${{ matrix.config }} `
          "-DSPARK_CMAKE_GENERATOR=Visual Studio 17 2022" `
          -DSPARK_CMAKE_GENERATOR_PLATFORM=x64 `
          -DSPARK_CMAKE_GENERATOR_TOOLSET=v143 `
          -P cmake/VerifyInstalledTemplates.cmake

    - name: Upload CPack failure diagnostics
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: SparkEngine-Windows-${{ matrix.config }}-cpack-diagnostics
        path: |
          build/packages/_CPack_Packages/**/NSISOutput.log
          build/packages/_CPack_Packages/**/wix.log
        if-no-files-found: ignore
        retention-days: 7

    - name: Upload packaged artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: SparkEngine-Windows-${{ matrix.config }}-packages
        path: |
          build/packages/*.zip
          build/packages/*.exe
          build/packages/*.msi
        retention-days: 7
        if-no-files-found: error

  # ===========================================================================
  # Linux Build — GCC
  # ===========================================================================
  build-linux:
    needs: [prepare]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.prepare.outputs.configs) }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-14 g++-14 cmake libgl-dev libvulkan-dev libsdl2-dev libfreetype-dev mesa-vulkan-drivers

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DBUILD_TESTS=ON \
          -DSPARK_STRICT_DEPS=ON \
          -DSPARK_ENGINE_VERSION="${{ needs.prepare.outputs.cmake_version }}" \
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/stage" \
          -DCMAKE_C_COMPILER=gcc-14 \
          -DCMAKE_CXX_COMPILER=g++-14

    - name: Build
      run: cmake --build build --parallel $(nproc)

    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure --no-tests=error
        if [ -f bin/SparkTests ]; then ./bin/SparkTests; fi

    - name: Validate external package consumption
      run: |
        cmake --install build
        cmake -S Tests/PackageSmoke -B smoke-build \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DCMAKE_C_COMPILER=gcc-14 \
          -DCMAKE_CXX_COMPILER=g++-14 \
          -DSparkEngine_DIR="${{ github.workspace }}/stage/lib/cmake/SparkEngine" \
          -DSPARK_EXPECTED_ENGINE_VERSION="${{ needs.prepare.outputs.cmake_version }}"
        cmake --build smoke-build --parallel $(nproc)
        ctest --test-dir smoke-build --output-on-failure --no-tests=error

    - name: Build every template against the installed SDK
      run: |
        cmake \
          -DSPARK_TEMPLATE_ROOT="${{ github.workspace }}/stage/share/SparkEngine/templates" \
          -DSPARK_TEMPLATE_SOURCE_ROOT="${{ github.workspace }}/Templates" \
          -DSPARK_TEMPLATE_BUILD_ROOT="${{ github.workspace }}/template-smoke-build" \
          -DSPARK_ENGINE_DIR="${{ github.workspace }}/stage/lib/cmake/SparkEngine" \
          -DSPARK_ENGINE_EXECUTABLE="${{ github.workspace }}/stage/bin/SparkEngine" \
          -DSPARK_TEMPLATE_CONFIG=${{ matrix.config }} \
          "-DSPARK_CMAKE_GENERATOR=Unix Makefiles" \
          -DSPARK_C_COMPILER=gcc-14 \
          -DSPARK_CXX_COMPILER=g++-14 \
          -P cmake/VerifyInstalledTemplates.cmake

    - name: Validate staged package executable BOM
      run: |
        cmake \
          -DSPARK_PACKAGE_ROOT="${{ github.workspace }}/stage" \
          -P cmake/ValidateStagedPackageExecutables.cmake

    - name: Generate CPack packages
      run: |
        cpack --config build/CPackConfig.cmake -C ${{ matrix.config }} -B build/packages

    - name: Extract and smoke-test portable package
      run: |
        archive_count=$(find build/packages -maxdepth 1 -type f -name '*.tar.gz' | wc -l)
        if [ "$archive_count" -ne 1 ]; then
          echo "Expected exactly one portable TGZ package; found $archive_count" >&2
          exit 1
        fi
        archive=$(find build/packages -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
        python3 .github/scripts/validate-extracted-package.py --preflight-archive "$archive"
        rm -rf build/packages/_CPack_Packages
        mkdir package-extract
        tar -xzf "$archive" -C package-extract
        if [ -d package-extract/bin ]; then
          package_root="$(pwd)/package-extract"
        else
          root_count=$(find package-extract -mindepth 1 -maxdepth 1 -type d | wc -l)
          if [ "$root_count" -ne 1 ]; then
            echo "Portable TGZ must contain one package root; found $root_count" >&2
            exit 1
          fi
          package_root=$(find package-extract -mindepth 1 -maxdepth 1 -type d -print -quit)
        fi
        python3 .github/scripts/validate-extracted-package.py \
          --package-root "$package_root" \
          --stage-root "${{ github.workspace }}/stage" \
          --archive "$archive"
        cmake -DSPARK_PACKAGE_ROOT="$package_root" -P cmake/ValidateStagedPackageExecutables.cmake
        cmake -S Tests/PackageSmoke -B package-smoke-build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 -DSparkEngine_DIR="$package_root/lib/cmake/SparkEngine" -DSPARK_EXPECTED_ENGINE_VERSION="${{ needs.prepare.outputs.cmake_version }}"
        cmake --build package-smoke-build --parallel $(nproc)
        ctest --test-dir package-smoke-build --output-on-failure --no-tests=error
        cmake \
          -DSPARK_TEMPLATE_ROOT="$package_root/share/SparkEngine/templates" \
          -DSPARK_TEMPLATE_SOURCE_ROOT="${{ github.workspace }}/Templates" \
          -DSPARK_TEMPLATE_BUILD_ROOT="${{ github.workspace }}/package-template-smoke-build" \
          -DSPARK_ENGINE_DIR="$package_root/lib/cmake/SparkEngine" \
          -DSPARK_ENGINE_EXECUTABLE="$package_root/bin/SparkEngine" \
          -DSPARK_TEMPLATE_CONFIG=${{ matrix.config }} \
          "-DSPARK_CMAKE_GENERATOR=Unix Makefiles" \
          -DSPARK_C_COMPILER=gcc-14 \
          -DSPARK_CXX_COMPILER=g++-14 \
          -P cmake/VerifyInstalledTemplates.cmake

    - name: Upload packaged artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: SparkEngine-Linux-${{ matrix.config }}-packages
        path: |
          build/packages/*.zip
          build/packages/*.tar.gz
        retention-days: 7
        if-no-files-found: error

  # ===========================================================================
  # macOS Build — Apple Clang, installed SDK, templates, and CPack
  # ===========================================================================
  build-macos:
    needs: [prepare]
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.prepare.outputs.configs) }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        brew update
        brew install cmake sdl2 openal-soft

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DBUILD_TESTS=ON \
          -DSPARK_STRICT_DEPS=ON \
          -DENABLE_LTO=OFF \
          -DENABLE_SDL2=ON \
          -DENABLE_VULKAN=OFF \
          -DENABLE_OPENGL=ON \
          -DENABLE_METAL=OFF \
          -DENABLE_DXR=OFF \
          -DSPARK_ENGINE_VERSION="${{ needs.prepare.outputs.cmake_version }}" \
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/stage" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3

    - name: Build
      run: cmake --build build --parallel $(sysctl -n hw.logicalcpu)

    - name: Run Tests
      run: ctest --test-dir build --output-on-failure --no-tests=error

    - name: Validate external package consumption
      run: |
        cmake --install build
        cmake -S Tests/PackageSmoke -B smoke-build \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DSparkEngine_DIR="${{ github.workspace }}/stage/lib/cmake/SparkEngine" \
          -DSPARK_EXPECTED_ENGINE_VERSION="${{ needs.prepare.outputs.cmake_version }}"
        cmake --build smoke-build --parallel $(sysctl -n hw.logicalcpu)
        ctest --test-dir smoke-build --output-on-failure --no-tests=error

    - name: Build every template against the installed SDK
      run: |
        cmake \
          -DSPARK_TEMPLATE_ROOT="${{ github.workspace }}/stage/share/SparkEngine/templates" \
          -DSPARK_TEMPLATE_SOURCE_ROOT="${{ github.workspace }}/Templates" \
          -DSPARK_TEMPLATE_BUILD_ROOT="${{ github.workspace }}/template-smoke-build" \
          -DSPARK_ENGINE_DIR="${{ github.workspace }}/stage/lib/cmake/SparkEngine" \
          -DSPARK_ENGINE_EXECUTABLE="${{ github.workspace }}/stage/bin/SparkEngine" \
          -DSPARK_TEMPLATE_CONFIG=${{ matrix.config }} \
          "-DSPARK_CMAKE_GENERATOR=Unix Makefiles" \
          -P cmake/VerifyInstalledTemplates.cmake

    - name: Validate staged package executable BOM
      run: |
        cmake \
          -DSPARK_PACKAGE_ROOT="${{ github.workspace }}/stage" \
          -P cmake/ValidateStagedPackageExecutables.cmake

    - name: Generate CPack packages
      run: cpack --config build/CPackConfig.cmake -C ${{ matrix.config }} -B build/packages

    - name: Extract and smoke-test portable package
      run: |
        archive_count=$(find build/packages -maxdepth 1 -type f -name '*.tar.gz' | wc -l)
        if [ "$archive_count" -ne 1 ]; then
          echo "Expected exactly one portable TGZ package; found $archive_count" >&2
          exit 1
        fi
        archive=$(find build/packages -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
        python3 .github/scripts/validate-extracted-package.py --preflight-archive "$archive"
        rm -rf build/packages/_CPack_Packages
        mkdir package-extract
        tar -xzf "$archive" -C package-extract
        if [ -d package-extract/bin ]; then
          package_root="$(pwd)/package-extract"
        else
          root_count=$(find package-extract -mindepth 1 -maxdepth 1 -type d | wc -l)
          if [ "$root_count" -ne 1 ]; then
            echo "Portable TGZ must contain one package root; found $root_count" >&2
            exit 1
          fi
          package_root=$(find package-extract -mindepth 1 -maxdepth 1 -type d -print -quit)
        fi
        python3 .github/scripts/validate-extracted-package.py \
          --package-root "$package_root" \
          --stage-root "${{ github.workspace }}/stage" \
          --archive "$archive"
        cmake -DSPARK_PACKAGE_ROOT="$package_root" -P cmake/ValidateStagedPackageExecutables.cmake
        cmake -S Tests/PackageSmoke -B package-smoke-build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DSparkEngine_DIR="$package_root/lib/cmake/SparkEngine" -DSPARK_EXPECTED_ENGINE_VERSION="${{ needs.prepare.outputs.cmake_version }}"
        cmake --build package-smoke-build --parallel $(sysctl -n hw.logicalcpu)
        ctest --test-dir package-smoke-build --output-on-failure --no-tests=error
        cmake \
          -DSPARK_TEMPLATE_ROOT="$package_root/share/SparkEngine/templates" \
          -DSPARK_TEMPLATE_SOURCE_ROOT="${{ github.workspace }}/Templates" \
          -DSPARK_TEMPLATE_BUILD_ROOT="${{ github.workspace }}/package-template-smoke-build" \
          -DSPARK_ENGINE_DIR="$package_root/lib/cmake/SparkEngine" \
          -DSPARK_ENGINE_EXECUTABLE="$package_root/bin/SparkEngine" \
          -DSPARK_TEMPLATE_CONFIG=${{ matrix.config }} \
          "-DSPARK_CMAKE_GENERATOR=Unix Makefiles" \
          -P cmake/VerifyInstalledTemplates.cmake

    - name: Upload packaged artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: SparkEngine-macOS-${{ matrix.config }}-packages
        path: |
          build/packages/*.zip
          build/packages/*.tar.gz
        retention-days: 7
        if-no-files-found: error

  # ===========================================================================
  # SparkInstaller — standalone bootstrap binary for the README "Install" buttons
  # ===========================================================================
  build-installer:
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact_name: SparkInstaller-Linux-x64
            bin_name: SparkInstaller
          - os: windows-latest
            artifact_name: SparkInstaller-Windows-x64.exe
            bin_name: SparkInstaller.exe
          - os: macos-latest
            artifact_name: SparkInstaller-macOS-arm64
            bin_name: SparkInstaller
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure SparkBuild + SparkInstaller (standalone)
        shell: bash
        run: |
          mkdir -p build-installer
          cat > build-installer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          project(SparkInstallerCombo LANGUAGES CXX)
          include(CTest)
          add_subdirectory(${CMAKE_SOURCE_DIR}/../SparkBuild SparkBuild)
          add_subdirectory(${CMAKE_SOURCE_DIR}/../SparkInstaller SparkInstaller)
          EOF
          cmake -S build-installer -B build-installer/build \
                -DCMAKE_BUILD_TYPE=Release \
                -DSPARK_ENGINE_VERSION="${{ needs.prepare.outputs.cmake_version }}" \
                -DSPARKINSTALLER_ENABLE_GUI=OFF \
                -DSPARKINSTALLER_BUILD_TESTS=ON

      - name: Build SparkInstaller and registered contract tests
        shell: bash
        run: >-
          cmake --build build-installer/build --config Release --target
          SparkInstaller
          SparkInstallerGitTests
          SparkBuildProcessRunnerTests
          SparkBuildDownloaderTests
          -j

      - name: Run installer dependency contract tests
        shell: bash
        run: ctest --test-dir build-installer/build -C Release --output-on-failure --no-tests=error

      - name: Stage artifact with release-ready name
        shell: bash
        run: |
          mkdir -p staging
          cp "build-installer/build/bin/${{ matrix.bin_name }}" "staging/${{ matrix.artifact_name }}"

      - name: Launch staged executable
        shell: bash
        run: |
          set -o pipefail
          "./staging/${{ matrix.artifact_name }}" --version | tee installer-version.txt
          "./staging/${{ matrix.artifact_name }}" --help | tee installer-help.txt
          grep -Fq "SparkInstaller" installer-version.txt
          grep -Fq "Usage:" installer-help.txt

      - name: Upload installer binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: staging/${{ matrix.artifact_name }}
          retention-days: 7

  # ===========================================================================
  # Publish GitHub Release (versioned or rolling "latest")
  # ===========================================================================
  release:
    needs: [prepare, build-windows, build-linux, build-macos, build-installer]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      attestations: write
      contents: write
      id-token: write
    concurrency:
      group: sparkengine-publication-global
      cancel-in-progress: false

    steps:
    - name: Checkout release source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false

    - name: Verify exact source commit passed Required CI Gate
      id: required-ci
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET_SHA: ${{ github.sha }}
      run: python3 .github/scripts/verify-exact-required-gate.py

    - name: Verify stable-v1 is ready for versioned publication
      if: needs.prepare.outputs.is_versioned == 'true'
      shell: bash
      run: python3 tools/site-data/validate.py --require-ready

    # Counters are repository-global/default-branch state, not tag state. A
    # separate checkout keeps release tags immutable and preserves the exact
    # source checkout used by the release metadata below.
    - name: Checkout canonical badge branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: Working
        path: badge-repository
        persist-credentials: false

    - name: Resolve short commit SHA
      id: sha
      run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

    - name: Download all build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: release-assets

    - name: Generate SPDX software bill of materials
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      with:
        path: release-assets
        format: spdx-json
        output-file: SparkEngine.spdx.json
        artifact-name: SparkEngine-SBOM.spdx.json
        upload-artifact: false
        upload-release-assets: false

    - name: Collect release assets
      id: assets
      run: |
        set -euo pipefail
        # Flatten all package artifacts + standalone installer binaries to current directory.
        while IFS= read -r -d '' artifact; do
          name=$(basename "$artifact")
          if [[ -e "$name" ]]; then
            echo "Duplicate release asset name: $name" >&2
            exit 1
          fi
          cp "$artifact" "$name"
        done < <(
          find release-assets -type f \
            \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.exe" -o -name "*.msi" \
               -o -name "SparkInstaller-*" \) -print0
        )

        # Publish version-independent aliases for direct README downloads.
        # Keep the versioned packages alongside them for archival clarity.
        for config in Debug Release; do
          mapfile -t zip_matches < <(compgen -G "SparkEngine-*-Windows-AMD64-${config}.zip" || true)
          mapfile -t installer_matches < <(compgen -G "SparkEngine-*-Windows-AMD64-${config}-Runtime.exe" || true)

          if (( ${#zip_matches[@]} > 1 || ${#installer_matches[@]} > 1 )); then
            echo "Ambiguous Windows ${config} release assets; refusing to publish direct aliases." >&2
            exit 1
          fi

          if (( ${#zip_matches[@]} == 1 )); then
            cp -- "${zip_matches[0]}" "SparkEngine-Windows-x64-${config}.zip"
          fi
          if (( ${#installer_matches[@]} == 1 )); then
            cp -- "${installer_matches[0]}" "SparkEngine-Windows-x64-${config}-Installer.exe"
          fi
        done

        # A rolling release is public only when every README direct-download
        # target is present. This blocks a one-config/manual run or a missing
        # package from publishing a mixed or incomplete nightly.
        if [[ "${{ needs.prepare.outputs.is_versioned }}" == "false" ]]; then
          mapfile -t readme_nightly_assets < <(
            grep -oE 'releases/download/nightly/[^) ]+' README.md \
              | sed 's#^.*/##' \
              | sort -u
          )
          if (( ${#readme_nightly_assets[@]} == 0 )); then
            echo "README declares no nightly direct-download assets." >&2
            exit 1
          fi
          for required_asset in "${readme_nightly_assets[@]}"; do
            if [[ ! -f "$required_asset" ]]; then
              echo "Missing README nightly asset: $required_asset" >&2
              exit 1
            fi
          done
        fi

        FILES=""
        TABLE="| Asset | Size | Notes |"$'\n'"|---|---:|---|"
        : > SHA256SUMS
        while IFS= read -r -d '' artifact; do
          artifact=${artifact#./}

          note="CPack package"
          if [[ "$artifact" == SparkInstaller-* ]]; then
            note="Bootstrap installer (clone + build engine)"
          elif [[ "$artifact" == *.spdx.json ]]; then
            note="SPDX software bill of materials"
          elif [[ "$artifact" == *"-Windows-"* ]]; then
            note="Windows package"
          elif [[ "$artifact" == *"-Linux-"* ]]; then
            note="Linux package"
          fi

          size_bytes=$(stat --format='%s' "$artifact")
          size_human=$(numfmt --to=iec-i --suffix=B "$size_bytes")
          sha256sum "$artifact" >> SHA256SUMS
          FILES="${FILES}${artifact}"$'\n'
          TABLE="${TABLE}"$'\n'"| \`${artifact}\` | ${size_human} | ${note} |"
        done < <(
          find . -maxdepth 1 -type f \
            \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.exe" -o -name "*.msi" \
               -o -name "SparkInstaller-*" -o -name "*.spdx.json" \) -print0 | sort -z
        )

        if [ ! -s SHA256SUMS ]; then
          echo "No release assets were collected; refusing to publish an empty release." >&2
          exit 1
        fi
        sha256sum --check SHA256SUMS
        FILES="${FILES}SHA256SUMS"$'\n'
        TABLE="${TABLE}"$'\n'"| \`SHA256SUMS\` | — | SHA-256 verification manifest |"
        printf '%s' "$FILES" > expected-release-assets.txt
        while IFS= read -r artifact; do
          sha256sum -- "$artifact"
        done < expected-release-assets.txt > expected-release-digests.txt

        {
          echo "### Release artifact statistics"
          echo
          echo "$TABLE"
          echo
          echo 'Every collected artifact passed an immediate `sha256sum --check SHA256SUMS` round trip.'
        } >> "$GITHUB_STEP_SUMMARY"

        # Write multiline outputs
        {
          echo "files<<FILESEOF"
          echo "$FILES"
          echo "FILESEOF"
        } >> "$GITHUB_OUTPUT"

        {
          echo "table<<TABLEEOF"
          echo "$TABLE"
          echo "TABLEEOF"
        } >> "$GITHUB_OUTPUT"

    - name: Inspect existing release before mutation
      id: release-inspect
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        IS_VERSIONED: ${{ needs.prepare.outputs.is_versioned }}
        GITHUB_SHA: ${{ github.sha }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      run: |
        set -euo pipefail
        if test "$(git rev-parse HEAD)" != "$GITHUB_SHA"; then
          echo "Release-source checkout is not the exact workflow commit." >&2
          exit 1
        fi

        python3 "$GITHUB_WORKSPACE/.github/scripts/prepare-download-badges.py" inspect \
          --expected-assets-file "$GITHUB_WORKSPACE/expected-release-assets.txt" \
          --expected-digests-file "$GITHUB_WORKSPACE/expected-release-digests.txt"

    - name: Hide and verify existing nightly release
      if: needs.prepare.outputs.is_versioned == 'false' && steps.release-inspect.outputs.target_exists == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_ID: ${{ steps.release-inspect.outputs.target_release_id }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      run: |
        set -euo pipefail
        if [[ ! "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]; then
          echo "Existing nightly release ID is invalid." >&2
          exit 1
        fi
        if [[ "$RELEASE_TAG" != "nightly" ]]; then
          echo "Refusing to hide non-nightly release: $RELEASE_TAG" >&2
          exit 1
        fi

        VERIFIED_RELEASE="$(mktemp)"
        trap 'rm -f "$VERIFIED_RELEASE"' EXIT
        gh api --method PATCH \
          "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
          -F draft=true >/dev/null
        gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$VERIFIED_RELEASE"
        if ! jq -e \
            --argjson release_id "$RELEASE_ID" \
            --arg release_tag "$RELEASE_TAG" \
            'type == "object" and
             .id == $release_id and
             .tag_name == $release_tag and
             .draft == true' \
            "$VERIFIED_RELEASE" >/dev/null; then
          echo "Existing nightly release was not verifiably hidden; refusing all tag and asset mutation." >&2
          exit 1
        fi

    - name: Prepare durable pending download-counter state
      id: badge-prepare
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        IS_VERSIONED: ${{ needs.prepare.outputs.is_versioned }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        GITHUB_SHA: ${{ github.sha }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      run: |
        set -euo pipefail
        if test "$(git rev-parse HEAD)" != "$GITHUB_SHA"; then
          echo "Release-source checkout is not the exact workflow commit." >&2
          exit 1
        fi

        python3 "$GITHUB_WORKSPACE/.github/scripts/prepare-download-badges.py" prepare \
          --data-file "$GITHUB_WORKSPACE/badge-repository/.github/badges/downloads-data.json" \
          --badge-directory "$GITHUB_WORKSPACE/badge-repository/.github/badges"

    - name: Commit durable pending download-counter state
      id: badge-pending-commit
      working-directory: badge-repository
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
        INITIAL_HEAD="$(git rev-parse HEAD)"
        REMOTE_HEAD="$(git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          ls-remote --exit-code --heads origin refs/heads/Working | awk '{print $1}')"
        if test "$REMOTE_HEAD" != "$INITIAL_HEAD"; then
          echo "Working advanced before pending counter state could be committed; rerun this release." >&2
          exit 1
        fi

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -- \
          .github/badges/downloads-data.json \
          .github/badges/downloads.json \
          .github/badges/installer-downloads.json
        if git diff --cached --quiet; then
          echo "Counter preparation produced no durable pending-state diff; refusing to mutate the release." >&2
          exit 1
        fi

        git commit -s -m "chore: prepare download counters (lifetime: ${{ steps.badge-prepare.outputs.new_total }}, installer: ${{ steps.badge-prepare.outputs.installer_total }}, operation: ${{ steps.badge-prepare.outputs.operation_id }}) [skip ci]"
        PENDING_COMMIT="$(git rev-parse HEAD)"
        git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" push \
          --force-with-lease="refs/heads/Working:${REMOTE_HEAD}" origin \
          "HEAD:refs/heads/Working"

        PUBLISHED_HEAD="$(git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          ls-remote --exit-code --heads origin refs/heads/Working | awk '{print $1}')"
        if test "$PUBLISHED_HEAD" != "$PENDING_COMMIT"; then
          echo "Working does not point to the durable pending commit after push." >&2
          exit 1
        fi
        echo "pending_commit=$PENDING_COMMIT" >> "$GITHUB_OUTPUT"

    - name: Verify compatible existing release assets before publication
      id: release-preflight
      # The inspect/hide sequence above prevents public partial replacement,
      # while the pending ledger commit makes every old asset count recoverable.
      # This second guard proves the snapshotted target did not change and that
      # an existing nightly is still draft before any tag or asset mutation.
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        IS_VERSIONED: ${{ needs.prepare.outputs.is_versioned }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        GITHUB_SHA: ${{ github.sha }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_WORKSPACE/.github/scripts/prepare-download-badges.py" preflight \
          --expected-assets-file "$GITHUB_WORKSPACE/expected-release-assets.txt" \
          --expected-digests-file "$GITHUB_WORKSPACE/expected-release-digests.txt" \
          --data-file "$GITHUB_WORKSPACE/badge-repository/.github/badges/downloads-data.json"

    - name: Determine release title suffix
      id: suffix
      run: |
        BUILD_TYPE="${{ needs.prepare.outputs.build_type }}"
        if [[ "$BUILD_TYPE" == "debug" ]]; then
          echo "label= (Debug)" >> "$GITHUB_OUTPUT"
        elif [[ "$BUILD_TYPE" == "release" ]]; then
          echo "label= (Release)" >> "$GITHUB_OUTPUT"
        else
          echo "label=" >> "$GITHUB_OUTPUT"
        fi

    - name: Bind release tag to workflow commit
      env:
        GH_TOKEN: ${{ github.token }}
        IS_VERSIONED: ${{ needs.prepare.outputs.is_versioned }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        TARGET_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail

        AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
        TARGET_COMMIT="$(git rev-parse "${TARGET_SHA}^{commit}")"
        REMOTE_TAG_OBJECT="$(git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          ls-remote --refs origin "refs/tags/${RELEASE_TAG}" | awk 'NR == 1 { print $1 }')"

        if [[ "$IS_VERSIONED" == "true" ]]; then
          if [[ -n "$REMOTE_TAG_OBJECT" ]]; then
            git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
              fetch --force --no-tags origin \
              "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          else
            # A manual versioned release may introduce a new immutable tag.
            # A normal push fails if another writer creates it between the
            # remote lookup and this push; stable tags are never force-moved.
            git tag "$RELEASE_TAG" "$TARGET_COMMIT"
            git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" push origin \
              "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          fi
        else
          if [[ "$RELEASE_TAG" != "nightly" ]]; then
            echo "Refusing to force-move non-nightly tag: $RELEASE_TAG" >&2
            exit 1
          fi

          git tag --force nightly "$TARGET_COMMIT"
          git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" push \
            --force-with-lease="refs/tags/nightly:${REMOTE_TAG_OBJECT}" origin \
            "refs/tags/nightly:refs/tags/nightly"
        fi

        # Re-read the remote ref after any create/move and prove the tag peels
        # to the exact commit whose artifacts this workflow built.
        git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          fetch --force --no-tags origin \
          "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
        BOUND_COMMIT="$(git rev-parse "${RELEASE_TAG}^{commit}")"
        if [[ "$BOUND_COMMIT" != "$TARGET_COMMIT" ]]; then
          echo "Release tag ${RELEASE_TAG} resolves to ${BOUND_COMMIT}, expected ${TARGET_COMMIT}." >&2
          exit 1
        fi
        echo "Release tag ${RELEASE_TAG} is bound to ${BOUND_COMMIT}."

    - name: Attest release build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: ${{ steps.assets.outputs.files }}

    - name: Reverify frozen asset counts immediately before staging
      id: release-freeze
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        IS_VERSIONED: ${{ needs.prepare.outputs.is_versioned }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        GITHUB_SHA: ${{ github.sha }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_WORKSPACE/.github/scripts/prepare-download-badges.py" preflight \
          --expected-assets-file "$GITHUB_WORKSPACE/expected-release-assets.txt" \
          --expected-digests-file "$GITHUB_WORKSPACE/expected-release-digests.txt" \
          --data-file "$GITHUB_WORKSPACE/badge-repository/.github/badges/downloads-data.json"

    - name: Stage new or interrupted stable versioned release as draft
      id: stable-stage
      if: needs.prepare.outputs.is_versioned == 'true' && (steps.release-freeze.outputs.target_exists != 'true' || steps.release-freeze.outputs.target_is_draft == 'true')
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      with:
        tag_name: ${{ needs.prepare.outputs.tag }}
        target_commitish: ${{ github.sha }}
        name: "SparkEngine ${{ needs.prepare.outputs.version }} (Stable)${{ steps.suffix.outputs.label }}"
        body: |
          ## SparkEngine ${{ needs.prepare.outputs.version }} — Stable Release${{ steps.suffix.outputs.label }}

          Built from commit [`${{ steps.sha.outputs.short }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
          Built on: ${{ github.run_started_at }}

          > **Stable releases** are manually published and thoroughly tested. For the latest development builds, see the [nightly release](https://github.com/${{ github.repository }}/releases/tag/nightly).

          ### Downloads

          ${{ steps.assets.outputs.table }}
        prerelease: false
        draft: true
        make_latest: false
        fail_on_unmatched_files: true
        overwrite_files: false
        files: ${{ steps.assets.outputs.files }}

    - name: Stage nightly rolling release as draft
      id: nightly-stage
      if: needs.prepare.outputs.is_versioned == 'false'
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      with:
        tag_name: nightly
        target_commitish: ${{ github.sha }}
        name: "Nightly Build (${{ steps.sha.outputs.short }})${{ steps.suffix.outputs.label }}"
        body: |
          ## Nightly Build${{ steps.suffix.outputs.label }}

          Built from commit [`${{ steps.sha.outputs.short }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
          Built on: ${{ github.run_started_at }}
          Branch: `${{ github.ref_name }}`

          > **Nightly builds** are published automatically on every commit. All CI checks pass before publishing. For a stable, manually-verified release see the [latest stable release](https://github.com/${{ github.repository }}/releases/latest).

          ${{ steps.assets.outputs.table }}
        prerelease: false
        draft: true
        make_latest: false
        fail_on_unmatched_files: true
        overwrite_files: true
        files: ${{ steps.assets.outputs.files }}

    - name: Checkpoint staged release download counters
      id: badge-stage
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        IS_VERSIONED: ${{ needs.prepare.outputs.is_versioned }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        GITHUB_SHA: ${{ github.sha }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      run: |
        set -euo pipefail
        if test "$(git rev-parse HEAD)" != "$GITHUB_SHA"; then
          echo "Release-source checkout is not the exact workflow commit." >&2
          exit 1
        fi

        for attempt in 1 2 3 4 5 6; do
          if python3 "$GITHUB_WORKSPACE/.github/scripts/prepare-download-badges.py" stage \
            --expected-assets-file "$GITHUB_WORKSPACE/expected-release-assets.txt" \
            --expected-digests-file "$GITHUB_WORKSPACE/expected-release-digests.txt" \
            --data-file "$GITHUB_WORKSPACE/badge-repository/.github/badges/downloads-data.json"; then
            exit 0
          fi
          if test "$attempt" -eq 6; then
            echo "Staged release did not converge to the exact expected asset set and digests." >&2
            exit 1
          fi
          echo "Staged assets are not yet consistent (attempt ${attempt}/6); retrying."
          sleep "$((attempt * 3))"
        done

    - name: Commit staged download-counter checkpoint
      id: badge-staged-commit
      working-directory: badge-repository
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
        EXPECTED_PENDING="${{ steps.badge-pending-commit.outputs.pending_commit }}"
        LOCAL_PENDING="$(git rev-parse HEAD)"
        if test "$LOCAL_PENDING" != "$EXPECTED_PENDING"; then
          echo "Badge checkout no longer points to this run's pending commit." >&2
          exit 1
        fi

        REMOTE_HEAD="$(git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          ls-remote --exit-code --heads origin refs/heads/Working | awk '{print $1}')"
        if test "$REMOTE_HEAD" != "$EXPECTED_PENDING"; then
          echo "Working advanced after the pending counter commit; refusing to checkpoint stale state." >&2
          exit 1
        fi

        git add -- .github/badges/downloads-data.json
        if git diff --cached --quiet; then
          echo "Counter staging produced no durable staged-state diff." >&2
          exit 1
        fi

        git commit -s -m "chore: checkpoint staged download counters (lifetime: ${{ steps.badge-stage.outputs.new_total }}, installer: ${{ steps.badge-stage.outputs.installer_total }}) [skip ci]"
        STAGED_COMMIT="$(git rev-parse HEAD)"
        git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" push \
          --force-with-lease="refs/heads/Working:${EXPECTED_PENDING}" origin \
          "HEAD:refs/heads/Working"

        PUBLISHED_HEAD="$(git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          ls-remote --exit-code --heads origin refs/heads/Working | awk '{print $1}')"
        if test "$PUBLISHED_HEAD" != "$STAGED_COMMIT"; then
          echo "Working does not point to the staged counter checkpoint after push." >&2
          exit 1
        fi
        echo "staged_commit=$STAGED_COMMIT" >> "$GITHUB_OUTPUT"

    - name: Verify release tag immediately before publication
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        TARGET_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
        TARGET_COMMIT="$(git rev-parse "${TARGET_SHA}^{commit}")"
        git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          fetch --force --no-tags origin \
          "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
        REMOTE_COMMIT="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
        if [[ "$REMOTE_COMMIT" != "$TARGET_COMMIT" ]]; then
          echo "Release tag ${RELEASE_TAG} drifted to ${REMOTE_COMMIT} before publication; expected ${TARGET_COMMIT}." >&2
          exit 1
        fi

    - name: Publish complete stable versioned release
      if: needs.prepare.outputs.is_versioned == 'true' && (steps.release-freeze.outputs.target_exists != 'true' || steps.release-freeze.outputs.target_is_draft == 'true')
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_ID: ${{ steps.stable-stage.outputs.id || steps.release-freeze.outputs.target_release_id }}
      run: |
        set -euo pipefail
        test -n "$RELEASE_ID"
        gh api --method PATCH \
          "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
          -F draft=false \
          -f make_latest=true >/dev/null

    - name: Publish complete nightly rolling release
      if: needs.prepare.outputs.is_versioned == 'false'
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_ID: ${{ steps.nightly-stage.outputs.id }}
      run: |
        set -euo pipefail
        test -n "$RELEASE_ID"
        gh api --method PATCH \
          "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
          -F draft=false \
          -f make_latest=false >/dev/null

    - name: Verify release tag immediately after publication
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        TARGET_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
        TARGET_COMMIT="$(git rev-parse "${TARGET_SHA}^{commit}")"
        git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          fetch --force --no-tags origin \
          "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
        REMOTE_COMMIT="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
        if [[ "$REMOTE_COMMIT" != "$TARGET_COMMIT" ]]; then
          echo "Release tag ${RELEASE_TAG} drifted to ${REMOTE_COMMIT} after publication; expected ${TARGET_COMMIT}." >&2
          exit 1
        fi

    - name: Complete published release and download counters
      id: badge-complete
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        IS_VERSIONED: ${{ needs.prepare.outputs.is_versioned }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        GITHUB_SHA: ${{ github.sha }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      run: |
        set -euo pipefail
        for attempt in 1 2 3 4 5 6; do
          if python3 "$GITHUB_WORKSPACE/.github/scripts/prepare-download-badges.py" complete \
            --expected-assets-file "$GITHUB_WORKSPACE/expected-release-assets.txt" \
            --expected-digests-file "$GITHUB_WORKSPACE/expected-release-digests.txt" \
            --data-file "$GITHUB_WORKSPACE/badge-repository/.github/badges/downloads-data.json" \
            --badge-directory "$GITHUB_WORKSPACE/badge-repository/.github/badges"; then
            exit 0
          fi
          if test "$attempt" -eq 6; then
            echo "Published release did not converge to the exact expected state." >&2
            exit 1
          fi
          echo "Published state is not yet consistent (attempt ${attempt}/6); retrying."
          sleep "$((attempt * 3))"
        done

    - name: Commit completed download-counter state
      id: badge-final-commit
      working-directory: badge-repository
      env:
        GH_TOKEN: ${{ github.token }}
        IS_VERSIONED: ${{ needs.prepare.outputs.is_versioned }}
      run: |
        set -euo pipefail
        AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
        EXPECTED_STAGED="${{ steps.badge-staged-commit.outputs.staged_commit }}"
        LOCAL_STAGED="$(git rev-parse HEAD)"
        if test "$LOCAL_STAGED" != "$EXPECTED_STAGED"; then
          echo "Badge checkout no longer points to this run's staged checkpoint." >&2
          exit 1
        fi

        REMOTE_HEAD="$(git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          ls-remote --exit-code --heads origin refs/heads/Working | awk '{print $1}')"
        if test "$REMOTE_HEAD" != "$EXPECTED_STAGED"; then
          echo "Working advanced after the staged counter checkpoint; refusing to commit stale completed state." >&2
          exit 1
        fi

        if [[ "$IS_VERSIONED" == "true" ]]; then
          TARGET_BADGE=.github/badges/stable-downloads.json
        else
          TARGET_BADGE=.github/badges/nightly-downloads.json
        fi
        git add -- \
          .github/badges/downloads-data.json \
          .github/badges/downloads.json \
          .github/badges/installer-downloads.json \
          "$TARGET_BADGE"
        if git diff --cached --quiet; then
          echo "Counter completion produced no completed-state diff." >&2
          exit 1
        fi

        git commit -s -m "chore: complete download counters (lifetime: ${{ steps.badge-complete.outputs.new_total }}, installer: ${{ steps.badge-complete.outputs.installer_total }}) [skip ci]"
        FINAL_COMMIT="$(git rev-parse HEAD)"
        git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" push \
          --force-with-lease="refs/heads/Working:${EXPECTED_STAGED}" origin \
          "HEAD:refs/heads/Working"

        PUBLISHED_HEAD="$(git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          ls-remote --exit-code --heads origin refs/heads/Working | awk '{print $1}')"
        if test "$PUBLISHED_HEAD" != "$FINAL_COMMIT"; then
          echo "Working does not point to the completed counter commit after push." >&2
          exit 1
        fi
        echo "changed=true" >> "$GITHUB_OUTPUT"
        echo "final_commit=$FINAL_COMMIT" >> "$GITHUB_OUTPUT"

    # GITHUB_TOKEN pushes do not trigger ordinary push workflows, so explicitly
    # prove and publish the generated Working head.
    - name: Dispatch exact-head build after Working badge commit
      if: steps.badge-final-commit.outputs.changed == 'true'
      working-directory: badge-repository
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
        FINAL_COMMIT="${{ steps.badge-final-commit.outputs.final_commit }}"
        if test "$(git rev-parse HEAD)" != "$FINAL_COMMIT"; then
          echo "Badge checkout no longer points to this run's finalized commit." >&2
          exit 1
        fi
        REMOTE_HEAD="$(git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          ls-remote --exit-code --heads origin refs/heads/Working | awk '{print $1}')"
        if test "$REMOTE_HEAD" != "$FINAL_COMMIT"; then
          echo "Working advanced after this counter push; the newer head owns the build."
          exit 0
        fi
        for attempt in 1 2 3 4 5; do
          if gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref Working; then
            exit 0
          fi
          test "$attempt" -lt 5 || exit 1
          sleep "$((attempt * 2))"
        done
