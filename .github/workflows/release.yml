name: Publish Builds

on:
  push:
    branches: [ 'release/**' ]
    tags: [ 'v*' ]
  schedule:
    # Nightly at 04:00 UTC — after the day's merges settle
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0). Leave empty for rolling "latest" release.'
        required: false
        type: string
      build_configs:
        description: 'Which build configurations to publish'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - release
          - debug

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Compute release metadata and build matrix shared by all jobs
  # ===========================================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      cmake_version: ${{ steps.meta.outputs.cmake_version }}
      tag: ${{ steps.meta.outputs.tag }}
      is_versioned: ${{ steps.meta.outputs.is_versioned }}
      configs: ${{ steps.matrix.outputs.configs }}
      build_type: ${{ steps.matrix.outputs.build_type }}
    steps:
    - name: Checkout release metadata source
      uses: actions/checkout@v7.0.1

    - name: Compute release metadata
      id: meta
      env:
        EVENT_NAME: ${{ github.event_name }}
        INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        REF_NAME: ${{ github.ref_name }}
        REF_TYPE: ${{ github.ref_type }}
      run: |
        set -euo pipefail
        DEFAULT_VERSION=$(sed -nE 's/^set\(SPARK_ENGINE_VERSION "([0-9]+\.[0-9]+\.[0-9]+)" CACHE.*/\1/p' CMakeLists.txt | head -n 1)
        if [[ ! "$DEFAULT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Could not determine the default semantic version from CMakeLists.txt" >&2
          exit 1
        fi

        if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_RELEASE_TAG" ]]; then
          TAG="$INPUT_RELEASE_TAG"
        elif [[ "$REF_TYPE" == "tag" ]]; then
          TAG="$REF_NAME"
        else
          TAG=""
        fi

        if [[ -n "$TAG" ]]; then
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must have the form vMAJOR.MINOR.PATCH; got: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "cmake_version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "is_versioned=true" >> "$GITHUB_OUTPUT"
        else
          echo "tag=nightly" >> "$GITHUB_OUTPUT"
          echo "version=nightly" >> "$GITHUB_OUTPUT"
          echo "cmake_version=$DEFAULT_VERSION" >> "$GITHUB_OUTPUT"
          echo "is_versioned=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Determine build configurations
      id: matrix
      env:
        EVENT_NAME: ${{ github.event_name }}
        REQUESTED_CONFIGS: ${{ inputs.build_configs || 'both' }}
      run: |
        # Scheduled nightlies publish both configurations so the README's
        # rolling Debug and Release download links always identify assets from
        # the same exact source revision. Tags and manual runs retain the
        # explicit Debug/Release choice.
        if [[ "$EVENT_NAME" == "schedule" ]]; then
          BUILD_CONFIGS="both"
        else
          BUILD_CONFIGS="$REQUESTED_CONFIGS"
        fi
        echo "build_type=$BUILD_CONFIGS" >> "$GITHUB_OUTPUT"

        if [[ "$BUILD_CONFIGS" == "both" ]]; then
          echo 'configs=["Debug","Release"]' >> "$GITHUB_OUTPUT"
        elif [[ "$BUILD_CONFIGS" == "release" ]]; then
          echo 'configs=["Release"]' >> "$GITHUB_OUTPUT"
        else
          echo 'configs=["Debug"]' >> "$GITHUB_OUTPUT"
        fi

  # ===========================================================================
  # Windows Build — MSVC VS 2022
  # ===========================================================================
  build-windows:
    needs: [prepare]
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.prepare.outputs.configs) }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        submodules: recursive

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v3

    - name: Configure CMake
      run: cmake -B build -G "Visual Studio 17 2022" -A x64 -T v143 -DBUILD_TESTS=ON -DSPARK_STRICT_DEPS=ON -DSPARK_ENGINE_VERSION="${{ needs.prepare.outputs.cmake_version }}" -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/stage"

    - name: Build
      run: cmake --build build --config ${{ matrix.config }} --parallel

    - name: Run Tests
      run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

    - name: Validate external package consumption
      shell: pwsh
      run: |
        cmake --install build --config ${{ matrix.config }}
        cmake -S Tests/PackageSmoke -B smoke-build -G "Visual Studio 17 2022" -A x64 -T v143 `
          -DSparkEngine_DIR="${{ github.workspace }}/stage/lib/cmake/SparkEngine" `
          -DSPARK_EXPECTED_ENGINE_VERSION="${{ needs.prepare.outputs.cmake_version }}"
        cmake --build smoke-build --config ${{ matrix.config }} --parallel
        ctest --test-dir smoke-build -C ${{ matrix.config }} --output-on-failure

    - name: Build every template against the installed SDK
      shell: pwsh
      run: |
        cmake `
          -DSPARK_TEMPLATE_ROOT="${{ github.workspace }}/stage/share/SparkEngine/templates" `
          -DSPARK_TEMPLATE_SOURCE_ROOT="${{ github.workspace }}/Templates" `
          -DSPARK_TEMPLATE_BUILD_ROOT="${{ github.workspace }}/template-smoke-build" `
          -DSPARK_ENGINE_DIR="${{ github.workspace }}/stage/lib/cmake/SparkEngine" `
          -DSPARK_ENGINE_EXECUTABLE="${{ github.workspace }}/stage/bin/SparkEngine.exe" `
          -DSPARK_TEMPLATE_CONFIG=${{ matrix.config }} `
          "-DSPARK_CMAKE_GENERATOR=Visual Studio 17 2022" `
          -DSPARK_CMAKE_GENERATOR_PLATFORM=x64 `
          -DSPARK_CMAKE_GENERATOR_TOOLSET=v143 `
          -P cmake/VerifyInstalledTemplates.cmake

    - name: Validate staged package executable BOM
      shell: pwsh
      run: |
        cmake `
          -DSPARK_PACKAGE_ROOT="${{ github.workspace }}/stage" `
          -DSPARK_EXECUTABLE_SUFFIX=.exe `
          -P cmake/ValidateStagedPackageExecutables.cmake

    - name: Generate CPack packages
      shell: pwsh
      run: |
        cpack --config build/CPackConfig.cmake -C ${{ matrix.config }} -B build/packages
        $cpackExitCode = $LASTEXITCODE
        if ($cpackExitCode -ne 0) {
          Get-ChildItem build/packages/_CPack_Packages -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -in @('NSISOutput.log', 'wix.log') } |
            ForEach-Object {
              Write-Error "CPack diagnostic: $($_.FullName)" -ErrorAction Continue
              Get-Content -LiteralPath $_.FullName
            }
          exit $cpackExitCode
        }

    - name: Extract and smoke-test portable package
      shell: pwsh
      run: |
        $archives = @(Get-ChildItem -LiteralPath build/packages -Filter *.zip -File)
        if ($archives.Count -ne 1) {
          throw "Expected exactly one portable ZIP package; found $($archives.Count)"
        }
        Remove-Item -LiteralPath build/packages/_CPack_Packages -Recurse -Force -ErrorAction SilentlyContinue
        $extractRoot = Join-Path "${{ github.workspace }}" "package-extract"
        New-Item -ItemType Directory -Force -Path $extractRoot | Out-Null
        Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $extractRoot
        if (Test-Path (Join-Path $extractRoot "bin")) {
          $packageRoot = $extractRoot
        } else {
          $roots = @(Get-ChildItem -LiteralPath $extractRoot -Directory)
          if ($roots.Count -ne 1) {
            throw "Portable ZIP must contain one package root; found $($roots.Count)"
          }
          $packageRoot = $roots[0].FullName
        }
        cmake -DSPARK_PACKAGE_ROOT="$packageRoot" -DSPARK_EXECUTABLE_SUFFIX=.exe -P cmake/ValidateStagedPackageExecutables.cmake
        cmake -S Tests/PackageSmoke -B package-smoke-build -G "Visual Studio 17 2022" -A x64 -T v143 -DSparkEngine_DIR="$packageRoot/lib/cmake/SparkEngine" -DSPARK_EXPECTED_ENGINE_VERSION="${{ needs.prepare.outputs.cmake_version }}"
        cmake --build package-smoke-build --config ${{ matrix.config }} --parallel
        ctest --test-dir package-smoke-build -C ${{ matrix.config }} --output-on-failure

    - name: Upload CPack failure diagnostics
      if: failure()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: SparkEngine-Windows-${{ matrix.config }}-cpack-diagnostics
        path: |
          build/packages/_CPack_Packages/**/NSISOutput.log
          build/packages/_CPack_Packages/**/wix.log
        if-no-files-found: ignore
        retention-days: 7

    - name: Upload packaged artifact
      uses: actions/upload-artifact@v7.0.1
      with:
        name: SparkEngine-Windows-${{ matrix.config }}-packages
        path: |
          build/packages/*.zip
          build/packages/*.exe
          build/packages/*.msi
        retention-days: 7
        if-no-files-found: error

  # ===========================================================================
  # Linux Build — GCC
  # ===========================================================================
  build-linux:
    needs: [prepare]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.prepare.outputs.configs) }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-14 g++-14 cmake libgl-dev libvulkan-dev libsdl2-dev libfreetype-dev mesa-vulkan-drivers

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DBUILD_TESTS=ON \
          -DSPARK_STRICT_DEPS=ON \
          -DSPARK_ENGINE_VERSION="${{ needs.prepare.outputs.cmake_version }}" \
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/stage" \
          -DCMAKE_C_COMPILER=gcc-14 \
          -DCMAKE_CXX_COMPILER=g++-14

    - name: Build
      run: cmake --build build --parallel $(nproc)

    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure
        if [ -f bin/SparkTests ]; then ./bin/SparkTests; fi

    - name: Validate external package consumption
      run: |
        cmake --install build
        cmake -S Tests/PackageSmoke -B smoke-build \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DCMAKE_C_COMPILER=gcc-14 \
          -DCMAKE_CXX_COMPILER=g++-14 \
          -DSparkEngine_DIR="${{ github.workspace }}/stage/lib/cmake/SparkEngine" \
          -DSPARK_EXPECTED_ENGINE_VERSION="${{ needs.prepare.outputs.cmake_version }}"
        cmake --build smoke-build --parallel $(nproc)
        ctest --test-dir smoke-build --output-on-failure

    - name: Build every template against the installed SDK
      run: |
        cmake \
          -DSPARK_TEMPLATE_ROOT="${{ github.workspace }}/stage/share/SparkEngine/templates" \
          -DSPARK_TEMPLATE_SOURCE_ROOT="${{ github.workspace }}/Templates" \
          -DSPARK_TEMPLATE_BUILD_ROOT="${{ github.workspace }}/template-smoke-build" \
          -DSPARK_ENGINE_DIR="${{ github.workspace }}/stage/lib/cmake/SparkEngine" \
          -DSPARK_ENGINE_EXECUTABLE="${{ github.workspace }}/stage/bin/SparkEngine" \
          -DSPARK_TEMPLATE_CONFIG=${{ matrix.config }} \
          "-DSPARK_CMAKE_GENERATOR=Unix Makefiles" \
          -DSPARK_C_COMPILER=gcc-14 \
          -DSPARK_CXX_COMPILER=g++-14 \
          -P cmake/VerifyInstalledTemplates.cmake

    - name: Validate staged package executable BOM
      run: |
        cmake \
          -DSPARK_PACKAGE_ROOT="${{ github.workspace }}/stage" \
          -P cmake/ValidateStagedPackageExecutables.cmake

    - name: Generate CPack packages
      run: |
        cpack --config build/CPackConfig.cmake -C ${{ matrix.config }} -B build/packages

    - name: Extract and smoke-test portable package
      run: |
        archive_count=$(find build/packages -maxdepth 1 -type f -name '*.tar.gz' | wc -l)
        if [ "$archive_count" -ne 1 ]; then
          echo "Expected exactly one portable TGZ package; found $archive_count" >&2
          exit 1
        fi
        archive=$(find build/packages -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
        rm -rf build/packages/_CPack_Packages
        mkdir package-extract
        tar -xzf "$archive" -C package-extract
        if [ -d package-extract/bin ]; then
          package_root="$(pwd)/package-extract"
        else
          root_count=$(find package-extract -mindepth 1 -maxdepth 1 -type d | wc -l)
          if [ "$root_count" -ne 1 ]; then
            echo "Portable TGZ must contain one package root; found $root_count" >&2
            exit 1
          fi
          package_root=$(find package-extract -mindepth 1 -maxdepth 1 -type d -print -quit)
        fi
        cmake -DSPARK_PACKAGE_ROOT="$package_root" -P cmake/ValidateStagedPackageExecutables.cmake
        cmake -S Tests/PackageSmoke -B package-smoke-build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 -DSparkEngine_DIR="$package_root/lib/cmake/SparkEngine" -DSPARK_EXPECTED_ENGINE_VERSION="${{ needs.prepare.outputs.cmake_version }}"
        cmake --build package-smoke-build --parallel $(nproc)
        ctest --test-dir package-smoke-build --output-on-failure

    - name: Upload packaged artifact
      uses: actions/upload-artifact@v7.0.1
      with:
        name: SparkEngine-Linux-${{ matrix.config }}-packages
        path: |
          build/packages/*.zip
          build/packages/*.tar.gz
        retention-days: 7
        if-no-files-found: error

  # ===========================================================================
  # macOS Build — Apple Clang, installed SDK, templates, and CPack
  # ===========================================================================
  build-macos:
    needs: [prepare]
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.prepare.outputs.configs) }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        brew update
        brew install cmake sdl2 openal-soft

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DBUILD_TESTS=ON \
          -DSPARK_STRICT_DEPS=ON \
          -DENABLE_LTO=OFF \
          -DENABLE_SDL2=ON \
          -DENABLE_VULKAN=OFF \
          -DENABLE_OPENGL=ON \
          -DENABLE_METAL=OFF \
          -DENABLE_DXR=OFF \
          -DSPARK_ENGINE_VERSION="${{ needs.prepare.outputs.cmake_version }}" \
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/stage" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3

    - name: Build
      run: cmake --build build --parallel $(sysctl -n hw.logicalcpu)

    - name: Run Tests
      run: ctest --test-dir build --output-on-failure

    - name: Validate external package consumption
      run: |
        cmake --install build
        cmake -S Tests/PackageSmoke -B smoke-build \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DSparkEngine_DIR="${{ github.workspace }}/stage/lib/cmake/SparkEngine" \
          -DSPARK_EXPECTED_ENGINE_VERSION="${{ needs.prepare.outputs.cmake_version }}"
        cmake --build smoke-build --parallel $(sysctl -n hw.logicalcpu)
        ctest --test-dir smoke-build --output-on-failure

    - name: Build every template against the installed SDK
      run: |
        cmake \
          -DSPARK_TEMPLATE_ROOT="${{ github.workspace }}/stage/share/SparkEngine/templates" \
          -DSPARK_TEMPLATE_SOURCE_ROOT="${{ github.workspace }}/Templates" \
          -DSPARK_TEMPLATE_BUILD_ROOT="${{ github.workspace }}/template-smoke-build" \
          -DSPARK_ENGINE_DIR="${{ github.workspace }}/stage/lib/cmake/SparkEngine" \
          -DSPARK_ENGINE_EXECUTABLE="${{ github.workspace }}/stage/bin/SparkEngine" \
          -DSPARK_TEMPLATE_CONFIG=${{ matrix.config }} \
          "-DSPARK_CMAKE_GENERATOR=Unix Makefiles" \
          -P cmake/VerifyInstalledTemplates.cmake

    - name: Validate staged package executable BOM
      run: |
        cmake \
          -DSPARK_PACKAGE_ROOT="${{ github.workspace }}/stage" \
          -P cmake/ValidateStagedPackageExecutables.cmake

    - name: Generate CPack packages
      run: cpack --config build/CPackConfig.cmake -C ${{ matrix.config }} -B build/packages

    - name: Extract and smoke-test portable package
      run: |
        archive_count=$(find build/packages -maxdepth 1 -type f -name '*.tar.gz' | wc -l)
        if [ "$archive_count" -ne 1 ]; then
          echo "Expected exactly one portable TGZ package; found $archive_count" >&2
          exit 1
        fi
        archive=$(find build/packages -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
        rm -rf build/packages/_CPack_Packages
        mkdir package-extract
        tar -xzf "$archive" -C package-extract
        if [ -d package-extract/bin ]; then
          package_root="$(pwd)/package-extract"
        else
          root_count=$(find package-extract -mindepth 1 -maxdepth 1 -type d | wc -l)
          if [ "$root_count" -ne 1 ]; then
            echo "Portable TGZ must contain one package root; found $root_count" >&2
            exit 1
          fi
          package_root=$(find package-extract -mindepth 1 -maxdepth 1 -type d -print -quit)
        fi
        cmake -DSPARK_PACKAGE_ROOT="$package_root" -P cmake/ValidateStagedPackageExecutables.cmake
        cmake -S Tests/PackageSmoke -B package-smoke-build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DSparkEngine_DIR="$package_root/lib/cmake/SparkEngine" -DSPARK_EXPECTED_ENGINE_VERSION="${{ needs.prepare.outputs.cmake_version }}"
        cmake --build package-smoke-build --parallel $(sysctl -n hw.logicalcpu)
        ctest --test-dir package-smoke-build --output-on-failure

    - name: Upload packaged artifact
      uses: actions/upload-artifact@v7.0.1
      with:
        name: SparkEngine-macOS-${{ matrix.config }}-packages
        path: |
          build/packages/*.zip
          build/packages/*.tar.gz
        retention-days: 7
        if-no-files-found: error

  # ===========================================================================
  # SparkInstaller — standalone bootstrap binary for the README "Install" buttons
  # ===========================================================================
  build-installer:
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact_name: SparkInstaller-Linux-x64
            bin_name: SparkInstaller
          - os: windows-latest
            artifact_name: SparkInstaller-Windows-x64.exe
            bin_name: SparkInstaller.exe
          - os: macos-latest
            artifact_name: SparkInstaller-macOS-arm64
            bin_name: SparkInstaller
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Configure SparkBuild + SparkInstaller (standalone)
        shell: bash
        run: |
          mkdir -p build-installer
          cat > build-installer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          project(SparkInstallerCombo LANGUAGES CXX)
          include(CTest)
          add_subdirectory(${CMAKE_SOURCE_DIR}/../SparkBuild SparkBuild)
          add_subdirectory(${CMAKE_SOURCE_DIR}/../SparkInstaller SparkInstaller)
          EOF
          cmake -S build-installer -B build-installer/build \
                -DCMAKE_BUILD_TYPE=Release \
                -DSPARKINSTALLER_ENABLE_GUI=OFF \
                -DSPARKINSTALLER_BUILD_TESTS=ON

      - name: Build SparkInstaller and registered contract tests
        shell: bash
        run: >-
          cmake --build build-installer/build --config Release --target
          SparkInstaller
          SparkInstallerGitTests
          SparkBuildProcessRunnerTests
          SparkBuildDownloaderTests
          -j

      - name: Run installer dependency contract tests
        shell: bash
        run: ctest --test-dir build-installer/build -C Release --output-on-failure --no-tests=error

      - name: Stage artifact with release-ready name
        shell: bash
        run: |
          mkdir -p staging
          cp "build-installer/build/bin/${{ matrix.bin_name }}" "staging/${{ matrix.artifact_name }}"

      - name: Launch staged executable
        shell: bash
        run: |
          "./staging/${{ matrix.artifact_name }}" --version | tee installer-version.txt
          "./staging/${{ matrix.artifact_name }}" --help | tee installer-help.txt
          grep -Fq "SparkInstaller" installer-version.txt
          grep -Fq "Usage:" installer-help.txt

      - name: Upload installer binary
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: staging/${{ matrix.artifact_name }}
          retention-days: 7

  # ===========================================================================
  # Publish GitHub Release (versioned or rolling "latest")
  # ===========================================================================
  release:
    needs: [prepare, build-windows, build-linux, build-macos, build-installer]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      attestations: write
      contents: write
      id-token: write
    concurrency:
      group: sparkengine-publication-global
      cancel-in-progress: false

    steps:
    - name: Checkout release source
      uses: actions/checkout@v7.0.1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0

    - name: Verify exact source commit passed Required CI Gate
      id: required-ci
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET_SHA: ${{ github.sha }}
      run: python3 .github/scripts/verify-exact-required-gate.py

    # Counters are repository-global/default-branch state, not tag state. A
    # separate checkout keeps release tags immutable and preserves the exact
    # source checkout used by the release metadata below.
    - name: Checkout canonical badge branch
      uses: actions/checkout@v7.0.1
      with:
        ref: Working
        path: badge-repository

    - name: Snapshot download counts and prepare badges
      id: badge-prepare
      working-directory: badge-repository
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p .github/badges
        DATA_FILE=".github/badges/downloads-data.json"
        LIFETIME_BADGE=".github/badges/downloads.json"
        NIGHTLY_BADGE=".github/badges/nightly-downloads.json"
        STABLE_BADGE=".github/badges/stable-downloads.json"

        # Persist only counts that GitHub will erase when the rolling nightly
        # assets are replaced. Stable assets remain queryable forever and are
        # summed live below, including downloads of older stable releases.
        if [ -f "$DATA_FILE" ]; then
          # Legacy data stored retired rolling-release snapshots in .total.
          ARCHIVED_NIGHTLY=$(jq -r '.archivedNightly // .total // 0' "$DATA_FILE")
          ARCHIVED_NIGHTLY_INSTALLERS=$(jq -r '.archivedNightlyInstallers // 0' "$DATA_FILE")
          LAST_SNAPSHOT_RUN_ID=$(jq -r '.snapshotRunId // ""' "$DATA_FILE")
        else
          ARCHIVED_NIGHTLY=0
          ARCHIVED_NIGHTLY_INSTALLERS=0
          LAST_SNAPSHOT_RUN_ID=""
        fi
        [[ "$ARCHIVED_NIGHTLY" =~ ^[0-9]+$ ]] || ARCHIVED_NIGHTLY=0
        [[ "$ARCHIVED_NIGHTLY_INSTALLERS" =~ ^[0-9]+$ ]] || ARCHIVED_NIGHTLY_INSTALLERS=0
        echo "Archived nightly downloads: $ARCHIVED_NIGHTLY"

        if [[ "${{ needs.prepare.outputs.is_versioned }}" == "false" ]]; then
          # Snapshot the rolling release before its assets and their GitHub
          # download counters are replaced.
          if NIGHTLY_DL=$(gh api repos/${{ github.repository }}/releases/tags/nightly \
            --jq '[.assets[].download_count] | add // 0' 2>/dev/null); then
            :
          else
            NIGHTLY_DL=0
          fi
          [[ "$NIGHTLY_DL" =~ ^[0-9]+$ ]] || NIGHTLY_DL=0
          if NIGHTLY_INSTALLER_DL=$(gh api repos/${{ github.repository }}/releases/tags/nightly \
            --jq '[.assets[] | select(.name | startswith("SparkInstaller-") or endswith("-Installer.exe") or endswith("-Runtime.exe")) | .download_count] | add // 0' \
            2>/dev/null); then
            :
          else
            NIGHTLY_INSTALLER_DL=0
          fi
          [[ "$NIGHTLY_INSTALLER_DL" =~ ^[0-9]+$ ]] || NIGHTLY_INSTALLER_DL=0
          echo "Current nightly downloads before reset: $NIGHTLY_DL"
          if test "$LAST_SNAPSHOT_RUN_ID" != "$GITHUB_RUN_ID"; then
            ARCHIVED_NIGHTLY=$((ARCHIVED_NIGHTLY + NIGHTLY_DL))
            ARCHIVED_NIGHTLY_INSTALLERS=$((ARCHIVED_NIGHTLY_INSTALLERS + NIGHTLY_INSTALLER_DL))
          else
            echo "This workflow run already recorded the nightly snapshot; not counting it twice."
          fi

          # Reset nightly badge to 0 (release is being replaced)
          echo '{
            "schemaVersion": 1,
            "label": "nightly downloads",
            "message": "0",
            "color": "brightgreen",
            "namedLogo": "github",
            "logoColor": "white"
          }' > "$NIGHTLY_BADGE"
        else
          # The latest-release badge is intentionally scoped to the release
          # being superseded. Lifetime totals are computed separately below.
          if STABLE_DL=$(gh api repos/${{ github.repository }}/releases/latest \
            --jq '[.assets[].download_count] | add // 0' 2>/dev/null); then
            :
          else
            STABLE_DL=0
          fi
          [[ "$STABLE_DL" =~ ^[0-9]+$ ]] || STABLE_DL=0
          echo "Current stable downloads before reset: $STABLE_DL"

          # Reset stable badge to 0 (new release is being published)
          echo '{
            "schemaVersion": 1,
            "label": "release downloads",
            "message": "0",
            "color": "blue",
            "namedLogo": "github",
            "logoColor": "white"
          }' > "$STABLE_BADGE"
        fi

        # Sum all still-live release assets. During a nightly replacement the
        # current nightly was just archived above, so exclude it from the live
        # sum to avoid double counting. Versioned releases leave nightly intact.
        if [[ "${{ needs.prepare.outputs.is_versioned }}" == "false" ]]; then
          RELEASE_FILTER='select(.tag_name != "nightly")'
        else
          RELEASE_FILTER='.'
        fi
        if LIVE_RELEASE_TOTAL=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate --slurp \
          --jq "[.[][] | ${RELEASE_FILTER} | .assets[].download_count] | add // 0" 2>/dev/null); then
          :
        else
          LIVE_RELEASE_TOTAL=0
        fi
        [[ "$LIVE_RELEASE_TOTAL" =~ ^[0-9]+$ ]] || LIVE_RELEASE_TOTAL=0
        NEW_TOTAL=$((ARCHIVED_NIGHTLY + LIVE_RELEASE_TOTAL))
        echo "New lifetime total: $NEW_TOTAL"
        FORMATTED=$(printf "%'d" "$NEW_TOTAL" 2>/dev/null || echo "$NEW_TOTAL")

        # Write data file
        printf '{\n    "total": %d,\n    "archivedNightly": %d,\n    "archivedNightlyInstallers": %d,\n    "updated": "%s",\n    "snapshotRunId": "%s"\n}\n' \
          "$NEW_TOTAL" "$ARCHIVED_NIGHTLY" "$ARCHIVED_NIGHTLY_INSTALLERS" \
          "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_RUN_ID" > "$DATA_FILE"

        # Write lifetime badge
        printf '{\n    "schemaVersion": 1,\n    "label": "lifetime downloads",\n    "message": "%s",\n    "color": "brightgreen",\n    "namedLogo": "github",\n    "logoColor": "white"\n}\n' \
          "$FORMATTED" > "$LIFETIME_BADGE"

        # Lifetime installer counter: bootstrap installers plus versioned and
        # direct runtime installers. Retired nightly installer counts are
        # preserved exactly like the all-asset lifetime count above.
        INSTALLER_BADGE=".github/badges/installer-downloads.json"
        if LIVE_INSTALLER_TOTAL=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate --slurp \
          --jq "[.[][] | ${RELEASE_FILTER} | .assets[] | select(.name | startswith(\"SparkInstaller-\") or endswith(\"-Installer.exe\") or endswith(\"-Runtime.exe\")) | .download_count] | add // 0" \
          2>/dev/null); then
          :
        else
          LIVE_INSTALLER_TOTAL=0
        fi
        [[ "$LIVE_INSTALLER_TOTAL" =~ ^[0-9]+$ ]] || LIVE_INSTALLER_TOTAL=0
        INSTALLER_TOTAL=$((ARCHIVED_NIGHTLY_INSTALLERS + LIVE_INSTALLER_TOTAL))
        echo "Installer total downloads: $INSTALLER_TOTAL"
        echo "new_total=$NEW_TOTAL" >> "$GITHUB_OUTPUT"
        echo "installer_total=$INSTALLER_TOTAL" >> "$GITHUB_OUTPUT"
        INSTALLER_FORMATTED=$(printf "%'d" "$INSTALLER_TOTAL" 2>/dev/null || echo "$INSTALLER_TOTAL")
        printf '{\n    "schemaVersion": 1,\n    "label": "installer downloads",\n    "message": "%s",\n    "color": "blueviolet",\n    "namedLogo": "github",\n    "logoColor": "white"\n}\n' \
          "$INSTALLER_FORMATTED" > "$INSTALLER_BADGE"

    - name: Resolve short commit SHA
      id: sha
      run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

    - name: Download all build artifacts
      uses: actions/download-artifact@v8.0.1
      with:
        path: release-assets

    - name: Generate SPDX software bill of materials
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      with:
        path: release-assets
        format: spdx-json
        output-file: SparkEngine.spdx.json
        artifact-name: SparkEngine-SBOM.spdx.json
        upload-artifact: false
        upload-release-assets: false

    - name: Collect release assets
      id: assets
      run: |
        # Flatten all package artifacts + standalone installer binaries to current directory.
        while IFS= read -r -d '' artifact; do
          name=$(basename "$artifact")
          if [[ -e "$name" ]]; then
            echo "Duplicate release asset name: $name" >&2
            exit 1
          fi
          cp "$artifact" "$name"
        done < <(
          find release-assets -type f \
            \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.exe" -o -name "*.msi" \
               -o -name "SparkInstaller-*" \) -print0
        )

        # Publish version-independent aliases for direct README downloads.
        # Keep the versioned packages alongside them for archival clarity.
        for config in Debug Release; do
          mapfile -t zip_matches < <(compgen -G "SparkEngine-*-Windows-AMD64-${config}.zip" || true)
          mapfile -t installer_matches < <(compgen -G "SparkEngine-*-Windows-AMD64-${config}-Runtime.exe" || true)

          if (( ${#zip_matches[@]} > 1 || ${#installer_matches[@]} > 1 )); then
            echo "Ambiguous Windows ${config} release assets; refusing to publish direct aliases." >&2
            exit 1
          fi

          if (( ${#zip_matches[@]} == 1 )); then
            cp -- "${zip_matches[0]}" "SparkEngine-Windows-x64-${config}.zip"
          fi
          if (( ${#installer_matches[@]} == 1 )); then
            cp -- "${installer_matches[0]}" "SparkEngine-Windows-x64-${config}-Installer.exe"
          fi
        done

        FILES=""
        TABLE="| Asset | Size | Notes |"$'\n'"|---|---:|---|"
        : > SHA256SUMS
        while IFS= read -r -d '' artifact; do
          artifact=${artifact#./}

          note="CPack package"
          if [[ "$artifact" == SparkInstaller-* ]]; then
            note="Bootstrap installer (clone + build engine)"
          elif [[ "$artifact" == *.spdx.json ]]; then
            note="SPDX software bill of materials"
          elif [[ "$artifact" == *"-Windows-"* ]]; then
            note="Windows package"
          elif [[ "$artifact" == *"-Linux-"* ]]; then
            note="Linux package"
          fi

          size_bytes=$(stat --format='%s' "$artifact")
          size_human=$(numfmt --to=iec-i --suffix=B "$size_bytes")
          sha256sum "$artifact" >> SHA256SUMS
          FILES="${FILES}${artifact}"$'\n'
          TABLE="${TABLE}"$'\n'"| \`${artifact}\` | ${size_human} | ${note} |"
        done < <(
          find . -maxdepth 1 -type f \
            \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.exe" -o -name "*.msi" \
               -o -name "SparkInstaller-*" -o -name "*.spdx.json" \) -print0 | sort -z
        )

        if [ ! -s SHA256SUMS ]; then
          echo "No release assets were collected; refusing to publish an empty release." >&2
          exit 1
        fi
        sha256sum --check SHA256SUMS
        FILES="${FILES}SHA256SUMS"$'\n'
        TABLE="${TABLE}"$'\n'"| \`SHA256SUMS\` | — | SHA-256 verification manifest |"

        {
          echo "### Release artifact statistics"
          echo
          echo "$TABLE"
          echo
          echo 'Every collected artifact passed an immediate `sha256sum --check SHA256SUMS` round trip.'
        } >> "$GITHUB_STEP_SUMMARY"

        # Write multiline outputs
        {
          echo "files<<FILESEOF"
          echo "$FILES"
          echo "FILESEOF"
        } >> "$GITHUB_OUTPUT"

        {
          echo "table<<TABLEEOF"
          echo "$TABLE"
          echo "TABLEEOF"
        } >> "$GITHUB_OUTPUT"

    - name: Determine release title suffix
      id: suffix
      run: |
        BUILD_TYPE="${{ needs.prepare.outputs.build_type }}"
        if [[ "$BUILD_TYPE" == "debug" ]]; then
          echo "label= (Debug)" >> "$GITHUB_OUTPUT"
        elif [[ "$BUILD_TYPE" == "release" ]]; then
          echo "label= (Release)" >> "$GITHUB_OUTPUT"
        else
          echo "label=" >> "$GITHUB_OUTPUT"
        fi

    - name: Bind release tag to workflow commit
      env:
        IS_VERSIONED: ${{ needs.prepare.outputs.is_versioned }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        TARGET_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail

        TARGET_COMMIT="$(git rev-parse "${TARGET_SHA}^{commit}")"
        REMOTE_TAG_OBJECT="$(git ls-remote --refs origin "refs/tags/${RELEASE_TAG}" | awk 'NR == 1 { print $1 }')"

        if [[ "$IS_VERSIONED" == "true" ]]; then
          if [[ -n "$REMOTE_TAG_OBJECT" ]]; then
            git fetch --force --no-tags origin \
              "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          else
            # A manual versioned release may introduce a new immutable tag.
            # A normal push fails if another writer creates it between the
            # remote lookup and this push; stable tags are never force-moved.
            git tag "$RELEASE_TAG" "$TARGET_COMMIT"
            git push origin \
              "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          fi
        else
          if [[ "$RELEASE_TAG" != "nightly" ]]; then
            echo "Refusing to force-move non-nightly tag: $RELEASE_TAG" >&2
            exit 1
          fi

          git tag --force nightly "$TARGET_COMMIT"
          git push --force-with-lease="refs/tags/nightly:${REMOTE_TAG_OBJECT}" origin \
            "refs/tags/nightly:refs/tags/nightly"
        fi

        # Re-read the remote ref after any create/move and prove the tag peels
        # to the exact commit whose artifacts this workflow built.
        git fetch --force --no-tags origin \
          "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
        BOUND_COMMIT="$(git rev-parse "${RELEASE_TAG}^{commit}")"
        if [[ "$BOUND_COMMIT" != "$TARGET_COMMIT" ]]; then
          echo "Release tag ${RELEASE_TAG} resolves to ${BOUND_COMMIT}, expected ${TARGET_COMMIT}." >&2
          exit 1
        fi
        echo "Release tag ${RELEASE_TAG} is bound to ${BOUND_COMMIT}."

    - name: Attest release build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: ${{ steps.assets.outputs.files }}

    - name: Create stable versioned release
      if: needs.prepare.outputs.is_versioned == 'true'
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      with:
        tag_name: ${{ needs.prepare.outputs.tag }}
        name: "SparkEngine ${{ needs.prepare.outputs.version }} (Stable)${{ steps.suffix.outputs.label }}"
        body: |
          ## SparkEngine ${{ needs.prepare.outputs.version }} — Stable Release${{ steps.suffix.outputs.label }}

          Built from commit [`${{ steps.sha.outputs.short }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
          Built on: ${{ github.run_started_at }}

          > **Stable releases** are manually published and thoroughly tested. For the latest development builds, see the [nightly release](https://github.com/${{ github.repository }}/releases/tag/nightly).

          ### Downloads

          ${{ steps.assets.outputs.table }}
        prerelease: false
        make_latest: true
        files: ${{ steps.assets.outputs.files }}

    - name: Create or update nightly rolling release
      if: needs.prepare.outputs.is_versioned == 'false'
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      with:
        tag_name: nightly
        name: "Nightly Build (${{ steps.sha.outputs.short }})${{ steps.suffix.outputs.label }}"
        body: |
          ## Nightly Build${{ steps.suffix.outputs.label }}

          Built from commit [`${{ steps.sha.outputs.short }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
          Built on: ${{ github.run_started_at }}
          Branch: `${{ github.ref_name }}`

          > **Nightly builds** are published automatically on every commit. All CI checks pass before publishing. For a stable, manually-verified release see the [latest stable release](https://github.com/${{ github.repository }}/releases/latest).

          ${{ steps.assets.outputs.table }}
        prerelease: false
        make_latest: false
        files: ${{ steps.assets.outputs.files }}

    # The old release's counts must be captured before replacement, but they
    # must not become canonical until the replacement release is published.
    - name: Commit published-release download counters
      id: badge-commit
      working-directory: badge-repository
      run: |
        set -euo pipefail
        echo "changed=false" >> "$GITHUB_OUTPUT"

        # This release snapshot must not be silently lost or applied to a
        # different Working revision.
        REMOTE_HEAD="$(git ls-remote --exit-code --heads origin refs/heads/Working | awk '{print $1}')"
        if test "$REMOTE_HEAD" != "$(git rev-parse HEAD)"; then
          echo "Working advanced before published-release counters could be committed; rerun this release."
          exit 1
        fi

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .github/badges/
        git diff --cached --quiet && echo "No download count change" && exit 0
        git commit -m "chore: update download counters (lifetime: ${{ steps.badge-prepare.outputs.new_total }}, installer: ${{ steps.badge-prepare.outputs.installer_total }}) [skip ci]"
        git push origin "HEAD:refs/heads/Working"
        echo "changed=true" >> "$GITHUB_OUTPUT"

    # GITHUB_TOKEN pushes do not trigger ordinary push workflows, so explicitly
    # prove and publish the generated Working head.
    - name: Dispatch exact-head build after Working badge commit
      if: steps.badge-commit.outputs.changed == 'true'
      working-directory: badge-repository
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        REMOTE_HEAD="$(git ls-remote --exit-code --heads origin refs/heads/Working | awk '{print $1}')"
        if test "$REMOTE_HEAD" != "$(git rev-parse HEAD)"; then
          echo "Working advanced after this counter push; the newer head owns the build."
          exit 0
        fi
        for attempt in 1 2 3 4 5; do
          if gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref Working; then
            exit 0
          fi
          test "$attempt" -lt 5 || exit 1
          sleep "$((attempt * 2))"
        done
