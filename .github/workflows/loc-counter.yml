name: Lines of Code Counter

on:
  push:
    branches: [ Working ]
    paths:
      - '**.cpp'
      - '**.h'
      - '**.hpp'
      - '**.mm'
      - '**.inl'
      - 'docs/codebase-metrics.py'
      - '.github/scripts/test-codebase-metrics.py'
      - 'Tools/check-test-registration.sh'
      - '.github/scripts/test-check-test-registration.py'
      - 'docs/update-codebase-stats.sh'
      - 'docs/sync-wiki.sh'
      - 'docs/update-readme-badges.sh'
      - '.github/workflows/loc-counter.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sparkengine-repository-metrics-publication
  cancel-in-progress: false

jobs:
  count-loc:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout trusted workflow source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: Working
        persist-credentials: false

    - name: Resolve exact trusted source
      id: source
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
        LOCAL_SOURCE="$(git rev-parse HEAD)"
        REMOTE_SOURCE="$(git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          ls-remote --refs origin refs/heads/Working | awk 'NR == 1 { print $1 }')"
        if test -z "$REMOTE_SOURCE" || test "$LOCAL_SOURCE" != "$REMOTE_SOURCE"; then
          echo "Trusted metrics checkout is not the current Working head." >&2
          exit 1
        fi
        echo "commit=$LOCAL_SOURCE" >> "$GITHUB_OUTPUT"

    - name: Checkout repository-metrics state seed
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: Working
        path: metrics-repository
        persist-credentials: false

    - name: Load durable repository-metrics state tag
      id: metrics-state
      working-directory: metrics-repository
      env:
        GH_TOKEN: ${{ github.token }}
        STATE_REF: refs/tags/generated-repository-metrics
      run: |
        set -euo pipefail
        AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
        REMOTE_OBJECT="$(git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          ls-remote --refs origin "$STATE_REF" | awk 'NR == 1 { print $1 }')"
        if test -n "$REMOTE_OBJECT"; then
          git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
            fetch --force --no-tags origin "+${STATE_REF}:${STATE_REF}"
          git checkout --detach "$STATE_REF"
          if test "$(git rev-parse HEAD)" != "$(git rev-parse "${STATE_REF}^{commit}")"; then
            echo "Generated metrics state tag did not resolve to its fetched commit." >&2
            exit 1
          fi
        else
          git checkout --detach "$(git rev-parse HEAD)"
        fi
        echo "remote_object=$REMOTE_OBJECT" >> "$GITHUB_OUTPUT"
        echo "state_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Test source inventory and registration guards
      run: |
        set -euo pipefail
        python3 .github/scripts/test-codebase-metrics.py -v
        python3 .github/scripts/test-check-test-registration.py -v
        bash Tools/check-test-registration.sh

    - name: Count lines of code
      id: loc
      run: |
        set -euo pipefail
        python3 docs/codebase-metrics.py > repository-metrics.json
        eval "$(python3 docs/codebase-metrics.py --shell)"
        CPP_LINES="$TOTAL_LINES"
        format_count() {
          python3 -c 'import sys; print(f"{int(sys.argv[1]):,}")' "$1"
        }
        FORMATTED_LOC="$(format_count "$CPP_LINES")"
        FORMATTED_FILES="$(format_count "$FILE_COUNT")"
        FORMATTED_TEST_DEFINITIONS="$(format_count "$TEST_DEFINITIONS")"

        echo "total_lines=$CPP_LINES" >> "$GITHUB_OUTPUT"
        echo "formatted_lines=$FORMATTED_LOC" >> "$GITHUB_OUTPUT"
        echo "file_count=$FILE_COUNT" >> "$GITHUB_OUTPUT"
        echo "formatted_files=$FORMATTED_FILES" >> "$GITHUB_OUTPUT"
        echo "test_definition_count=$TEST_DEFINITIONS" >> "$GITHUB_OUTPUT"
        echo "formatted_test_definitions=$FORMATTED_TEST_DEFINITIONS" >> "$GITHUB_OUTPUT"
        echo "engine_lines=$ENGINE_LINES" >> "$GITHUB_OUTPUT"
        echo "editor_lines=$EDITOR_LINES" >> "$GITHUB_OUTPUT"
        echo "game_lines=$GAME_LINES" >> "$GITHUB_OUTPUT"
        echo "services_lines=$SERVICES_LINES" >> "$GITHUB_OUTPUT"
        echo "pipeline_lines=$PIPELINE_LINES" >> "$GITHUB_OUTPUT"
        echo "test_lines=$TEST_LINES" >> "$GITHUB_OUTPUT"
        echo "tool_lines=$TOOL_LINES" >> "$GITHUB_OUTPUT"

        echo "### Lines of Code Summary" >> "$GITHUB_STEP_SUMMARY"
        echo "| Module | Lines |" >> "$GITHUB_STEP_SUMMARY"
        echo "|--------|------:|" >> "$GITHUB_STEP_SUMMARY"
        echo "| Engine | $(format_count "$ENGINE_LINES") |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Editor | $(format_count "$EDITOR_LINES") |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Game   | $(format_count "$GAME_LINES") |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Services | $(format_count "$SERVICES_LINES") |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Asset pipeline | $(format_count "$PIPELINE_LINES") |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Tests  | $(format_count "$TEST_LINES") |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Tools  | $(format_count "$TOOL_LINES") |" >> "$GITHUB_STEP_SUMMARY"
        echo "| **Total** | **$FORMATTED_LOC** |" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "**$FILE_COUNT source files**" >> "$GITHUB_STEP_SUMMARY"

    - name: Verify generated repository and wiki stats
      run: |
        set -euo pipefail
        bash docs/update-readme-badges.sh check
        bash docs/update-codebase-stats.sh check
        bash docs/sync-wiki.sh check

    - name: Prove generated metrics are deterministic
      run: |
        set -euo pipefail
        python3 -m json.tool repository-metrics.json >/dev/null
        python3 -m json.tool .github/badges/tests.json >/dev/null
        python3 -m json.tool .github/badges/loc.json >/dev/null
        python3 -m json.tool .github/badges/files.json >/dev/null
        python3 -m json.tool .github/badges/loc-breakdown.json >/dev/null
        bash docs/update-readme-badges.sh check
        bash docs/update-codebase-stats.sh check

    - name: Upload exact-commit repository metrics
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: repository-metrics-${{ steps.source.outputs.commit }}
        path: |
          repository-metrics.json
          .github/badges/tests.json
          .github/badges/loc.json
          .github/badges/files.json
          .github/badges/loc-breakdown.json
        retention-days: 14
        if-no-files-found: error

    - name: Publish exact-source metrics state tag
      id: badge-commit
      working-directory: metrics-repository
      env:
        GH_TOKEN: ${{ github.token }}
        STATE_REF: refs/tags/generated-repository-metrics
        EXPECTED_REMOTE_OBJECT: ${{ steps.metrics-state.outputs.remote_object }}
        EXPECTED_STATE_COMMIT: ${{ steps.metrics-state.outputs.state_commit }}
        TRUSTED_SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
      run: |
        set -euo pipefail
        AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
        if test "$(git rev-parse HEAD)" != "$EXPECTED_STATE_COMMIT"; then
          echo "Metrics checkout no longer points to the loaded state commit." >&2
          exit 1
        fi
        REMOTE_SOURCE="$(git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          ls-remote --refs origin refs/heads/Working | awk 'NR == 1 { print $1 }')"
        if test "$REMOTE_SOURCE" != "$TRUSTED_SOURCE_COMMIT"; then
          echo "Working advanced while metrics were generated; refusing to publish stale state." >&2
          exit 1
        fi
        REMOTE_OBJECT="$(git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          ls-remote --refs origin "$STATE_REF" | awk 'NR == 1 { print $1 }')"
        if test "$REMOTE_OBJECT" != "$EXPECTED_REMOTE_OBJECT"; then
          echo "Generated metrics state advanced while this run was preparing; refusing stale state." >&2
          exit 1
        fi

        mkdir -p .github/badges
        for badge in tests.json loc.json files.json loc-breakdown.json; do
          cp "$GITHUB_WORKSPACE/.github/badges/$badge" ".github/badges/$badge"
        done
        jq -n \
          --arg repository "$GITHUB_REPOSITORY" \
          --arg commit "$TRUSTED_SOURCE_COMMIT" \
          --arg run_id "$GITHUB_RUN_ID" \
          --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
          '{schemaVersion: 1, source: {repository: $repository, ref: "refs/heads/Working", commit: $commit}, producer: {workflow: ".github/workflows/loc-counter.yml", runId: $run_id, runAttempt: $run_attempt}}' \
          > .github/badges/repository-metrics-source.json
        jq -e --arg commit "$TRUSTED_SOURCE_COMMIT" \
          '.schemaVersion == 1 and .source.commit == $commit and .source.ref == "refs/heads/Working"' \
          .github/badges/repository-metrics-source.json >/dev/null

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -- \
          .github/badges/tests.json \
          .github/badges/loc.json \
          .github/badges/files.json \
          .github/badges/loc-breakdown.json \
          .github/badges/repository-metrics-source.json
        git diff --cached --quiet && echo "No metrics state changes" && exit 0
        git commit -s -m "chore: publish repository metrics for ${TRUSTED_SOURCE_COMMIT:0:12} [skip ci]"
        FINAL_COMMIT="$(git rev-parse HEAD)"
        git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" push \
          --force-with-lease="${STATE_REF}:${EXPECTED_REMOTE_OBJECT}" origin \
          "HEAD:${STATE_REF}"
        PUBLISHED_OBJECT="$(git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
          ls-remote --refs origin "$STATE_REF" | awk 'NR == 1 { print $1 }')"
        if test "$PUBLISHED_OBJECT" != "$FINAL_COMMIT"; then
          echo "Generated metrics state tag does not point to this run's commit." >&2
          exit 1
        fi
        echo "changed=true" >> "$GITHUB_OUTPUT"
