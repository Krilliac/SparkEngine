name: Lines of Code Counter

on:
  push:
    branches: [ main, master, develop, Working ]
    paths:
      - '**.cpp'
      - '**.h'
      - '**.hpp'
      - '**.mm'
      - '**.inl'
      - 'docs/codebase-metrics.py'
      - '.github/scripts/test-codebase-metrics.py'
      - 'Tools/check-test-registration.sh'
      - '.github/scripts/test-check-test-registration.py'
      - 'docs/update-codebase-stats.sh'
      - 'docs/sync-wiki.sh'
      - 'docs/update-readme-badges.sh'
      - '.github/workflows/loc-counter.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: sparkengine-publication-global
  cancel-in-progress: false

jobs:
  count-loc:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Test source inventory and registration guards
      run: |
        set -euo pipefail
        python3 .github/scripts/test-codebase-metrics.py -v
        python3 .github/scripts/test-check-test-registration.py -v
        bash Tools/check-test-registration.sh

    - name: Count lines of code
      id: loc
      run: |
        set -euo pipefail
        python3 docs/codebase-metrics.py > repository-metrics.json
        eval "$(python3 docs/codebase-metrics.py --shell)"
        CPP_LINES="$TOTAL_LINES"
        format_count() {
          python3 -c 'import sys; print(f"{int(sys.argv[1]):,}")' "$1"
        }
        FORMATTED_LOC="$(format_count "$CPP_LINES")"
        FORMATTED_FILES="$(format_count "$FILE_COUNT")"
        FORMATTED_TEST_DEFINITIONS="$(format_count "$TEST_DEFINITIONS")"

        echo "total_lines=$CPP_LINES" >> "$GITHUB_OUTPUT"
        echo "formatted_lines=$FORMATTED_LOC" >> "$GITHUB_OUTPUT"
        echo "file_count=$FILE_COUNT" >> "$GITHUB_OUTPUT"
        echo "formatted_files=$FORMATTED_FILES" >> "$GITHUB_OUTPUT"
        echo "test_definition_count=$TEST_DEFINITIONS" >> "$GITHUB_OUTPUT"
        echo "formatted_test_definitions=$FORMATTED_TEST_DEFINITIONS" >> "$GITHUB_OUTPUT"
        echo "engine_lines=$ENGINE_LINES" >> "$GITHUB_OUTPUT"
        echo "editor_lines=$EDITOR_LINES" >> "$GITHUB_OUTPUT"
        echo "game_lines=$GAME_LINES" >> "$GITHUB_OUTPUT"
        echo "services_lines=$SERVICES_LINES" >> "$GITHUB_OUTPUT"
        echo "pipeline_lines=$PIPELINE_LINES" >> "$GITHUB_OUTPUT"
        echo "test_lines=$TEST_LINES" >> "$GITHUB_OUTPUT"
        echo "tool_lines=$TOOL_LINES" >> "$GITHUB_OUTPUT"

        echo "### Lines of Code Summary" >> "$GITHUB_STEP_SUMMARY"
        echo "| Module | Lines |" >> "$GITHUB_STEP_SUMMARY"
        echo "|--------|------:|" >> "$GITHUB_STEP_SUMMARY"
        echo "| Engine | $(format_count "$ENGINE_LINES") |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Editor | $(format_count "$EDITOR_LINES") |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Game   | $(format_count "$GAME_LINES") |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Services | $(format_count "$SERVICES_LINES") |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Asset pipeline | $(format_count "$PIPELINE_LINES") |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Tests  | $(format_count "$TEST_LINES") |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Tools  | $(format_count "$TOOL_LINES") |" >> "$GITHUB_STEP_SUMMARY"
        echo "| **Total** | **$FORMATTED_LOC** |" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "**$FILE_COUNT source files**" >> "$GITHUB_STEP_SUMMARY"

    - name: Refresh generated repository and wiki stats
      run: |
        set -euo pipefail
        bash docs/update-readme-badges.sh update
        bash docs/update-codebase-stats.sh generate
        bash docs/sync-wiki.sh sync

    - name: Prove generated metrics are deterministic
      run: |
        set -euo pipefail
        python3 -m json.tool repository-metrics.json >/dev/null
        python3 -m json.tool .github/badges/tests.json >/dev/null
        python3 -m json.tool .github/badges/loc.json >/dev/null
        python3 -m json.tool .github/badges/files.json >/dev/null
        python3 -m json.tool .github/badges/loc-breakdown.json >/dev/null
        bash docs/update-readme-badges.sh check
        bash docs/update-codebase-stats.sh check

    - name: Upload exact-commit repository metrics
      uses: actions/upload-artifact@v7.0.1
      with:
        name: repository-metrics-${{ github.sha }}
        path: |
          repository-metrics.json
          .github/badges/tests.json
          .github/badges/loc.json
          .github/badges/files.json
          .github/badges/loc-breakdown.json
        retention-days: 14
        if-no-files-found: error

    - name: Commit badge data
      id: badge-commit
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        echo "changed=false" >> "$GITHUB_OUTPUT"
        REMOTE_HEAD="$(git ls-remote --heads origin "$GITHUB_REF" | awk '{print $1}')"
        if test "$REMOTE_HEAD" != "$GITHUB_SHA"; then
          echo "Working advanced while badge data was generated; the newer run owns the update."
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -- README.md .github/copilot-instructions.md .github/prompts/copilot-instructions.md \
          .github/prompts/build-test.prompt.md .github/badges/tests.json .github/badges/loc.json .github/badges/files.json \
          .github/badges/loc-breakdown.json wiki/Home.md wiki/advanced/Testing.md \
          wiki/advanced/Codebase-Statistics.md \
          wiki/subsystems/Entity-Component-System.md wiki/gameplay-tools/SparkEditor.md
        git diff --cached --quiet && echo "No changes to commit" && exit 0
        git commit -m "chore: refresh generated repository metrics"
        git push \
          "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
          "HEAD:refs/heads/${GITHUB_REF_NAME}"
        echo "changed=true" >> "$GITHUB_OUTPUT"

    # Pushes made with GITHUB_TOKEN intentionally do not trigger ordinary
    # push workflows. Explicit workflow_dispatch is the supported exception,
    # so prove the generated-badge commit and publish its canonical wiki rather
    # than leaving Working ahead of either repository-driven workflow.
    - name: Dispatch exact-head workflows after badge commit
      if: steps.badge-commit.outputs.changed == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        dispatch_exact_head() {
          local workflow="$1"
          for attempt in 1 2 3 4 5; do
            REMOTE_HEAD="$(git ls-remote --exit-code --heads origin "$GITHUB_REF" | awk '{print $1}')"
            if test "$REMOTE_HEAD" != "$(git rev-parse HEAD)"; then
              echo "Working advanced after this badge push; the newer head owns $workflow."
              return 0
            fi
            if gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"; then
              return 0
            fi
            test "$attempt" -lt 5 || return 1
            sleep "$((attempt * 2))"
          done
        }

        dispatch_exact_head build.yml
        dispatch_exact_head publish-wiki.yml
