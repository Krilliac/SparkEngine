# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature.  For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

on:
  push:
    branches: [ "Working" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "Working" ]
  schedule:
    - cron: '41 5 * * 3'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    # The C++ corpus is large enough that cppcheck can exceed the classic CLI's
    # 15-minute per-tool default. Leave headroom for SARIF generation/upload.
    timeout-minutes: 90
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The scanner receives no repository credential. This also prevents
          # a transitive analyzer process from recovering checkout's token.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Validate Codacy SARIF tooling and workflow boundaries
        run: |
          python3 -I .github/scripts/test_normalize_codacy_sarif.py
          python3 -I .github/scripts/test_workflow_privilege_boundaries.py

      # Execute Codacy Analysis CLI and generate a SARIF output with the security issues identified during the analysis
      - name: Run Codacy Analysis CLI
        env:
          # Docker Hub manifest digest for codacy/codacy-analysis-cli:7.9.25.
          # The old pinned composite action downloaded a mutable Git tag at
          # runtime. Execute the immutable image directly and do not expose a
          # Codacy project token to the scanner or its nested tool container.
          CODACY_ANALYSIS_CLI_IMAGE: codacy/codacy-analysis-cli@sha256:339e0103e28804f9d76aff34503e505440e5d5b42f5dd70dae73b592ea87826a
          CODACY_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if test "$(git rev-parse HEAD)" != "$CODACY_COMMIT_SHA"; then
            echo "Codacy checkout is not the exact analyzed source head." >&2
            exit 1
          fi
          docker run --rm \
            --env CODACY_CODE="$GITHUB_WORKSPACE" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --volume /tmp:/tmp \
            --workdir "$GITHUB_WORKSPACE" \
            "$CODACY_ANALYSIS_CLI_IMAGE" -- \
            analyze \
            --skip-commit-uuid-validation \
            --commit-uuid "$CODACY_COMMIT_SHA" \
            --verbose \
            --tool cppcheck \
            --tool-timeout 45minutes \
            --fail-if-incomplete \
            --output "$GITHUB_WORKSPACE/results.sarif" \
            --format sarif \
            --gh-code-scanning-compat \
            --max-allowed-issues 2147483647

      # Keep only actionable severities plus the stable c/cpp-1/cpp-2 category
      # roster. Empty category runs are intentional: GitHub needs the same
      # automationDetails categories to retire findings omitted by this upload.
      - name: Filter, audit, and categorize Codacy's C and C++ SARIF runs
        run: python3 -I .github/scripts/normalize-codacy-sarif.py results.sarif

      # Hand only normalized data to the separately trusted workflow_run
      # reporter. Direct single-file upload avoids archive extraction in that
      # privileged workflow.
      - name: Publish normalized SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: results.sarif
          archive: false
          if-no-files-found: error
          retention-days: 1
