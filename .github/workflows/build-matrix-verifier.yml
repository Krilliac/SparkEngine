# build-matrix source artifacts are untrusted.  This workflow executes only the
# current default-branch verifier, authorizes one exact completed source run
# through the Actions API, parses downloaded files as bounded data, and attests
# the resulting receipt.  The producer job records structural evidence and
# succeeds; only this verifier, executing the current Working checkout, can
# attest that evidence and publish the exact-source status.
name: "Build Matrix Verifier"

on:
  workflow_run:
    workflows: ["Build SparkEngine"]
    types: [in_progress, completed]

jobs:
  invalidate-running:
    name: "Invalidate the prior build-matrix status for a running source attempt"
    if: github.event.action == 'in_progress'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: build-matrix-trusted-source-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      statuses: write
    steps:
    - name: Checkout trusted default-branch verifier
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.event.repository.default_branch }}
        path: trusted-verifier
        persist-credentials: false
        fetch-depth: 1

    - name: Resolve trusted verifier commit
      id: trusted-checkout
      shell: bash
      run: echo "sha=$(git -C trusted-verifier rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Attest exact default-branch verifier before execution
      id: trusted-attestation
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      env:
        TRUSTED_CHECKOUT_SHA: ${{ steps.trusted-checkout.outputs.sha }}
        TRUSTED_WORKFLOW_REF: ${{ github.workflow_ref }}
        TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
      with:
        script: |
          const sha = /^[0-9a-f]{40}$/i;
          const repository = (await github.rest.repos.get(context.repo)).data;
          const checkoutSha = process.env.TRUSTED_CHECKOUT_SHA;
          const workflowSha = process.env.TRUSTED_WORKFLOW_SHA;
          const expectedRef = `${repository.full_name}/.github/workflows/build-matrix-verifier.yml@refs/heads/${repository.default_branch}`;
          const defaultCommit = (await github.rest.repos.getCommit({
            ...context.repo, ref: repository.default_branch
          })).data;
          if (repository.default_branch !== 'Working' || !sha.test(checkoutSha || '') ||
              !sha.test(workflowSha || '') || checkoutSha.toLowerCase() !== workflowSha.toLowerCase() ||
              checkoutSha.toLowerCase() !== String(defaultCommit.sha || '').toLowerCase() ||
              process.env.TRUSTED_WORKFLOW_REF !== expectedRef) {
            throw new Error('Verifier checkout, executing workflow, and current Working default branch are not exact.');
          }

    - name: Mark the exact source build-matrix status pending
      if: steps.trusted-attestation.outcome == 'success'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      env:
        BUILD_MATRIX_STATUS_MODE: pending
        TRUSTED_CHECKOUT_SHA: ${{ steps.trusted-checkout.outputs.sha }}
        TRUSTED_WORKFLOW_REF: ${{ github.workflow_ref }}
        TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
      with:
        script: |
          const status = require('./trusted-verifier/.github/scripts/build-matrix-commit-status.js');
          await status({ github, context, core });

  verify:
    name: "Verify and attest build-matrix evidence"
    if: github.event.action == 'completed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: build-matrix-trusted-source-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      statuses: write
    steps:
    - name: Checkout trusted default-branch verifier
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.event.repository.default_branch }}
        path: trusted-verifier
        persist-credentials: false
        fetch-depth: 1

    - name: Resolve trusted verifier commit
      id: trusted-checkout
      shell: bash
      run: echo "sha=$(git -C trusted-verifier rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Attest exact default-branch verifier before execution
      id: trusted-attestation
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      env:
        TRUSTED_CHECKOUT_SHA: ${{ steps.trusted-checkout.outputs.sha }}
        TRUSTED_WORKFLOW_REF: ${{ github.workflow_ref }}
        TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
      with:
        script: |
          const sha = /^[0-9a-f]{40}$/i;
          const repository = (await github.rest.repos.get(context.repo)).data;
          const checkoutSha = process.env.TRUSTED_CHECKOUT_SHA;
          const workflowSha = process.env.TRUSTED_WORKFLOW_SHA;
          const expectedRef = `${repository.full_name}/.github/workflows/build-matrix-verifier.yml@refs/heads/${repository.default_branch}`;
          const defaultCommit = (await github.rest.repos.getCommit({
            ...context.repo, ref: repository.default_branch
          })).data;
          if (repository.default_branch !== 'Working' || !sha.test(checkoutSha || '') ||
              !sha.test(workflowSha || '') || checkoutSha.toLowerCase() !== workflowSha.toLowerCase() ||
              checkoutSha.toLowerCase() !== String(defaultCommit.sha || '').toLowerCase() ||
              process.env.TRUSTED_WORKFLOW_REF !== expectedRef) {
            throw new Error('Verifier checkout, executing workflow, and current Working default branch are not exact.');
          }

    - name: Mark the exact source build-matrix status pending
      id: pending-status
      if: steps.trusted-attestation.outcome == 'success'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      env:
        BUILD_MATRIX_STATUS_MODE: pending
        TRUSTED_CHECKOUT_SHA: ${{ steps.trusted-checkout.outputs.sha }}
        TRUSTED_WORKFLOW_REF: ${{ github.workflow_ref }}
        TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
      with:
        script: |
          const status = require('./trusted-verifier/.github/scripts/build-matrix-commit-status.js');
          await status({ github, context, core });

    - name: Test the trusted build-matrix verifier
      id: verifier-tests
      if: steps.trusted-attestation.outcome == 'success' && steps.pending-status.outcome == 'success'
      shell: bash
      working-directory: trusted-verifier
      run: |
        set -euo pipefail
        python -m unittest \
          Tests.Tools.test_build_matrix_pending_authority \
          Tests.Tools.test_build_matrix_external_verifier

    - name: Authorize exact source run, job, and artifact
      id: preflight
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      env:
        SOURCE_METADATA_PATH: ${{ runner.temp }}/build-matrix-source-metadata.json
        TRUSTED_CHECKOUT_SHA: ${{ steps.trusted-checkout.outputs.sha }}
        TRUSTED_WORKFLOW_REF: ${{ github.workflow_ref }}
        TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        VERIFIER_TEST_OUTCOME: ${{ steps.verifier-tests.outcome }}
      with:
        script: |
          const fs = require('fs');
          const status = require('./trusted-verifier/.github/scripts/build-matrix-commit-status.js');
          const shaPattern = /^[0-9a-f]{40}$/i;
          const digestPattern = /^sha256:[0-9a-f]{64}$/i;
          const sourceName = 'Build SparkEngine';
          const sourcePath = '.github/workflows/build.yml';
          const sourceJobName = 'Windows Shipping build matrix';
          const finalStepName = 'Record build-matrix evidence';
          const normalizePath = value => {
            const text = String(value || '').split('@', 1)[0].replace(/\\/g, '/');
            const marker = '/.github/workflows/';
            const offset = text.indexOf(marker);
            return offset >= 0 ? text.slice(offset + 1) : text.replace(/^\.\//, '');
          };
          if (process.env.VERIFIER_TEST_OUTCOME !== 'success') {
            throw new Error('Trusted verifier tests did not pass.');
          }

          const eventRun = context.payload.workflow_run;
          const eventRepository = context.payload.repository;
          if (!eventRun || !eventRepository || !Number.isInteger(eventRun.id) || eventRun.id < 1 ||
              !Number.isInteger(eventRun.run_attempt) || eventRun.run_attempt < 1 ||
              !shaPattern.test(eventRun.head_sha || '')) {
            throw new Error('workflow_run payload does not identify an exact source attempt.');
          }
          const repository = (await github.rest.repos.get(context.repo)).data;
          const defaultCommit = (await github.rest.repos.getCommit({
            ...context.repo, ref: repository.default_branch
          })).data;
          const checkoutSha = String(process.env.TRUSTED_CHECKOUT_SHA || '').toLowerCase();
          const workflowSha = String(process.env.TRUSTED_WORKFLOW_SHA || '').toLowerCase();
          const sourceSha = eventRun.head_sha.toLowerCase();
          if (repository.id !== eventRepository.id ||
              repository.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
              repository.default_branch !== 'Working' || checkoutSha !== workflowSha ||
              checkoutSha !== String(defaultCommit.sha || '').toLowerCase()) {
            throw new Error('Verifier workflow, checkout, repository, and current default branch are not exact.');
          }
          const expectedVerifierRef = `${repository.full_name}/.github/workflows/build-matrix-verifier.yml@refs/heads/Working`;
          if (process.env.TRUSTED_WORKFLOW_REF !== expectedVerifierRef) {
            throw new Error('Executing verifier workflow ref is not the protected Working workflow.');
          }
          const [sourceWorkflowResponse, trustedWorkflowResponse] = await Promise.all([
            github.rest.repos.getContent({
              ...context.repo, path: sourcePath, ref: sourceSha
            }),
            github.rest.repos.getContent({
              ...context.repo, path: sourcePath, ref: checkoutSha
            })
          ]);
          const sourceWorkflow = sourceWorkflowResponse.data;
          const trustedWorkflow = trustedWorkflowResponse.data;
          if (!sourceWorkflow || !trustedWorkflow || Array.isArray(sourceWorkflow) ||
              Array.isArray(trustedWorkflow) || sourceWorkflow.type !== 'file' ||
              trustedWorkflow.type !== 'file' || !shaPattern.test(sourceWorkflow.sha || '') ||
              !shaPattern.test(trustedWorkflow.sha || '') ||
              sourceWorkflow.sha.toLowerCase() !== trustedWorkflow.sha.toLowerCase()) {
            throw new Error('Source Build workflow is not byte-identical to the current trusted workflow.');
          }

          const run = (await github.rest.actions.getWorkflowRun({
            ...context.repo, run_id: eventRun.id
          })).data;
          if (run.id !== eventRun.id || run.run_attempt !== eventRun.run_attempt ||
              run.workflow_id !== eventRun.workflow_id || run.name !== sourceName ||
              normalizePath(run.path) !== sourcePath || !['push', 'workflow_dispatch'].includes(run.event) ||
              run.status !== 'completed' || run.conclusion !== 'success' ||
              run.head_branch !== 'Working' || String(run.head_sha || '').toLowerCase() !== sourceSha ||
              run.repository?.id !== repository.id || run.repository?.full_name !== repository.full_name ||
              run.head_repository?.id !== repository.id || run.head_repository?.full_name !== repository.full_name) {
            throw new Error('Actions API source run is not the exact successful default-branch build.');
          }

          const authorization = await status.authorizeSourceJobArtifact({
            github, context, run, repository, sourceSha
          });
          const sourceJob = authorization.sourceJob;
          const finalStep = authorization.finalStep;
          const artifact = authorization.artifact;

          const metadata = {
            schemaVersion: 1,
            repository: {
              id: repository.id,
              fullName: repository.full_name,
              defaultBranch: repository.default_branch
            },
            source: {
              workflowId: run.workflow_id,
              workflowName: run.name,
              workflowPath: normalizePath(run.path),
              runId: run.id,
              runNumber: run.run_number,
              runAttempt: run.run_attempt,
              event: run.event,
              conclusion: run.conclusion,
              headBranch: run.head_branch,
              headSha: sourceSha,
              jobId: sourceJob.id,
              jobName: sourceJob.name,
              jobConclusion: sourceJob.conclusion,
              finalStepName,
              finalStepConclusion: finalStep.conclusion
            },
            artifact: {
              id: artifact.id,
              name: artifact.name,
              bytes: artifact.size_in_bytes,
              digest: artifact.digest.toLowerCase()
            },
            verifier: {
              repository: repository.full_name,
              checkoutSha,
              workflowSha,
              workflowRef: process.env.TRUSTED_WORKFLOW_REF,
              sourceWorkflowBlobSha: sourceWorkflow.sha.toLowerCase(),
              trustedWorkflowBlobSha: trustedWorkflow.sha.toLowerCase()
            }
          };
          fs.writeFileSync(process.env.SOURCE_METADATA_PATH, JSON.stringify(metadata, null, 2) + '\n', {
            encoding: 'utf8', flag: 'wx'
          });
          core.setOutput('authorized', 'true');
          core.setOutput('artifact-id', String(artifact.id));
          core.setOutput('artifact-name', artifact.name);
          core.setOutput('artifact-digest', artifact.digest.toLowerCase());

    - name: Download the exact build-matrix source artifact
      id: download
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        artifact-ids: ${{ steps.preflight.outputs.artifact-id }}
        path: ${{ runner.temp }}/build-matrix-source-artifact
        merge-multiple: true
        digest-mismatch: error
        repository: ${{ github.repository }}
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ github.token }}

    - name: Verify the build-matrix evidence as bounded data
      id: verify-evidence
      shell: bash
      run: |
        set -euo pipefail
        python trusted-verifier/Tools/buildmatrix/verify_external_evidence.py \
          --artifact-root "${{ runner.temp }}/build-matrix-source-artifact" \
          --source-metadata "${{ runner.temp }}/build-matrix-source-metadata.json" \
          --output "${{ runner.temp }}/build-matrix-trusted-receipt.json" \
          > "${{ runner.temp }}/build-matrix-trusted-receipt-stdout.json"
        cmp \
          "${{ runner.temp }}/build-matrix-trusted-receipt.json" \
          "${{ runner.temp }}/build-matrix-trusted-receipt-stdout.json"

    - name: Attest the trusted build-matrix receipt
      id: attest-receipt
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        subject-path: ${{ runner.temp }}/build-matrix-trusted-receipt.json

    - name: Upload the trusted build-matrix receipt
      id: upload-receipt
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: build-matrix-trusted-receipt-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/build-matrix-trusted-receipt.json
          ${{ runner.temp }}/build-matrix-source-metadata.json
        retention-days: 30
        if-no-files-found: error

    - name: Publish the exact source build-matrix status
      id: final-status
      if: always() && steps.trusted-attestation.outcome == 'success' && steps.pending-status.outcome == 'success' && steps.verifier-tests.outcome == 'success'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      env:
        BUILD_MATRIX_STATUS_MODE: final
        TRUSTED_CHECKOUT_SHA: ${{ steps.trusted-checkout.outputs.sha }}
        TRUSTED_WORKFLOW_REF: ${{ github.workflow_ref }}
        TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        VERIFIER_TEST_OUTCOME: ${{ steps.verifier-tests.outcome }}
        PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
        DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        VERIFY_EVIDENCE_OUTCOME: ${{ steps.verify-evidence.outcome }}
        ATTEST_RECEIPT_OUTCOME: ${{ steps.attest-receipt.outcome }}
        UPLOAD_RECEIPT_OUTCOME: ${{ steps.upload-receipt.outcome }}
        SOURCE_METADATA_PATH: ${{ runner.temp }}/build-matrix-source-metadata.json
        RECEIPT_PATH: ${{ runner.temp }}/build-matrix-trusted-receipt.json
        STATUS_RECORD_PATH: ${{ runner.temp }}/build-matrix-trusted-status.json
      with:
        script: |
          const status = require('./trusted-verifier/.github/scripts/build-matrix-commit-status.js');
          await status({ github, context, core });

    - name: Upload verifier rejection diagnostics
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: build-matrix-verifier-rejection-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
        path: |
          ${{ runner.temp }}/build-matrix-trusted-receipt.json
          ${{ runner.temp }}/build-matrix-source-metadata.json
          ${{ runner.temp }}/build-matrix-trusted-status.json
        retention-days: 7
        if-no-files-found: warn
