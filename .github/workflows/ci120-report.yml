# CI-120 source artifacts are untrusted.  This workflow executes only the
# current default-branch verifier, authorizes one exact completed source run
# through the Actions API, parses downloaded files as bounded data, and attests
# the resulting receipt.  The staged rollout intentionally accepts only the
# producer's documented final fail-closed step; a later reviewed change may
# promote the handoff after this verifier has passed remotely.
name: "CI-120 Trusted Verifier"

on:
  workflow_run:
    workflows: ["Build SparkEngine"]
    types: [completed]

jobs:
  verify:
    name: "Verify and attest CI-120 evidence"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci120-trusted-verifier-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: true
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
    - name: Checkout trusted default-branch verifier
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.event.repository.default_branch }}
        path: trusted-verifier
        persist-credentials: false
        fetch-depth: 1

    - name: Resolve trusted verifier commit
      id: trusted-checkout
      shell: bash
      run: echo "sha=$(git -C trusted-verifier rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Attest exact default-branch verifier before execution
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      env:
        TRUSTED_CHECKOUT_SHA: ${{ steps.trusted-checkout.outputs.sha }}
        TRUSTED_WORKFLOW_REF: ${{ github.workflow_ref }}
        TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
      with:
        script: |
          const sha = /^[0-9a-f]{40}$/i;
          const repository = (await github.rest.repos.get(context.repo)).data;
          const checkoutSha = process.env.TRUSTED_CHECKOUT_SHA;
          const workflowSha = process.env.TRUSTED_WORKFLOW_SHA;
          const expectedRef = `${repository.full_name}/.github/workflows/ci120-report.yml@refs/heads/${repository.default_branch}`;
          const defaultCommit = (await github.rest.repos.getCommit({
            ...context.repo, ref: repository.default_branch
          })).data;
          if (repository.default_branch !== 'Working' || !sha.test(checkoutSha || '') ||
              !sha.test(workflowSha || '') || checkoutSha.toLowerCase() !== workflowSha.toLowerCase() ||
              checkoutSha.toLowerCase() !== String(defaultCommit.sha || '').toLowerCase() ||
              process.env.TRUSTED_WORKFLOW_REF !== expectedRef) {
            throw new Error('Verifier checkout, executing workflow, and current Working default branch are not exact.');
          }

    - name: Test trusted CI-120 verifier
      id: verifier-tests
      shell: bash
      working-directory: trusted-verifier
      run: |
        set -euo pipefail
        python -m unittest \
          Tests.Tools.test_ci120_pending_authority \
          Tests.Tools.test_ci120_external_verifier

    - name: Authorize exact source run, job, and artifact
      id: preflight
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      env:
        SOURCE_METADATA_PATH: ${{ runner.temp }}/ci120-source-metadata.json
        TRUSTED_CHECKOUT_SHA: ${{ steps.trusted-checkout.outputs.sha }}
        TRUSTED_WORKFLOW_REF: ${{ github.workflow_ref }}
        TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        VERIFIER_TEST_OUTCOME: ${{ steps.verifier-tests.outcome }}
      with:
        script: |
          const fs = require('fs');
          const shaPattern = /^[0-9a-f]{40}$/i;
          const digestPattern = /^sha256:[0-9a-f]{64}$/i;
          const sourceName = 'Build SparkEngine';
          const sourcePath = '.github/workflows/build.yml';
          const sourceJobName = 'Windows Shipping structural configured-evidence producer';
          const finalStepName = 'Enforce reviewed CI-120 findings';
          const normalizePath = value => {
            const text = String(value || '').split('@', 1)[0].replace(/\\/g, '/');
            const marker = '/.github/workflows/';
            const offset = text.indexOf(marker);
            return offset >= 0 ? text.slice(offset + 1) : text.replace(/^\.\//, '');
          };
          if (process.env.VERIFIER_TEST_OUTCOME !== 'success') {
            throw new Error('Trusted verifier tests did not pass.');
          }

          const eventRun = context.payload.workflow_run;
          const eventRepository = context.payload.repository;
          if (!eventRun || !eventRepository || !Number.isInteger(eventRun.id) || eventRun.id < 1 ||
              !Number.isInteger(eventRun.run_attempt) || eventRun.run_attempt < 1 ||
              !shaPattern.test(eventRun.head_sha || '')) {
            throw new Error('workflow_run payload does not identify an exact source attempt.');
          }
          const repository = (await github.rest.repos.get(context.repo)).data;
          const defaultCommit = (await github.rest.repos.getCommit({
            ...context.repo, ref: repository.default_branch
          })).data;
          const checkoutSha = String(process.env.TRUSTED_CHECKOUT_SHA || '').toLowerCase();
          const workflowSha = String(process.env.TRUSTED_WORKFLOW_SHA || '').toLowerCase();
          const sourceSha = eventRun.head_sha.toLowerCase();
          if (repository.id !== eventRepository.id ||
              repository.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
              repository.default_branch !== 'Working' || checkoutSha !== workflowSha ||
              checkoutSha !== sourceSha || checkoutSha !== String(defaultCommit.sha || '').toLowerCase()) {
            throw new Error('Source run, verifier workflow, checkout, repository, and default branch are not exact.');
          }
          const expectedVerifierRef = `${repository.full_name}/.github/workflows/ci120-report.yml@refs/heads/Working`;
          if (process.env.TRUSTED_WORKFLOW_REF !== expectedVerifierRef) {
            throw new Error('Executing verifier workflow ref is not the protected Working workflow.');
          }

          const run = (await github.rest.actions.getWorkflowRun({
            ...context.repo, run_id: eventRun.id
          })).data;
          if (run.id !== eventRun.id || run.run_attempt !== eventRun.run_attempt ||
              run.workflow_id !== eventRun.workflow_id || run.name !== sourceName ||
              normalizePath(run.path) !== sourcePath || run.event !== 'push' ||
              run.status !== 'completed' || run.conclusion !== 'failure' ||
              run.head_branch !== 'Working' || String(run.head_sha || '').toLowerCase() !== sourceSha ||
              run.repository?.id !== repository.id || run.repository?.full_name !== repository.full_name ||
              run.head_repository?.id !== repository.id || run.head_repository?.full_name !== repository.full_name) {
            throw new Error('Actions API source run is not the exact staged fail-closed default-branch build.');
          }

          const jobsResponse = await github.rest.actions.listJobsForWorkflowRunAttempt({
            ...context.repo,
            run_id: run.id,
            attempt_number: run.run_attempt,
            per_page: 100,
            page: 1
          });
          const jobs = jobsResponse.data?.jobs;
          if (!Array.isArray(jobs) || jobsResponse.data.total_count > 100) {
            throw new Error('Source job inventory is malformed or exceeds the bound.');
          }
          const sourceJobs = jobs.filter(job => job?.name === sourceJobName);
          if (sourceJobs.length !== 1) {
            throw new Error('Expected exactly one CI-120 source job.');
          }
          const sourceJob = sourceJobs[0];
          if (!Number.isInteger(sourceJob.id) || sourceJob.id < 1 || sourceJob.status !== 'completed' ||
              sourceJob.conclusion !== 'failure' || !Array.isArray(sourceJob.steps)) {
            throw new Error('CI-120 source job is not the exact completed fail-closed job.');
          }
          const requiredSuccessfulSteps = [
            'Checkout repository',
            'Setup MSVC',
            'Configure and build canonical Windows Shipping lane (CI-120)',
            'Capture Windows Shipping structural provenance (CI-120)',
            'Install exact Windows Shipping SDK for the consumer profile (CI-120)',
            'Configure and build canonical Windows validation lane (CI-120)',
            'Capture Windows validation structural provenance (CI-120)',
            'Configure and build installed SDK consumer lane (CI-120)',
            'Capture installed SDK consumer structural provenance (CI-120)',
            'Generate configured build-matrix inventory from the structural producer (CI-120)',
            'Compare reviewed configured-evidence findings (CI-120)',
            'Upload untrusted CI-120 structural evidence'
          ];
          const named = name => sourceJob.steps.filter(step => step?.name === name);
          for (const name of requiredSuccessfulSteps) {
            const matches = named(name);
            if (matches.length !== 1 || matches[0].status !== 'completed' || matches[0].conclusion !== 'success') {
              throw new Error(`Required CI-120 source step did not succeed exactly once: ${name}`);
            }
          }
          const finalSteps = named(finalStepName);
          if (finalSteps.length !== 1 || finalSteps[0].status !== 'completed' ||
              finalSteps[0].conclusion !== 'failure') {
            throw new Error('CI-120 did not fail only at its documented external-authority enforcement step.');
          }
          const unexpectedFailures = sourceJob.steps.filter(
            step => step?.conclusion === 'failure' && step?.name !== finalStepName
          );
          if (unexpectedFailures.length) {
            throw new Error('CI-120 source job has an unexpected failed step.');
          }

          const artifactsResponse = await github.rest.actions.listWorkflowRunArtifacts({
            ...context.repo, run_id: run.id, per_page: 100, page: 1
          });
          const artifacts = artifactsResponse.data?.artifacts;
          if (!Array.isArray(artifacts) || artifactsResponse.data.total_count > 100) {
            throw new Error('Source artifact inventory is malformed or exceeds the bound.');
          }
          const expectedArtifactName = `ci120-untrusted-stable-v1-${sourceSha}-${run.run_attempt}`;
          const candidates = artifacts.filter(artifact => artifact?.name === expectedArtifactName);
          if (candidates.length !== 1) {
            throw new Error('Expected exactly one exact-attempt CI-120 source artifact.');
          }
          const artifact = candidates[0];
          if (!Number.isInteger(artifact.id) || artifact.id < 1 || artifact.expired !== false ||
              !Number.isInteger(artifact.size_in_bytes) || artifact.size_in_bytes < 1 ||
              artifact.size_in_bytes > 4 * 1024 * 1024 * 1024 ||
              !digestPattern.test(artifact.digest || '')) {
            throw new Error('CI-120 artifact identity, retention, size, or API digest is invalid.');
          }

          const metadata = {
            schemaVersion: 1,
            repository: {
              id: repository.id,
              fullName: repository.full_name,
              defaultBranch: repository.default_branch
            },
            source: {
              workflowId: run.workflow_id,
              workflowName: run.name,
              workflowPath: normalizePath(run.path),
              runId: run.id,
              runNumber: run.run_number,
              runAttempt: run.run_attempt,
              event: run.event,
              conclusion: run.conclusion,
              headBranch: run.head_branch,
              headSha: sourceSha,
              jobId: sourceJob.id,
              jobName: sourceJob.name,
              jobConclusion: sourceJob.conclusion,
              finalStepName,
              finalStepConclusion: finalSteps[0].conclusion
            },
            artifact: {
              id: artifact.id,
              name: artifact.name,
              bytes: artifact.size_in_bytes,
              digest: artifact.digest.toLowerCase()
            },
            verifier: {
              repository: repository.full_name,
              checkoutSha,
              workflowSha,
              workflowRef: process.env.TRUSTED_WORKFLOW_REF
            }
          };
          fs.writeFileSync(process.env.SOURCE_METADATA_PATH, JSON.stringify(metadata, null, 2) + '\n', {
            encoding: 'utf8', flag: 'wx'
          });
          core.setOutput('authorized', 'true');
          core.setOutput('artifact-id', String(artifact.id));
          core.setOutput('artifact-name', artifact.name);
          core.setOutput('artifact-digest', artifact.digest.toLowerCase());

    - name: Download exact CI-120 source artifact
      id: download
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        artifact-ids: ${{ steps.preflight.outputs.artifact-id }}
        path: ${{ runner.temp }}/ci120-source-artifact
        merge-multiple: true
        digest-mismatch: error
        repository: ${{ github.repository }}
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ github.token }}

    - name: Verify untrusted CI-120 evidence as bounded data
      id: verify-evidence
      shell: bash
      run: |
        set -euo pipefail
        python trusted-verifier/Tools/buildmatrix/verify_external_evidence.py \
          --artifact-root "${{ runner.temp }}/ci120-source-artifact" \
          --source-metadata "${{ runner.temp }}/ci120-source-metadata.json" \
          --output "${{ runner.temp }}/ci120-trusted-receipt.json" \
          > "${{ runner.temp }}/ci120-trusted-receipt-stdout.json"
        cmp \
          "${{ runner.temp }}/ci120-trusted-receipt.json" \
          "${{ runner.temp }}/ci120-trusted-receipt-stdout.json"

    - name: Attest trusted CI-120 receipt
      id: attest-receipt
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        subject-path: ${{ runner.temp }}/ci120-trusted-receipt.json

    - name: Upload trusted CI-120 receipt
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ci120-trusted-receipt-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.run_attempt }}
        path: |
          ${{ runner.temp }}/ci120-trusted-receipt.json
          ${{ runner.temp }}/ci120-source-metadata.json
        retention-days: 30
        if-no-files-found: error

    - name: Upload verifier rejection diagnostics
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ci120-verifier-rejection-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
        path: |
          ${{ runner.temp }}/ci120-trusted-receipt.json
          ${{ runner.temp }}/ci120-source-metadata.json
        retention-days: 7
        if-no-files-found: warn
