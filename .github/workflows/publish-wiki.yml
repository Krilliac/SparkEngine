name: Publish GitHub Wiki

on:
  push:
    branches: [Working]
    paths:
      - "wiki/**"
      - "docs/**"
      - "CHANGELOG.md"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "tools/publish-wiki.py"
      - "tools/check-wiki-quality.sh"
      - "tools/check-wiki-nav.sh"
      - "Tests/Tools/test_publish_wiki.py"
      - ".github/workflows/publish-wiki.yml"
  pull_request:
    branches: [Working, 'claude/**']
    paths:
      - "wiki/**"
      - "docs/**"
      - "CHANGELOG.md"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "tools/publish-wiki.py"
      - "tools/check-wiki-quality.sh"
      - "tools/check-wiki-nav.sh"
      - "Tests/Tools/test_publish_wiki.py"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch:

concurrency:
  group: sparkengine-wiki-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate GitHub Wiki publication
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate exact-commit API documentation
        env:
          SPARKENGINE_DOC_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export SPARKENGINE_DOC_SOURCE_COMMITTED_AT="$(git show -s --format=%cI HEAD)"
          timeout 5m bash docs/generate-api-docs.sh generate

      - name: Build and validate GitHub Wiki tree
        run: |
          set -euo pipefail
          bash docs/sync-wiki.sh check
          bash tools/check-wiki-quality.sh
          bash tools/check-wiki-nav.sh
          python3 tools/publish-wiki.py \
            --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/published-wiki"

  # The whole Tests/Tools suite (3,000+ tests) no longer fits one runner's
  # 10-minute budget, so it runs as a deterministic partition of its files.
  # Nothing is dropped: every shard recomputes the full partition and fails
  # unless it covers every test file exactly once, and tools-tests-complete
  # re-checks that the files the shards actually ran are exactly the suite.
  # Each shard runs its files in one process from the repository root with
  # Tests/Tools importable, as `unittest discover -s Tests/Tools` does.
  tools-tests:
    name: Tools tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The font-notice and real crypto-build tests require the pinned ImGui
      # and libsodium sources and fail closed when either is absent.
      - name: Initialise the font-embedding and crypto submodules
        run: git submodule update --init --depth 1 ThirdParty/UI/imgui ThirdParty/Security/libsodium

      - name: Generate exact-commit API documentation
        env:
          SPARKENGINE_DOC_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export SPARKENGINE_DOC_SOURCE_COMMITTED_AT="$(git show -s --format=%cI HEAD)"
          timeout 5m bash docs/generate-api-docs.sh generate

      - name: Run this shard of Tests/Tools
        env:
          SHARD_INDEX: ${{ strategy.job-index }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools-tests"
          python3 - > "$RUNNER_TEMP/tools-tests/shard-$SHARD_INDEX.files" <<'PY'
          import os
          import pathlib
          import sys

          # Files too slow to share a runner each get one; the rest are dealt
          # round-robin, in name order, across the remaining shards.
          DEDICATED = (
              "test_site_data_generation_determinism.py",
              "test_site_data_contract.py",
              "test_site_data_docs_parity.py",
          )
          files = sorted(path.name for path in pathlib.Path("Tests/Tools").glob("test_*.py"))
          index = int(os.environ["SHARD_INDEX"])
          total = int(os.environ["SHARD_TOTAL"])
          missing = [name for name in DEDICATED if name not in files]
          if missing:
              sys.exit(f"dedicated shard files do not exist: {missing}")
          shared = total - len(DEDICATED)
          if shared < 1:
              sys.exit(f"{total} shards leave none for the {len(files) - len(DEDICATED)} shared files")
          rest = [name for name in files if name not in DEDICATED]
          shards = [[name] for name in DEDICATED] + [rest[start::shared] for start in range(shared)]
          assigned = sorted(name for shard in shards for name in shard)
          if assigned != files or not all(shards):
              sys.exit("shard partition does not cover every Tests/Tools test file exactly once")
          print("\n".join(shards[index]))
          PY
          echo "Shard $SHARD_INDEX of $SHARD_TOTAL runs:"
          cat "$RUNNER_TEMP/tools-tests/shard-$SHARD_INDEX.files"
          mapfile -t modules < <(sed 's/\.py$//' "$RUNNER_TEMP/tools-tests/shard-$SHARD_INDEX.files")
          PYTHONPATH="$PWD/Tests/Tools" python3 -m unittest -v "${modules[@]}" 2>&1 \
            | tee "$RUNNER_TEMP/tools-tests/shard-$SHARD_INDEX.log"

      - name: Upload shard file list
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tools-tests-shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/tools-tests/shard-${{ strategy.job-index }}.files
          if-no-files-found: error
          retention-days: 1

  tools-tests-complete:
    name: Tools tests cover the whole suite
    needs: tools-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download shard file lists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tools-tests-shard-*
          path: ${{ runner.temp }}/tools-tests
          merge-multiple: true

      - name: Assert the shards ran every test file exactly once
        run: |
          set -euo pipefail
          (cd Tests/Tools && ls test_*.py) | LC_ALL=C sort > "$RUNNER_TEMP/expected.files"
          cat "$RUNNER_TEMP"/tools-tests/shard-*.files | LC_ALL=C sort > "$RUNNER_TEMP/ran.files"
          test -s "$RUNNER_TEMP/expected.files"
          if ! diff -u "$RUNNER_TEMP/expected.files" "$RUNNER_TEMP/ran.files"; then
            echo "Tests/Tools shards did not run every test file exactly once" >&2
            exit 1
          fi
          echo "$(wc -l < "$RUNNER_TEMP/ran.files") Tests/Tools files ran across $(ls "$RUNNER_TEMP"/tools-tests/shard-*.files | wc -l) shards"

  publish:
    name: Publish canonical wiki source
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/Working'
    needs: [validate, tools-tests-complete]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build and validate GitHub Wiki tree
        run: |
          set -euo pipefail
          python3 tools/publish-wiki.py \
            --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/published-wiki"

      - name: Publish exact source revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REMOTE_HEAD="$(git ls-remote --exit-code --heads origin refs/heads/Working | awk '{print $1}')"
          if test "$REMOTE_HEAD" != "$GITHUB_SHA"; then
            echo "Working advanced while this wiki was validated; the newer run owns publication."
            exit 0
          fi
          git clone --quiet \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" \
            "$RUNNER_TEMP/wiki-repository"
          git -C "$RUNNER_TEMP/wiki-repository" rm -r --ignore-unmatch -- .
          cp -a "$RUNNER_TEMP/published-wiki/." "$RUNNER_TEMP/wiki-repository/"
          cd "$RUNNER_TEMP/wiki-repository"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "GitHub Wiki already matches ${GITHUB_SHA}."
            exit 0
          fi
          git commit -m "docs: sync wiki from ${GITHUB_SHA}"
          REMOTE_HEAD="$(git ls-remote --exit-code --heads \
            "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/Working | awk '{print $1}')"
          if test "$REMOTE_HEAD" != "$GITHUB_SHA"; then
            echo "Working advanced before wiki push; the newer run owns publication."
            exit 0
          fi
          git push origin HEAD:master
