name: Publish GitHub Wiki

on:
  push:
    branches: [Working]
    paths:
      - "wiki/**"
      - "docs/**"
      - "CHANGELOG.md"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "tools/publish-wiki.py"
      - ".github/workflows/publish-wiki.yml"
  pull_request:
    branches: [Working]
    paths:
      - "wiki/**"
      - "docs/**"
      - "tools/publish-wiki.py"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch:

concurrency:
  group: sparkengine-wiki-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate GitHub Wiki publication
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build and validate GitHub Wiki tree
        run: |
          set -euo pipefail
          python3 tools/publish-wiki.py --output "$RUNNER_TEMP/published-wiki"

  publish:
    name: Publish canonical wiki source
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build and validate GitHub Wiki tree
        run: |
          set -euo pipefail
          python3 tools/publish-wiki.py --output "$RUNNER_TEMP/published-wiki"

      - name: Publish exact source revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --quiet \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" \
            "$RUNNER_TEMP/wiki-repository"
          find "$RUNNER_TEMP/wiki-repository" -mindepth 1 -maxdepth 1 \
            ! -name .git -exec rm -rf -- {} +
          cp -a "$RUNNER_TEMP/published-wiki/." "$RUNNER_TEMP/wiki-repository/"
          cd "$RUNNER_TEMP/wiki-repository"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "GitHub Wiki already matches ${GITHUB_SHA}."
            exit 0
          fi
          git commit -m "docs: sync wiki from ${GITHUB_SHA}"
          git push origin HEAD:master
