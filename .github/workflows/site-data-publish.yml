name: Publish Repository Site Data

on:
  workflow_run:
    workflows: ["Build SparkEngine"]
    branches: [Working]
    types: [completed]
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: Successful Build SparkEngine run ID to validate and publish
        required: true
        type: string

concurrency:
  group: sparkengine-site-data-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  REQUESTED_EVIDENCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.evidence_run_id }}

jobs:
  site-data-prepare:
    name: Prove and prepare exact-commit site data
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      publish: ${{ steps.final-head.outputs.publish }}
      evidence_conclusion: ${{ steps.normalize_evidence.outputs.conclusion }}
      source_commit: ${{ steps.resolve_evidence.outputs.source_commit }}
    steps:
      - name: Resolve and validate build evidence
        id: resolve_evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$REQUESTED_EVIDENCE_RUN_ID" in
            ''|*[!0-9]*) echo "Invalid evidence run ID: $REQUESTED_EVIDENCE_RUN_ID" >&2; exit 1 ;;
          esac
          RUN_FILE="$RUNNER_TEMP/build-evidence-run.json"
          curl --fail-with-body --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${REQUESTED_EVIDENCE_RUN_ID}" \
            --output "$RUN_FILE"
          python3 -I - "$RUN_FILE" <<'PY'
          import json
          import os
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              run = json.load(stream)

          requested_id = int(os.environ["REQUESTED_EVIDENCE_RUN_ID"])
          assert run.get("id") == requested_id
          assert run.get("name") == "Build SparkEngine"
          assert run.get("path") == ".github/workflows/build.yml"
          assert run.get("head_branch") == "Working"
          assert run.get("status") == "completed"
          assert run.get("conclusion") in {"success", "failure", "cancelled", "timed_out"}
          assert isinstance(run.get("run_attempt"), int) and run["run_attempt"] >= 1
          source_commit = run.get("head_sha", "")
          assert re.fullmatch(r"[0-9a-f]{40}", source_commit)
          assert run.get("repository", {}).get("full_name") == os.environ["GITHUB_REPOSITORY"]

          values = {
              "SOURCE_COMMIT": source_commit,
              "SOURCE_BRANCH": run["head_branch"],
              "REPORTED_EVIDENCE_CONCLUSION": run["conclusion"],
              "EVIDENCE_RUN_ID": str(run["id"]),
              "EVIDENCE_RUN_ATTEMPT": str(run["run_attempt"]),
          }
          for value in values.values():
              assert "\n" not in value and "\r" not in value
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              for key, value in values.items():
                  stream.write(f"{key}={value}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"source_commit={source_commit}\n")
          print(f"Validated {run['name']} run {run['id']} at {source_commit}")
          PY

      - name: Normalize evidence across every build job
        id: normalize_evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          JOBS_FILE="$RUNNER_TEMP/build-evidence-jobs.tsv"
          NON_PASSING_FILE="$RUNNER_TEMP/build-evidence-non-passing.tsv"
          : > "$JOBS_FILE"
          case "$EVIDENCE_RUN_ATTEMPT" in
            ''|*[!0-9]*) echo "Invalid workflow attempt: $EVIDENCE_RUN_ATTEMPT" >&2; exit 1 ;;
          esac
          test "$EVIDENCE_RUN_ATTEMPT" -ge 1

          PAGE=1
          EXPECTED_JOB_COUNT=""
          while true; do
            PAGE_FILE="$RUNNER_TEMP/build-evidence-jobs-${PAGE}.json"
            curl --fail-with-body --silent --show-error \
              --retry 3 \
              --retry-all-errors \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${EVIDENCE_RUN_ID}/attempts/${EVIDENCE_RUN_ATTEMPT}/jobs?per_page=100&page=${PAGE}" \
              --output "$PAGE_FILE"

            PAGE_METADATA="$(python3 -I -c 'import json, os, sys; payload = json.load(open(sys.argv[1], encoding="utf-8")); jobs = payload.get("jobs"); total = payload.get("total_count"); assert isinstance(jobs, list) and isinstance(total, int) and total >= 0; expected_run = int(os.environ["EVIDENCE_RUN_ID"]); expected_sha = os.environ["SOURCE_COMMIT"]; assert all(isinstance(job, dict) and isinstance(job.get("id"), int) and job["id"] > 0 and job.get("run_id") == expected_run and job.get("head_sha") == expected_sha and isinstance(job.get("name"), str) and job["name"] for job in jobs); print(f"{total}\t{len(jobs)}")' \
              "$PAGE_FILE")"
            PAGE_TOTAL_COUNT="${PAGE_METADATA%%$'\t'*}"
            PAGE_JOB_COUNT="${PAGE_METADATA#*$'\t'}"
            if test "$PAGE" -eq 1; then
              EXPECTED_JOB_COUNT="$PAGE_TOTAL_COUNT"
            else
              test "$PAGE_TOTAL_COUNT" -eq "$EXPECTED_JOB_COUNT"
            fi

            if test "$PAGE_JOB_COUNT" -eq 0; then
              break
            fi

            python3 -I -c 'import json, sys; field = lambda value: str(value or "").replace("\\", "\\\\").replace("\t", "\\t").replace("\r", "\\r").replace("\n", "\\n"); payload = json.load(open(sys.argv[1], encoding="utf-8")); [print("\t".join(field(job.get(key)) for key in ("id", "name", "status", "conclusion"))) for job in payload["jobs"]]' \
              "$PAGE_FILE" >> "$JOBS_FILE"

            if test "$PAGE_JOB_COUNT" -lt 100; then
              break
            fi
            PAGE="$((PAGE + 1))"
            test "$PAGE" -le 100
          done

          JOB_COUNT="$(wc -l < "$JOBS_FILE" | tr -d '[:space:]')"
          UNIQUE_JOB_COUNT="$(cut -f 1 "$JOBS_FILE" | LC_ALL=C sort -u | wc -l | tr -d '[:space:]')"
          test "$JOB_COUNT" -eq "$EXPECTED_JOB_COUNT"
          test "$UNIQUE_JOB_COUNT" -eq "$JOB_COUNT"
          awk -F '\t' \
            '$3 != "completed" || ($4 != "success" && $4 != "skipped") { print }' \
            "$JOBS_FILE" > "$NON_PASSING_FILE"

          NORMALIZED_CONCLUSION="failure"
          if test "$EVIDENCE_RUN_ATTEMPT" -eq 1 \
            && test "$JOB_COUNT" -gt 0 \
            && test "$REPORTED_EVIDENCE_CONCLUSION" = "success" \
            && test ! -s "$NON_PASSING_FILE"; then
            NORMALIZED_CONCLUSION="success"
          else
            echo "::warning::The build evidence is not fully passing (workflow=${REPORTED_EVIDENCE_CONCLUSION})."
            if test "$EVIDENCE_RUN_ATTEMPT" -ne 1; then
              echo "::warning::A rerun cannot promote site evidence because a partial rerun does not prove the complete job roster. Push a new commit for a full run."
            fi
            if test "$JOB_COUNT" -eq 0; then
              echo "::warning::The build was cancelled before any jobs materialized; publishing blocked evidence."
            fi
            while IFS=$'\t' read -r JOB_ID JOB_NAME JOB_STATUS JOB_CONCLUSION; do
              printf 'Non-passing job %s: %s (%s/%s)\n' \
                "$JOB_ID" "$JOB_NAME" "$JOB_STATUS" "${JOB_CONCLUSION:-missing}"
            done < "$NON_PASSING_FILE"
          fi

          printf 'Evaluated %s jobs; normalized conclusion: %s\n' \
            "$JOB_COUNT" "$NORMALIZED_CONCLUSION"
          printf 'conclusion=%s\n' "$NORMALIZED_CONCLUSION" >> "$GITHUB_OUTPUT"

      - name: Checkout the evaluated source commit without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve_evidence.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse to prepare a superseded Working snapshot
        id: initial-head
        run: |
          set -euo pipefail
          git fetch --no-tags origin Working:refs/remotes/origin/Working
          if test "$SOURCE_COMMIT" = "$(git rev-parse refs/remotes/origin/Working)"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping superseded commit $SOURCE_COMMIT"
          fi

      - name: Repeat the complete repository proof
        if: steps.initial-head.outputs.publish == 'true'
        env:
          NORMALIZED_EVIDENCE_CONCLUSION: ${{ steps.normalize_evidence.outputs.conclusion }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          python3 tools/site-data/validate.py
          python3 tools/site-data/validate.py --assets
          python3 tools/site-data/validate.py --docs
          python3 tools/site-data/validate.py --legal
          python3 tools/site-data/render_handoff.py --check
          COMMITTED_AT="$(git show -s --format=%cI "$SOURCE_COMMIT")"
          for OUTPUT in "$RUNNER_TEMP/.site-data-proof-a" "$RUNNER_TEMP/.site-data-proof-b"; do
            python3 tools/site-data/generate.py \
              --output "$OUTPUT" \
              --source-commit "$SOURCE_COMMIT" \
              --source-branch "$SOURCE_BRANCH" \
              --committed-at "$COMMITTED_AT" \
              --evidence-commit "$SOURCE_COMMIT" \
              --ci-conclusion "$NORMALIZED_EVIDENCE_CONCLUSION" \
              --workflow-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${EVIDENCE_RUN_ID}/attempts/${EVIDENCE_RUN_ATTEMPT}"
            python3 tools/site-data/validate.py --published "$OUTPUT"
          done
          diff --recursive --brief \
            "$RUNNER_TEMP/.site-data-proof-a" \
            "$RUNNER_TEMP/.site-data-proof-b"

      - name: Seed publication payload from the current public site-data branch
        if: steps.initial-head.outputs.publish == 'true'
        env:
          PUBLISH_DIR: ${{ runner.temp }}/sparkengine-site-data-payload
        run: |
          set -euo pipefail
          mkdir -p "$PUBLISH_DIR"
          if git ls-remote --exit-code --heads origin site-data >/dev/null 2>&1; then
            git fetch --no-tags origin site-data:refs/remotes/origin/site-data
            git archive refs/remotes/origin/site-data | tar -x -C "$PUBLISH_DIR"
          fi

      - name: Generate and validate the retained publication payload
        if: steps.initial-head.outputs.publish == 'true'
        env:
          NORMALIZED_EVIDENCE_CONCLUSION: ${{ steps.normalize_evidence.outputs.conclusion }}
          PUBLISH_DIR: ${{ runner.temp }}/sparkengine-site-data-payload
        run: |
          set -euo pipefail
          COMMITTED_AT="$(git show -s --format=%cI "$SOURCE_COMMIT")"
          python3 tools/site-data/generate.py \
            --output "$PUBLISH_DIR" \
            --preserve-existing \
            --retain 3 \
            --source-commit "$SOURCE_COMMIT" \
            --source-branch "$SOURCE_BRANCH" \
            --committed-at "$COMMITTED_AT" \
            --evidence-commit "$SOURCE_COMMIT" \
            --ci-conclusion "$NORMALIZED_EVIDENCE_CONCLUSION" \
            --workflow-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${EVIDENCE_RUN_ID}/attempts/${EVIDENCE_RUN_ATTEMPT}"
          python3 tools/site-data/validate.py --published "$PUBLISH_DIR"

      - name: Recheck Working immediately before handing off the payload
        id: final-head
        if: steps.initial-head.outputs.publish == 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags origin Working:refs/remotes/origin/Working
          if test "$SOURCE_COMMIT" = "$(git rev-parse refs/remotes/origin/Working)"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping superseded commit $SOURCE_COMMIT"
          fi

      - name: Upload the credential-free publication payload
        if: steps.final-head.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sparkengine-site-data-publication-${{ steps.resolve_evidence.outputs.source_commit }}
          path: ${{ runner.temp }}/sparkengine-site-data-payload
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  site-data-publish:
    name: Publish proven payload with isolated write permission
    needs: site-data-prepare
    if: needs.site-data-prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      EVIDENCE_CONCLUSION: ${{ needs.site-data-prepare.outputs.evidence_conclusion }}
      SOURCE_COMMIT: ${{ needs.site-data-prepare.outputs.source_commit }}
    steps:
      - name: Download the proven publication payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sparkengine-site-data-publication-${{ env.SOURCE_COMMIT }}
          path: ${{ runner.temp }}/sparkengine-site-data-payload

      - name: Recheck Working, commit, recheck again, and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAYLOAD_DIR: ${{ runner.temp }}/sparkengine-site-data-payload
          PUBLISH_REPO: ${{ runner.temp }}/sparkengine-site-data-repository
        run: |
          set -euo pipefail
          test -f "$PAYLOAD_DIR/latest.json"
          test -d "$PAYLOAD_DIR/snapshots/$SOURCE_COMMIT"
          test ! -e "$PAYLOAD_DIR/.git"
          python3 -I -c 'import json, sys; payload = json.load(open(sys.argv[1], encoding="utf-8")); conclusion = sys.argv[2]; assert payload["publication"]["conclusion"] == conclusion; assert payload["publication"]["state"] == ("current" if conclusion == "success" else "blocked")' \
            "$PAYLOAD_DIR/latest.json" "$EVIDENCE_CONCLUSION"

          git init "$PUBLISH_REPO"
          git -C "$PUBLISH_REPO" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$PUBLISH_REPO" fetch --no-tags origin Working:refs/remotes/origin/Working
          if test "$SOURCE_COMMIT" != "$(git -C "$PUBLISH_REPO" rev-parse refs/remotes/origin/Working)"; then
            echo "Skipping superseded commit $SOURCE_COMMIT"
            exit 0
          fi

          if git -C "$PUBLISH_REPO" ls-remote --exit-code --heads origin site-data >/dev/null 2>&1; then
            git -C "$PUBLISH_REPO" fetch --no-tags origin site-data:refs/remotes/origin/site-data
            git -C "$PUBLISH_REPO" switch --create site-data refs/remotes/origin/site-data
            git -C "$PUBLISH_REPO" rm -r --force .
          else
            git -C "$PUBLISH_REPO" switch --orphan site-data
          fi
          cp -a "$PAYLOAD_DIR"/. "$PUBLISH_REPO"/

          git -C "$PUBLISH_REPO" config user.name "github-actions[bot]"
          git -C "$PUBLISH_REPO" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$PUBLISH_REPO" add --all
          if git -C "$PUBLISH_REPO" diff --cached --quiet; then
            echo "site-data already matches $SOURCE_COMMIT"
            exit 0
          fi
          git -C "$PUBLISH_REPO" commit -m "site-data: publish ${SOURCE_COMMIT:0:12} (${EVIDENCE_CONCLUSION})"

          # Minimize the unavoidable cross-ref race: compare after the commit
          # exists and immediately before the only write-capable operation.
          git -C "$PUBLISH_REPO" fetch --no-tags origin Working:refs/remotes/origin/Working
          if test "$SOURCE_COMMIT" != "$(git -C "$PUBLISH_REPO" rev-parse refs/remotes/origin/Working)"; then
            echo "Skipping superseded commit $SOURCE_COMMIT"
            exit 0
          fi
          git -C "$PUBLISH_REPO" remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$PUBLISH_REPO" push origin HEAD:site-data
