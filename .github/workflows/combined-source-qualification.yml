# Combined diagnostic qualification; original release acceptance remains unchanged.
name: Combined source qualification
on:
  push:
    branches: [codex/combined-qualification-20261002]
permissions:
  contents: read
concurrency:
  group: combined-source-${{ github.sha }}
  cancel-in-progress: false
env:
  ARTIFACT_RETENTION_DAYS: 1
  ERROR_RETENTION_DAYS: 1
  CCACHE_COMPRESS: 'true'
  CCACHE_COMPRESSLEVEL: '6'
  CCACHE_MAXSIZE: 1G
  CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,file_stat_matches
  CCACHE_BASEDIR: ${{ github.workspace }}
jobs:
  build-linux-clang:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config:
        - Debug
        - Release
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Verify exact combined source
      shell: bash
      run: |
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git diff --exit-code HEAD
        git rev-parse HEAD HEAD^{tree}
    - name: Install dependencies
      run: |
        sudo apt-get update
        # RHI-230: the VulkanValidation CTest entry requires Lavapipe plus the
        # Khronos validation layer (SPARK_REQUIRE_VULKAN_VALIDATION=1) and fails without them.
        sudo apt-get install -y clang cmake ccache libgl-dev libvulkan-dev glslang-tools libsdl2-dev libfreetype-dev mesa-vulkan-drivers libc++-dev libc++abi-dev vulkan-validationlayers
    - name: Setup ccache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.ccache
        key: combined-ccache-linux-clang-${{ matrix.config }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-${{ github.sha }}
        restore-keys: |
          ccache-linux-clang-${{ matrix.config }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-
          ccache-linux-clang-${{ matrix.config }}-
    - name: Restore build directory
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: build
        key: combined-build-linux-clang-${{ matrix.config }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-${{ github.sha }}
        restore-keys: |
          build-linux-clang-${{ matrix.config }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-
          build-linux-clang-${{ matrix.config }}-
    - name: Scrub restored test evidence
      if: always()
      shell: bash
      run: |
        rm -f \
          build/SparkTests-junit.xml \
          build/SparkTests.log \
          build/SparkTests-output.log \
          build/SparkTests-load-junit.xml \
          build/SparkTests-load.log \
          build/SparkTests-load-output.log \
          build/ctest-junit.xml \
          build/*-process-smoke.log \
          build/*-process-smoke.json \
          build/*-process-smoke.xml
    - name: Configure CMake
      run: |
        set -o pipefail
        spark_engine_version=$(grep -o 'SPARK_ENGINE_VERSION [^ ]*' CMakeLists.txt | cut -d' ' -f2 | sed 's/^"//;s/"$//')
        test -n "$spark_engine_version"
        command -v ccache >/dev/null && ccache --zero-stats || echo "::warning::ccache not installed, proceeding without cache"
        cmake -B build \
          -DSPARK_ENGINE_VERSION="$spark_engine_version" \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DBUILD_TESTS=ON \
          -DENABLE_LTO=OFF \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
          -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ -lc++abi" \
          -DCMAKE_SHARED_LINKER_FLAGS="-stdlib=libc++" 2>&1 | tee cmake-configure.log
    - name: Build all targets
      run: "set -o pipefail\n# Remove stale PCH files \u2014 cached build dirs may have PCH built against\n# older system headers (e.g. unistd_64.h mtime changes after apt-get).\nfind build -name '*.pch' -delete 2>/dev/null || true\n# Purge cached static archives unconditionally. apt-get install of\n# clang between cached runs can change the object-file ABI (LLVM\n# major version bump, libc++ ABI bump). The on-disk .a archive\n# looks valid to `ar t`, but ld rejects it with\n#   libJolt.a: error adding symbols: file format not recognized\n# Deleting the archive forces CMake to rebuild just the final lib\n# (all the underlying .o files still come straight out of ccache).\nfind build -name 'lib*.a' -delete 2>/dev/null || true\ncmake --build build --parallel $(nproc) 2>&1 | tee cmake-build.log\n"
    - name: Print ccache stats
      if: always()
      run: command -v ccache >/dev/null && ccache --show-stats || echo "::warning::ccache not installed, skipping stats"
    - name: Run Tests
      run: |
        set -o pipefail
        ctest --test-dir build -C ${{ matrix.config }} \
          --label-exclude '^experimental-modules$' \
          --output-on-failure --no-tests=error --parallel 2 \
          --output-junit ctest-junit.xml 2>&1 | tee test-results.log
    - name: Validate and summarize test statistics
      if: always()
      run: "test -s build/SparkTests-junit.xml\ntest -s build/SparkTests.log\ntest -s build/SparkTests-output.log\ntest -s build/ctest-junit.xml\ntest -s build/SparkTests-load-junit.xml\ntest -s build/test-registration-count.json\npython3 .github/scripts/summarize-test-results.py \\\n  build/SparkTests-junit.xml \\\n  build/SparkTests-load-junit.xml \\\n  --min-tests 6900 \\\n  --registration-count build/test-registration-count.json \\\n  --title \"SparkTests \u2014 Linux Clang ${{ matrix.config }}\" \\\n  --json test-stats-linux-clang-${{ matrix.config }}.json\n"
    - name: Upload machine-readable test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: combined-test-results-linux-clang-${{ matrix.config }}
        path: |
          build/SparkTests-junit.xml
          build/SparkTests.log
          build/SparkTests-output.log
          build/SparkTests-load-junit.xml
          build/SparkTests-load.log
          build/SparkTests-load-output.log
          build/ctest-junit.xml
          build/*-process-smoke.log
          build/*-process-smoke.json
          build/*-process-smoke.xml
          test-stats-linux-clang-${{ matrix.config }}.json
          test-results.log
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
        if-no-files-found: error
    - name: Extract error summary
      if: failure()
      run: |
        .github/scripts/extract-errors.sh \
          "build-linux-clang-${{ matrix.config }}" \
          error-summary.json \
          cmake-configure.log cmake-build.log test-results.log
    - name: Upload error summary
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: combined-ci-errors-linux-clang-${{ matrix.config }}
        path: error-summary.json
        retention-days: ${{ env.ERROR_RETENTION_DAYS }}
    timeout-minutes: 120
  build-linux-tsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - name: Define TSan evidence directory
      shell: bash
      run: echo "SANITIZER_EVIDENCE_DIR=${RUNNER_TEMP}/spark-sanitizer-tsan-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-build-linux-tsan" >> "$GITHUB_ENV"
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Verify exact combined source
      shell: bash
      run: |
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git diff --exit-code HEAD
        git rev-parse HEAD HEAD^{tree}
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-14 g++-14 cmake ccache libgl-dev libvulkan-dev glslang-tools libsdl2-dev libfreetype-dev mesa-vulkan-drivers
    - name: Setup ccache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.ccache
        key: combined-ccache-linux-tsan-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-${{ github.sha }}
        restore-keys: |
          ccache-linux-tsan-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-
          ccache-linux-tsan-
    - name: Restore build directory
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: build
        key: combined-build-linux-tsan-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-${{ github.sha }}
        restore-keys: |
          build-linux-tsan-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-
          build-linux-tsan-
    - name: Configure CMake (TSan)
      run: |
        spark_engine_version=$(grep -o 'SPARK_ENGINE_VERSION [^ ]*' CMakeLists.txt | cut -d' ' -f2 | sed 's/^"//;s/"$//')
        test -n "$spark_engine_version"
        command -v ccache >/dev/null && ccache --zero-stats || echo "::warning::ccache not installed, proceeding without cache"
        cmake -B build \
          -DSPARK_ENGINE_VERSION="$spark_engine_version" \
          -DCMAKE_BUILD_TYPE=Debug \
          -DBUILD_TESTS=ON \
          -DCMAKE_C_COMPILER=gcc-14 \
          -DCMAKE_CXX_COMPILER=g++-14 \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
          -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread"
    - name: Build
      run: |
        set -o pipefail
        cmake --build build --parallel $(nproc) 2>&1 | tee cmake-build.log
    - name: Print ccache stats
      if: always()
      run: command -v ccache >/dev/null && ccache --show-stats || echo "::warning::ccache not installed, skipping stats"
    - name: Run Tests under TSan
      env:
        TSAN_OPTIONS: halt_on_error=0:second_deadlock_stack=1:print_suppressions=1:suppressions=${{ github.workspace }}/Tests/tsan_suppressions.txt
      run: |
        bash .github/scripts/run-sanitizer-tests.sh \
          --evidence-root "${{ runner.temp }}" \
          --sanitizer tsan \
          --expected-sha "${{ github.sha }}" \
          --run-id "${{ github.run_id }}" \
          --run-attempt "${{ github.run_attempt }}" \
          --job "${{ github.job }}" \
          --expected-selector all \
          --minimum-tests 6900 \
          --timeout-seconds 3000 \
          --runtime-env TSAN_OPTIONS \
          -- build/bin/SparkTests --warn-is-error --shuffle 123
    - name: Summarize TSan exact-commit test evidence
      run: "python3 .github/scripts/summarize-test-results.py \\\n  \"$SANITIZER_EVIDENCE_DIR/junit.xml\" \\\n  --min-tests 6900 \\\n  --title \"SparkTests \u2014 Linux TSan\" \\\n  --json \"$SANITIZER_EVIDENCE_DIR/test-stats-linux-tsan.json\"\n"
    - name: Verify published TSan exact-commit evidence
      run: |
        python3 .github/scripts/verify-sanitizer-evidence.py verify-published \
          --evidence-dir "$SANITIZER_EVIDENCE_DIR" \
          --stats "$SANITIZER_EVIDENCE_DIR/test-stats-linux-tsan.json" \
          --sanitizer tsan \
          --lane linux-tsan \
          --expected-sha "${{ github.sha }}" \
          --run-id "${{ github.run_id }}" \
          --run-attempt "${{ github.run_attempt }}" \
          --job build-linux-tsan \
          --minimum-tests 6900 \
          --timeout-seconds 3000
    - name: Extract error summary
      if: failure()
      run: |
        .github/scripts/extract-errors.sh \
          "build-linux-tsan" \
          error-summary.json \
          cmake-build.log \
          "$SANITIZER_EVIDENCE_DIR/console.txt" \
          "$SANITIZER_EVIDENCE_DIR/process-footer.txt" \
          "$SANITIZER_EVIDENCE_DIR/metadata.json" \
          "$SANITIZER_EVIDENCE_DIR"/runtime/sanitizer.*
    - name: Upload error summary
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: combined-ci-errors-linux-tsan
        path: error-summary.json
        retention-days: ${{ env.ERROR_RETENTION_DAYS }}
    - name: Upload TSan report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: combined-sanitizer-report-tsan
        path: ${{ env.SANITIZER_EVIDENCE_DIR }}
        if-no-files-found: error
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
    - name: Upload TSan exact-commit test evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: combined-test-results-linux-tsan
        path: ${{ env.SANITIZER_EVIDENCE_DIR }}
        if-no-files-found: error
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
  coverage:
    name: Code Coverage (GCC + per-subsystem thresholds)
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CCACHE_MAXSIZE: 3G
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Verify exact combined source
      shell: bash
      run: |
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git diff --exit-code HEAD
        git rev-parse HEAD HEAD^{tree}
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y gcc-14 g++-14 lcov ccache libgl-dev libsdl2-dev libfreetype-dev
    - name: Setup ccache
      id: ccache-restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.ccache
        key: combined-ccache-coverage-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-${{ github.sha }}
        restore-keys: |
          ccache-coverage-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-
          ccache-coverage-
    - name: Restore build directory
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: build
        key: combined-build-coverage-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-${{ github.sha }}
        restore-keys: |
          build-coverage-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-
          build-coverage-
    - name: Configure
      run: |
        spark_engine_version=$(grep -o 'SPARK_ENGINE_VERSION [^ ]*' CMakeLists.txt | cut -d' ' -f2 | sed 's/^"//;s/"$//')
        test -n "$spark_engine_version"
        # Pin ccache to the directory the cache steps persist. Unset, ccache
        # 4.9 writes to ~/.cache/ccache and ~/.ccache is never created.
        mkdir -p "$HOME/.ccache"
        echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
        export CCACHE_DIR="$HOME/.ccache"
        command -v ccache >/dev/null && ccache --zero-stats || echo "::warning::ccache not installed, proceeding without cache"
        # -pthread, not -fprofile-update=atomic: the GCC driver turns
        # --coverage + -pthread into -fprofile-update=prefer-atomic (atomic on
        # x86-64), so counters stay race-free, while ccache 4.9 (Ubuntu 24.04)
        # rejects any unknown -fprofile-* option as an unsupported compiler
        # option, which made every coverage compile uncacheable.
        g++-14 -dumpspecs | grep -q 'pthread:-fprofile-update=prefer-atomic' || {
          echo "::error::g++-14 no longer maps -pthread to -fprofile-update=prefer-atomic"; exit 1; }
        cmake -B build -DCMAKE_BUILD_TYPE=Debug \
          -DSPARK_ENGINE_VERSION="$spark_engine_version" \
          -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_FLAGS="--coverage -pthread" -DCMAKE_C_FLAGS="--coverage -pthread" \
          -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
          -DBUILD_TESTS=ON -DBUILD_GAME_MODULES=ON
    - name: Build
      run: |
        # pipefail so a cmake --build failure is not masked by tee
        set -o pipefail
        # Coverage executes SparkTests only; building the default target also
        # compiles unrelated tools and product binaries inside the job budget
        # (75 minutes, OD-29). SparkTests still brings in every library and module it
        # links, so the instrumented test corpus and coverage thresholds are
        # unchanged.
        cmake --build build --target SparkTests --parallel $(nproc) 2>&1 | tee cmake-build.log
    - name: Print ccache stats
      if: always()
      run: command -v ccache >/dev/null && ccache --show-stats || echo "::warning::ccache not installed, skipping stats"
    - name: Save ccache
      if: ${{ always() && steps.ccache-restore.outcome == 'success' && steps.ccache-restore.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.ccache
        key: combined-${{ steps.ccache-restore.outputs.cache-primary-key }}
    - name: Test
      id: coverage-tests
      env:
        SPARK_TEST_EXCLUDE: LoadTest_
      run: |
        set +e
        set -o pipefail
        cd build && ./bin/SparkTests --verbose 2>&1 | tee ../test-output.log
        test_exit=${PIPESTATUS[0]}
        tail -5 ../test-output.log
        exit "$test_exit"
    - name: Generate coverage
      id: generate-coverage
      if: always()
      run: "set +e\nlcov --capture --directory build --output-file coverage.info \\\n  --gcov-tool gcov-14 \\\n  --ignore-errors mismatch,mismatch,gcov,negative,unused,source,inconsistent \\\n  --rc geninfo_unexecuted_blocks=1 2>&1 | tee lcov-capture.log\ncap_exit=${PIPESTATUS[0]}\necho \"lcov --capture exit: $cap_exit\"\n\nlcov --remove coverage.info '/usr/*' '*/ThirdParty/*' '*/Tests/*' \\\n  --output-file coverage.info \\\n  --ignore-errors unused,negative,inconsistent 2>&1 | tee lcov-remove.log\nrm_exit=${PIPESTATUS[0]}\necho \"lcov --remove exit: $rm_exit\"\n\nlcov --list coverage.info --ignore-errors unused,negative,inconsistent 2>&1 \\\n  | tee coverage-summary.txt\nlist_exit=${PIPESTATUS[0]}\necho \"lcov --list exit: $list_exit\"\n\nif [ ! -s coverage.info ]; then\n  echo \"::error::coverage.info is empty or missing \u2014 lcov produced no usable data\"\n  exit 1\nfi\n# --ignore-errors already defines the warnings this lane permits.\n# Any remaining non-zero status means capture, filtering, or report\n# validation was incomplete; a non-empty partial trace is not enough\n# evidence for subsystem thresholds.\nif [ \"$cap_exit\" -ne 0 ] || [ \"$rm_exit\" -ne 0 ] || [ \"$list_exit\" -ne 0 ]; then\n  echo \"::error::lcov coverage evidence is incomplete (capture=$cap_exit remove=$rm_exit list=$list_exit)\"\n  exit 1\nfi\n"
    - name: Per-subsystem coverage analysis
      id: subsystem-coverage
      if: always()
      run: |
        set +e
        chmod +x scripts/coverage-report.sh
        scripts/coverage-report.sh coverage.info --json coverage.json 2>&1 | tee subsystem-coverage.txt
        threshold_exit=${PIPESTATUS[0]}
        if [ "$threshold_exit" -ne 0 ]; then
          echo "coverage: error: Per-subsystem coverage analysis or threshold enforcement failed" | tee -a subsystem-coverage.txt
        fi
        exit "$threshold_exit"
    - name: Extract error summary
      if: |-
        always() && (failure() ||
         steps.coverage-tests.outcome == 'failure' ||
         steps.generate-coverage.outcome == 'failure' ||
         steps.subsystem-coverage.outcome == 'failure')
      run: |
        .github/scripts/extract-errors.sh \
          "coverage" \
          error-summary.json \
          cmake-build.log test-output.log lcov-capture.log lcov-remove.log \
          coverage-summary.txt subsystem-coverage.txt
    - name: Upload error summary
      if: |-
        always() && (failure() ||
         steps.coverage-tests.outcome == 'failure' ||
         steps.generate-coverage.outcome == 'failure' ||
         steps.subsystem-coverage.outcome == 'failure')
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: combined-ci-errors-coverage
        path: error-summary.json
        retention-days: ${{ env.ERROR_RETENTION_DAYS }}
    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: combined-coverage-report
        path: |
          coverage.info
          coverage.json
          subsystem-coverage.txt
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
        if-no-files-found: warn
    - name: Enforce coverage test and threshold results
      if: always()
      env:
        TEST_OUTCOME: ${{ steps.coverage-tests.outcome }}
        GENERATE_OUTCOME: ${{ steps.generate-coverage.outcome }}
        THRESHOLD_OUTCOME: ${{ steps.subsystem-coverage.outcome }}
      run: |
        failed=0
        if [ "$TEST_OUTCOME" != "success" ]; then
          echo "::error::SparkTests coverage step ended as '$TEST_OUTCOME'"
          failed=1
        fi
        if [ "$GENERATE_OUTCOME" != "success" ]; then
          echo "::error::Coverage generation step ended as '$GENERATE_OUTCOME'"
          failed=1
        fi
        if [ "$THRESHOLD_OUTCOME" != "success" ]; then
          echo "::error::Coverage threshold step ended as '$THRESHOLD_OUTCOME'"
          failed=1
        fi
        exit "$failed"
  build-windows-vs2026:
    if: github.ref == 'refs/heads/Working' || github.ref == 'refs/heads/main' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2025-vs2026
    env:
      SCCACHE_IDLE_TIMEOUT: '0'
      SCCACHE_LOG: info
    strategy:
      fail-fast: false
      matrix:
        config:
        - Release
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Verify exact combined source
      shell: bash
      run: |
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git diff --exit-code HEAD
        git rev-parse HEAD HEAD^{tree}
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57
    - name: Install sccache v0.17.0 (hash-pinned)
      shell: pwsh
      env:
        SCCACHE_VERSION: v0.17.0
        SCCACHE_SHA256: caf1932d76a909c909b7a2e41443cdfe3c79a49a380da1a22fa422e1d00d3ca7
      run: |
        $name = "sccache-$env:SCCACHE_VERSION-x86_64-pc-windows-msvc"
        $url = "https://github.com/mozilla/sccache/releases/download/$env:SCCACHE_VERSION/$name.tar.gz"
        $dest = Join-Path $env:RUNNER_TEMP "sccache-bin"
        New-Item -ItemType Directory -Force -Path $dest | Out-Null
        $archive = Join-Path $dest "$name.tar.gz"
        $attempt = 0
        while ($true) {
          $attempt++
          try { Invoke-WebRequest -Uri $url -OutFile $archive; break }
          catch {
            if ($attempt -ge 3) { throw }
            Write-Host "sccache download attempt $attempt failed: $($_.Exception.Message)"
            Start-Sleep -Seconds (10 * $attempt)
          }
        }
        $actual = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
        if ($actual -ne $env:SCCACHE_SHA256) {
          throw "sccache archive hash mismatch: expected $env:SCCACHE_SHA256, got $actual"
        }
        & (Join-Path $env:SystemRoot "System32\tar.exe") -xf $archive -C $dest
        $bin = Join-Path $dest $name
        if (-not (Test-Path (Join-Path $bin "sccache.exe"))) { throw "sccache.exe missing after extraction in $bin" }
        Add-Content -Path $env:GITHUB_PATH -Value $bin -Encoding utf8
        Add-Content -Path $env:GITHUB_ENV -Value "SCCACHE_DIR=$(Join-Path $env:RUNNER_TEMP 'sccache')" -Encoding utf8
        Add-Content -Path $env:GITHUB_ENV -Value "SCCACHE_ERROR_LOG=$(Join-Path $env:RUNNER_TEMP 'sccache-server.log')" -Encoding utf8
        & (Join-Path $bin "sccache.exe") --version
    - name: Restore sccache cache
      id: sccache-restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ runner.temp }}\sccache
        key: combined-sccache-windows-vs2026-${{ matrix.config }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-${{ github.sha }}
        restore-keys: |
          sccache-windows-vs2026-${{ matrix.config }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-
          sccache-windows-vs2026-${{ matrix.config }}-
    - name: Scrub restored test evidence
      if: always()
      shell: bash
      run: |
        rm -f \
          build/SparkTests-junit.xml \
          build/SparkTests.log \
          build/SparkTests-output.log \
          build/SparkTests-load-junit.xml \
          build/SparkTests-load.log \
          build/SparkTests-load-output.log \
          build/ctest-junit.xml \
          build/*-process-smoke.log \
          build/*-process-smoke.json \
          build/*-process-smoke.xml
    - name: Require Visual Studio 2026
      shell: pwsh
      run: |
        $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
        if (-not (Test-Path $vswhere)) {
          throw "vswhere is unavailable; cannot verify Visual Studio 2026"
        }
        $install = & $vswhere -latest -products * -version '[18.0,19.0)' -property installationPath
        if (-not $install) {
          throw "Visual Studio 2026 is unavailable on this runner"
        }
        Write-Host "Visual Studio 2026: $install"
    - name: Enter Visual Studio 2026 developer environment (x64)
      shell: pwsh
      run: |
        $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
        if (-not (Test-Path $vswhere)) { throw "vswhere is unavailable; cannot locate Visual Studio 2026" }
        $install = & $vswhere -latest -products * -version '[18.0,19.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $install) { throw "Visual Studio 2026 with the v145 toolset is unavailable on this runner" }
        $before = @{}
        Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
        Import-Module (Join-Path $install "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
        Enter-VsDevShell -VsInstallPath $install -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"
        foreach ($entry in Get-ChildItem env:) {
          if ($entry.Name.StartsWith('=')) { continue }
          if ($entry.Value -match "[`r`n]") { continue }
          if ($before[$entry.Name] -ne $entry.Value) {
            Add-Content -Path $env:GITHUB_ENV -Value "$($entry.Name)=$($entry.Value)" -Encoding utf8
          }
        }
        Get-Command cl.exe, rc.exe, ninja.exe, cmake.exe | Format-Table Name, Source -AutoSize
        ninja --version
        cmake --version
    - name: Start sccache server
      shell: bash
      run: |
        sccache --start-server
        sccache --show-stats
    - name: Configure CMake (VS 2026 / v145)
      shell: bash
      run: |
        set -o pipefail
        cmake --fresh -B build -G "Ninja Multi-Config" \
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl \
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded \
          -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON \
          -DCMAKE_CXX_SCAN_FOR_MODULES=OFF \
          -DGENERATE_DEBUG_SYMBOLS=OFF \
          -DBUILD_TESTS=ON 2>&1 | tee cmake-configure.log
    - name: Install hash-pinned PyYAML into the configured test interpreter
      if: matrix.config == 'Release'
      shell: bash
      run: |
        set -euo pipefail
        python3_exe="$(ctest --test-dir build -C ${{ matrix.config }} --show-only=json-v1 -R '^ReleaseApproval_Record$' \
          | python -c 'import json, sys; print(json.load(sys.stdin)["tests"][0]["command"][0])')"
        test -n "$python3_exe" || { echo "::error::ReleaseApproval_Record registers no interpreter"; exit 1; }
        "$python3_exe" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps \
          -r .github/ci-python-requirements.txt
        "$python3_exe" -c "import sys, yaml; print(sys.executable, 'PyYAML', yaml.__version__)"
    - name: Build
      run: cmake --build build --config ${{ matrix.config }} --parallel
      id: combined-build
    - name: Print sccache stats
      if: always()
      shell: bash
      env:
        SCCACHE_RESTORED_KEY: ${{ steps.sccache-restore.outputs.cache-matched-key }}
      run: "set -o pipefail\nsccache --show-stats 2>&1 | tee sccache-stats.txt || echo \"::warning::sccache --show-stats failed\"\nrequests=\"$(awk '$1==\"Compile\" && $2==\"requests\" && NF==3 {print $3; exit}' sccache-stats.txt)\"\nif [ \"${requests:-0}\" = \"0\" ]; then\n  echo \"::warning::sccache handled 0 compile requests: the launcher is not wired (INERT)\"\nfi\nif awk '/^Cache (errors|read errors|write errors|timeouts)/ && $NF+0 != 0 {found=1} END {exit !found}' sccache-stats.txt; then\n  echo \"::warning::sccache reported non-zero cache error counters; see sccache-stats.txt and the sccache server log artifact\"\nfi\nif [ -z \"${SCCACHE_RESTORED_KEY}\" ]; then\n  echo \"::warning::no sccache cache was restored (expected only on the first run of this key family); this build was cold\"\nfi\n{ echo \"### sccache \u2014 build-windows-vs2026 ${{ matrix.config }}\"; echo \"restored key: ${SCCACHE_RESTORED_KEY:-<none>}\"; echo '```'; cat sccache-stats.txt; echo '```'; } >> \"$GITHUB_STEP_SUMMARY\"\nsccache --stop-server || echo \"::warning::sccache --stop-server failed\"\n"
    - name: Save sccache cache
      if: ${{ !cancelled() && steps.sccache-restore.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ runner.temp }}\sccache
        key: combined-${{ steps.sccache-restore.outputs.cache-primary-key }}
    - name: Install D3D12 debug layer
      if: matrix.config == 'Release'
      shell: pwsh
      run: |
        $layers = Join-Path $env:SystemRoot 'System32\d3d12SDKLayers.dll'
        if (-not (Test-Path -LiteralPath $layers)) {
          Add-WindowsCapability -Online -Name 'Tools.Graphics.DirectX~~~~0.0.1.0' -ErrorAction Stop | Out-Host
        }
        if (-not (Test-Path -LiteralPath $layers)) {
          throw "Graphics Tools installed but $layers is missing; D3D12_Validation cannot run"
        }
        "d3d12SDKLayers.dll $((Get-Item -LiteralPath $layers).VersionInfo.FileVersion)"
    - name: Run Tests
      if: matrix.config == 'Release'
      run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure --no-tests=error --parallel 2 --output-junit ctest-junit.xml
    - name: Verify approved Primary WARP images and negative controls
      if: always() && steps.combined-build.outcome == 'success'
      shell: pwsh
      run: |
        python .github/scripts/verify-approved-primary.py --exe build/bin/Release/SparkTests.exe --output "${{ runner.temp }}/combined-primary"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Retain Primary diagnostic evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: combined-primary-${{ github.sha }}
        path: ${{ runner.temp }}/combined-primary
        if-no-files-found: warn
        retention-days: 1
    - name: Validate and summarize test statistics
      if: always() && matrix.config == 'Release'
      shell: bash
      run: "test -s build/SparkTests-junit.xml\ntest -s build/SparkTests.log\ntest -s build/SparkTests-output.log\ntest -s build/ctest-junit.xml\ntest -s build/SparkTests-load-junit.xml\ntest -s build/test-registration-count.json\npython .github/scripts/summarize-test-results.py \\\n  build/SparkTests-junit.xml \\\n  build/SparkTests-load-junit.xml \\\n  --min-tests 6800 \\\n  --registration-count build/test-registration-count.json \\\n  --title \"SparkTests \u2014 Windows VS2026 Release\" \\\n  --json test-stats-windows-vs2026-release.json\n"
    - name: Upload machine-readable test results
      if: always() && matrix.config == 'Release'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: combined-test-results-windows-vs2026-release
        path: |
          build/SparkTests-junit.xml
          build/SparkTests.log
          build/SparkTests-output.log
          build/SparkTests-load-junit.xml
          build/SparkTests-load.log
          build/SparkTests-load-output.log
          build/ctest-junit.xml
          build/*-process-smoke.log
          build/*-process-smoke.json
          build/*-process-smoke.xml
          test-stats-windows-vs2026-release.json
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
        if-no-files-found: error
    - name: Upload sccache server log
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: combined-sccache-server-log-windows-vs2026-${{ matrix.config }}
        path: ${{ runner.temp }}\sccache-server.log
        retention-days: ${{ env.ERROR_RETENTION_DAYS }}
        if-no-files-found: ignore
    timeout-minutes: 120
