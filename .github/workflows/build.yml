name: Build SparkEngine

on:
  push:
    branches: [ main, develop, Working, 'feature/**', 'claude/**' ]
  pull_request:
    branches: [ main, develop, Working ]

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Code Quality — clang-format enforcement
  # ===========================================================================
  check-format:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install clang-format
      run: sudo apt-get update && sudo apt-get install -y clang-format

    - name: Check formatting
      run: |
        find SparkEngine/Source GameModules/SparkGame/Source GameModules/SparkGameMMO/Source SparkEditor/Source SparkConsole/src SparkShaderCompiler/src \
          -not -path '*/Metal/*' \
          \( -name '*.h' -o -name '*.hpp' -o -name '*.cpp' \) | \
          xargs clang-format --dry-run --Werror 2>&1 || {
            echo "::error::Code formatting violations found. Run 'clang-format -i' on the listed files."
            exit 1
          }

  # ===========================================================================
  # Prompt System Validation — anti-drift, overload prevention, stale detection
  # ===========================================================================
  validate-prompts:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Validate prompt system
      run: ./tools/validate-prompts.sh --ci

  # ===========================================================================
  # Linux Build — GCC with AddressSanitizer
  # ===========================================================================
  build-linux-asan:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libgl-dev libvulkan-dev libsdl2-dev

    - name: Configure CMake (ASan + UBSan)
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DBUILD_TESTS=ON \
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

    - name: Build
      run: cmake --build build --parallel $(nproc)

    - name: Run Tests under ASan
      run: |
        cd build
        ctest --output-on-failure || true
        ./bin/SparkTests

  # ===========================================================================
  # Windows Build (MSVC VS 2022, v143 toolset + DirectX 11)
  # ===========================================================================
  build-windows-vs2022:
    runs-on: windows-latest
    strategy:
      matrix:
        config: [Debug, Release]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v3

    - name: Configure CMake (VS 2022 / v143)
      run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DSPARK_MSVC_TOOLSET=v143 -DBUILD_TESTS=ON

    - name: Build
      run: cmake --build build --config ${{ matrix.config }} --parallel

    - name: Run Tests
      if: matrix.config == 'Release'
      run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

    - name: Package build output
      if: matrix.config == 'Release'
      shell: pwsh
      run: |
        $outDir = "dist/SparkEngine-Windows-${{ matrix.config }}"
        New-Item -ItemType Directory -Force -Path $outDir | Out-Null
        if (Test-Path "build/bin/${{ matrix.config }}") {
          Copy-Item "build/bin/${{ matrix.config }}/*" $outDir -Recurse -Force
        } elseif (Test-Path "build/bin") {
          Copy-Item "build/bin/*" $outDir -Recurse -Force
        }
        Compress-Archive -Path $outDir -DestinationPath "SparkEngine-Windows-${{ matrix.config }}.zip"

    - name: Upload Build Artifacts
      if: matrix.config == 'Release'
      uses: actions/upload-artifact@v7
      with:
        name: SparkEngine-Windows-VS2022-${{ matrix.config }}
        path: SparkEngine-Windows-${{ matrix.config }}.zip
        retention-days: 14

  # ===========================================================================
  # Windows Build (MSVC VS 2022 generator + v144 toolset for VS 2026)
  # Uses VS 2022 generator since CMake does not yet have a VS 2026 generator.
  # Marked continue-on-error until v144 toolset is broadly available on runners.
  # ===========================================================================
  build-windows-vs2026:
    runs-on: windows-latest
    continue-on-error: true
    strategy:
      matrix:
        config: [Debug, Release]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v3

    - name: Check v144 toolset availability
      id: check-v144
      shell: pwsh
      run: |
        # v144 platform toolset ships with VS 2026. Check if the toolset props file exists.
        $propsPath = Join-Path $env:ProgramFiles "Microsoft Visual Studio" "2022" "Enterprise" `
          "MSBuild" "Microsoft" "VC" "v170" "Platforms" "x64" "PlatformToolsets" "v144"
        if (Test-Path $propsPath) {
          echo "available=true" >> $env:GITHUB_OUTPUT
          Write-Host "v144 toolset found"
        } else {
          echo "available=false" >> $env:GITHUB_OUTPUT
          Write-Host "v144 toolset not found — skipping VS 2026 build"
        }

    - name: Configure CMake (VS 2022 generator / v144 toolset)
      if: steps.check-v144.outputs.available == 'true'
      run: cmake -B build -G "Visual Studio 17 2022" -A x64 -T v144 -DSPARK_MSVC_TOOLSET=v144 -DBUILD_TESTS=ON

    - name: Build
      if: steps.check-v144.outputs.available == 'true'
      run: cmake --build build --config ${{ matrix.config }} --parallel

    - name: Run Tests
      if: steps.check-v144.outputs.available == 'true' && matrix.config == 'Release'
      run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

    - name: Upload Build Artifacts
      if: steps.check-v144.outputs.available == 'true' && matrix.config == 'Release'
      uses: actions/upload-artifact@v7
      with:
        name: SparkEngine-Windows-VS2026-${{ matrix.config }}
        path: build/bin/${{ matrix.config }}/
        retention-days: 14

  # ===========================================================================
  # Linux Build - GCC
  # ===========================================================================
  build-linux-gcc:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        config: [Debug, Release]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libgl-dev libvulkan-dev libsdl2-dev

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DBUILD_TESTS=ON \
          -DCMAKE_C_COMPILER=gcc \
          -DCMAKE_CXX_COMPILER=g++

    - name: Build all targets
      run: cmake --build build --parallel $(nproc)

    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure || true
        ./bin/SparkTests

    - name: Package build output
      if: matrix.config == 'Release'
      run: |
        mkdir -p dist/SparkEngine-Linux-GCC-${{ matrix.config }}
        cp -r build/bin/* dist/SparkEngine-Linux-GCC-${{ matrix.config }}/
        tar -czf SparkEngine-Linux-GCC-${{ matrix.config }}.tar.gz \
          -C dist SparkEngine-Linux-GCC-${{ matrix.config }}

    - name: Upload Build Artifacts
      if: matrix.config == 'Release'
      uses: actions/upload-artifact@v7
      with:
        name: SparkEngine-Linux-GCC-${{ matrix.config }}
        path: SparkEngine-Linux-GCC-${{ matrix.config }}.tar.gz
        retention-days: 14

  # ===========================================================================
  # Linux Build - Clang (LLVM)
  # ===========================================================================
  build-linux-clang:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        config: [Debug, Release]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake libgl-dev libvulkan-dev libsdl2-dev

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DBUILD_TESTS=ON \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++

    - name: Build all targets
      run: cmake --build build --parallel $(nproc)

    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure || true
        ./bin/SparkTests

    - name: Package build output
      if: matrix.config == 'Release'
      run: |
        mkdir -p dist/SparkEngine-Linux-Clang-${{ matrix.config }}
        cp -r build/bin/* dist/SparkEngine-Linux-Clang-${{ matrix.config }}/
        tar -czf SparkEngine-Linux-Clang-${{ matrix.config }}.tar.gz \
          -C dist SparkEngine-Linux-Clang-${{ matrix.config }}

    - name: Upload Build Artifacts
      if: matrix.config == 'Release'
      uses: actions/upload-artifact@v7
      with:
        name: SparkEngine-Linux-Clang-${{ matrix.config }}
        path: SparkEngine-Linux-Clang-${{ matrix.config }}.tar.gz
        retention-days: 14

  # ===========================================================================
  # Code Coverage — GCC with lcov
  # ===========================================================================
  coverage:
    name: "Code Coverage (GCC)"
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y lcov libgl-dev libsdl2-dev
      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_FLAGS="--coverage" -DCMAKE_C_FLAGS="--coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DBUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Debug
      - name: Test
        run: cd build && ctest --output-on-failure
      - name: Generate coverage
        run: |
          lcov --capture --directory build --output-file coverage.info --ignore-errors mismatch,gcov --rc geninfo_unexecuted_blocks=1
          lcov --remove coverage.info '/usr/*' '*/ThirdParty/*' '*/Tests/*' --output-file coverage.info --ignore-errors unused
          lcov --list coverage.info --ignore-errors unused
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.info
          retention-days: 14

  # ===========================================================================
  # Static Analysis — Clang-Tidy
  # ===========================================================================
  clang-tidy:
    name: "Clang-Tidy Analysis"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang-tidy libgl-dev libsdl2-dev
      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Run clang-tidy
        run: |
          find SparkEngine/Source -name '*.cpp' | head -30 | \
            xargs clang-tidy -p build --warnings-as-errors="" 2>&1 | tail -100
        continue-on-error: true

  # ===========================================================================
  # Code Hygiene — TODO/FIXME/HACK comment count
  # ===========================================================================
  todo-count:
    name: "TODO/FIXME Count"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Count TODO/FIXME/HACK comments
        run: |
          count=$(grep -rn 'TODO\|FIXME\|HACK\|XXX' SparkEngine/Source SparkEditor/Source GameModules --include='*.h' --include='*.cpp' | wc -l)
          echo "Found $count TODO/FIXME/HACK/XXX comments"
          if [ "$count" -gt 20 ]; then
            echo "::warning::TODO/FIXME count ($count) exceeds threshold of 20"
          fi
