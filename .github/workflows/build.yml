name: Build SparkEngine

on:
  push:
    branches: [ main, develop, Working, 'feature/**', 'claude/**', 'release/**' ]
  pull_request:
    branches: [ main, develop, Working ]
  workflow_dispatch:

# Supersede stale pull-request runs, but preserve every pushed SHA so the
# required gate and its evidence can reach a terminal state for Working.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ARTIFACT_RETENTION_DAYS: 14
  ERROR_RETENTION_DAYS: 1
  # ── Compiler cache (ccache) tuning for incremental CI builds ──
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "6"
  CCACHE_MAXSIZE: "1G"
  CCACHE_SLOPPINESS: "pch_defines,time_macros,include_file_mtime,file_stat_matches"
  CCACHE_BASEDIR: ${{ github.workspace }}

jobs:
  # ===========================================================================
  # CI Tooling — prove report parsers and generated repository statistics
  # ===========================================================================
  validate-ci-tools:
    name: "Validate CI tooling"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Test JUnit statistics parser
      run: python3 .github/scripts/test-summarize-test-results.py

    - name: Test aggregate test evidence
      run: python3 .github/scripts/test-aggregate-test-stats.py

    - name: Test required-job gate
      run: python3 .github/scripts/test-verify-required-jobs.py

    - name: Test exact-commit release gate
      run: python3 .github/scripts/test-verify-exact-required-gate.py

    - name: Test crash-consistent release download counters
      run: python3 .github/scripts/test_prepare_download_badges.py

    - name: Test extracted portable-package validation
      run: python3 .github/scripts/test_validate_extracted_package.py

    - name: Test coverage evidence semantics
      run: bash .github/scripts/test-coverage-report.sh

    - name: Test sanitizer pipeline exit propagation
      run: bash .github/scripts/test-run-sanitizer-tests.sh

    - name: Test workflow failure-propagation contract
      run: python3 .github/scripts/test-workflow-failure-propagation.py

    - name: Test Spark CLI
      run: python3 -m unittest discover -s Tools/spark-cli/tests -p "test_*.py" -v

    - name: Verify every test source is registered
      run: bash Tools/check-test-registration.sh

    - name: Validate model and template asset contracts
      run: python3 Tools/model_pipeline/validate_models.py --repo-root .

    - name: Test build-matrix inventory and parity (CI-120)
      run: python3 Tests/Tools/test_build_matrix_parity.py

    - name: Generate and compare deterministic build-matrix inventory (CI-120)
      run: |
        python3 Tools/buildmatrix/inventory.py \
          --output build-matrix-inventory.json \
          --check docs/readiness/ci120-build-matrix-inventory.json
        python3 -c "import json; json.load(open('build-matrix-inventory.json', encoding='utf-8'))"

    - name: Compare reviewed build-matrix findings (CI-120)
      id: ci120-parity
      run: |
        set +e
        python3 Tools/buildmatrix/check_parity.py \
          --inventory build-matrix-inventory.json \
          --baseline docs/readiness/ci120-parity-findings.json \
          --output build-matrix-parity-findings.json \
          > build-matrix-parity-stdout.json
        status=$?
        set -e
        python3 -c "import json; json.load(open('build-matrix-parity-findings.json', encoding='utf-8')); json.load(open('build-matrix-parity-stdout.json', encoding='utf-8'))"
        cmp build-matrix-parity-findings.json build-matrix-parity-stdout.json
        if test "$status" -ge 2; then
          echo "::error::CI-120 baseline drift or analyzer failure (exit $status)"
          exit "$status"
        fi
        if test "$status" -ne 0 && test "$status" -ne 1; then
          echo "::error::Unexpected CI-120 analyzer exit $status"
          exit 3
        fi
        echo "status=$status" >> "$GITHUB_OUTPUT"

    - name: Upload deterministic CI-120 evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ci120-build-matrix-${{ github.sha }}-${{ github.run_attempt }}
        path: |
          build-matrix-inventory.json
          build-matrix-parity-findings.json
          build-matrix-parity-stdout.json
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
        if-no-files-found: error

    - name: Validate publishable wiki output
      run: python3 tools/publish-wiki.py --check

    - name: Verify all generated documentation and statistics
      id: generated-docs
      env:
        LC_ALL: C.UTF-8
        TZ: UTC
      run: |
        set +e
        set -uo pipefail
        bash docs/update-all-docs.sh check 2>&1 | tee generated-docs-check.log
        status=${PIPESTATUS[0]}

        {
          echo "### Generated documentation gate"
          echo
          if test "$status" -eq 0; then
            echo "All generated API references, indexes, diagrams, wiki inventories, codebase statistics, badges, and AI context are current."
          else
            echo "Generated content drift was detected. Run \`bash docs/update-all-docs.sh\`, review the changes, and commit the generated outputs."
          fi
          echo
          echo "<details><summary>Check output</summary>"
          echo
          echo '```text'
          cat generated-docs-check.log
          echo '```'
          echo "</details>"
        } >> "$GITHUB_STEP_SUMMARY"

        exit "$status"

    - name: Upload generated documentation check log
      if: always() && steps.generated-docs.outcome != 'skipped'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: generated-docs-check-${{ github.run_attempt }}
        path: generated-docs-check.log
        retention-days: ${{ env.ERROR_RETENTION_DAYS }}
        if-no-files-found: error

    - name: Enforce reviewed CI-120 findings
      if: always() && steps.ci120-parity.outputs.status != ''
      run: |
        status="${{ steps.ci120-parity.outputs.status }}"
        if test "$status" -ne 0; then
          echo "::error::CI-120 remains blocked by the reviewed configuration findings artifact."
          exit 1
        fi

  # ===========================================================================
  # Code Quality — clang-format enforcement
  # ===========================================================================
  check-format:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Install clang-format
      run: |
        set -e
        for attempt in 1 2 3 4; do
          if sudo apt-get update; then break; fi
          echo "apt-get update failed (attempt $attempt); retrying in $((attempt * 5))s..."
          sleep $((attempt * 5))
        done
        sudo apt-get install -y clang-format

    - name: Check formatting
      env:
        FORMAT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        set -euo pipefail
        # Every C++ surface is in scope, but source checks are incremental so
        # unrelated legacy formatting debt does not hide new debt. The style
        # file itself is always validated and is part of change detection.
        FORMAT_ROOTS=(SparkEngine/Source GameModules SparkEditor/Source SparkConsole/src SparkShaderCompiler/src SparkBuild/src SparkInstaller/src SparkDaemon/src SparkServer/src SparkGateway/src SparkCooker/src SparkWorker/src SparkAutomation/src SparkLauncher/src Tests)
        for root in "${FORMAT_ROOTS[@]}"; do
          if [[ ! -d "$root" ]]; then
            echo "::error::Formatting source root is missing: $root"
            exit 1
          fi
        done
        BASE_SHA="${FORMAT_BASE_SHA:-}"
        if [[ ! "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] ||
           [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]] ||
           ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
          BASE_SHA=$(git rev-parse HEAD^ 2>/dev/null || true)
        fi

        if [[ -n "$BASE_SHA" ]]; then
          mapfile -d '' CHANGED_PATHS < <(
            git diff --name-only --diff-filter=ACMRD -z "$BASE_SHA" HEAD -- "${FORMAT_ROOTS[@]}" .clang-format
          )
        else
          mapfile -d '' CHANGED_PATHS < <(git ls-files -z -- "${FORMAT_ROOTS[@]}" .clang-format)
        fi

        FORMAT_SOURCES=()
        FORMAT_CONFIG_CHANGED=false
        for source in "${CHANGED_PATHS[@]}"; do
          case "$source" in
            .clang-format) FORMAT_CONFIG_CHANGED=true ;;
            */Metal/*) ;;
            *.h|*.hpp|*.cpp)
              if [[ -f "$source" ]]; then
                FORMAT_SOURCES+=("$source")
              fi
              ;;
          esac
        done

        if ! command -v clang-format >/dev/null 2>&1; then
          echo "::error::clang-format is not installed."
          exit 1
        fi
        if [[ ! -f .clang-format ]]; then
          echo "::error::.clang-format is missing."
          exit 1
        fi
        if ! clang-format --style=file --dump-config > /dev/null 2> check-format-output.log; then
          cat check-format-output.log
          echo "::error::.clang-format could not be parsed."
          exit 1
        fi
        if [[ "$FORMAT_CONFIG_CHANGED" == true ]]; then
          echo "Validated changed .clang-format configuration."
        fi
        if (( ${#FORMAT_SOURCES[@]} == 0 )); then
          echo "No changed C++ sources require formatting."
          exit 0
        fi

        set +e
        clang-format --dry-run --Werror "${FORMAT_SOURCES[@]}" > check-format-output.log 2>&1
        FORMAT_STATUS=$?
        set -e
        if (( FORMAT_STATUS != 0 )); then
          cat check-format-output.log
          if grep -q -- "-Wclang-format-violations" check-format-output.log; then
            echo "::error::Code formatting violations found. Run 'clang-format -i' on the listed files."
          else
            echo "::error::clang-format failed to parse or format the changed sources (exit ${FORMAT_STATUS})."
          fi
          exit "$FORMAT_STATUS"
        fi

    - name: Extract check-format error summary
      if: failure()
      run: |
        .github/scripts/extract-errors.sh \
          "check-format" \
          error-summary.json \
          check-format-output.log || true

    - name: Upload check-format error summary
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ci-errors-check-format
        path: error-summary.json
        retention-days: ${{ env.ERROR_RETENTION_DAYS }}
        if-no-files-found: ignore

  # ===========================================================================
  # Prompt System Validation — anti-drift, overload prevention, stale detection
  # ===========================================================================
  validate-prompts:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Validate prompt system
      run: ./tools/validate-prompts.sh --ci

  check-thirdparty-manifest:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Check ThirdParty manifest sync
      run: ./tools/check-thirdparty-manifest-sync.sh

  # ===========================================================================
  # Linux Build — GCC with AddressSanitizer + UBSan + LSan
  # ===========================================================================
  build-linux-asan:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SANITIZER_EVIDENCE_DIR: ${{ runner.temp }}/spark-sanitizer-asan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-build-linux-asan
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-14 g++-14 cmake ccache libgl-dev libvulkan-dev libsdl2-dev libfreetype-dev mesa-vulkan-drivers

    - name: Setup ccache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.ccache
        key: ccache-linux-asan-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-${{ github.sha }}
        restore-keys: |
          ccache-linux-asan-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-
          ccache-linux-asan-

    - name: Restore build directory
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: build
        key: build-linux-asan-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-${{ github.sha }}
        restore-keys: |
          build-linux-asan-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-
          build-linux-asan-

    - name: Configure CMake (ASan + UBSan + LSan)
      run: |
        command -v ccache >/dev/null && ccache --zero-stats || echo "::warning::ccache not installed, proceeding without cache"
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DBUILD_TESTS=ON \
          -DCMAKE_C_COMPILER=gcc-14 \
          -DCMAKE_CXX_COMPILER=g++-14 \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer" \
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

    - name: Build
      run: |
        set -o pipefail
        cmake --build build --parallel $(nproc) 2>&1 | tee cmake-build.log

    - name: Print ccache stats
      if: always()
      run: command -v ccache >/dev/null && ccache --show-stats || echo "::warning::ccache not installed, skipping stats"

    - name: Run Tests under ASan + UBSan + LSan
      env:
        ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:print_stats=1:check_initialization_order=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        LSAN_OPTIONS: suppressions=${{ github.workspace }}/Tests/lsan_suppressions.txt
      run: |
        bash .github/scripts/run-sanitizer-tests.sh \
          --evidence-root "${{ runner.temp }}" \
          --sanitizer asan \
          --expected-sha "${{ github.sha }}" \
          --run-id "${{ github.run_id }}" \
          --run-attempt "${{ github.run_attempt }}" \
          --job "${{ github.job }}" \
          --expected-selector all \
          --minimum-tests 6600 \
          --timeout-seconds 900 \
          --runtime-env ASAN_OPTIONS \
          -- build/bin/SparkTests --warn-is-error --shuffle 123

    - name: Summarize ASan exact-commit test evidence
      run: |
        python3 .github/scripts/summarize-test-results.py \
          "$SANITIZER_EVIDENCE_DIR/junit.xml" \
          --min-tests 6600 \
          --title "SparkTests — Linux ASan/UBSan/LSan" \
          --json "$SANITIZER_EVIDENCE_DIR/test-stats-linux-asan.json"

    - name: Verify published ASan exact-commit evidence
      run: |
        python3 .github/scripts/verify-sanitizer-evidence.py verify-published \
          --evidence-dir "$SANITIZER_EVIDENCE_DIR" \
          --stats "$SANITIZER_EVIDENCE_DIR/test-stats-linux-asan.json" \
          --sanitizer asan \
          --lane linux-asan \
          --expected-sha "${{ github.sha }}" \
          --run-id "${{ github.run_id }}" \
          --run-attempt "${{ github.run_attempt }}" \
          --job build-linux-asan \
          --minimum-tests 6600 \
          --timeout-seconds 900

    - name: Extract error summary
      if: failure()
      run: |
        .github/scripts/extract-errors.sh \
          "build-linux-asan" \
          error-summary.json \
          cmake-build.log \
          "$SANITIZER_EVIDENCE_DIR/console.txt" \
          "$SANITIZER_EVIDENCE_DIR/process-footer.txt" \
          "$SANITIZER_EVIDENCE_DIR/metadata.json" \
          "$SANITIZER_EVIDENCE_DIR"/runtime/sanitizer.*

    - name: Upload error summary
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ci-errors-linux-asan
        path: error-summary.json
        retention-days: ${{ env.ERROR_RETENTION_DAYS }}

    - name: Upload ASan + UBSan + LSan report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sanitizer-report-asan-ubsan-lsan
        path: ${{ env.SANITIZER_EVIDENCE_DIR }}
        if-no-files-found: error
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

    - name: Upload ASan exact-commit test evidence
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results-linux-asan
        path: ${{ env.SANITIZER_EVIDENCE_DIR }}
        if-no-files-found: error
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # ===========================================================================
  # Linux Build — GCC with ThreadSanitizer
  # ===========================================================================
  build-linux-tsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SANITIZER_EVIDENCE_DIR: ${{ runner.temp }}/spark-sanitizer-tsan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-build-linux-tsan
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-14 g++-14 cmake ccache libgl-dev libvulkan-dev libsdl2-dev libfreetype-dev mesa-vulkan-drivers

    - name: Setup ccache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.ccache
        key: ccache-linux-tsan-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-${{ github.sha }}
        restore-keys: |
          ccache-linux-tsan-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-
          ccache-linux-tsan-

    - name: Restore build directory
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: build
        key: build-linux-tsan-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-${{ github.sha }}
        restore-keys: |
          build-linux-tsan-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-
          build-linux-tsan-

    - name: Configure CMake (TSan)
      run: |
        command -v ccache >/dev/null && ccache --zero-stats || echo "::warning::ccache not installed, proceeding without cache"
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DBUILD_TESTS=ON \
          -DCMAKE_C_COMPILER=gcc-14 \
          -DCMAKE_CXX_COMPILER=g++-14 \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
          -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread"

    - name: Build
      run: |
        set -o pipefail
        cmake --build build --parallel $(nproc) 2>&1 | tee cmake-build.log

    - name: Print ccache stats
      if: always()
      run: command -v ccache >/dev/null && ccache --show-stats || echo "::warning::ccache not installed, skipping stats"

    - name: Run Tests under TSan
      env:
        TSAN_OPTIONS: halt_on_error=0:second_deadlock_stack=1:print_suppressions=1:suppressions=${{ github.workspace }}/Tests/tsan_suppressions.txt
      run: |
        bash .github/scripts/run-sanitizer-tests.sh \
          --evidence-root "${{ runner.temp }}" \
          --sanitizer tsan \
          --expected-sha "${{ github.sha }}" \
          --run-id "${{ github.run_id }}" \
          --run-attempt "${{ github.run_attempt }}" \
          --job "${{ github.job }}" \
          --expected-selector all \
          --minimum-tests 6600 \
          --timeout-seconds 900 \
          --runtime-env TSAN_OPTIONS \
          -- build/bin/SparkTests --warn-is-error --shuffle 123

    - name: Summarize TSan exact-commit test evidence
      run: |
        python3 .github/scripts/summarize-test-results.py \
          "$SANITIZER_EVIDENCE_DIR/junit.xml" \
          --min-tests 6600 \
          --title "SparkTests — Linux TSan" \
          --json "$SANITIZER_EVIDENCE_DIR/test-stats-linux-tsan.json"

    - name: Verify published TSan exact-commit evidence
      run: |
        python3 .github/scripts/verify-sanitizer-evidence.py verify-published \
          --evidence-dir "$SANITIZER_EVIDENCE_DIR" \
          --stats "$SANITIZER_EVIDENCE_DIR/test-stats-linux-tsan.json" \
          --sanitizer tsan \
          --lane linux-tsan \
          --expected-sha "${{ github.sha }}" \
          --run-id "${{ github.run_id }}" \
          --run-attempt "${{ github.run_attempt }}" \
          --job build-linux-tsan \
          --minimum-tests 6600 \
          --timeout-seconds 900

    - name: Extract error summary
      if: failure()
      run: |
        .github/scripts/extract-errors.sh \
          "build-linux-tsan" \
          error-summary.json \
          cmake-build.log \
          "$SANITIZER_EVIDENCE_DIR/console.txt" \
          "$SANITIZER_EVIDENCE_DIR/process-footer.txt" \
          "$SANITIZER_EVIDENCE_DIR/metadata.json" \
          "$SANITIZER_EVIDENCE_DIR"/runtime/sanitizer.*

    - name: Upload error summary
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ci-errors-linux-tsan
        path: error-summary.json
        retention-days: ${{ env.ERROR_RETENTION_DAYS }}

    - name: Upload TSan report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sanitizer-report-tsan
        path: ${{ env.SANITIZER_EVIDENCE_DIR }}
        if-no-files-found: error
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

    - name: Upload TSan exact-commit test evidence
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results-linux-tsan
        path: ${{ env.SANITIZER_EVIDENCE_DIR }}
        if-no-files-found: error
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # ===========================================================================
  # Linux Build — Clang with MemorySanitizer
  # MSan requires ALL code (including stdlib) to be MSan-instrumented. The
  # system libc++ on ubuntu-24.04 is NOT instrumented, which causes false
  # positives in basic string/IO operations. A fully clean MSan build would
  # require building libc++ from source with -fsanitize=memory. This job is
  # marked continue-on-error because of these inherent false positives, but
  # the report artifact is still uploaded for manual review of real findings.
  # ===========================================================================
  build-linux-msan:
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 90
    env:
      SANITIZER_EVIDENCE_DIR: ${{ runner.temp }}/spark-sanitizer-msan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-build-linux-msan
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ccache libgl-dev libvulkan-dev libsdl2-dev libfreetype-dev mesa-vulkan-drivers libc++-dev libc++abi-dev

    - name: Setup ccache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.ccache
        key: ccache-linux-msan-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-${{ github.sha }}
        restore-keys: |
          ccache-linux-msan-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-
          ccache-linux-msan-

    - name: Restore build directory
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: build
        key: build-linux-msan-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-${{ github.sha }}
        restore-keys: |
          build-linux-msan-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-
          build-linux-msan-

    - name: Configure CMake (MSan)
      run: |
        command -v ccache >/dev/null && ccache --zero-stats || echo "::warning::ccache not installed, proceeding without cache"
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DBUILD_TESTS=ON \
          -DENABLE_SDL2=OFF \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_FLAGS="-fsanitize=memory -fsanitize-memory-track-origins=2 -fno-omit-frame-pointer -stdlib=libc++ -fsanitize-ignorelist=${{ github.workspace }}/Tests/msan_ignorelist.txt" \
          -DCMAKE_C_FLAGS="-fsanitize=memory -fsanitize-memory-track-origins=2 -fno-omit-frame-pointer -fsanitize-ignorelist=${{ github.workspace }}/Tests/msan_ignorelist.txt" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=memory -stdlib=libc++ -lc++abi" \
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=memory -stdlib=libc++"

    - name: Build (SparkTests only)
      run: |
        set -o pipefail
        cmake --build build --parallel $(nproc) --target SparkTests 2>&1 | tee cmake-build.log

    - name: Print ccache stats
      if: always()
      run: command -v ccache >/dev/null && ccache --show-stats || echo "::warning::ccache not installed, skipping stats"

    - name: Run Tests under MSan
      env:
        MSAN_OPTIONS: halt_on_error=0:print_stats=1
      run: |
        bash .github/scripts/run-sanitizer-tests.sh \
          --evidence-root "${{ runner.temp }}" \
          --sanitizer msan \
          --expected-sha "${{ github.sha }}" \
          --run-id "${{ github.run_id }}" \
          --run-attempt "${{ github.run_attempt }}" \
          --job "${{ github.job }}" \
          --expected-selector all \
          --minimum-tests 6600 \
          --timeout-seconds 900 \
          --runtime-env MSAN_OPTIONS \
          -- build/bin/SparkTests --warn-is-error --shuffle 123

    - name: Extract error summary
      if: failure()
      run: |
        .github/scripts/extract-errors.sh \
          "build-linux-msan" \
          error-summary.json \
          cmake-build.log \
          "$SANITIZER_EVIDENCE_DIR/console.txt" \
          "$SANITIZER_EVIDENCE_DIR/process-footer.txt" \
          "$SANITIZER_EVIDENCE_DIR/metadata.json" \
          "$SANITIZER_EVIDENCE_DIR"/runtime/sanitizer.*

    - name: Upload error summary
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ci-errors-linux-msan
        path: error-summary.json
        retention-days: ${{ env.ERROR_RETENTION_DAYS }}

    - name: Upload MSan report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sanitizer-report-msan
        path: ${{ env.SANITIZER_EVIDENCE_DIR }}
        if-no-files-found: error
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # ===========================================================================
  # Windows Build (MSVC VS 2022, v143 toolset + DirectX 11)
  # ===========================================================================
  build-windows-vs2022:
    runs-on: windows-2022
    strategy:
      matrix:
        config: [Debug, Release]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

    - name: Restore build directory
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: build
        key: build-windows-vs2022-${{ matrix.config }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-${{ github.sha }}
        restore-keys: |
          build-windows-vs2022-${{ matrix.config }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-
          build-windows-vs2022-${{ matrix.config }}-

    - name: Configure CMake (VS 2022 / v143)
      shell: bash
      # Keep restored object files, but regenerate CMake metadata so an older
      # cache cannot retain a different generator platform or toolset.
      run: |
        set -o pipefail
        cmake --fresh -B build -G "Visual Studio 17 2022" -A x64 -T v143 -DBUILD_TESTS=ON 2>&1 | tee cmake-configure.log

    - name: Build
      shell: bash
      run: |
        set -o pipefail
        cmake --build build --config ${{ matrix.config }} --parallel 2>&1 | tee cmake-build.log

    - name: Print sccache stats
      if: always()
      run: sccache --show-stats

    - name: Run Tests
      if: matrix.config == 'Release'
      shell: bash
      run: |
        set -o pipefail
        ctest --test-dir build -C ${{ matrix.config }} \
          --output-on-failure --parallel 2 \
          --output-junit build/ctest-junit.xml 2>&1 | tee test-results.log

    - name: Validate and summarize test statistics
      if: always() && matrix.config == 'Release'
      shell: bash
      run: |
        python .github/scripts/summarize-test-results.py \
          build/SparkTests-junit.xml \
          --min-tests 5000 \
          --title "SparkTests — Windows VS2022 Release" \
          --json test-stats-windows-vs2022-release.json

    - name: Upload machine-readable test results
      if: always() && matrix.config == 'Release'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results-windows-vs2022-release
        path: |
          build/SparkTests-junit.xml
          build/ctest-junit.xml
          build/*-process-smoke.log
          build/*-process-smoke.json
          build/*-process-smoke.xml
          test-stats-windows-vs2022-release.json
          test-results.log
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
        if-no-files-found: error

    - name: Extract error summary
      if: failure()
      shell: bash
      run: |
        .github/scripts/extract-errors.sh \
          "build-windows-vs2022-${{ matrix.config }}" \
          error-summary.json \
          cmake-configure.log cmake-build.log test-results.log

    - name: Upload error summary
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ci-errors-windows-vs2022-${{ matrix.config }}
        path: error-summary.json
        retention-days: ${{ env.ERROR_RETENTION_DAYS }}

    - name: Package build output
      if: matrix.config == 'Release'
      shell: pwsh
      run: |
        $outDir = "dist/SparkEngine-Windows-${{ matrix.config }}"
        New-Item -ItemType Directory -Force -Path $outDir | Out-Null
        if (Test-Path "build/bin/${{ matrix.config }}") {
          Copy-Item "build/bin/${{ matrix.config }}/*" $outDir -Recurse -Force
        } elseif (Test-Path "build/bin") {
          Copy-Item "build/bin/*" $outDir -Recurse -Force
        }
        Compress-Archive -Path $outDir -DestinationPath "SparkEngine-Windows-${{ matrix.config }}.zip"

    - name: Upload Build Artifacts
      if: matrix.config == 'Release'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: SparkEngine-Windows-VS2022-${{ matrix.config }}
        path: SparkEngine-Windows-${{ matrix.config }}.zip
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # ===========================================================================
  # CI-120 trusted producer: canonical Windows Shipping configured evidence
  # ===========================================================================
  build-windows-shipping:
    name: "Windows Shipping configured-evidence producer"
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

    - name: Produce Windows Shipping CMake provenance and build artifacts (CI-120)
      shell: bash
      run: |
        set -o pipefail
        python Tools/buildmatrix/capture_provenance.py \
          --profile windows-shipping \
          --build-dir build/windows-shipping \
          --build 2>&1 | tee ci120-producer.log

    - name: Generate configured build-matrix inventory from the owned producer (CI-120)
      shell: bash
      run: |
        python Tools/buildmatrix/inventory.py \
          --codemodel windows-shipping=build/windows-shipping \
          --output build-matrix-inventory.json
        python -c "import json; json.load(open('build-matrix-inventory.json', encoding='utf-8'))"

    - name: Compare reviewed configured-evidence findings (CI-120)
      id: ci120-parity
      shell: bash
      run: |
        set +e
        python Tools/buildmatrix/check_parity.py \
          --inventory build-matrix-inventory.json \
          --baseline docs/readiness/ci120-parity-findings.json \
          --output build-matrix-parity-findings.json \
          > build-matrix-parity-stdout.json
        status=$?
        set -e
        python -c "import json; json.load(open('build-matrix-parity-findings.json', encoding='utf-8')); json.load(open('build-matrix-parity-stdout.json', encoding='utf-8'))"
        cmp build-matrix-parity-findings.json build-matrix-parity-stdout.json
        if test "$status" -ge 2; then
          echo "::error::CI-120 configured-evidence baseline drift or analyzer failure (exit $status)"
          exit "$status"
        fi
        if test "$status" -ne 0 && test "$status" -ne 1; then
          echo "::error::Unexpected CI-120 analyzer exit $status"
          exit 3
        fi
        echo "status=$status" >> "$GITHUB_OUTPUT"

    - name: Upload trusted CI-120 producer evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ci120-windows-shipping-${{ github.sha }}-${{ github.run_attempt }}
        path: |
          ci120-producer.log
          build/windows-shipping/.cmake/api/v1/reply
          build/windows-shipping/.cmake/api/v1/provenance
          build-matrix-inventory.json
          build-matrix-parity-findings.json
          build-matrix-parity-stdout.json
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
        if-no-files-found: error

    - name: Enforce reviewed CI-120 findings
      if: always() && steps.ci120-parity.outputs.status != ''
      shell: bash
      run: |
        status="${{ steps.ci120-parity.outputs.status }}"
        if test "$status" -ne 0; then
          echo "::error::CI-120 remains blocked by the reviewed configuration findings artifact."
          exit 1
        fi

  # ===========================================================================
  # Windows Build (Visual Studio 2026 / v145)
  # CMake 4.2+ provides the native Visual Studio 18 2026 generator. This lane
  # remains advisory until GitHub-hosted runners guarantee that installation,
  # but an unavailable toolchain must be visible rather than a green no-op.
  # ===========================================================================
  build-windows-vs2026:
    if: github.ref == 'refs/heads/Working' || github.ref == 'refs/heads/main' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    continue-on-error: true
    strategy:
      matrix:
        config: [Debug, Release]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

    - name: Restore build directory
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: build
        key: build-windows-vs2026-${{ matrix.config }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-${{ github.sha }}
        restore-keys: |
          build-windows-vs2026-${{ matrix.config }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-
          build-windows-vs2026-${{ matrix.config }}-

    - name: Require Visual Studio 2026
      shell: pwsh
      run: |
        $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
        if (-not (Test-Path $vswhere)) {
          throw "vswhere is unavailable; cannot verify Visual Studio 2026"
        }
        $install = & $vswhere -latest -products * -version '[18.0,19.0)' -property installationPath
        if (-not $install) {
          throw "Visual Studio 2026 is unavailable on this runner"
        }
        Write-Host "Visual Studio 2026: $install"

    - name: Configure CMake (VS 2026 / v145)
      run: cmake --fresh -B build -G "Visual Studio 18 2026" -A x64 -DBUILD_TESTS=ON

    - name: Build
      run: cmake --build build --config ${{ matrix.config }} --parallel

    - name: Run Tests
      if: matrix.config == 'Release'
      run: >-
        ctest --test-dir build -C ${{ matrix.config }}
        --output-on-failure --parallel 2
        --output-junit build/ctest-junit.xml

    - name: Validate and summarize test statistics
      if: always() && matrix.config == 'Release'
      shell: bash
      run: |
        python .github/scripts/summarize-test-results.py \
          build/SparkTests-junit.xml \
          --min-tests 5000 \
          --title "SparkTests — Windows VS2026 Release" \
          --json test-stats-windows-vs2026-release.json

    - name: Upload machine-readable test results
      if: always() && matrix.config == 'Release'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results-windows-vs2026-release
        path: |
          build/SparkTests-junit.xml
          build/ctest-junit.xml
          build/*-process-smoke.log
          build/*-process-smoke.json
          build/*-process-smoke.xml
          test-stats-windows-vs2026-release.json
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
        if-no-files-found: error

    - name: Upload Build Artifacts
      if: matrix.config == 'Release'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: SparkEngine-Windows-VS2026-${{ matrix.config }}
        path: build/bin/${{ matrix.config }}/
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # ===========================================================================
  # Linux Build - GCC
  # ===========================================================================
  build-linux-gcc:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        config: [Debug, Release]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-14 g++-14 cmake ccache libgl-dev libvulkan-dev libsdl2-dev libfreetype-dev mesa-vulkan-drivers

    - name: Setup ccache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.ccache
        key: ccache-linux-gcc-${{ matrix.config }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-${{ github.sha }}
        restore-keys: |
          ccache-linux-gcc-${{ matrix.config }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-
          ccache-linux-gcc-${{ matrix.config }}-

    - name: Restore build directory
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: build
        key: build-linux-gcc-${{ matrix.config }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-${{ github.sha }}
        restore-keys: |
          build-linux-gcc-${{ matrix.config }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-
          build-linux-gcc-${{ matrix.config }}-

    - name: Configure CMake
      run: |
        set -o pipefail
        command -v ccache >/dev/null && ccache --zero-stats || echo "::warning::ccache not installed, proceeding without cache"
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DBUILD_TESTS=ON \
          -DCMAKE_C_COMPILER=gcc-14 \
          -DCMAKE_CXX_COMPILER=g++-14 \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache 2>&1 | tee cmake-configure.log

    - name: Build all targets
      run: |
        set -o pipefail
        find build -name '*.pch' -delete 2>/dev/null || true
        cmake --build build --parallel $(nproc) 2>&1 | tee cmake-build.log

    - name: Print ccache stats
      if: always()
      run: command -v ccache >/dev/null && ccache --show-stats || echo "::warning::ccache not installed, skipping stats"

    - name: Run Tests
      run: |
        set -o pipefail
        ctest --test-dir build -C ${{ matrix.config }} \
          --output-on-failure --parallel 2 \
          --output-junit build/ctest-junit.xml 2>&1 | tee test-results.log

    - name: Validate and summarize test statistics
      if: always()
      run: |
        python3 .github/scripts/summarize-test-results.py \
          build/SparkTests-junit.xml \
          --min-tests 5000 \
          --title "SparkTests — Linux GCC ${{ matrix.config }}" \
          --json test-stats-linux-gcc-${{ matrix.config }}.json

    - name: Upload machine-readable test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results-linux-gcc-${{ matrix.config }}
        path: |
          build/SparkTests-junit.xml
          build/ctest-junit.xml
          build/*-process-smoke.log
          build/*-process-smoke.json
          build/*-process-smoke.xml
          test-stats-linux-gcc-${{ matrix.config }}.json
          test-results.log
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
        if-no-files-found: error

    - name: Assert Vulkan preset is enabled (Release gate)
      if: matrix.config == 'Release'
      run: grep -q "ENABLE_VULKAN:BOOL=ON" build/CMakeCache.txt

    - name: Assert Vulkan shader compile parity test ran (Release gate)
      if: matrix.config == 'Release'
      run: |
        echo "Test results: $(wc -l < test-results.log) lines"
        grep -Fq 'name="VulkanParity_ShaderCompilePath_Asserted"' build/SparkTests-junit.xml
        grep -Fq 'name="VulkanParity_D3D11MilestoneSnapshot"' build/SparkTests-junit.xml

    - name: Extract error summary
      if: failure()
      run: |
        .github/scripts/extract-errors.sh \
          "build-linux-gcc-${{ matrix.config }}" \
          error-summary.json \
          cmake-configure.log cmake-build.log test-results.log

    - name: Upload error summary
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ci-errors-linux-gcc-${{ matrix.config }}
        path: error-summary.json
        retention-days: ${{ env.ERROR_RETENTION_DAYS }}

    - name: Package build output
      if: matrix.config == 'Release'
      run: |
        mkdir -p dist/SparkEngine-Linux-GCC-${{ matrix.config }}
        cp -r build/bin/* dist/SparkEngine-Linux-GCC-${{ matrix.config }}/
        tar -czf SparkEngine-Linux-GCC-${{ matrix.config }}.tar.gz \
          -C dist SparkEngine-Linux-GCC-${{ matrix.config }}

    - name: Upload Build Artifacts
      if: matrix.config == 'Release'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: SparkEngine-Linux-GCC-${{ matrix.config }}
        path: SparkEngine-Linux-GCC-${{ matrix.config }}.tar.gz
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # ===========================================================================
  # Linux Build - Clang (LLVM)
  # ===========================================================================
  build-linux-clang:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        config: [Debug, Release]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ccache libgl-dev libvulkan-dev libsdl2-dev libfreetype-dev mesa-vulkan-drivers libc++-dev libc++abi-dev

    - name: Setup ccache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.ccache
        key: ccache-linux-clang-${{ matrix.config }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-${{ github.sha }}
        restore-keys: |
          ccache-linux-clang-${{ matrix.config }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-
          ccache-linux-clang-${{ matrix.config }}-

    - name: Restore build directory
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: build
        key: build-linux-clang-${{ matrix.config }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-${{ github.sha }}
        restore-keys: |
          build-linux-clang-${{ matrix.config }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-
          build-linux-clang-${{ matrix.config }}-

    - name: Configure CMake
      run: |
        set -o pipefail
        command -v ccache >/dev/null && ccache --zero-stats || echo "::warning::ccache not installed, proceeding without cache"
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DBUILD_TESTS=ON \
          -DENABLE_LTO=OFF \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
          -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ -lc++abi" \
          -DCMAKE_SHARED_LINKER_FLAGS="-stdlib=libc++" 2>&1 | tee cmake-configure.log

    - name: Build all targets
      run: |
        set -o pipefail
        # Remove stale PCH files — cached build dirs may have PCH built against
        # older system headers (e.g. unistd_64.h mtime changes after apt-get).
        find build -name '*.pch' -delete 2>/dev/null || true
        # Purge cached static archives unconditionally. apt-get install of
        # clang between cached runs can change the object-file ABI (LLVM
        # major version bump, libc++ ABI bump). The on-disk .a archive
        # looks valid to `ar t`, but ld rejects it with
        #   libJolt.a: error adding symbols: file format not recognized
        # Deleting the archive forces CMake to rebuild just the final lib
        # (all the underlying .o files still come straight out of ccache).
        find build -name 'lib*.a' -delete 2>/dev/null || true
        cmake --build build --parallel $(nproc) 2>&1 | tee cmake-build.log

    - name: Print ccache stats
      if: always()
      run: command -v ccache >/dev/null && ccache --show-stats || echo "::warning::ccache not installed, skipping stats"

    - name: Run Tests
      run: |
        set -o pipefail
        ctest --test-dir build -C ${{ matrix.config }} \
          --output-on-failure --parallel 2 \
          --output-junit build/ctest-junit.xml 2>&1 | tee test-results.log

    - name: Validate and summarize test statistics
      if: always()
      run: |
        python3 .github/scripts/summarize-test-results.py \
          build/SparkTests-junit.xml \
          --min-tests 5000 \
          --title "SparkTests — Linux Clang ${{ matrix.config }}" \
          --json test-stats-linux-clang-${{ matrix.config }}.json

    - name: Upload machine-readable test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results-linux-clang-${{ matrix.config }}
        path: |
          build/SparkTests-junit.xml
          build/ctest-junit.xml
          build/*-process-smoke.log
          build/*-process-smoke.json
          build/*-process-smoke.xml
          test-stats-linux-clang-${{ matrix.config }}.json
          test-results.log
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
        if-no-files-found: error

    - name: Extract error summary
      if: failure()
      run: |
        .github/scripts/extract-errors.sh \
          "build-linux-clang-${{ matrix.config }}" \
          error-summary.json \
          cmake-configure.log cmake-build.log test-results.log

    - name: Upload error summary
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ci-errors-linux-clang-${{ matrix.config }}
        path: error-summary.json
        retention-days: ${{ env.ERROR_RETENTION_DAYS }}

    - name: Package build output
      if: matrix.config == 'Release'
      run: |
        mkdir -p dist/SparkEngine-Linux-Clang-${{ matrix.config }}
        cp -r build/bin/* dist/SparkEngine-Linux-Clang-${{ matrix.config }}/
        tar -czf SparkEngine-Linux-Clang-${{ matrix.config }}.tar.gz \
          -C dist SparkEngine-Linux-Clang-${{ matrix.config }}

    - name: Upload Build Artifacts
      if: matrix.config == 'Release'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: SparkEngine-Linux-Clang-${{ matrix.config }}
        path: SparkEngine-Linux-Clang-${{ matrix.config }}.tar.gz
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # ===========================================================================
  # Linux MinGW Cross-Compilation — Build Windows D3D11/D3D12 code on Linux
  # Runs the resulting .exe under Wine + DXVK + Lavapipe (software Vulkan)
  # ===========================================================================
  build-linux-mingw-wine:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive

    - name: Install MinGW, Wine, and Mesa Lavapipe
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          mingw-w64 cmake ccache \
          wine64 wine \
          mesa-vulkan-drivers

    - name: Setup ccache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.ccache
        key: ccache-linux-mingw-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-${{ github.sha }}
        restore-keys: |
          ccache-linux-mingw-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-
          ccache-linux-mingw-

    - name: Restore build directory
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: build
        key: build-linux-mingw-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-${{ github.sha }}
        restore-keys: |
          build-linux-mingw-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-
          build-linux-mingw-

    - name: Configure CMake (MinGW cross-compilation)
      run: |
        set -o pipefail
        command -v ccache >/dev/null && ccache --zero-stats || echo "::warning::ccache not installed, proceeding without cache"
        cmake -B build \
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/mingw-w64-x86_64.cmake \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_TESTS=ON \
          -DENABLE_VULKAN=OFF \
          -DENABLE_OPENGL=OFF \
          -DENABLE_SDL2=OFF \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache 2>&1 | tee cmake-configure.log

    - name: Build (Windows .exe via MinGW)
      run: |
        set -o pipefail
        cmake --build build --parallel $(nproc) 2>&1 | tee cmake-build.log

    - name: Print ccache stats
      if: always()
      run: command -v ccache >/dev/null && ccache --show-stats || echo "::warning::ccache not installed, skipping stats"

    - name: Setup Wine prefix and DXVK
      run: |
        export WINEPREFIX=${{ github.workspace }}/build/.wineprefix
        tools/wine-run.sh --setup-only

    - name: Run Tests under Wine
      env:
        WINEPREFIX: ${{ github.workspace }}/build/.wineprefix
        WINEDEBUG: -all
        LIBGL_ALWAYS_SOFTWARE: "1"
        # Native Windows lanes cover these facilities. Wine lacks Windows Git,
        # WARP, native D3DCompiler include semantics, and native stack-frame
        # addresses, so exclude only those known platform-incompatible tests.
        SPARK_TEST_EXCLUDE: VersionControlPhaseAA_InitializeShutdown,GPUDriven_D3D11_ShaderReflectionMatchesSharedABI,GPUDriven_D3D11_PrimitiveLosesSparseSourceIdentityAndProductionGateFailsClosed,PostProcessingD3D11_ZeroAndOnePassRouteWithoutViewHazards,WorldBasicRender_DrawsGeometryIntoOffscreenRTV,WARP_D3D11DeviceInit,WARP_D3D11BufferCreation,WARP_D3D11FactoryCreate,StackTrace_FramesHaveAddresses
      run: |
        set -o pipefail
        tools/wine-run.sh build/bin/SparkTests.exe 2>&1 | tee wine-test-results.txt

    - name: Extract error summary
      if: failure()
      run: |
        .github/scripts/extract-errors.sh \
          "build-linux-mingw-wine" \
          error-summary.json \
          cmake-configure.log cmake-build.log wine-test-results.txt

    - name: Upload error summary
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ci-errors-linux-mingw-wine
        path: error-summary.json
        retention-days: ${{ env.ERROR_RETENTION_DAYS }}

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: mingw-wine-test-results
        path: wine-test-results.txt
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # ===========================================================================
  # macOS Build — Apple Clang (experimental)
  # Validates cross-platform compatibility on macOS with SDL2 + OpenGL.
  # Marked continue-on-error until macOS support is fully stabilized.
  # ===========================================================================
  build-macos:
    if: github.ref == 'refs/heads/Working' || github.ref == 'refs/heads/main' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # OpenGL backend — safe baseline. Debug + Release both build; tests
          # run on Release. Metal off so the .mm translation unit is excluded
          # from the build (verifies the non-Metal code path still compiles).
          - { config: Debug,   backend: OpenGL, enable_metal: 'OFF' }
          - { config: Release, backend: OpenGL, enable_metal: 'OFF' }
          # Metal backend — exercises MetalDevice.mm end-to-end. Release-only
          # to keep CI cost reasonable; the .mm code is the long-term macOS
          # rendering path so it gets a dedicated build + test pass.
          - { config: Release, backend: Metal,  enable_metal: 'ON'  }

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        # SDL2 handles windowing/input, openal-soft gives real audio output.
        # molten-vk is optional — enables the Vulkan path when the MoltenVK
        # preset is used. Everything else is build tooling.
        brew update
        brew install cmake sdl2 openal-soft ccache
        brew install molten-vk || echo "::warning::MoltenVK install failed — Vulkan path will be disabled"

    - name: Setup ccache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/Library/Caches/ccache
        key: ccache-macos-${{ matrix.config }}-${{ matrix.backend }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-${{ github.sha }}
        restore-keys: |
          ccache-macos-${{ matrix.config }}-${{ matrix.backend }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-
          ccache-macos-${{ matrix.config }}-${{ matrix.backend }}-

    - name: Restore build directory
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: build
        key: build-macos-${{ matrix.config }}-${{ matrix.backend }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-${{ github.sha }}
        restore-keys: |
          build-macos-${{ matrix.config }}-${{ matrix.backend }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-
          build-macos-${{ matrix.config }}-${{ matrix.backend }}-

    - name: Configure CMake
      run: |
        set -o pipefail
        command -v ccache >/dev/null && ccache --zero-stats || echo "::warning::ccache not installed, proceeding without cache"
        # macOS path: SDL2 + OpenGL + OpenAL. DXR/Vulkan always off here
        # (MoltenVK path has its own preset). ENABLE_METAL is matrix-driven —
        # the Metal entry compiles MetalDevice.mm and the Objective-C++ wiring.
        # ENABLE_SDL2=ON is required — macOS has no X11 fallback.
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DBUILD_TESTS=ON \
          -DENABLE_LTO=OFF \
          -DENABLE_SDL2=ON \
          -DENABLE_VULKAN=OFF \
          -DENABLE_OPENGL=ON \
          -DENABLE_METAL=${{ matrix.enable_metal }} \
          -DENABLE_DXR=OFF \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache 2>&1 | tee cmake-configure.log

    - name: Build
      run: |
        set -o pipefail
        # Purge cached static archives unconditionally — brew updates can bump
        # Apple Clang / ld between runs, which then rejects cached archives
        # with "ld: libJolt.a: error adding symbols: file format not recognized".
        # CMake rebuilds just the .a from ccache-hot .o files.
        find build -name 'lib*.a' -delete 2>/dev/null || true
        cmake --build build --parallel $(sysctl -n hw.logicalcpu) 2>&1 | tee cmake-build.log

    - name: Print ccache stats
      if: always()
      run: command -v ccache >/dev/null && ccache --show-stats || echo "::warning::ccache not installed, skipping stats"

    - name: Run Tests
      if: matrix.config == 'Release'
      run: |
        set -o pipefail
        ctest --test-dir build -C ${{ matrix.config }} \
          --output-on-failure --parallel 2 \
          --output-junit build/ctest-junit.xml 2>&1 | tee test-results.log

    - name: Validate and summarize test statistics
      if: always() && matrix.config == 'Release'
      run: |
        python3 .github/scripts/summarize-test-results.py \
          build/SparkTests-junit.xml \
          --min-tests 5000 \
          --title "SparkTests — macOS ${{ matrix.backend }} Release" \
          --json test-stats-macos-${{ matrix.backend }}-release.json

    - name: Upload machine-readable test results
      if: always() && matrix.config == 'Release'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results-macos-${{ matrix.backend }}-release
        path: |
          build/SparkTests-junit.xml
          build/ctest-junit.xml
          build/*-process-smoke.log
          build/*-process-smoke.json
          build/*-process-smoke.xml
          test-stats-macos-${{ matrix.backend }}-release.json
          test-results.log
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
        if-no-files-found: error

    - name: Extract error summary
      if: failure()
      run: |
        .github/scripts/extract-errors.sh \
          "build-macos-${{ matrix.config }}-${{ matrix.backend }}" \
          error-summary.json \
          cmake-configure.log cmake-build.log test-results.log

    - name: Upload error summary
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ci-errors-macos-${{ matrix.config }}-${{ matrix.backend }}
        path: error-summary.json
        retention-days: ${{ env.ERROR_RETENTION_DAYS }}

    # Capture golden-image diffs produced by live Metal RT tests. The
    # GoldenImageTestRunner writes actual-frame and diff visualizations
    # into Tests/Output/ when a comparison fails; uploading the folder
    # means a reviewer can download <scene>.png + <scene>_diff.png for
    # each failure instead of rerunning the job locally.
    - name: Upload Golden Image Diffs
      if: failure() && matrix.backend == 'Metal'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: rt-goldens-macos-${{ matrix.config }}-${{ github.run_id }}
        path: |
          Tests/Output/
          build/Tests/Output/
        if-no-files-found: ignore
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

    - name: Upload Build Artifacts
      if: matrix.config == 'Release'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: SparkEngine-macOS-${{ matrix.config }}-${{ matrix.backend }}
        path: build/bin/
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # ===========================================================================
  # Code Coverage — GCC with lcov
  # ===========================================================================
  coverage:
    name: "Code Coverage (GCC + per-subsystem thresholds)"
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc-14 g++-14 lcov ccache libgl-dev libsdl2-dev libfreetype-dev
      - name: Setup ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.ccache
          key: ccache-coverage-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-${{ github.sha }}
          restore-keys: |
            ccache-coverage-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-
            ccache-coverage-
      - name: Restore build directory
        # Coverage build trees are ~1.5 GB. Saving one for every commit can
        # consume the job's entire post-step budget after all evidence passed.
        # Restore prior trees for speed; ccache remains the durable write cache.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build
          key: build-coverage-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-${{ github.sha }}
          restore-keys: |
            build-coverage-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-
            build-coverage-
      - name: Configure
        run: |
          command -v ccache >/dev/null && ccache --zero-stats || echo "::warning::ccache not installed, proceeding without cache"
          cmake -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-update=atomic" -DCMAKE_C_FLAGS="--coverage -fprofile-update=atomic" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DBUILD_TESTS=ON -DBUILD_GAME_MODULES=ON
      - name: Build
        run: |
          # pipefail so a cmake --build failure is not masked by tee
          set -o pipefail
          cmake --build build --parallel $(nproc) 2>&1 | tee cmake-build.log
      - name: Print ccache stats
        if: always()
        run: command -v ccache >/dev/null && ccache --show-stats || echo "::warning::ccache not installed, skipping stats"
      - name: Test
        id: coverage-tests
        continue-on-error: true
        env:
          SPARK_TEST_EXCLUDE: "LoadTest_"
        run: |
          set +e
          set -o pipefail
          cd build && ./bin/SparkTests --verbose 2>&1 | tee ../test-output.log
          test_exit=${PIPESTATUS[0]}
          tail -5 ../test-output.log
          exit "$test_exit"
      - name: Generate coverage
        id: generate-coverage
        if: always()
        continue-on-error: true
        # lcov is noisy on warnings and sometimes emits non-zero exit
        # codes even with --ignore-errors. Capture each command's exit
        # status explicitly so we can continue into the per-subsystem
        # analysis even if a single file fails to process, while still
        # recording the failure in the logs for the PR error report.
        run: |
          set +e
          lcov --capture --directory build --output-file coverage.info \
            --gcov-tool gcov-14 \
            --ignore-errors mismatch,mismatch,gcov,negative,unused,source,inconsistent \
            --rc geninfo_unexecuted_blocks=1 2>&1 | tee lcov-capture.log
          cap_exit=${PIPESTATUS[0]}
          echo "lcov --capture exit: $cap_exit"

          lcov --remove coverage.info '/usr/*' '*/ThirdParty/*' '*/Tests/*' \
            --output-file coverage.info \
            --ignore-errors unused,negative,inconsistent 2>&1 | tee lcov-remove.log
          rm_exit=${PIPESTATUS[0]}
          echo "lcov --remove exit: $rm_exit"

          lcov --list coverage.info --ignore-errors unused,negative,inconsistent 2>&1 \
            | tee coverage-summary.txt
          list_exit=${PIPESTATUS[0]}
          echo "lcov --list exit: $list_exit"

          if [ ! -s coverage.info ]; then
            echo "::error::coverage.info is empty or missing — lcov produced no usable data"
            exit 1
          fi
          # --ignore-errors already defines the warnings this lane permits.
          # Any remaining non-zero status means capture, filtering, or report
          # validation was incomplete; a non-empty partial trace is not enough
          # evidence for subsystem thresholds.
          if [ "$cap_exit" -ne 0 ] || [ "$rm_exit" -ne 0 ] || [ "$list_exit" -ne 0 ]; then
            echo "::error::lcov coverage evidence is incomplete (capture=$cap_exit remove=$rm_exit list=$list_exit)"
            exit 1
          fi
      - name: Per-subsystem coverage analysis
        id: subsystem-coverage
        if: always()
        continue-on-error: true
        run: |
          set +e
          chmod +x scripts/coverage-report.sh
          scripts/coverage-report.sh coverage.info --json coverage.json 2>&1 | tee subsystem-coverage.txt
          threshold_exit=${PIPESTATUS[0]}
          if [ "$threshold_exit" -ne 0 ]; then
            echo "coverage: error: Per-subsystem coverage analysis or threshold enforcement failed" | tee -a subsystem-coverage.txt
          fi
          exit "$threshold_exit"
      - name: Extract error summary
        if: >-
          always() &&
          (failure() ||
           steps.coverage-tests.outcome == 'failure' ||
           steps.generate-coverage.outcome == 'failure' ||
           steps.subsystem-coverage.outcome == 'failure')
        run: |
          .github/scripts/extract-errors.sh \
            "coverage" \
            error-summary.json \
            cmake-build.log test-output.log lcov-capture.log lcov-remove.log \
            coverage-summary.txt subsystem-coverage.txt

      - name: Upload error summary
        if: >-
          always() &&
          (failure() ||
           steps.coverage-tests.outcome == 'failure' ||
           steps.generate-coverage.outcome == 'failure' ||
           steps.subsystem-coverage.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-errors-coverage
          path: error-summary.json
          retention-days: ${{ env.ERROR_RETENTION_DAYS }}

      - name: Prepare bounded coverage comment payload
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          COVERAGE_COMMENT_ARTIFACT: coverage-pr-comment-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          SOURCE_EVENT: ${{ github.event_name }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const fs = require('fs');
            const outputDirectory = 'coverage-pr-comment-payload';
            fs.rmSync(outputDirectory, { recursive: true, force: true });
            fs.mkdirSync(outputDirectory, { mode: 0o700 });

            let body = `## Code Coverage (GCC + lcov)\n\n`;
            if (fs.existsSync('coverage-summary.txt') &&
                fs.statSync('coverage-summary.txt').size <= 131072) {
              const summary = fs.readFileSync('coverage-summary.txt', 'utf8');
              const lines = summary.split('\n');
              const table = lines.slice(-35).join('\n');
              body += `\`\`\`\n${table}\n\`\`\`\n`;

              if (fs.existsSync('coverage.json') &&
                  fs.statSync('coverage.json').size <= 262144) {
                try {
                  const json = JSON.parse(fs.readFileSync('coverage.json', 'utf8'));
                  body += `\n### Per-Subsystem Coverage\n\n`;
                  body += `| Subsystem | Lines | Hit | Coverage | Threshold | Status |\n`;
                  body += `|-----------|-------|-----|----------|-----------|--------|\n`;
                  for (const s of json.subsystems) {
                    const icon = s.pass ? ':white_check_mark:' : ':x:';
                    body += `| ${s.subsystem} | ${s.lines} | ${s.hit} | ${s.coverage}% | ${s.threshold}% | ${icon} |\n`;
                  }
                  body += `\n**Selected-subsystem coverage: ${json.selected_subsystem_coverage}%** `;
                  body += `(${json.selected_subsystem_hit}/${json.selected_subsystem_lines} lines)\n`;
                  body += `\nLCOV corpus coverage: ${json.lcov_corpus_coverage}% `;
                  body += `(${json.lcov_corpus_hit}/${json.lcov_corpus_lines} lines); `;
                  body += `${json.unclassified_lines} instrumented lines are outside the threshold table.\n`;
                } catch (error) {
                  core.warning(`Ignoring invalid coverage.json: ${error.message}`);
                }
              }
            } else {
              body += `Coverage summary was unavailable for this run.\n`;
            }

            const payload = {
              schema_version: 1,
              artifact_name: process.env.COVERAGE_COMMENT_ARTIFACT,
              source_event: process.env.SOURCE_EVENT,
              source_run_id: Number(process.env.SOURCE_RUN_ID),
              source_run_attempt: Number(process.env.SOURCE_RUN_ATTEMPT),
              source_sha: process.env.SOURCE_SHA,
              source_head_sha: process.env.SOURCE_HEAD_SHA,
              source_repository: process.env.SOURCE_REPOSITORY,
              pull_request_number: Number(process.env.SOURCE_PR_NUMBER),
              body: body.slice(0, 60000)
            };
            fs.writeFileSync(
              `${outputDirectory}/payload.json`,
              `${JSON.stringify(payload)}\n`,
              { encoding: 'utf8', mode: 0o600 }
            );

      - name: Upload bounded coverage comment payload
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-pr-comment-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: coverage-pr-comment-payload/payload.json
          retention-days: 1
          if-no-files-found: error
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            coverage.info
            coverage.json
            subsystem-coverage.txt
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: warn

      - name: Enforce coverage test and threshold results
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.coverage-tests.outcome }}
          GENERATE_OUTCOME: ${{ steps.generate-coverage.outcome }}
          THRESHOLD_OUTCOME: ${{ steps.subsystem-coverage.outcome }}
        run: |
          failed=0
          if [ "$TEST_OUTCOME" = "failure" ]; then
            echo "::error::SparkTests failed during the coverage run"
            failed=1
          fi
          if [ "$GENERATE_OUTCOME" = "failure" ]; then
            echo "::error::Coverage generation failed"
            failed=1
          fi
          if [ "$THRESHOLD_OUTCOME" = "failure" ]; then
            echo "::error::One or more coverage thresholds failed"
            failed=1
          fi
          exit "$failed"

  # ===========================================================================
  # Coverage PR Comment — privileged, data-only reporter
  # Downloads one bounded artifact from this workflow run. It never checks out
  # or executes pull-request-controlled repository content.
  # ===========================================================================
  report-coverage:
    name: "Coverage PR Comment"
    if: always() && github.event_name == 'pull_request'
    needs: coverage
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download same-run coverage comment payload
        id: download-coverage-comment
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: coverage-pr-comment-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: coverage-pr-comment-artifact

      - name: Validate artifact identity and post coverage comment
        if: steps.download-coverage-comment.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          EXPECTED_ARTIFACT: coverage-pr-comment-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          EXPECTED_EVENT: ${{ github.event_name }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const expectedArtifact = process.env.EXPECTED_ARTIFACT;
            const expectedRunId = Number(process.env.EXPECTED_RUN_ID);
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: expectedRunId,
              name: expectedArtifact,
              per_page: 100
            });
            const matchingArtifacts = artifacts.filter(
              artifact => artifact.name === expectedArtifact && !artifact.expired
            );
            if (matchingArtifacts.length !== 1) {
              throw new Error('Expected exactly one non-expired coverage comment artifact from this workflow run');
            }

            const artifactDirectory = fs.realpathSync('coverage-pr-comment-artifact');
            const entries = fs.readdirSync(artifactDirectory, { withFileTypes: true });
            if (entries.length !== 1 || entries[0].name !== 'payload.json' || !entries[0].isFile()) {
              throw new Error('Coverage comment artifact must contain exactly one regular payload.json file');
            }

            const payloadPath = fs.realpathSync(path.join(artifactDirectory, 'payload.json'));
            if (payloadPath !== path.join(artifactDirectory, 'payload.json')) {
              throw new Error('Coverage comment payload resolved outside its artifact directory');
            }

            const payloadStat = fs.statSync(payloadPath);
            if (!payloadStat.isFile() || payloadStat.size > 131072) {
              throw new Error('Coverage comment payload is not a bounded regular file');
            }

            const payload = JSON.parse(fs.readFileSync(payloadPath, 'utf8'));
            const expected = {
              schema_version: 1,
              artifact_name: expectedArtifact,
              source_event: process.env.EXPECTED_EVENT,
              source_run_id: expectedRunId,
              source_run_attempt: Number(process.env.EXPECTED_RUN_ATTEMPT),
              source_sha: process.env.EXPECTED_SOURCE_SHA,
              source_head_sha: process.env.EXPECTED_HEAD_SHA,
              source_repository: process.env.EXPECTED_REPOSITORY,
              pull_request_number: Number(process.env.EXPECTED_PR_NUMBER)
            };
            for (const [field, value] of Object.entries(expected)) {
              if (payload[field] !== value) {
                throw new Error(`Coverage comment payload ${field} does not match this workflow run`);
              }
            }
            if (payload.source_event !== 'pull_request') {
              throw new Error('Coverage comments may only originate from pull_request runs');
            }
            if (!/^[0-9a-f]{40}$/.test(payload.source_sha) ||
                !/^[0-9a-f]{40}$/.test(payload.source_head_sha)) {
              throw new Error('Coverage comment payload contains an invalid commit SHA');
            }
            if (typeof payload.body !== 'string' || payload.body.length === 0 || payload.body.length > 60000) {
              throw new Error('Coverage comment body is missing or exceeds the allowed size');
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: expected.pull_request_number,
              body: payload.body
            });

  # ===========================================================================
  # Static Analysis — Clang-Tidy
  # ===========================================================================
  clang-tidy:
    name: "Clang-Tidy Analysis"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install dependencies
        # Azure's apt mirrors occasionally return 403 on
        # packages.microsoft.com. Retry with exponential backoff and
        # ignore the third-party repo failures that don't block the
        # packages we actually need.
        run: |
          set -e
          for attempt in 1 2 3 4; do
            if sudo apt-get update; then
              break
            fi
            echo "apt-get update failed on attempt $attempt; retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          sudo apt-get install -y clang-tidy ccache libgl-dev libsdl2-dev libfreetype-dev libc++-dev libc++abi-dev
      - name: Setup ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.ccache
          key: ccache-clang-tidy-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-${{ github.sha }}
          restore-keys: |
            ccache-clang-tidy-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-
            ccache-clang-tidy-
      - name: Restore build directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build
          key: build-clang-tidy-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-${{ github.sha }}
          restore-keys: |
            build-clang-tidy-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-
            build-clang-tidy-
      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
            -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ -lc++abi" \
            -DCMAKE_SHARED_LINKER_FLAGS="-stdlib=libc++" \
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Run clang-tidy
        id: clang-tidy-run
        run: |
          # Route full output to a log file so the follow-up extract
          # step can parse warnings/errors for the CI Error Report PR
          # comment, while also printing a tail to the job log for
          # live-viewing in the Actions UI.
          set +e
          find SparkEngine/Source -name '*.cpp' -print0 | sort -z | head -z -n 30 > clang-tidy-files.list
          xargs -0 -r -n 1 -P 2 clang-tidy -p build --warnings-as-errors="" \
            < clang-tidy-files.list 2>&1 | tee clang-tidy-output.log
          ct_exit=${PIPESTATUS[0]}
          echo ""
          echo "=== Last 50 lines of clang-tidy output ==="
          tail -50 clang-tidy-output.log
          echo ""
          # Count warning / error lines for the summary.
          warn_count=$(grep -cE ':\s*(warning|error):' clang-tidy-output.log || true)
          echo "clang-tidy issues detected: $warn_count"
          echo "warn_count=$warn_count" >> "$GITHUB_OUTPUT"
          # Warnings remain advisory; compiler/configuration failures are fatal.
          exit "$ct_exit"
      - name: Extract clang-tidy error summary
        if: always()
        run: |
          .github/scripts/extract-errors.sh \
            "clang-tidy" \
            error-summary.json \
            clang-tidy-output.log || true
      - name: Upload clang-tidy error summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-errors-clang-tidy
          path: error-summary.json
          retention-days: ${{ env.ERROR_RETENTION_DAYS }}
          if-no-files-found: ignore
      - name: Upload clang-tidy full log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clang-tidy-output
          path: clang-tidy-output.log
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: ignore

  # ===========================================================================
  # Exact-commit test/statistics evidence — merge existing lane artifacts
  # without compiling the engine again.
  # ===========================================================================
  aggregate-test-stats:
    name: "Aggregate test and source statistics"
    if: always()
    needs:
      - validate-ci-tools
      - build-linux-asan
      - build-linux-tsan
      - build-windows-vs2022
      - build-linux-gcc
      - build-linux-clang
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download primary-lane test evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test-results-*
          path: ci-test-results
          merge-multiple: false

      - name: Verify downloaded ASan evidence identity
        run: |
          python3 .github/scripts/verify-sanitizer-evidence.py verify-published \
            --evidence-dir "${{ github.workspace }}/ci-test-results/test-results-linux-asan" \
            --stats "${{ github.workspace }}/ci-test-results/test-results-linux-asan/test-stats-linux-asan.json" \
            --sanitizer asan \
            --lane linux-asan \
            --expected-sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --job build-linux-asan \
            --minimum-tests 6600 \
            --timeout-seconds 900

      - name: Verify downloaded TSan evidence identity
        run: |
          python3 .github/scripts/verify-sanitizer-evidence.py verify-published \
            --evidence-dir "${{ github.workspace }}/ci-test-results/test-results-linux-tsan" \
            --stats "${{ github.workspace }}/ci-test-results/test-results-linux-tsan/test-stats-linux-tsan.json" \
            --sanitizer tsan \
            --lane linux-tsan \
            --expected-sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --job build-linux-tsan \
            --minimum-tests 6600 \
            --timeout-seconds 900

      - name: Collect deterministic repository metrics
        run: python3 docs/codebase-metrics.py > repository-metrics.json

      - name: Require and aggregate primary-lane evidence
        run: |
          python3 .github/scripts/aggregate-test-stats.py \
            --input-root ci-test-results \
            --repository-metrics repository-metrics.json \
            --ratchet .github/test-count-ratchet.json \
            --minimum-tests 5000 \
            --commit "${{ github.sha }}" \
            --expected-lane linux-asan \
            --expected-lane linux-tsan \
            --expected-lane windows-vs2022-release \
            --expected-lane linux-gcc-Debug \
            --expected-lane linux-gcc-Release \
            --expected-lane linux-clang-Debug \
            --expected-lane linux-clang-Release \
            --output ci-metrics.json

      - name: Upload exact-commit CI metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-metrics-${{ github.sha }}
          path: |
            ci-metrics.json
            repository-metrics.json
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: warn

  # ===========================================================================
  # Consolidated CI Error Report — PR comment or job summary
  # Runs after all build jobs, collects error summaries, and posts/updates
  # one comment (on PRs) or writes a job summary (on push).
  # ===========================================================================
  report-ci-errors:
    name: "CI Error Report"
    if: always()
    needs:
      - validate-ci-tools
      - check-format
      - validate-prompts
      - check-thirdparty-manifest
      - build-linux-asan
      - build-linux-tsan
      - build-linux-msan
      - build-windows-vs2022
      - build-windows-vs2026
      - build-linux-gcc
      - build-linux-clang
      - build-linux-mingw-wine
      - build-macos
      - coverage
      - clang-tidy
      - todo-count
      - build-installer
      - aggregate-test-stats
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      # This job has pull-request write permission. Always load its executable
      # reporter from the trusted Working branch, never from the PR checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: Working
          persist-credentials: false

      - name: Test CI error reporter
        run: node .github/scripts/test-report-ci-errors.js

      - name: Download all error summaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci-errors-*
          path: ci-error-summaries
          merge-multiple: false
        continue-on-error: true

      - name: Post consolidated error report
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ARTIFACT_DIR: ci-error-summaries
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            const report = require('./.github/scripts/report-ci-errors.js');
            await report({ github, context, core, glob, io });

  # ===========================================================================
  # Code Hygiene — TODO/FIXME/HACK comment count
  # ===========================================================================
  todo-count:
    name: "TODO/FIXME Count"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Count TODO/FIXME/HACK comments
        id: todo-count-run
        run: |
          grep -rn 'TODO\|FIXME\|HACK\|XXX' SparkEngine/Source SparkEditor/Source GameModules \
            --include='*.h' --include='*.cpp' > todo-list.log || true
          count=$(wc -l < todo-list.log)
          echo "Found $count TODO/FIXME/HACK/XXX comments"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 20 ]; then
            echo "::warning::TODO/FIXME count ($count) exceeds threshold of 20"
          fi
      - name: Upload todo-count summary artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: todo-count-report
          path: todo-list.log
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: ignore

  # ===========================================================================
  # SparkInstaller — tiny standalone bootstrap binary (TUI only, per-OS)
  # ===========================================================================
  build-installer:
    name: Installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: SparkInstaller-Linux-x64
            bin_name: SparkInstaller
          - os: windows-latest
            artifact: SparkInstaller-Windows-x64
            bin_name: SparkInstaller.exe
          - os: macos-latest
            artifact: SparkInstaller-macOS-arm64
            bin_name: SparkInstaller
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure SparkBuild + SparkInstaller (standalone, no engine)
        shell: bash
        run: |
          mkdir -p build-installer
          cat > build-installer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          project(SparkInstallerCombo LANGUAGES CXX)
          include(CTest)
          add_subdirectory(${CMAKE_SOURCE_DIR}/../SparkBuild SparkBuild)
          add_subdirectory(${CMAKE_SOURCE_DIR}/../SparkInstaller SparkInstaller)
          EOF
          cmake -S build-installer -B build-installer/build \
                -DCMAKE_BUILD_TYPE=Release \
                -DSPARKINSTALLER_ENABLE_GUI=OFF \
                -DSPARKINSTALLER_BUILD_TESTS=ON

      - name: Build SparkInstaller and registered contract tests
        shell: bash
        run: >-
          cmake --build build-installer/build --config Release --target
          SparkInstaller
          SparkInstallerGitTests
          SparkBuildProcessRunnerTests
          SparkBuildDownloaderTests
          -j

      - name: Run installer dependency contract tests
        shell: bash
        run: ctest --test-dir build-installer/build -C Release --output-on-failure --no-tests=error

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p staging
          cp "build-installer/build/bin/${{ matrix.bin_name }}" "staging/${{ matrix.bin_name }}"

      - name: Launch staged executable
        shell: bash
        run: |
          set -o pipefail
          "./staging/${{ matrix.bin_name }}" --version | tee installer-version.txt
          "./staging/${{ matrix.bin_name }}" --help | tee installer-help.txt
          grep -Fq "SparkInstaller" installer-version.txt
          grep -Fq "Usage:" installer-help.txt

      - name: Upload installer binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: staging/${{ matrix.bin_name }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # ===========================================================================
  # One stable branch-protection target. A cancelled, skipped, or missing
  # required lane is a failure instead of an accidental green aggregate.
  # Advisory/future-platform lanes remain visible but are deliberately omitted.
  # ===========================================================================
  required-ci-gate:
    name: "Required CI Gate"
    if: always()
    needs:
      - validate-ci-tools
      - check-format
      - validate-prompts
      - check-thirdparty-manifest
      - build-linux-asan
      - build-linux-tsan
      - build-windows-vs2022
      - build-windows-shipping
      - build-linux-gcc
      - build-linux-clang
      - coverage
      - clang-tidy
      - todo-count
      - build-installer
      - aggregate-test-stats
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify every required job succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 .github/scripts/verify-required-jobs.py
