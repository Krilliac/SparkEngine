name: Build SparkEngine

on:
  push:
    branches: [ main, develop, Working, 'feature/**', 'claude/**' ]
    paths-ignore:
      - '**.md'
      - 'wiki/**'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'
  pull_request:
    branches: [ main, develop, Working ]

# Cancel in-progress runs on the same branch/PR when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  ARTIFACT_RETENTION_DAYS: 14
  ERROR_RETENTION_DAYS: 1

jobs:
  # ===========================================================================
  # Code Quality — clang-format enforcement
  # ===========================================================================
  check-format:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install clang-format
      run: sudo apt-get update && sudo apt-get install -y clang-format

    - name: Check formatting
      run: |
        find SparkEngine/Source GameModules/SparkGame/Source GameModules/SparkGameMMO/Source SparkEditor/Source SparkConsole/src SparkShaderCompiler/src \
          -not -path '*/Metal/*' \
          \( -name '*.h' -o -name '*.hpp' -o -name '*.cpp' \) | \
          xargs clang-format --dry-run --Werror 2>&1 || {
            echo "::error::Code formatting violations found. Run 'clang-format -i' on the listed files."
            exit 1
          }

  # ===========================================================================
  # Prompt System Validation — anti-drift, overload prevention, stale detection
  # ===========================================================================
  validate-prompts:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Validate prompt system
      run: ./tools/validate-prompts.sh --ci

  # ===========================================================================
  # Linux Build — GCC with AddressSanitizer + UBSan + LSan
  # ===========================================================================
  build-linux-asan:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ccache libgl-dev libvulkan-dev libsdl2-dev mesa-vulkan-drivers

    - name: Setup ccache
      uses: actions/cache@v5
      with:
        path: ~/.ccache
        key: ccache-linux-asan-${{ github.sha }}
        restore-keys: ccache-linux-asan-

    - name: Configure CMake (ASan + UBSan + LSan)
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DBUILD_TESTS=ON \
          -DCMAKE_C_COMPILER=gcc \
          -DCMAKE_CXX_COMPILER=g++ \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

    - name: Build
      env:
        CCACHE_COMPRESS: "true"
        CCACHE_COMPRESSLEVEL: "6"
      run: cmake --build build --parallel $(nproc) 2>&1 | tee cmake-build.log

    - name: Run Tests under ASan + UBSan + LSan
      env:
        ASAN_OPTIONS: detect_leaks=1:halt_on_error=0:print_stats=1:check_initialization_order=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0
        LSAN_OPTIONS: suppressions=${{ github.workspace }}/Tests/lsan_suppressions.txt
      run: |
        cd build
        ./bin/SparkTests --output-file asan-ubsan-lsan-results.txt 2>&1 | tee asan-console.txt
        cat asan-console.txt >> asan-ubsan-lsan-results.txt || true

    - name: Extract error summary
      if: failure()
      run: |
        .github/scripts/extract-errors.sh \
          "build-linux-asan" \
          error-summary.json \
          cmake-build.log build/asan-console.txt

    - name: Upload error summary
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: ci-errors-linux-asan
        path: error-summary.json
        retention-days: ${{ env.ERROR_RETENTION_DAYS }}

    - name: Upload ASan + UBSan + LSan report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: sanitizer-report-asan-ubsan-lsan
        path: build/asan-ubsan-lsan-results.txt
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # ===========================================================================
  # Linux Build — GCC with ThreadSanitizer
  # ===========================================================================
  build-linux-tsan:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ccache libgl-dev libvulkan-dev libsdl2-dev mesa-vulkan-drivers

    - name: Setup ccache
      uses: actions/cache@v5
      with:
        path: ~/.ccache
        key: ccache-linux-tsan-${{ github.sha }}
        restore-keys: ccache-linux-tsan-

    - name: Configure CMake (TSan)
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DBUILD_TESTS=ON \
          -DCMAKE_C_COMPILER=gcc \
          -DCMAKE_CXX_COMPILER=g++ \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
          -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread"

    - name: Build
      env:
        CCACHE_COMPRESS: "true"
        CCACHE_COMPRESSLEVEL: "6"
      run: cmake --build build --parallel $(nproc) 2>&1 | tee cmake-build.log

    - name: Run Tests under TSan
      env:
        TSAN_OPTIONS: halt_on_error=0:second_deadlock_stack=1:suppressions=${{ github.workspace }}/Tests/tsan_suppressions.txt
      run: |
        cd build
        ./bin/SparkTests --output-file tsan-results.txt 2>&1 | tee tsan-console.txt
        cat tsan-console.txt >> tsan-results.txt || true

    - name: Extract error summary
      if: failure()
      run: |
        .github/scripts/extract-errors.sh \
          "build-linux-tsan" \
          error-summary.json \
          cmake-build.log build/tsan-console.txt

    - name: Upload error summary
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: ci-errors-linux-tsan
        path: error-summary.json
        retention-days: ${{ env.ERROR_RETENTION_DAYS }}

    - name: Upload TSan report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: sanitizer-report-tsan
        path: build/tsan-results.txt
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # ===========================================================================
  # Linux Build — Clang with MemorySanitizer
  # MSan requires ALL code (including stdlib) to be MSan-instrumented. The
  # system libc++ on ubuntu-24.04 is NOT instrumented, which causes false
  # positives in basic string/IO operations. A fully clean MSan build would
  # require building libc++ from source with -fsanitize=memory. This job is
  # marked continue-on-error because of these inherent false positives, but
  # the report artifact is still uploaded for manual review of real findings.
  # ===========================================================================
  build-linux-msan:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ccache libgl-dev libvulkan-dev libsdl2-dev mesa-vulkan-drivers libc++-dev libc++abi-dev

    - name: Setup ccache
      uses: actions/cache@v5
      with:
        path: ~/.ccache
        key: ccache-linux-msan-${{ github.sha }}
        restore-keys: ccache-linux-msan-

    - name: Configure CMake (MSan)
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DBUILD_TESTS=ON \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_FLAGS="-fsanitize=memory -fsanitize-memory-track-origins=2 -fno-omit-frame-pointer -stdlib=libc++ -fsanitize-ignorelist=${{ github.workspace }}/Tests/msan_ignorelist.txt" \
          -DCMAKE_C_FLAGS="-fsanitize=memory -fsanitize-memory-track-origins=2 -fno-omit-frame-pointer -fsanitize-ignorelist=${{ github.workspace }}/Tests/msan_ignorelist.txt" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=memory -stdlib=libc++ -lc++abi" \
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=memory -stdlib=libc++"

    - name: Build (SparkTests only)
      env:
        CCACHE_COMPRESS: "true"
        CCACHE_COMPRESSLEVEL: "6"
      run: cmake --build build --parallel $(nproc) --target SparkTests 2>&1 | tee cmake-build.log

    - name: Extract error summary
      if: failure()
      run: |
        .github/scripts/extract-errors.sh \
          "build-linux-msan" \
          error-summary.json \
          cmake-build.log

    - name: Upload error summary
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: ci-errors-linux-msan
        path: error-summary.json
        retention-days: ${{ env.ERROR_RETENTION_DAYS }}

    - name: Run Tests under MSan
      env:
        MSAN_OPTIONS: halt_on_error=0:print_stats=1
      run: |
        cd build
        # MSan returns non-zero if ANY warnings were reported (even with halt_on_error=0).
        # Since the system libc++ is uninstrumented, false positives are unavoidable.
        # Allow the step to pass — real findings are captured in the artifact.
        ./bin/SparkTests --output-file msan-results.txt 2>&1 | tee msan-console.txt || true
        cat msan-console.txt >> msan-results.txt || true

    - name: Upload MSan report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: sanitizer-report-msan
        path: build/msan-results.txt
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # ===========================================================================
  # Windows Build (MSVC VS 2022, v143 toolset + DirectX 11)
  # ===========================================================================
  build-windows-vs2022:
    runs-on: windows-latest
    strategy:
      matrix:
        config: [Debug, Release]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v3

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.9

    - name: Configure CMake (VS 2022 / v143)
      run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DSPARK_MSVC_TOOLSET=v143 -DBUILD_TESTS=ON -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache 2>&1 | tee cmake-configure.log

    - name: Build
      run: cmake --build build --config ${{ matrix.config }} --parallel 2>&1 | tee cmake-build.log

    - name: Run Tests
      if: matrix.config == 'Release'
      run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure --parallel 2>&1 | tee test-results.log

    - name: Extract error summary
      if: failure()
      shell: bash
      run: |
        .github/scripts/extract-errors.sh \
          "build-windows-vs2022-${{ matrix.config }}" \
          error-summary.json \
          cmake-configure.log cmake-build.log test-results.log

    - name: Upload error summary
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: ci-errors-windows-vs2022-${{ matrix.config }}
        path: error-summary.json
        retention-days: ${{ env.ERROR_RETENTION_DAYS }}

    - name: Package build output
      if: matrix.config == 'Release'
      shell: pwsh
      run: |
        $outDir = "dist/SparkEngine-Windows-${{ matrix.config }}"
        New-Item -ItemType Directory -Force -Path $outDir | Out-Null
        if (Test-Path "build/bin/${{ matrix.config }}") {
          Copy-Item "build/bin/${{ matrix.config }}/*" $outDir -Recurse -Force
        } elseif (Test-Path "build/bin") {
          Copy-Item "build/bin/*" $outDir -Recurse -Force
        }
        Compress-Archive -Path $outDir -DestinationPath "SparkEngine-Windows-${{ matrix.config }}.zip"

    - name: Upload Build Artifacts
      if: matrix.config == 'Release'
      uses: actions/upload-artifact@v7
      with:
        name: SparkEngine-Windows-VS2022-${{ matrix.config }}
        path: SparkEngine-Windows-${{ matrix.config }}.zip
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # ===========================================================================
  # Windows Build (MSVC VS 2022 generator + v144 toolset for VS 2026)
  # Uses VS 2022 generator since CMake does not yet have a VS 2026 generator.
  # Marked continue-on-error until v144 toolset is broadly available on runners.
  # ===========================================================================
  build-windows-vs2026:
    if: github.ref == 'refs/heads/Working' || github.ref == 'refs/heads/main' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    continue-on-error: true
    strategy:
      matrix:
        config: [Debug, Release]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v3

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.9

    - name: Check v144 toolset availability
      id: check-v144
      shell: pwsh
      run: |
        # v144 platform toolset ships with VS 2026. Check if the toolset props file exists.
        $propsPath = Join-Path $env:ProgramFiles "Microsoft Visual Studio" "2022" "Enterprise" `
          "MSBuild" "Microsoft" "VC" "v170" "Platforms" "x64" "PlatformToolsets" "v144"
        if (Test-Path $propsPath) {
          echo "available=true" >> $env:GITHUB_OUTPUT
          Write-Host "v144 toolset found"
        } else {
          echo "available=false" >> $env:GITHUB_OUTPUT
          Write-Host "v144 toolset not found — skipping VS 2026 build"
        }

    - name: Configure CMake (VS 2022 generator / v144 toolset)
      if: steps.check-v144.outputs.available == 'true'
      run: cmake -B build -G "Visual Studio 17 2022" -A x64 -T v144 -DSPARK_MSVC_TOOLSET=v144 -DBUILD_TESTS=ON -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

    - name: Build
      if: steps.check-v144.outputs.available == 'true'
      run: cmake --build build --config ${{ matrix.config }} --parallel

    - name: Run Tests
      if: steps.check-v144.outputs.available == 'true' && matrix.config == 'Release'
      run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure --parallel

    - name: Upload Build Artifacts
      if: steps.check-v144.outputs.available == 'true' && matrix.config == 'Release'
      uses: actions/upload-artifact@v7
      with:
        name: SparkEngine-Windows-VS2026-${{ matrix.config }}
        path: build/bin/${{ matrix.config }}/
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # ===========================================================================
  # Linux Build - GCC
  # ===========================================================================
  build-linux-gcc:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        config: [Debug, Release]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ccache libgl-dev libvulkan-dev libsdl2-dev mesa-vulkan-drivers

    - name: Setup ccache
      uses: actions/cache@v5
      with:
        path: ~/.ccache
        key: ccache-linux-gcc-${{ matrix.config }}-${{ github.sha }}
        restore-keys: ccache-linux-gcc-${{ matrix.config }}-

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DBUILD_TESTS=ON \
          -DCMAKE_C_COMPILER=gcc \
          -DCMAKE_CXX_COMPILER=g++ \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache 2>&1 | tee cmake-configure.log

    - name: Build all targets
      env:
        CCACHE_COMPRESS: "true"
        CCACHE_COMPRESSLEVEL: "6"
      run: cmake --build build --parallel $(nproc) 2>&1 | tee cmake-build.log

    - name: Run Tests
      run: cd build && ./bin/SparkTests 2>&1 | tee ../test-results.log

    - name: Extract error summary
      if: failure()
      run: |
        .github/scripts/extract-errors.sh \
          "build-linux-gcc-${{ matrix.config }}" \
          error-summary.json \
          cmake-configure.log cmake-build.log test-results.log

    - name: Upload error summary
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: ci-errors-linux-gcc-${{ matrix.config }}
        path: error-summary.json
        retention-days: ${{ env.ERROR_RETENTION_DAYS }}

    - name: Package build output
      if: matrix.config == 'Release'
      run: |
        mkdir -p dist/SparkEngine-Linux-GCC-${{ matrix.config }}
        cp -r build/bin/* dist/SparkEngine-Linux-GCC-${{ matrix.config }}/
        tar -czf SparkEngine-Linux-GCC-${{ matrix.config }}.tar.gz \
          -C dist SparkEngine-Linux-GCC-${{ matrix.config }}

    - name: Upload Build Artifacts
      if: matrix.config == 'Release'
      uses: actions/upload-artifact@v7
      with:
        name: SparkEngine-Linux-GCC-${{ matrix.config }}
        path: SparkEngine-Linux-GCC-${{ matrix.config }}.tar.gz
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # ===========================================================================
  # Linux Build - Clang (LLVM)
  # ===========================================================================
  build-linux-clang:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        config: [Debug, Release]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ccache libgl-dev libvulkan-dev libsdl2-dev mesa-vulkan-drivers

    - name: Setup ccache
      uses: actions/cache@v5
      with:
        path: ~/.ccache
        key: ccache-linux-clang-${{ matrix.config }}-${{ github.sha }}
        restore-keys: ccache-linux-clang-${{ matrix.config }}-

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DBUILD_TESTS=ON \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache 2>&1 | tee cmake-configure.log

    - name: Build all targets
      env:
        CCACHE_COMPRESS: "true"
        CCACHE_COMPRESSLEVEL: "6"
      run: cmake --build build --parallel $(nproc) 2>&1 | tee cmake-build.log

    - name: Run Tests
      run: cd build && ./bin/SparkTests 2>&1 | tee ../test-results.log

    - name: Extract error summary
      if: failure()
      run: |
        .github/scripts/extract-errors.sh \
          "build-linux-clang-${{ matrix.config }}" \
          error-summary.json \
          cmake-configure.log cmake-build.log test-results.log

    - name: Upload error summary
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: ci-errors-linux-clang-${{ matrix.config }}
        path: error-summary.json
        retention-days: ${{ env.ERROR_RETENTION_DAYS }}

    - name: Package build output
      if: matrix.config == 'Release'
      run: |
        mkdir -p dist/SparkEngine-Linux-Clang-${{ matrix.config }}
        cp -r build/bin/* dist/SparkEngine-Linux-Clang-${{ matrix.config }}/
        tar -czf SparkEngine-Linux-Clang-${{ matrix.config }}.tar.gz \
          -C dist SparkEngine-Linux-Clang-${{ matrix.config }}

    - name: Upload Build Artifacts
      if: matrix.config == 'Release'
      uses: actions/upload-artifact@v7
      with:
        name: SparkEngine-Linux-Clang-${{ matrix.config }}
        path: SparkEngine-Linux-Clang-${{ matrix.config }}.tar.gz
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # ===========================================================================
  # Linux MinGW Cross-Compilation — Build Windows D3D11/D3D12 code on Linux
  # Runs the resulting .exe under Wine + DXVK + Lavapipe (software Vulkan)
  # ===========================================================================
  build-linux-mingw-wine:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install MinGW, Wine, and Mesa Lavapipe
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          mingw-w64 cmake ccache \
          wine64 wine \
          mesa-vulkan-drivers

    - name: Setup ccache
      uses: actions/cache@v5
      with:
        path: ~/.ccache
        key: ccache-linux-mingw-${{ github.sha }}
        restore-keys: ccache-linux-mingw-

    - name: Configure CMake (MinGW cross-compilation)
      run: |
        cmake -B build \
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/mingw-w64-x86_64.cmake \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_TESTS=ON \
          -DENABLE_VULKAN=OFF \
          -DENABLE_OPENGL=OFF \
          -DENABLE_SDL2=OFF \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache 2>&1 | tee cmake-configure.log

    - name: Build (Windows .exe via MinGW)
      env:
        CCACHE_COMPRESS: "true"
        CCACHE_COMPRESSLEVEL: "6"
      run: cmake --build build --parallel $(nproc) 2>&1 | tee cmake-build.log

    - name: Setup Wine prefix and DXVK
      run: |
        export WINEPREFIX=${{ github.workspace }}/build/.wineprefix
        tools/wine-run.sh --setup-only

    - name: Run Tests under Wine
      env:
        WINEPREFIX: ${{ github.workspace }}/build/.wineprefix
        WINEDEBUG: -all
        LIBGL_ALWAYS_SOFTWARE: "1"
      run: |
        tools/wine-run.sh build/bin/SparkTests.exe 2>&1 | tee wine-test-results.txt || {
          echo "::warning::Wine test execution had failures (non-blocking)"
          true
        }

    - name: Extract error summary
      if: failure()
      run: |
        .github/scripts/extract-errors.sh \
          "build-linux-mingw-wine" \
          error-summary.json \
          cmake-configure.log cmake-build.log wine-test-results.txt

    - name: Upload error summary
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: ci-errors-linux-mingw-wine
        path: error-summary.json
        retention-days: ${{ env.ERROR_RETENTION_DAYS }}

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: mingw-wine-test-results
        path: wine-test-results.txt
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # ===========================================================================
  # macOS Build — Apple Clang (experimental)
  # Validates cross-platform compatibility on macOS with SDL2 + OpenGL.
  # Marked continue-on-error until macOS support is fully stabilized.
  # ===========================================================================
  build-macos:
    if: github.ref == 'refs/heads/Working' || github.ref == 'refs/heads/main' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    continue-on-error: true
    strategy:
      matrix:
        config: [Debug, Release]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install dependencies
      run: brew install cmake sdl2 ccache

    - name: Setup ccache
      uses: actions/cache@v5
      with:
        path: ~/Library/Caches/ccache
        key: ccache-macos-${{ matrix.config }}-${{ github.sha }}
        restore-keys: ccache-macos-${{ matrix.config }}-

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DBUILD_TESTS=ON \
          -DENABLE_VULKAN=OFF \
          -DENABLE_OPENGL=ON \
          -DENABLE_METAL=OFF \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache 2>&1 | tee cmake-configure.log

    - name: Build
      env:
        CCACHE_COMPRESS: "true"
        CCACHE_COMPRESSLEVEL: "6"
      run: cmake --build build --parallel $(sysctl -n hw.logicalcpu) 2>&1 | tee cmake-build.log

    - name: Run Tests
      if: matrix.config == 'Release'
      run: cd build && ./bin/SparkTests 2>&1 | tee ../test-results.log

    - name: Extract error summary
      if: failure()
      run: |
        .github/scripts/extract-errors.sh \
          "build-macos-${{ matrix.config }}" \
          error-summary.json \
          cmake-configure.log cmake-build.log test-results.log

    - name: Upload error summary
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: ci-errors-macos-${{ matrix.config }}
        path: error-summary.json
        retention-days: ${{ env.ERROR_RETENTION_DAYS }}

    - name: Upload Build Artifacts
      if: matrix.config == 'Release'
      uses: actions/upload-artifact@v7
      with:
        name: SparkEngine-macOS-${{ matrix.config }}
        path: build/bin/
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # ===========================================================================
  # Code Coverage — GCC with lcov (whole-project analysis)
  # ===========================================================================
  coverage:
    name: "Code Coverage (GCC)"
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y lcov ccache libgl-dev libsdl2-dev
      - name: Setup ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-coverage-${{ github.sha }}
          restore-keys: ccache-coverage-
      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-update=atomic" -DCMAKE_C_FLAGS="--coverage -fprofile-update=atomic" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DBUILD_TESTS=ON -DBUILD_GAME_MODULES=ON
      - name: Build
        env:
          CCACHE_COMPRESS: "true"
          CCACHE_COMPRESSLEVEL: "6"
        run: cmake --build build --parallel $(nproc)
      - name: Test
        run: cd build && ./bin/SparkTests 2>&1 | tail -5
      - name: Generate coverage
        run: |
          # Capture raw coverage from all compiled sources
          lcov --capture --directory build --output-file coverage-raw.info \
            --ignore-errors mismatch,mismatch,gcov,negative \
            --rc geninfo_unexecuted_blocks=1

          # Remove system headers, third-party, and test code
          lcov --remove coverage-raw.info \
            '/usr/*' '*/ThirdParty/*' '*/Tests/*' \
            --output-file coverage.info \
            --ignore-errors unused,negative

          # Full directory listing for the PR comment
          lcov --list coverage.info --ignore-errors unused,negative 2>&1 | tee coverage-summary.txt
      - name: Per-subsystem coverage analysis
        run: |
          scripts/coverage-report.sh coverage.info --json coverage-report.json 2>&1 | tee subsystem-coverage.txt
      - name: Coverage threshold check
        run: |
          scripts/coverage-report.sh coverage.info --check 2>&1 | tee coverage-check.txt
      - name: Post coverage summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            try {
              // Read the per-subsystem breakdown
              let subsystemReport = '';
              try {
                subsystemReport = fs.readFileSync('subsystem-coverage.txt', 'utf8');
                // Strip ANSI color codes for GitHub
                subsystemReport = subsystemReport.replace(/\x1b\[[0-9;]*m/g, '');
              } catch (e) { /* ignore */ }

              // Read the lcov directory breakdown
              const summary = fs.readFileSync('coverage-summary.txt', 'utf8');
              const lines = summary.split('\n');
              const table = lines.slice(-50).join('\n');

              // Read JSON for structured data
              let jsonData = null;
              try {
                jsonData = JSON.parse(fs.readFileSync('coverage-report.json', 'utf8'));
              } catch (e) { /* ignore */ }

              // Build the PR comment
              let body = `## Code Coverage Report\n\n`;

              // Total coverage badge-style summary
              if (jsonData) {
                const total = jsonData.total;
                const icon = total.pass ? ':white_check_mark:' : ':x:';
                body += `${icon} **Total: ${total.coverage}%** (${total.lines_hit} / ${total.lines_total} lines, threshold: ${total.threshold}%)\n\n`;
              }

              // Per-subsystem table
              if (jsonData) {
                body += `### Per-Subsystem Breakdown\n\n`;
                body += `| Subsystem | Coverage | Lines | Threshold | Status |\n`;
                body += `|-----------|----------|-------|-----------|--------|\n`;
                const sorted = jsonData.subsystems
                  .filter(s => s.lines_total > 0)
                  .sort((a, b) => b.coverage - a.coverage);
                for (const s of sorted) {
                  const icon = s.pass ? ':white_check_mark:' : ':x:';
                  body += `| ${s.subsystem} | ${s.coverage}% | ${s.lines_hit}/${s.lines_total} | ${s.threshold}% | ${icon} |\n`;
                }

                // Subsystems with no coverage data
                const empty = jsonData.subsystems.filter(s => s.lines_total === 0);
                if (empty.length > 0) {
                  body += `\n<details><summary>Subsystems with no coverage data (${empty.length})</summary>\n\n`;
                  for (const s of empty) {
                    body += `- ${s.subsystem}\n`;
                  }
                  body += `</details>\n`;
                }
              }

              // Detailed lcov breakdown (collapsed)
              body += `\n<details><summary>Full lcov directory breakdown</summary>\n\n`;
              body += `\`\`\`\n${table}\n\`\`\`\n</details>\n`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body.slice(0, 65000)
              });
            } catch (e) {
              console.log('Could not post coverage:', e.message);
            }
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.info
            coverage-report.json
            subsystem-coverage.txt
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # ===========================================================================
  # Static Analysis — Clang-Tidy
  # ===========================================================================
  clang-tidy:
    name: "Clang-Tidy Analysis"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang-tidy ccache libgl-dev libsdl2-dev
      - name: Setup ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-clang-tidy-${{ github.sha }}
          restore-keys: ccache-clang-tidy-
      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Run clang-tidy
        run: |
          find SparkEngine/Source -name '*.cpp' | head -30 | \
            xargs clang-tidy -p build --warnings-as-errors="" 2>&1 | tail -100
        continue-on-error: true

  # ===========================================================================
  # Consolidated CI Error Report — single deduplicated PR comment
  # Runs after all build jobs, collects error summaries, and posts/updates
  # one comment instead of spamming separate comments per job.
  # ===========================================================================
  report-ci-errors:
    name: "CI Error Report"
    if: always() && github.event_name == 'pull_request'
    needs:
      - check-format
      - validate-prompts
      - build-linux-asan
      - build-linux-tsan
      - build-linux-msan
      - build-windows-vs2022
      - build-linux-gcc
      - build-linux-clang
      - build-linux-mingw-wine
      - build-macos
      - coverage
      - clang-tidy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all error summaries
        uses: actions/download-artifact@v7
        with:
          pattern: ci-errors-*
          path: ci-error-summaries
          merge-multiple: false
        continue-on-error: true

      - name: Post consolidated error report
        uses: actions/github-script@v8
        env:
          ARTIFACT_DIR: ci-error-summaries
        with:
          script: |
            const report = require('./.github/scripts/report-ci-errors.js');
            await report({ github, context, core, glob, io });

  # ===========================================================================
  # Code Hygiene — TODO/FIXME/HACK comment count
  # ===========================================================================
  todo-count:
    name: "TODO/FIXME Count"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Count TODO/FIXME/HACK comments
        run: |
          count=$(grep -rn 'TODO\|FIXME\|HACK\|XXX' SparkEngine/Source SparkEditor/Source GameModules --include='*.h' --include='*.cpp' | wc -l)
          echo "Found $count TODO/FIXME/HACK/XXX comments"
          if [ "$count" -gt 20 ]; then
            echo "::warning::TODO/FIXME count ($count) exceeds threshold of 20"
          fi
