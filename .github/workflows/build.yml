        path: build/bin/
        retention-days: 14

  # ===========================================================================
  # Code Coverage — GCC with lcov
  # ===========================================================================
  coverage:
    name: "Code Coverage (GCC)"
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y lcov ccache libgl-dev libsdl2-dev
      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-coverage-${{ github.sha }}
          restore-keys: ccache-coverage-
      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-update=atomic" -DCMAKE_C_FLAGS="--coverage -fprofile-update=atomic" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DBUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel $(nproc) 2>&1 | tee cmake-build.log
      - name: Test
        run: cd build && ./bin/SparkTests 2>&1 | tee ../test-results.log
      - name: Report build errors to PR
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            // Find the PR number (works for both push and pull_request events)
            let prNumber = context.issue?.number;
            if (!prNumber) {
              const branch = context.ref?.replace('refs/heads/', '');
              if (branch) {
                const prs = await github.rest.pulls.list({
                  owner: context.repo.owner, repo: context.repo.repo,
                  head: `${context.repo.owner}:${branch}`, state: 'open'
                });
                prNumber = prs.data[0]?.number;
              }
            }
            if (!prNumber) return;

            const fs = require('fs');
            let body = `## :x: Code Coverage (GCC) failed\n\n`;
            for (const [label, file] of [
              ['Build Output', 'cmake-build.log'],
              ['Test Results', 'test-results.log']
            ]) {
              try {
                const log = fs.readFileSync(file, 'utf8');
                const issues = log.split('\n').filter(l =>
                  /error[:\s]|warning[:\s]|FAILED|FAIL:|fatal error/i.test(l)
                );
                if (issues.length > 0) {
                  body += `### ${label}\n\`\`\`\n${issues.slice(-80).join('\n').slice(-30000)}\n\`\`\`\n\n`;
                }
              } catch (e) {}
            }
            if (!body.includes('```')) {
              body += `No error details could be extracted from build logs.\nCheck the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for full output.\n`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body.slice(0, 65000)
            });
      - name: Generate coverage
        run: |
          lcov --capture --directory build --output-file coverage.info --ignore-errors mismatch,mismatch,gcov,negative --rc geninfo_unexecuted_blocks=1
          lcov --remove coverage.info '/usr/*' '*/ThirdParty/*' '*/Tests/*' --output-file coverage.info --ignore-errors unused,negative
          lcov --list coverage.info --ignore-errors unused,negative 2>&1 | tee coverage-summary.txt
      - name: Post coverage summary to PR
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            // Find the PR number (works for both push and pull_request events)
            let prNumber = context.issue?.number;
            if (!prNumber) {
              const branch = context.ref?.replace('refs/heads/', '');
              if (branch) {
                const prs = await github.rest.pulls.list({
                  owner: context.repo.owner, repo: context.repo.repo,
                  head: `${context.repo.owner}:${branch}`, state: 'open'
                });
                prNumber = prs.data[0]?.number;
              }
            }
            if (!prNumber) return; // No associated PR found

            const fs = require('fs');
            try {
              const summary = fs.readFileSync('coverage-summary.txt', 'utf8');
              const lines = summary.split('\n');
              // Extract the total line (last non-empty line with a percentage)
              const totalLine = lines.filter(l => /Total:/.test(l) || /\d+\.\d+%/.test(l)).pop() || '';
              let body = `## Code Coverage (GCC + lcov)\n\n`;
              // Get the last 30 lines which contain the per-directory breakdown
              const table = lines.slice(-35).join('\n');
              body += `\`\`\`\n${table}\n\`\`\`\n`;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body.slice(0, 65000)
              });
            } catch (e) {
              console.log('Could not post coverage:', e.message);
            }
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.info
          retention-days: 14

  # ===========================================================================
  # Static Analysis — Clang-Tidy
  # ===========================================================================
  clang-tidy:
    name: "Clang-Tidy Analysis"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang-tidy libgl-dev libsdl2-dev
      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Run clang-tidy
        run: |
          find SparkEngine/Source -name '*.cpp' | head -30 | \
            xargs clang-tidy -p build --warnings-as-errors="" 2>&1 | tail -100
        continue-on-error: true

  # ===========================================================================
  # Code Hygiene — TODO/FIXME/HACK comment count
  # ===========================================================================
  todo-count:
    name: "TODO/FIXME Count"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Count TODO/FIXME/HACK comments
        run: |
          count=$(grep -rn 'TODO\|FIXME\|HACK\|XXX' SparkEngine/Source SparkEditor/Source GameModules --include='*.h' --include='*.cpp' | wc -l)
          echo "Found $count TODO/FIXME/HACK/XXX comments"
          if [ "$count" -gt 20 ]; then
            echo "::warning::TODO/FIXME count ($count) exceeds threshold of 20"
          fi
