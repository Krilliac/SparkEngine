---
# Keep the legacy Codacy wrapper focused on first-party analyzable source. Its
# SARIF formatter decodes every reported file as UTF-8, so vendored code,
# generated binaries, and repository assets must never enter its result set.
engines:
  cppcheck:
    enabled: true

exclude_paths:
  - "Assets/**/*"
  - "Shaders/Compiled/**/*"
  - "SparkEditor/Fonts/**/*"
  - "SparkEngine/Shaders/Compiled/**/*"
  - "ThirdParty/**/*"
  - "build*/**/*"
  - "docs/screenshots/**/*"
  - "**/*.bin"
  - "**/*.bof"
  - "**/*.cso"
  - "**/*.icns"
  - "**/*.jar"
  - "**/*.jpeg"
  - "**/*.jpg"
  - "**/*.png"
  - "**/*.tga"
  - "**/*.ttf"
  - "**/*.wav"
