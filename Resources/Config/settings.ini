; SparkEngine Default Settings (Complete Engine List)
;
; Notes:
; - This file mirrors all settings exposed by EngineSettings.cpp read/write paths.
; - Values here are engine defaults; override per project or via settings.local.ini.
; - Boolean values: true/false. Numeric values are decimal unless noted.

; ============================================================================
; [Graphics] - Display/output device and window presentation settings.
; Enum: AntiAliasing => 0=Off, 2=MSAAx2, 4=MSAAx4, 8=MSAAx8.
; Enum: ShadowQuality => 0=Low, 1=Medium, 2=High, 3=Ultra.
; ============================================================================
[Graphics]
WindowWidth = 1280
WindowHeight = 720
Fullscreen = false
VSync = true
AntiAliasing = 4
ShadowQuality = 2
RenderScale = 1.0
HDR = false
RefreshRate = 0
BorderlessWindowed = false
Monitor = 0
TripleBuffering = false
MaxFrameLatency = 2

; ============================================================================
; [Audio] - Master mix and channel-level user audio controls.
; ============================================================================
[Audio]
MasterVolume = 1.0
SFXVolume = 0.8
MusicVolume = 0.6
VoiceVolume = 1.0
AmbienceVolume = 0.7
MuteOnFocusLoss = true
MuteAll = false

; ============================================================================
; [Controls] - Mouse/controller deadzones, sensitivity, and inversion settings.
; ============================================================================
[Controls]
MouseSensitivity = 1.0
InvertMouse = false
MouseDeadZone = 0.0
RawMouseInput = false
MouseAcceleration = false
ControllerDeadZoneLeft = 0.15
ControllerDeadZoneRight = 0.1
ControllerSensitivity = 1.0
ControllerVibration = true
InvertControllerY = false

; ============================================================================
; [Game] - Global gameplay defaults and player-facing options.
; Enum: Difficulty => Story | Easy | Normal | Hard | Nightmare.
; ============================================================================
[Game]
