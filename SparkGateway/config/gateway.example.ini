[Gateway]
world_name = SparkWorld
port = 27020
inter_server_port = 27021
max_total_clients = 1000
tick_rate = 10
load_balancing = true
load_balance_interval = 30
ingress_endpoint = spark-gateway-ingress-27020

# Area processes must expose their authenticated local control endpoint before
# the gateway reports ready.
[Area.Town]
host = 127.0.0.1
port = 27101
inter_server_port = 27201
max_clients = 128
tick_rate = 60
scene = Assets/Scenes/town.spark

[Area.Forest]
host = 127.0.0.1
port = 27102
inter_server_port = 27202
max_clients = 128
tick_rate = 60
scene = Assets/Scenes/forest.spark

[Status]
health_file = Temp/spark-gateway-health.json
stop_file = Temp/spark-gateway.stop
interval_ms = 5000
[Security]
# Provision this file with at least 32 random bytes and an owner-only ACL (0600 on POSIX).
key_file = Config/gateway.key
