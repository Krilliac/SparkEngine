[Server]
name = Spark Dedicated Server
motd = Welcome to SparkEngine

[Network]
port = 27015
max_clients = 64
tick_rate = 60
# Private LAN development requires canonical RFC1918 CIDR, for example 192.168.1.20/24.
# Remove GatewayControl below for LAN mode; gateway-managed servers require loopback.
bind_address = loopback
lan_broadcast = false

[Game]
maps = default
score_limit = 50
time_limit_minutes = 15

[Modules]
# Select exactly one. Paths are resolved from the process working directory.
module = bin/SparkGame.dll
# manifest = spark.modules.json

[Status]
health_file = Temp/spark-server-health.json
interval_ms = 5000
[GatewayControl]
# Use a unique endpoint matching the gateway area's inter_server_port.
endpoint = spark-area-control-27201
key_file = Config/gateway.key
epoch_state_file = Temp/spark-area-control-epochs.txt
