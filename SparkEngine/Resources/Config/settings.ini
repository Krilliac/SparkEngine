[Logging]
# Global minimum log level: Trace, Debug, Info, Warn, Error, Fatal, Off
GlobalLevel = Info
# Minimum level at which stack traces are auto-captured (Off to disable)
StackTraceLevel = Error
# Category enable bitmask (hex). Each bit = one LogCategory.
# Bit 0=Core, 1=Graphics, 2=Physics, 3=Audio, 4=AI, 5=Animation,
# 6=ECS, 7=Network, 8=Input, 9=Scripting, 10=Scene, 11=Save,
# 12=Cinematic, 13=Procedural, 14=Editor, 15=Game
# 0xFFFFFFFF = all enabled
CategoryMask = 0xFFFFFFFF
# Per-category level overrides (leave empty to use GlobalLevel)
# Valid values: Trace, Debug, Info, Warn, Error, Fatal, Off
CoreLevel =
GraphicsLevel =
PhysicsLevel =
AudioLevel =
AILevel =
AnimationLevel =
ECSLevel =
NetworkLevel =
InputLevel =
ScriptingLevel =
SceneLevel =
SaveLevel =
CinematicLevel =
ProceduralLevel =
EditorLevel =
GameLevel =

[CrashReporting]
# Master switch — set to false to disable all crash report uploading
Enabled = true
# Show consent dialog before uploading (recommended for release builds)
RequireConsent = true
# Skip dialog boxes entirely (CI, testing, headless servers)
HeadlessMode = false
# Show a "describe what happened" text input after crash (users can skip)
PromptUserDescription = true
# Let users opt out of screenshot capture specifically
AllowScreenshotRefusal = true

# Upload URL — auto-detected backend from prefix:
#   https://api.github.com/...      → GitHub Issues (needs GitHubToken)
#   https://dropbox.com/request/... → Dropbox file request link
#   ftp://host/path/               → FTP upload
#   smtp://smtp.gmail.com:587      → Email (see SmtpUser/SmtpPass/EmailTo)
#   https://your-server.com/crash  → Generic HTTP POST (multipart)
# Leave empty for local-only crash dumps.
UploadURL =

# Proxy relay endpoint — for release builds, holds credentials server-side.
# Takes priority over UploadURL when set.
ProxyURL =

# Non-secret GitHub settings (labels, dump attachment)
GitHubLabels = crash-report
AttachDump = true

# =====================================================================
# SENSITIVE CREDENTIALS — DO NOT PUT SECRETS IN THIS FILE!
# =====================================================================
# This file is checked into version control. Use ONE of these instead:
#
# Option 1: Environment variables (recommended for CI and dev):
#   SPARK_GITHUB_REPO=owner/repo
#   SPARK_GITHUB_TOKEN=ghp_xxxxxxxxxxxx
#   SPARK_CRASH_PROXY_URL=https://your-proxy.com/crash
#   SPARK_CRASH_UPLOAD_URL=smtp://smtp.gmail.com:587
#   SPARK_SMTP_USER=you@gmail.com
#   SPARK_SMTP_PASS=app-password
#   SPARK_CRASH_EMAIL_TO=you@gmail.com
#
# Option 2: Local override file (gitignored, never committed):
#   Create Resources/Config/settings.local.ini with ONLY the secret keys:
#     [CrashReporting]
#     GitHubRepo = owner/repo
#     GitHubToken = ghp_xxxxxxxxxxxx
#     SmtpUser = you@gmail.com
#     SmtpPass = your-app-password
#     EmailTo = you@gmail.com
#
# The local file is loaded after settings.ini and overrides matching keys.
# =====================================================================
EmailFrom = crashreporter@sparkengine.dev

# Capture settings
CaptureScreenshot = true
CaptureSystemInfo = true
CaptureAllThreads = true
TimeoutSeconds = 5
