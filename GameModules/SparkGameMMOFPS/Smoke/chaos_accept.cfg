# =============================================================================
# TERRAFRONT chaos acceptance gate (bots-chaos lane, 2026-07-10)
#
# Headless dedicated-server chaos run + machine-greppable validation.
# The integrator runs this and greps the output for [TF-VALIDATE]:
#   every line is "PASS"/"FAIL" + numbers; the last line is
#   "[TF-VALIDATE] RESULT: PASS ..." when all five checks hold
#   (physics/Jolt live, collision bodies + blocked-or-slid bot moves,
#   capture progress advanced, at least one kill, no pawn below terrain).
#
# Run (from build/bin):
#   SparkEngine.exe -game SparkGameMMOFPS.dll -exec GameModules/SparkGameMMOFPS/Smoke/chaos_accept.cfg -test-seconds 60 -headless
# (path is repo-relative; if running with cwd=build/bin copy/point -exec at the
#  file accordingly, same convention as Tools/tf_smoke_host.cfg)
#
# Grep the gate:
#   grep "\[TF-VALIDATE\]" exec_audit.log     (or server.log / stdout)
#
# Timeline: dedicated boot at t1; 12 bots enter chaos at t3 (spawn ~1-2 s, then
# teleport-scatter onto capture points: even slots into one shared multi-
# faction arena region for guaranteed fights, odd slots onto faction-capturable
# regions for guaranteed capture progress); ~40 s of chaos; verdict at t45.
# =============================================================================
t1 tf_dedicated
t2 tf_status
t3 tf_chaos 12
t10 tf_botinfo
t25 tf_botinfo
t40 tf_capture_debug
t44 tf_botinfo
t45 tf_validate
