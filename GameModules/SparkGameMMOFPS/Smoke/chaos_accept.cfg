# =============================================================================
# TERRAFRONT chaos acceptance gate (bots-chaos lane 2026-07-10; extended by the
# W9 bots-v2 lane 2026-07-11: vehicles + abilities checks, longer timeline).
#
# Headless dedicated-server chaos run + machine-greppable validation.
# The integrator runs this and greps the output for [TF-VALIDATE]:
#   every line is "PASS"/"FAIL" (+ one SKIP-able line) + numbers; the last line
#   is "[TF-VALIDATE] RESULT: PASS ..." when all checks hold:
#     physics    Jolt live
#     collision  bodies built + blocked-or-slid bot moves
#     capture    capture progress advanced / region flipped
#     kills      at least one kill
#     terrain    no pawn below terrain
#     vehicles   >=1 vehicle purchase succeeded AND >=1 vehicle moved > 20 m
#                (chaos pilot slots 1/2 buy a Vulture/Drifter at their faction
#                skyanchor terminal and take it to a far region)
#     abilities  >=1 class-ability activation — reports SKIP (not FAIL, and not
#                counted in the verdict) while the ability system is absent
#
# Run (from build/bin):
#   SparkEngine.exe -game SparkGameMMOFPS.dll -exec GameModules/SparkGameMMOFPS/Smoke/chaos_accept.cfg -test-seconds 105 -headless
# (W9: -test-seconds raised from 60 to 105 — the vehicle checks need the pilots
#  to spawn, scatter, purchase, board and put >20 m behind them, and the
#  Vulture ride to a far region takes ~30-60 s. Path is repo-relative; if
#  running with cwd=build/bin copy/point -exec at the file accordingly, same
#  convention as Tools/tf_smoke_host.cfg)
#
# Grep the gate:
#   grep "\[TF-VALIDATE\]" exec_audit.log     (or server.log / stdout)
#
# Timeline: dedicated boot at t1; 12 bots enter chaos at t3 (spawn ~1-2 s, then
# teleport-scatter onto capture points: even slots into one shared multi-
# faction arena region for guaranteed fights, odd slots onto faction-capturable
# regions for guaranteed capture progress; pilot slots 1/2 drop at their own
# skyanchor vehicle terminal, buy, then drive/fly at a far objective);
# ~90 s of chaos; verdict at t95.
# =============================================================================
t1 tf_dedicated
t2 tf_status
t3 tf_chaos 12 120
t10 tf_botinfo
t30 tf_botinfo
t50 tf_capture_debug
t70 tf_botinfo
t90 tf_botinfo
t95 tf_validate
