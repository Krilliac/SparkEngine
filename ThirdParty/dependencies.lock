# SparkEngine third-party dependency manifest.
# Format:
#   "name|source|version_or_commit|license|local_path|required_files_csv|feature_macro|fallback_or_stub_path|severity"
# severity: ERROR (configure-time fatal), WARN (configure-time warning)
# Git submodules use the immutable gitlink in HEAD as their canonical lock. The
# helper below renders that exact 40-character revision into the manifest at
# configure/check time, avoiding a second SHA copy that Dependabot cannot edit.
# Source archives without Git metadata retain an explicit descriptive marker.
# Last sync: 2026-08-26 (made repository gitlinks canonical for submodule pins;
# Dependabot pointer-only PRs can now be validated without leaving stale SHAs).

function(_spark_manifest_gitlink_revision dep_path out_var)
    get_filename_component(_manifest_root "${CMAKE_CURRENT_LIST_DIR}/.." REALPATH)
    execute_process(
        COMMAND git rev-parse --show-toplevel
        WORKING_DIRECTORY "${_manifest_root}"
        OUTPUT_VARIABLE _git_root
        RESULT_VARIABLE _git_root_rc
        OUTPUT_STRIP_TRAILING_WHITESPACE
        ERROR_QUIET
    )

    if(_git_root_rc EQUAL 0)
        get_filename_component(_git_root "${_git_root}" REALPATH)
    endif()

    if(_git_root_rc EQUAL 0 AND _git_root STREQUAL _manifest_root)
        execute_process(
            COMMAND git ls-tree HEAD -- "${dep_path}"
            WORKING_DIRECTORY "${_manifest_root}"
            OUTPUT_VARIABLE _gitlink_record
            RESULT_VARIABLE _gitlink_rc
            OUTPUT_STRIP_TRAILING_WHITESPACE
            ERROR_QUIET
        )
    else()
        set(_gitlink_record "")
        set(_gitlink_rc 1)
    endif()

    if(_gitlink_rc EQUAL 0 AND NOT _gitlink_record STREQUAL "")
        if(NOT _gitlink_record MATCHES "^160000 commit ([0-9a-fA-F]+)[\t ]")
            message(FATAL_ERROR
                "Third-party submodule '${dep_path}' is not a mode-160000 gitlink in HEAD: ${_gitlink_record}")
        endif()
        set(_gitlink_revision "${CMAKE_MATCH_1}")
        string(LENGTH "${_gitlink_revision}" _gitlink_revision_length)
        if(NOT _gitlink_revision_length EQUAL 40)
            message(FATAL_ERROR
                "Third-party submodule '${dep_path}' has an invalid gitlink revision: ${_gitlink_revision}")
        endif()
    else()
        set(_gitlink_revision "gitlink (exact revision recorded by repository tree)")
    endif()

    set(${out_var} "${_gitlink_revision}" PARENT_SCOPE)
endfunction()

_spark_manifest_gitlink_revision("ThirdParty/Utils/miniz" _spark_miniz_revision)
_spark_manifest_gitlink_revision("ThirdParty/ECS/entt" _spark_entt_revision)
_spark_manifest_gitlink_revision("ThirdParty/UI/imgui" _spark_imgui_revision)
_spark_manifest_gitlink_revision("ThirdParty/Scripting/angelscript-mirror" _spark_angelscript_revision)
_spark_manifest_gitlink_revision("ThirdParty/AI/recastnavigation" _spark_recast_revision)
_spark_manifest_gitlink_revision("ThirdParty/SDL2" _spark_sdl2_revision)

